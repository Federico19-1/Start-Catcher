        // ----- Per-account shop state -----
        // { owned: ['red', ...], equipped: 'red' | null }. Old saves have
        // no `${user}__shop` key → the getter lazily creates it.
        function getUserShop(username) {
            if (!username) return { owned: [], equipped: null };
            const all = getAllRecords();
            const key = `${username}__shop`;
            let data = all[key];
            if (!data || typeof data !== 'object' || !Array.isArray(data.owned)) {
                data = { owned: [], equipped: null };
                all[key] = data;
                saveAllRecords(all);
            }
            return data;
        }

        function saveUserShop(username, data) {
            if (!username) return;
            const all = getAllRecords();
            all[`${username}__shop`] = data;
            saveAllRecords(all);
            // Invalidate the equipped-skin cache so the mascot / ship
            // repaint immediately with the new skin.
            _cachedSkin = null;
        }

        // Buys + auto-equips a skin: checks ownership, checks the star
        // balance, deducts SKIN_PRICE and persists. Returns true on success.
        function buySkin(skinId) {
            if (!currentUser) return false;
            const skin = SKINS.find(s => s.id === skinId);
            if (!skin || skin.id === 'blue') return false;
            const shop = getUserShop(currentUser);
            if (shop.owned.includes(skinId)) return false;
            if (!spendStars(currentUser, SKIN_PRICE)) return false;
            shop.owned.push(skinId);
            shop.equipped = skinId;
            saveUserShop(currentUser, shop);
            return true;
        }

        function equipSkin(skinId) {
            if (!currentUser) return false;
            const shop = getUserShop(currentUser);
            if (!shop.owned.includes(skinId)) return false;
            shop.equipped = skinId;
            saveUserShop(currentUser, shop);
            return true;
        }

        // Cached equipped skin (avoids a localStorage parse every frame).
        // The cache is invalidated on saveUserShop and whenever the
        // currentUser changes (keyed on the username).
        let _cachedSkin = null;
        let _cachedSkinUser = null;
        function getEquippedSkin() {
            if (_cachedSkin && _cachedSkinUser === currentUser) return _cachedSkin;
            _cachedSkin = null;
            if (currentUser) {
                try {
                    const shop = getUserShop(currentUser);
                    if (shop && shop.equipped) {
                        const s = SKINS.find(x => x.id === shop.equipped);
                        if (s) {
                            _cachedSkin = s;
                            _cachedSkinUser = currentUser;
                            return s;
                        }
                    }
                } catch (e) { /* fall through to default */ }
            }
            _cachedSkin = SKINS[0];
            _cachedSkinUser = currentUser;
            return _cachedSkin;
        }

        /* ============================================================
           4. GAME LOGIC FUNCTIONS
        ============================================================ */
        // ===== 4.1 Daily missions + streaks =====
        // ----- Daily missions + streaks -----
        // Swipeable page accessible from the main menu. Two streaks
        // per account: a yellow/orange manual-claim "daily streak"
        // and a red/burgundy auto-bumped "super streak" earned by
        // completing all of today's 3 missions.
        const MISSION_POOL = [
            { id: 'catch5', label: 'Catch 5 stars in Classic', target: 5, type: 'classic_score' },
            { id: 'catch10', label: 'Catch 10 stars in Classic', target: 10, type: 'classic_score' },
            { id: 'catch15', label: 'Catch 15 stars in Classic', target: 15, type: 'classic_score' },
            { id: 'survive20', label: 'Survive 20s in Survival', target: 20, type: 'survival_time' },
            { id: 'survive30', label: 'Survive 30s in Survival', target: 30, type: 'survival_time' },
            { id: 'survive45', label: 'Survive 45s in Survival', target: 45, type: 'survival_time' },
            { id: 'battle_kill_5', label: 'Destroy 5 enemies in Battle', target: 5, type: 'battle_kills' },
            { id: 'battle_kill_15', label: 'Destroy 15 enemies in Battle', target: 15, type: 'battle_kills' },
            { id: 'visit_set', label: 'Visit Settings today', type: 'visit_settings' },
            { id: 'toggle_set', label: 'Toggle a setting today', type: 'toggle_setting' },
            { id: 'both_modes', label: 'Play both Classic + Survival', type: 'both_modes' },
            { id: 'all_modes', label: 'Play Classic, Survival and Battle today', type: 'all_modes' }
        ];

        // Deterministic seed from a YYYY-MM-DD string. Every player sees
        // the same 3 missions on a given calendar day so friends can
        // talk about the same set.
        function dailySeedForToday(todayKey) {
            let h = 0;
            for (let i = 0; i < todayKey.length; i++) {
                h = ((h << 5) - h + todayKey.charCodeAt(i)) | 0;
            }
            return Math.abs(h);
        }

        function localDayKey(date = new Date()) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function generateDailyMissions(todayKey) {
            const seed = dailySeedForToday(todayKey);
            const pool = MISSION_POOL.slice();
            const picked = [];
            for (let i = 0; i < 3 && pool.length > 0; i++) {
                const idx = (seed * (i + 7) + Math.floor(seed / 13)) % pool.length;
                picked.push(pool.splice(idx, 1)[0]);
            }
            return picked;
        }

        // Idempotent per day. Resets to 1 if a day was skipped, grows
        // by 1 if last claim was yesterday.
        function claimDailyStreak() {
            if (!currentUser) return null;
            const m = refreshMissionsForUser(currentUser);
            const today = m.currentDayKey;
            if (m.lastClaimedDate === today) return m.streakCount;
            if (m.lastClaimedDate && isYesterday(m.lastClaimedDate, today)) {
                m.streakCount += 1;
            } else {
                m.streakCount = 1;
            }
            m.lastClaimedDate = today;
            saveUserMissions(currentUser, m);
            playRecordSound();
            return m.streakCount;
        }

        // Note-completion-only: stamps _lastAllCompleteDayKey so the Super
        // Streak Button can appear on the Missions screen. The counter bump
        // itself happens inside claimSuperStreak() so the button is the
        // single, user-visible path that changes the super-streak count.
        // Bump at most once per day.
        function maybeAdvanceSuperStreak(arg) {
            // Bug-fix friendly overload: accept either (m) directly OR a
            // legacy (username) string. The previous single-string version
            // re-fetched m from localStorage via getUserMissions(), but
            // recordMissionEvent had not yet saved the just-updated
            // m.missionsCompleted — so the freshly-parsed copy was stale,
            // mis-counted done < total, and the SUPER CLAIM! button
            // stayed LOCKED forever.
            //
            // Fix: recordMissionEvent now passes the SAME m object it
            // already mutated, so the m._lastAllCompleteDayKey write lands
            // on the reference that the caller's final saveUserMissions()
            // is about to persist. The legacy (username) path stays in
            // place for any future caller and self-saves for safety.
            let m = null;
            let usernameToSave = null;
            if (typeof arg === 'string') {
                m = getUserMissions(arg);
                usernameToSave = arg;
            } else if (arg && typeof arg === 'object') {
                m = arg;
            }
            if (!m) return;
            const total = (m.missionsForDay || []).length;
            if (total === 0) return;
            const done = Object.values(m.missionsCompleted || {}).filter(Boolean).length;
            if (done < total) return;
            const today = m.currentDayKey;
            if (m._lastAllCompleteDayKey === today) return;
            m._lastAllCompleteDayKey = today;
            // Only auto-save in the legacy (username) call-site: the (m)
            // call-site is always followed by the caller saving its own
            // m, which would otherwise overwrite our write with the same
            // data on a fresh parse anyway.
            if (usernameToSave) saveUserMissions(usernameToSave, m);
        }

        // Manually bumps the super-streak count when the user clicks the
        // Super Streak Button on the Missions screen. Mirrors the daily
        // `claimDailyStreak()` pattern: once per day, with consecutive
        // days incrementing and missed days resetting to 1. The button is
        // the only thing that can advance m.superStreakCount now that
        // maybeAdvanceSuperStreak no longer auto-bumps.
        function claimSuperStreak() {
            if (!currentUser) return null;
            const m = refreshMissionsForUser(currentUser);
            const today = m.currentDayKey;
            // Locked-state guard: the button is always rendered under
            // the SUPER STREAK counter (greyed-out "LOCKED" until all
            // 3 daily missions are done), so a click on the locked
            // version MUST be a no-op here. Once _lastAllCompleteDayKey
            // matches today, this guard lets the click through to bump
            // m.superStreakCount and flip superClaimedDate.
            if (m._lastAllCompleteDayKey !== today) return null;
            // Already claimed today — accidental double-click must not
            // inflate the count.
            if (m.superClaimedDate === today) return m.superStreakCount;
            if (m.lastSuperClaimDate && isYesterday(m.lastSuperClaimDate, today)) {
                m.superStreakCount += 1;
            } else {
                m.superStreakCount = 1;
            }
            m.lastSuperClaimDate = today;
            m.superClaimedDate = today;
            saveUserMissions(currentUser, m);
            playRecordSound();
            return m.superStreakCount;
        }

        function recordMissionEvent(eventType, value) {
            if (!currentUser) return;
            const m = refreshMissionsForUser(currentUser);
            if (eventType === 'finished_classic') {
                m.modesPlayedToday.classic = true;
                if (value > m.bestClassicScoreToday) m.bestClassicScoreToday = value;
                if (lives > 0) m.noDeathClassicToday = true;
            } else if (eventType === 'finished_survival') {
                m.modesPlayedToday.survival = true;
                if (value > m.bestSurvivalTimeToday) m.bestSurvivalTimeToday = value;
            } else if (eventType === 'finished_battle') {
                // `value` is the kill count of the Battle run that just
                // ended. Two flags flip off this event:
                //   * modesPlayedToday.battle — toggles the
                //     play-counter used by the Super Streak heuristic.
                //   * bestBattleKillsToday — fuels the two
                //     `battle_kills` daily missions.
                // `noDamageBattleToday` was already flagged at the moment
                // a hit actually reduced `hp`, so its truth value here is
                // simply observed via recheckMissionCompletion below.
                m.modesPlayedToday.battle = true;
                if (typeof value === 'number' && value > m.bestBattleKillsToday) {
                    m.bestBattleKillsToday = value;
                }
            } else if (eventType === 'visited_settings') {
                m.settingsVisitedToday = true;
            } else if (eventType === 'toggled_setting') {
                m.settingsToggledCountToday = (m.settingsToggledCountToday || 0) + 1;
            }
            recheckMissionCompletion(m);
            // Pass m (not currentUser) so the _lastAllCompleteDayKey write
            // lands on the same reference our final saveUserMissions()
            // call below will persist. Using currentUser here re-fetches
            // from localStorage BEFORE the in-memory mission updates are
            // saved, which used to skip the unlock step on the third event.
            maybeAdvanceSuperStreak(m);
            saveUserMissions(currentUser, m);
        }


        function navigateToMissionsScreen() {
            if (!currentUser) return;
            refreshMissionsForUser(currentUser);
            gameState = GAME_STATES.MISSIONS;
            playClickSound();
        }

        function navigateFromMissionsScreen() {
            gameState = GAME_STATES.MENU;
            playClickSound();
        }

        function newMissionsRecord() {
            return {
                lastClaimedDate: null,
                streakCount: 0,
                superStreakCount: 0,
                lastSuperClaimDate: null,
                superClaimedDate: null,
                currentDayKey: null,
                missionsForDay: [],
                missionsCompleted: {},
                _lastAllCompleteDayKey: null,
                modesPlayedToday: { classic: false, survival: false, battle: false },
                settingsVisitedToday: false,
                settingsToggledCountToday: 0,
                bestClassicScoreToday: 0,
                bestSurvivalTimeToday: 0,
                bestBattleKillsToday: 0,
                noDeathClassicToday: false,
                noDamageBattleToday: false
            };
        }

        function getUserMissions(username) {
            if (!username) return newMissionsRecord();
            const all = getAllRecords();
            const key = `${username}__missions`;
            if (!all[key]) {
                all[key] = newMissionsRecord();
                saveAllRecords(all);
            } else {
                // Backfill any fields missing from records saved by older
                // versions so the streak displays never see `undefined`
                // (the menu bar would fall back to 0, the missions screen
                // would draw the literal string "undefined"). Existing
                // values are always preserved — only missing fields get
                // their defaults.
                all[key] = Object.assign({}, newMissionsRecord(), all[key]);
            }
            return all[key];
        }

        function saveUserMissions(username, data) {
            if (!username) return;
            const all = getAllRecords();
            all[`${username}__missions`] = data;
            saveAllRecords(all);
        }

        function recheckMissionCompletion(m) {
            if (!m.missionsForDay) return;
            m.missionsCompleted = {};
            for (const mission of m.missionsForDay) {
                let done = false;
                switch (mission.type) {
                    case 'classic_score': done = m.bestClassicScoreToday >= mission.target; break;
                    case 'survival_time': done = m.bestSurvivalTimeToday >= mission.target; break;
                    case 'no_death_run': done = m.noDeathClassicToday; break;
                    case 'battle_kills': done = m.bestBattleKillsToday >= mission.target; break;
                    case 'battle_no_damage_run': done = !!(m.noDamageBattleToday && m.bestBattleKillsToday >= 1); break;
                    case 'visit_settings': done = m.settingsVisitedToday; break;
                    case 'toggle_setting': done = (m.settingsToggledCountToday || 0) >= 1; break;
                    case 'both_modes': done = !!(m.modesPlayedToday.classic && m.modesPlayedToday.survival); break;
                    // `all_modes` is in MISSION_POOL but was never handled
                    // here, so a day containing it could NEVER be marked
                    // complete — the SUPER CLAIM button stayed locked and
                    // the super streak could not advance on those days.
                    case 'all_modes': done = !!(m.modesPlayedToday.classic && m.modesPlayedToday.survival && m.modesPlayedToday.battle); break;
                }
                m.missionsCompleted[mission.id] = done;
            }
        }

        function refreshMissionsForUser(username) {
            const m = getUserMissions(username);
            const today = localDayKey();
            if (m.currentDayKey !== today) {
                m.currentDayKey = today;
                m.missionsForDay = generateDailyMissions(today);
                m.missionsCompleted = {};
                m.modesPlayedToday = { classic: false, survival: false, battle: false };
                m.settingsVisitedToday = false;
                m.settingsToggledCountToday = 0;
                m.bestClassicScoreToday = 0;
                m.bestSurvivalTimeToday = 0;
                m.bestBattleKillsToday = 0;
                m.noDeathClassicToday = false;
                m.noDamageBattleToday = false;
                m._lastAllCompleteDayKey = null;
                m.superClaimedDate = null;
                // Streak honesty: a new day started, so if the last claim
                // was NOT yesterday (claiming today is already covered by
                // the `=== today` guard inside the claim functions), the
                // streak is broken — zero the displayed count so the UI
                // shows 0 instead of a stale number. The *_ClaimDate fields
                // stay untouched so claimDailyStreak / claimSuperStreak can
                // still tell a consecutive claim (+1) from a broken one
                // (reset to 1 on the next claim).
                if (!(m.lastClaimedDate && isYesterday(m.lastClaimedDate, today))) {
                    m.streakCount = 0;
                }
                if (!(m.lastSuperClaimDate && isYesterday(m.lastSuperClaimDate, today))) {
                    m.superStreakCount = 0;
                }
            }
            recheckMissionCompletion(m);
            const all = getAllRecords();
            all[`${username}__missions`] = m;
            saveAllRecords(all);
            return m;
        }

        function isYesterday(prev, today) {
            if (!prev) return false;
            const aParts = prev.split('-').map(Number);
            const bParts = today.split('-').map(Number);
            const a = new Date(aParts[0], aParts[1] - 1, aParts[2]).getTime();
            const b = new Date(bParts[0], bParts[1] - 1, bParts[2]).getTime();
            return Math.round((b - a) / (1000 * 60 * 60 * 24)) === 1;
        }

        // ----- Missions page renderer -----
        // ===== 4.2 Missions screen (page 1) =====
        function drawMissionsScreen() {
            drawBackground();
            updateButtonHover();  // Phase-2B

            const m = currentUser
                ? refreshMissionsForUser(currentUser)
                : newMissionsRecord();

            ctx.textAlign = 'center';
            ctx.shadowBlur = 30;
            ctx.shadowColor = '#ffd84a';
            ctx.font = 'bold 38px Orbitron, sans-serif';
            ctx.fillStyle = '#ffd84a';
            drawIconLabelCenter('missions', 'MISSIONS', canvas.width / 2, 60, 'bold 38px Orbitron, sans-serif', '#ffd84a', '#ffd84a', 22);

            if (!currentUser) {
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'black';
                ctx.font = '20px Orbitron, sans-serif';
                ctx.fillStyle = '#aaa';
                ctx.fillText('Create an account to track your progress!', canvas.width / 2, 110);
                const backY = 540, backW = 160, backH = 35;
                const backX = canvas.width / 2 - backW / 2;
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(26, 31, 44, 0.80)';
                ctx.strokeStyle = 'rgba(138, 43, 226, 0.5)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.roundRect(backX, backY, backW, backH, 10);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'white';
                ctx.font = '18px Orbitron, sans-serif';
                ctx.fillText('\u2190 BACK', canvas.width / 2, backY + 25);
                menuButtons = [{ rect: { x: backX, y: backY, w: backW, h: backH }, action: 'missionsBack' }];
                ctx.textAlign = 'left';
                ctx.shadowBlur = 0;
                return;
            }

            // Date badge
            ctx.shadowBlur = 8;
            ctx.shadowColor = 'black';
            ctx.font = '13px Orbitron, sans-serif';
            ctx.fillStyle = '#9cd3ff';
            const dateStr = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
            drawIconLabelCenter('calendar', dateStr, canvas.width / 2, 92, '13px Orbitron, sans-serif', '#9cd3ff', '#9cd3ff', 14);

            // Streak panel
            const streakY = 125, streakH = 110, streakW = 360;
            const streakX = canvas.width / 2 - streakW / 2;
            ctx.shadowBlur = 22;
            ctx.shadowColor = '#ffaa55';
            const streakGrad = ctx.createLinearGradient(streakX, streakY, streakX, streakY + streakH);
            streakGrad.addColorStop(0, 'rgba(70, 40, 10, 0.85)');
            streakGrad.addColorStop(1, 'rgba(35, 18, 5, 0.95)');
            ctx.fillStyle = streakGrad;
            ctx.beginPath();
            ctx.roundRect(streakX, streakY, streakW, streakH, 12);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(255, 170, 70, 0.55)';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Verical divider between the two streak columns
            ctx.strokeStyle = 'rgba(255,170,70,0.4)';
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, streakY + 14);
            ctx.lineTo(canvas.width / 2, streakY + streakH - 14);
            ctx.stroke();

            const dailyX = streakX + streakW * 0.25;
            const superX = streakX + streakW * 0.75;
            ctx.textAlign = 'center';

            ctx.font = 'bold 11px Orbitron, sans-serif';
            ctx.shadowBlur = 4;
            ctx.shadowColor = 'black';
            ctx.fillStyle = '#ffcc88';
            ctx.fillText('DAILY STREAK', dailyX, streakY + 18);
            ctx.font = 'bold 38px Arial';
            ctx.shadowColor = '#ff7300';
            ctx.shadowBlur = 22;
            drawFlameIcon(dailyX, streakY + 44, 1.8, true, '#ff9933');
            ctx.shadowBlur = 0;
            ctx.font = 'bold 30px Orbitron, sans-serif';
            ctx.fillStyle = '#ff9933';
            ctx.fillText(m.streakCount, dailyX, streakY + 95);

            ctx.font = 'bold 11px Orbitron, sans-serif';
            ctx.shadowBlur = 4;
            ctx.shadowColor = 'black';
            ctx.fillStyle = '#ffaaaa';
            ctx.fillText('SUPER STREAK', superX, streakY + 18);
            ctx.font = 'bold 38px Arial';
            ctx.shadowColor = '#8a0303';
            ctx.shadowBlur = 22;
            drawFlameIcon(superX, streakY + 44, 1.8, true, '#cc4040');
            ctx.shadowBlur = 0;
            ctx.font = 'bold 30px Orbitron, sans-serif';
            ctx.fillStyle = '#cc4040';
            ctx.fillText(m.superStreakCount, superX, streakY + 95);

            // Claim button under the daily side
            const claimW = 130, claimH = 28;
            const claimX = dailyX - claimW / 2;
            const claimY = streakY + streakH + 14;
            const claimedToday = m.lastClaimedDate === m.currentDayKey;
            ctx.shadowBlur = 12;
            if (claimedToday) {
                ctx.shadowColor = 'rgba(120,255,120,0.6)';
                ctx.fillStyle = '#1a4a2a';
                ctx.strokeStyle = '#66ee88';
            } else {
                ctx.shadowColor = 'rgba(255,140,0,0.75)';
                ctx.fillStyle = '#5a2a0a';
                ctx.strokeStyle = '#ff9933';
            }
            ctx.beginPath();
            ctx.roundRect(claimX, claimY, claimW, claimH, 10);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.font = 'bold 12px Orbitron, sans-serif';
            ctx.fillStyle = claimedToday ? '#aaffaa' : '#ffd84a';
            ctx.fillText(claimedToday ? '\u2713 CLAIMED' : 'CLAIM TODAY', claimX + claimW / 2, claimY + 19);

            // ---- Super Streak Button ----
            // Always rendered under the SUPER STREAK counter so the player
            // sees it the whole day. Three visual states, in priority order:
            //   1) claimed (green ✓) — already collected today's super bonus
            //   2) ready     (red glow) — all 3 daily missions are done; clickable
            //   3) locked    (dim grey) — default; render shows "LOCKED"
            // Mirrors the daily claim button on the right side of the streak
            // panel so the two stay visually symmetric.
            const allMissionsDone = m._lastAllCompleteDayKey === m.currentDayKey;
            const superClaimW = 130;
            const superClaimX = superX - superClaimW / 2;
            const superClaimed = m.superClaimedDate === m.currentDayKey;
            const superLabel = superClaimed
                ? '\u2713 CLAIMED'
                : (allMissionsDone ? 'SUPER CLAIM!' : 'LOCKED');
            ctx.shadowBlur = 12;
            if (superClaimed) {
                ctx.shadowColor = 'rgba(120,255,120,0.6)';
                ctx.fillStyle = '#1a4a2a';
                ctx.strokeStyle = '#66ee88';
            } else if (allMissionsDone) {
                ctx.shadowColor = 'rgba(204,64,64,0.85)';
                ctx.fillStyle = '#5a0a0a';
                ctx.strokeStyle = '#ff4040';
            } else {
                // Locked / disabled: dim grey, no glow, so the player can
                // tell at a glance that all 3 missions aren't done yet.
                ctx.shadowColor = 'rgba(0,0,0,0.35)';
                ctx.fillStyle = '#2a2a3a';
                ctx.strokeStyle = 'rgba(150,150,150,0.4)';
            }
            ctx.beginPath();
            ctx.roundRect(superClaimX, claimY, superClaimW, claimH, 10);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.font = 'bold 12px Orbitron, sans-serif';
            ctx.fillStyle = superClaimed ? '#aaffaa' : (allMissionsDone ? '#ffcccc' : '#777');
            if (superClaimed || allMissionsDone) {
                ctx.fillText(superLabel, superClaimX + superClaimW / 2, claimY + 19);
            } else {
                drawIconLabelCenter('lock', 'LOCKED', superClaimX + superClaimW / 2, claimY + 19, 'bold 12px Orbitron, sans-serif', '#777', '#8a93a5', 13);
            }

            // ----- Today's mission cards -----
            const missionsY = claimY + 60;
            ctx.textAlign = 'center';
            ctx.shadowColor = '#88aaff';
            ctx.shadowBlur = 14;
            ctx.font = 'bold 14px Orbitron, sans-serif';
            ctx.fillStyle = '#f1f5f9';
            ctx.fillText("TODAY'S MISSIONS", canvas.width / 2, missionsY - 18);

            // Hit rect for the → arrow button drawn beside the first daily
            // mission card (null until the cards render below).
            let bossNavArrowRect = null;

            if (m.missionsForDay && m.missionsForDay.length > 0) {
                const cardW = 440, cardH = 54;
                const cardX = canvas.width / 2 - cardW / 2;
                m.missionsForDay.forEach((mission, idx) => {
                    const y = missionsY + idx * (cardH + 10);
                    const done = (m.missionsCompleted && m.missionsCompleted[mission.id]) || false;

                    ctx.shadowBlur = 14;
                    ctx.shadowColor = done ? 'rgba(120,255,120,0.55)' : 'rgba(74,140,255,0.4)';
                    ctx.fillStyle = done ? 'rgba(30,70,40,0.85)' : 'rgba(15,25,50,0.85)';
                    ctx.beginPath();
                    ctx.roundRect(cardX, y, cardW, cardH, 10);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = done ? 'rgba(140,255,140,0.7)' : 'rgba(74,170,255,0.4)';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    ctx.font = 'bold 28px Arial';
                    ctx.textAlign = 'center';
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = done ? 'rgba(120,255,120,0.7)' : 'rgba(255,255,255,0.18)';
                    ctx.fillStyle = done ? '#9eff9e' : 'rgba(255,255,255,0.35)';
                    drawVectorIcon(done ? 'check' : 'box', cardX + 30, y + 28, done ? '#9eff9e' : 'rgba(255,255,255,0.35)', 1.1);

                    ctx.shadowBlur = 0;
                    ctx.font = 'bold 14px Orbitron, sans-serif';
                    ctx.textAlign = 'left';
                    ctx.fillStyle = done ? '#cfffcf' : '#ffffff';
                    ctx.fillText(mission.label, cardX + 62, y + 23);

                    ctx.font = '11px Orbitron, sans-serif';
                    ctx.fillStyle = done ? '#a2e6a2' : '#88aaff';
                    let progressText = '';
                    if (mission.type === 'classic_score') {
                        progressText = `Best today: ${m.bestClassicScoreToday} / ${mission.target} stars`;
                    } else if (mission.type === 'survival_time') {
                        progressText = `Best today: ${m.bestSurvivalTimeToday}s / ${mission.target}s`;
                    } else if (mission.type === 'no_death_run') {
                        progressText = m.noDeathClassicToday ? 'No-death run complete!' : 'Survive Classic with all 3 lives';
                    } else if (mission.type === 'visit_settings') {
                        progressText = m.settingsVisitedToday ? 'Visited Settings today' : 'Open the Settings screen';
                    } else if (mission.type === 'toggle_setting') {
                        progressText = `Toggled ${m.settingsToggledCountToday || 0} time(s)`;
                    } else if (mission.type === 'both_modes') {
                        const parts = [m.modesPlayedToday.classic ? 'Classic \u2713' : 'Classic',
                        m.modesPlayedToday.survival ? 'Survival \u2713' : 'Survival'];
                        progressText = parts.join('   \u00b7   ');
                    } else if (mission.type === 'all_modes') {
                        // Mirrors the `all_modes` completion check so the
                        // card shows live status for all three modes.
                        const parts = [
                            m.modesPlayedToday.classic ? 'Classic \u2713' : 'Classic',
                            m.modesPlayedToday.survival ? 'Survival \u2713' : 'Survival',
                            m.modesPlayedToday.battle ? 'Battle \u2713' : 'Battle'
                        ];
                        progressText = parts.join('   \u00b7   ');
                    }
                    ctx.fillText(progressText, cardX + 62, y + 42);
                });

                // ----- BOSS objectives access (single → arrow) -----
                // ONE round arrow button on the RIGHT of the first daily
                // mission card, pointing RIGHT toward the BOSS FIGHT unlock
                // objectives page. Replaces the old two-button (◀ + −) pair
                // on the left; the chevron is drawn in the same gold-on-
                // violet-glow glass style as every other arrow in the game.
                const navSize = 30;
                const navY = missionsY + (cardH - navSize) / 2;
                const navGap = 10;
                const arrowX = cardX + cardW + navGap;
                const arrowY = navY;
                const arrowHover = hoverFor('bossObjectives');
                ctx.save();
                ctx.shadowBlur = 8 + arrowHover * 10;
                ctx.shadowColor = 'rgba(138, 43, 226, ' + (0.3 + arrowHover * 0.5).toFixed(2) + ')';
                ctx.fillStyle = 'rgba(26, 31, 44, ' + (0.72 + arrowHover * 0.25).toFixed(2) + ')';
                ctx.beginPath();
                ctx.roundRect(arrowX, arrowY, navSize, navSize, 9);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(138, 43, 226, ' + (0.5 + arrowHover * 0.4).toFixed(2) + ')';
                ctx.lineWidth = 1.5;
                ctx.stroke();
                drawVectorIcon('chevron', arrowX + navSize / 2, arrowY + navSize / 2 + 1, '#ffd84a', 1.1);
                ctx.restore();
                bossNavArrowRect = { x: arrowX, y: arrowY, w: navSize, h: navSize };
            }

            // BACK button + swipe hint
            ctx.shadowBlur = 4;
            ctx.shadowColor = 'black';
            ctx.font = '11px Orbitron, sans-serif';
            ctx.fillStyle = '#7eaad6';
            ctx.textAlign = 'center';
            ctx.fillText('\u2190 arrow-left / Esc to go back to menu', canvas.width / 2, 530);

            const backY = 560, backW = 160, backH = 35;
            const backX = canvas.width / 2 - backW / 2;
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(26, 31, 44, 0.80)';
            ctx.strokeStyle = 'rgba(138, 43, 226, 0.5)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.roundRect(backX, backY, backW, backH, 10);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#f1f5f9';
            ctx.font = '18px Orbitron, sans-serif';
            ctx.fillText('\u2190 BACK', canvas.width / 2, backY + 25);
            menuButtons = [{ rect: { x: backX, y: backY, w: backW, h: backH }, action: 'missionsBack' }];
            if (!claimedToday) {
                menuButtons.push({ rect: { x: claimX, y: claimY, w: claimW, h: claimH }, action: 'claimStreak' });
            }
            // Super Streak Button is ALWAYS click-targetable while today
            // is not yet claimed (so the locked visual still feels
            // tappable — clicking is intentionally a no-op inside
            // claimSuperStreak() until the 3 daily missions are done).
            // We skip the click target entirely once it's already
            // claimed for today so it stops accepting input.
            if (!superClaimed) {
                menuButtons.push({ rect: { x: superClaimX, y: claimY, w: superClaimW, h: claimH }, action: 'claimSuperStreak' });
            }

            // BOSS objectives arrow (only present when the cards drew)
            if (bossNavArrowRect) menuButtons.push({ rect: bossNavArrowRect, action: 'bossObjectives' });

            ctx.textAlign = 'left';
            ctx.shadowBlur = 0;
        }

        // ===== 4.3 BOSS objectives page (page 2) =====
        function drawBossObjectivesScreen() {
            drawBackground();
            updateButtonHover();

            ctx.textAlign = 'center';
            ctx.shadowBlur = 30;
            ctx.shadowColor = '#ffd84a';
            ctx.font = 'bold 34px Orbitron, sans-serif';
            ctx.fillStyle = '#ffd84a';
            drawIconLabelCenter('crown', 'BOSS OBJECTIVES', canvas.width / 2, 58, 'bold 34px Orbitron, sans-serif', '#ffd84a', '#ffd84a', 20);

            ctx.shadowBlur = 8;
            ctx.shadowColor = 'black';
            ctx.font = '13px Orbitron, sans-serif';
            ctx.fillStyle = '#9cd3ff';
            ctx.fillText('Complete these challenges to unlock BOSS FIGHT mode', canvas.width / 2, 90);

            if (!currentUser) {
                ctx.font = '19px Orbitron, sans-serif';
                ctx.fillStyle = '#aaa';
                ctx.fillText('Create an account to track your progress!', canvas.width / 2, 150);

                const backY = 540, backW = 160, backH = 35;
                const backX = canvas.width / 2 - backW / 2;
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(26, 31, 44, 0.80)';
                ctx.strokeStyle = 'rgba(138, 43, 226, 0.5)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.roundRect(backX, backY, backW, backH, 10);
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = '#f1f5f9';
                ctx.font = '18px Orbitron, sans-serif';
                ctx.textBaseline = 'middle';
                ctx.fillText('\u2190 BACK', canvas.width / 2, backY + backH / 2);
                // Narrow ← arrow back to Missions (matches the main flow).
                const navSize = 30;
                const navGap = 10;
                const navX = 100 - navGap - navSize;
                const navY = 130 + (98 - navSize) / 2;
                const backHover = hoverFor('bossObjectivesBack');
                ctx.save();
                ctx.shadowBlur = 8 + backHover * 10;
                ctx.shadowColor = 'rgba(138, 43, 226, ' + (0.3 + backHover * 0.5).toFixed(2) + ')';
                ctx.fillStyle = 'rgba(26, 31, 44, ' + (0.72 + backHover * 0.25).toFixed(2) + ')';
                ctx.beginPath();
                ctx.roundRect(navX, navY, navSize, navSize, 9);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(138, 43, 226, ' + (0.5 + backHover * 0.4).toFixed(2) + ')';
                ctx.lineWidth = 1.5;
                ctx.stroke();
                drawVectorIcon('chevronLeft', navX + navSize / 2, navY + navSize / 2 + 1, '#ffd84a', 1.1);
                ctx.restore();
                menuButtons = [
                    { rect: { x: backX, y: backY, w: backW, h: backH }, action: 'bossObjectivesBack' },
                    { rect: { x: navX, y: navY, w: navSize, h: navSize }, action: 'bossObjectivesBack' }
                ];
                ctx.textAlign = 'left';
                ctx.textBaseline = 'alphabetic';
                ctx.shadowBlur = 0;
                return;
            }

            const unlocked = isBossFightUnlocked();
            const objectives = [
                {
                    icon: 'star', name: 'CLASSIC', goal: 'Catch 1000 stars in a single Classic run',
                    cur: getMaxScore(currentUser), target: 1000, unit: 'stars', bar: 'rgba(255, 216, 74, 0.9)', track: 'rgba(255, 216, 74, 0.18)'
                },
                {
                    icon: 'skull', name: 'SURVIVAL', goal: 'Survive 60 seconds in Survival mode',
                    cur: getMaxSurvivalScore(currentUser), target: 60, unit: 's', bar: 'rgba(255, 107, 107, 0.9)', track: 'rgba(255, 107, 107, 0.18)'
                },
                {
                    icon: 'target', name: 'BATTLE (NORMAL)', goal: 'Destroy 100 enemies in Battle Normal',
                    cur: getBattleNormalBest(currentUser), target: 100, unit: 'kills', bar: 'rgba(73, 215, 200, 0.9)', track: 'rgba(73, 215, 200, 0.18)'
                }
            ];

            const cardX = 100, cardW = 600, cardH = 98, gap = 14;
            const startY = 130;
            const maxBarW = cardW - 160;

            objectives.forEach((o, i) => {
                const y = startY + i * (cardH + gap);
                const pct = Math.min(1, o.cur / o.target);
                const remaining = Math.max(0, o.target - o.cur);
                const done = remaining <= 0;

                ctx.shadowBlur = 14;
                ctx.shadowColor = done ? 'rgba(120, 255, 120, 0.5)' : 'rgba(74, 140, 255, 0.3)';
                ctx.fillStyle = done ? 'rgba(30, 70, 40, 0.9)' : 'rgba(15, 25, 50, 0.9)';
                ctx.beginPath();
                ctx.roundRect(cardX, y, cardW, cardH, 12);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = done ? 'rgba(140, 255, 140, 0.65)' : 'rgba(138, 43, 226, 0.4)';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Icon + name + goal
                ctx.textAlign = 'left';
                ctx.textBaseline = 'alphabetic';
                ctx.font = '26px Arial, sans-serif';
                ctx.fillStyle = done ? '#9eff9e' : o.bar;
                ctx.shadowBlur = 8;
                ctx.shadowColor = 'black';
                drawVectorIcon(o.icon, cardX + 34, y + 26, done ? '#9eff9e' : o.bar, 1.05);
                ctx.shadowBlur = 0;
                ctx.font = 'bold 15px Orbitron, sans-serif';
                ctx.fillStyle = '#f1f5f9';
                ctx.fillText(o.name, cardX + 58, y + 26);
                ctx.font = '11px Orbitron, sans-serif';
                ctx.fillStyle = done ? '#a2e6a2' : '#88aaff';
                ctx.fillText(o.goal, cardX + 58, y + 44);

                // Right-aligned numbers: current/target + how much is left
                ctx.textAlign = 'right';
                ctx.font = 'bold 13px Orbitron, sans-serif';
                ctx.fillStyle = done ? '#9eff9e' : '#ffffff';
                ctx.fillText(o.cur + ' / ' + o.target + ' ' + o.unit, cardX + cardW - 22, y + 26);
                ctx.font = '11px Orbitron, sans-serif';
                ctx.fillStyle = done ? '#9eff9e' : '#ff9f43';
                ctx.fillText(done ? '\u2713 COMPLETE' : remaining + ' ' + o.unit + ' left', cardX + cardW - 22, y + 44);

                // Progress bar
                const barX = cardX + 58, barY = y + 60;
                const barH = 12;
                ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
                ctx.beginPath();
                ctx.roundRect(barX, barY, maxBarW, barH, 6);
                ctx.fill();
                if (pct > 0) {
                    ctx.fillStyle = o.bar;
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = o.bar;
                    ctx.beginPath();
                    ctx.roundRect(barX, barY, Math.max(barH, maxBarW * pct), barH, 6);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
                ctx.textAlign = 'right';
                ctx.font = 'bold 11px Orbitron, sans-serif';
                ctx.fillStyle = done ? '#9eff9e' : '#9aa6b2';
                ctx.fillText(Math.round(pct * 100) + '%', cardX + cardW - 22, barY + barH + 16);
            });

            // ----- Narrow ← arrow back to the Missions screen -----
            // Mirrors the missions arrow: one chevron on the LEFT of the
            // first objective card, pointing LEFT back to where the player
            // came from. Same gold-on-violet-glass tile.
            const navSize = 30;
            const navGap = 10;
            const navX = cardX - navGap - navSize;
            const navY = startY + (cardH - navSize) / 2;
            const backHover = hoverFor('bossObjectivesBack');
            ctx.save();
            ctx.shadowBlur = 8 + backHover * 10;
            ctx.shadowColor = 'rgba(138, 43, 226, ' + (0.3 + backHover * 0.5).toFixed(2) + ')';
            ctx.fillStyle = 'rgba(26, 31, 44, ' + (0.72 + backHover * 0.25).toFixed(2) + ')';
            ctx.beginPath();
            ctx.roundRect(navX, navY, navSize, navSize, 9);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(138, 43, 226, ' + (0.5 + backHover * 0.4).toFixed(2) + ')';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            drawVectorIcon('chevronLeft', navX + navSize / 2, navY + navSize / 2 + 1, '#ffd84a', 1.1);
            ctx.restore();
            const bossBackArrowRect = { x: navX, y: navY, w: navSize, h: navSize };

            const bannerY = startY + 3 * (cardH + gap) + 4;
            ctx.textAlign = 'center';
            if (unlocked) {
                ctx.shadowBlur = 16;
                ctx.shadowColor = 'rgba(120, 255, 120, 0.7)';
                ctx.font = 'bold 19px Orbitron, sans-serif';
                ctx.fillStyle = '#9eff9e';
                drawIconLabelCenter('crown', 'BOSS FIGHT UNLOCKED!', canvas.width / 2, bannerY, 'bold 19px Orbitron, sans-serif', '#9eff9e', '#9eff9e', 15);
                ctx.shadowBlur = 0;

                const playW = 250, playH = 44;
                const playX = canvas.width / 2 - playW / 2;
                const playY = bannerY + 16;
                drawGlassButton(playX, playY, playW, playH, 10, 'PLAY BOSS FIGHT', 'bold 16px Orbitron, sans-serif', {
                    isPrimary: true,
                    hoverStrength: hoverFor('bossObjectivesPlay'),
                    icon: 'play'
                });
                menuButtons = [{ rect: { x: playX, y: playY, w: playW, h: playH }, action: 'bossObjectivesPlay' }];
            } else {
                ctx.shadowBlur = 8;
                ctx.shadowColor = 'black';
                ctx.font = '12px Orbitron, sans-serif';
                ctx.fillStyle = '#7eaad6';
                drawIconLabelCenter('lock', 'Keep playing — every record counts toward the unlock!', canvas.width / 2, bannerY + 10, '12px Orbitron, sans-serif', '#7eaad6', '#8a93a5', 13);
                ctx.shadowBlur = 0;
                menuButtons = [];
            }

            // Back to the Missions screen
            const backY = 560, backW = 160, backH = 35;
            const backX = canvas.width / 2 - backW / 2;
            ctx.fillStyle = 'rgba(26, 31, 44, 0.80)';
            ctx.strokeStyle = 'rgba(138, 43, 226, 0.5)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.roundRect(backX, backY, backW, backH, 10);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#f1f5f9';
            ctx.font = '18px Orbitron, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('\u2190 BACK', canvas.width / 2, backY + backH / 2);
            menuButtons.push({ rect: { x: backX, y: backY, w: backW, h: backH }, action: 'bossObjectivesBack' });
            menuButtons.push({ rect: bossBackArrowRect, action: 'bossObjectivesBack' });

            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';

        // ===== 4.4 Skin shop (page 3) =====
        // Small mascot-head preview used inside each shop card so the
        // player can see the exact color they would be unlocking.
        function drawMascotPreview(skin, cx, cy, r) {
            ctx.save();
            ctx.shadowColor = skin.glow;
            ctx.shadowBlur = 14;
            ctx.fillStyle = skin.body;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            const grad = ctx.createRadialGradient(cx - r * 0.25, cy - r * 0.3, r * 0.12, cx, cy, r);
            grad.addColorStop(0, 'rgba(255,255,255,0.5)');
            grad.addColorStop(0.6, 'rgba(255,255,255,0.05)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = skin.stroke;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.stroke();
            const eyeR = r * 0.19;
            const pupilR = r * 0.1;
            const eyeY = cy - r * 0.12;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(cx - r * 0.26, eyeY, eyeR, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(cx + r * 0.26, eyeY, eyeR, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = skin.face;
            ctx.beginPath(); ctx.arc(cx - r * 0.26, eyeY, pupilR, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(cx + r * 0.26, eyeY, pupilR, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = skin.face;
            ctx.lineWidth = 1.8;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.arc(cx, cy + r * 0.3, r * 0.4, 0.15 * Math.PI, 0.85 * Math.PI);
            ctx.stroke();
            ctx.lineCap = 'butt';
            ctx.restore();
        }

        // Small in-card ship preview for the shop. Mirrors drawShip()'s
        // layered body / cockpit / fin / flame recipe (using the skin's
        // ship palette) so the player sees exactly how each skin colors
        // the in-game ship before spending stars.
        function drawMiniShip(skin, cx, cy, scale) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.scale(scale, scale);
            ctx.shadowColor = skin.shipGlow;
            ctx.shadowBlur = 25;

            ctx.beginPath();
            ctx.ellipse(0, -5, 18, 12, 0, 0, Math.PI * 2);
            ctx.fillStyle = skin.shipBody;
            ctx.fill();
            ctx.strokeStyle = skin.shipStroke;
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.beginPath();
            ctx.ellipse(0, -12, 10, 7, 0, 0, Math.PI * 2);
            ctx.fillStyle = skin.shipCockpit;
            ctx.fill();
            ctx.strokeStyle = skin.shipCockpitStroke;
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.fillStyle = '#fff';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(-4, -14, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(4, -14, 2, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = skin.shipFin;
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.moveTo(-20, 5);
            ctx.lineTo(-8, -2);
            ctx.lineTo(-8, 8);
            ctx.closePath();
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(20, 5);
            ctx.lineTo(8, -2);
            ctx.lineTo(8, 8);
            ctx.closePath();
            ctx.fill();

            // Two-layer engine flame, exactly as the in-game ship draws it.
            ctx.shadowBlur = 30;
            ctx.shadowColor = '#f90';
            ctx.fillStyle = '#f90';
            ctx.beginPath();
            ctx.moveTo(-6, 12);
            ctx.lineTo(0, 22);
            ctx.lineTo(6, 12);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#fd0';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.moveTo(-3, 12);
            ctx.lineTo(0, 18);
            ctx.lineTo(3, 12);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        // ----- Purchase celebration (confetti + banner) -----
        // Fires right after a skin is successfully bought: a burst of
        // confetti in the skin's colors plus a gold "NEW SKIN UNLOCKED!"
        // banner. Self-clears after a few seconds of frames.
        const SHOP_CELEBRATION_MS = 2400;
        // Skin-card grid geometry, shared by drawShopScreen (draws the
        // cards) and startShopCelebration (bursts confetti from the bought
        // card) so the two layouts can never drift apart.
        const SHOP_CARD_W = 228, SHOP_CARD_H = 126, SHOP_GAP_X = 18, SHOP_GAP_Y = 10;
        const SHOP_GRID_START_X = (800 - (3 * SHOP_CARD_W + 2 * SHOP_GAP_X)) / 2; // 40
        const SHOP_GRID_START_Y = 142;
        let shopCelebration = null;

        // Centre of a shop card's preview zone, used as the confetti origin.
        function shopCardCenter(skinId) {
            const i = SKINS.slice(1).findIndex(s => s.id === skinId);
            if (i < 0) return { x: canvas.width / 2, y: 340 };
            const col = i % 3, row = Math.floor(i / 3);
            return {
                x: SHOP_GRID_START_X + col * (SHOP_CARD_W + SHOP_GAP_X) + SHOP_CARD_W / 2,
                y: SHOP_GRID_START_Y + row * (SHOP_CARD_H + SHOP_GAP_Y) + 42
            };
        }

        function startShopCelebration(skin) {
            const burst = shopCardCenter(skin.id);
            const particles = [];
            for (let i = 0; i < 64; i++) {
                particles.push({
                    x: burst.x + (Math.random() - 0.5) * 90,
                    y: burst.y + (Math.random() - 0.5) * 40,
                    vx: (Math.random() - 0.5) * 8,
                    vy: -5 - Math.random() * 7,
                    g: 0.32,
                    size: 3.5 + Math.random() * 5,
                    color: [skin.body, skin.glow, '#ffd84a', '#ffffff', '#ff9f43'][i % 5],
                    rot: Math.random() * Math.PI * 2,
                    vr: (Math.random() - 0.5) * 0.35
                });
            }
            shopCelebration = { skinId: skin.id, name: skin.name, glow: skin.glow, startedAt: Date.now(), particles };
        }

        function drawShopCelebration(celeb, elapsed) {
            // Confetti particles (updated in place — the shop redraws every frame)
            for (const p of celeb.particles) {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += p.g;
                p.rot += p.vr;
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rot);
                ctx.globalAlpha = p.y > canvas.height - 12 ? 0 : 1;
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.62);
                ctx.restore();
            }
            ctx.globalAlpha = 1;

            // Banner: pops in, holds, fades out near the end.
            const inT = Math.min(1, elapsed / 220);
            const outT = elapsed > SHOP_CELEBRATION_MS - 350 ? (SHOP_CELEBRATION_MS - elapsed) / 350 : 1;
            const pop = 0.55 + 0.45 * inT;
            ctx.save();
            ctx.globalAlpha = Math.max(0, Math.min(1, inT * outT));
            // The banner sits over row 1's preview zone (y ≈ 142–226),
            // well above the card action-button rows (y ≈ 243+), so the
            // BUY / EQUIP buttons stay visible and clickable mid-burst.
            ctx.translate(canvas.width / 2, 184);
            ctx.scale(pop, pop);
            ctx.shadowColor = 'rgba(255, 191, 36, 0.9)';
            ctx.shadowBlur = 34;
            ctx.fillStyle = 'rgba(20, 26, 38, 0.94)';
            ctx.strokeStyle = 'rgba(255, 191, 36, 0.95)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(-190, -42, 380, 84, 18);
            ctx.fill();
            ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = 'bold 24px Orbitron, sans-serif';
            ctx.fillStyle = '#ffd84a';
            ctx.fillText('NEW SKIN UNLOCKED!', 0, -11);
            ctx.font = 'bold 19px Orbitron, sans-serif';
            ctx.fillStyle = celeb.glow;
            ctx.fillText(celeb.name, 0, 26);
            ctx.restore();
        }

        function drawShopScreen() {
            drawBackground();
            updateButtonHover();

            const shop = currentUser ? getUserShop(currentUser) : { owned: [], equipped: null };
            const starCount = getStarCountCached();
            const equipped = shop.equipped;

            // Title
            ctx.textAlign = 'center';
            ctx.shadowBlur = 30;
            ctx.shadowColor = '#ffd84a';
            ctx.font = 'bold 38px Orbitron, sans-serif';
            ctx.fillStyle = '#ffd84a';
            drawIconLabelCenter('shop', 'SKIN SHOP', canvas.width / 2, 56, 'bold 38px Orbitron, sans-serif', '#ffd84a', '#ffd84a', 22);

            ctx.shadowBlur = 8;
            ctx.shadowColor = 'black';
            ctx.font = '13px Orbitron, sans-serif';
            ctx.fillStyle = '#9cd3ff';

            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.roundRect(balX, balY, balW, balH, 17);
            ctx.fill();
            ctx.stroke();
            drawIconLabelCenter('star', starCount.toLocaleString('en-US') + ' stars', canvas.width / 2, balY + balH / 2, 'bold 15px Orbitron, sans-serif', '#ffd84a', '#ffd84a', 16);

            // 3x3 grid of purchasable skins (SKINS[0] is the free BLUE
            // default and is never sold).
            // Grid geometry lives at module level (SHOP_CARD_W etc.) so
            // the celebration's confetti origin matches the cards exactly.
            const cardW = SHOP_CARD_W, cardH = SHOP_CARD_H, gapX = SHOP_GAP_X, gapY = SHOP_GAP_Y;
            const totalW = 3 * cardW + 2 * gapX;

                const owned = shop.owned.indexOf(skin.id) !== -1;
                const isEquipped = equipped === skin.id;
                const affordable = starCount >= SKIN_PRICE;
                const buyAction = 'shopBuy_' + skin.id;
                const equipAction = 'shopEquip_' + skin.id;

                // Card background
                ctx.shadowBlur = 16;
                ctx.shadowColor = isEquipped
                    ? 'rgba(120, 255, 120, 0.55)'
                    : (affordable ? 'rgba(255, 191, 36, 0.25)' : 'rgba(90, 90, 110, 0.20)');
                ctx.fillStyle = isEquipped ? 'rgba(25, 60, 40, 0.85)' : 'rgba(15, 25, 50, 0.88)';
                ctx.beginPath();
                ctx.roundRect(x, y, cardW, cardH, 14);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = isEquipped
                    ? 'rgba(140, 255, 140, 0.75)'
                    : (owned ? 'rgba(140, 255, 140, 0.35)' : (affordable ? 'rgba(255, 191, 36, 0.45)' : 'rgba(120, 120, 140, 0.30)'));
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Expanding gold ring pulse on the just-bought card so the
                // purchase feedback points straight at the new skin.
                if (shopCelebration && shopCelebration.skinId === skin.id) {
                    const ringElapsed = Date.now() - shopCelebration.startedAt;
                    if (ringElapsed < 1200) {
                        const ringP = ringElapsed / 1200;
                        ctx.strokeStyle = 'rgba(255, 216, 74, ' + (0.75 * (1 - ringP)).toFixed(2) + ')';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.roundRect(x - 6 - ringP * 16, y - 6 - ringP * 16, cardW + 12 + ringP * 32, cardH + 12 + ringP * 32, 18);
                        ctx.stroke();
                    }
                }

                // Mascot + ship preview + name
                drawMascotPreview(skin, x + 92, y + 42, 22);
                drawMiniShip(skin, x + 160, y + 42, 0.85);
                ctx.fillStyle = '#f1f5f9';
                ctx.font = 'bold 15px Orbitron, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'alphabetic';
                ctx.fillText(skin.name, x + cardW / 2, y + 78);

                // Price / status line
                ctx.font = '12px Orbitron, sans-serif';
                if (owned) {
                    ctx.fillStyle = '#8ff08f';
                    ctx.fillText(isEquipped ? 'ACTIVE SKIN' : 'OWNED', x + cardW / 2, y + 93);
                } else {
                    ctx.fillStyle = affordable ? '#ffd84a' : '#ff8a8a';
                    ctx.fillText(SKIN_PRICE.toLocaleString('en-US') + ' stars', x + cardW / 2, y + 93);
                }

                // Action button
                const btnW = cardW - 48, btnH = 27;
                const btnX = x + 24, btnY = y + 98;
                if (!owned) {
                    if (affordable) {
                        drawGlassButton(btnX, btnY, btnW, btnH, 10, 'BUY', 'bold 13px Orbitron, sans-serif', {
                            isPrimary: true,
                            icon: 'star',
                            hoverStrength: hoverFor(buyAction)
                        });
                        menuButtons.push({ rect: { x: btnX, y: btnY, w: btnW, h: btnH }, action: buyAction });
                    } else {
                        // Not enough stars: flat dim-grey pill, no glow and
                        // no click target, so it clearly reads as disabled
                        // (the violet glass border would look tappable).
                        ctx.fillStyle = 'rgba(42, 42, 58, 0.90)';
                        ctx.strokeStyle = 'rgba(150, 150, 160, 0.30)';
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.roundRect(btnX, btnY, btnW, btnH, 10);
                        ctx.fill();
                        ctx.stroke();
                        ctx.font = 'bold 12px Orbitron, sans-serif';
                        ctx.fillStyle = '#8b8fa0';
                        ctx.textBaseline = 'alphabetic';
                        drawIconLabelCenter('lock', 'LOCKED', btnX + btnW / 2, btnY + 15, 'bold 12px Orbitron, sans-serif', '#8b8fa0', '#8b8fa0', 13);
                    }
                } else if (isEquipped) {
                    // Green confirmed pill — no click target.
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = 'rgba(120, 255, 120, 0.6)';
                    ctx.fillStyle = '#1a4a2a';
                    ctx.strokeStyle = '#66ee88';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.roundRect(btnX, btnY, btnW, btnH, 10);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.stroke();
                    ctx.font = 'bold 12px Orbitron, sans-serif';
                    ctx.fillStyle = '#aaffaa';
                    ctx.fillText('\u2713 EQUIPPED', btnX + btnW / 2, btnY + 15);
                } else {
                    drawGlassButton(btnX, btnY, btnW, btnH, 10, 'EQUIP', 'bold 13px Orbitron, sans-serif', {
                        icon: 'check',
                        hoverStrength: hoverFor(equipAction)
                    });
                    menuButtons.push({ rect: { x: btnX, y: btnY, w: btnW, h: btnH }, action: equipAction });
                }
            });

            // Purchase celebration overlay: confetti + "NEW SKIN UNLOCKED!"
            // banner, drawn on top of the cards right after a successful buy.
            if (shopCelebration) {
                const celebElapsed = Date.now() - shopCelebration.startedAt;
                if (celebElapsed >= SHOP_CELEBRATION_MS) {
                    shopCelebration = null;
                } else {
                    drawShopCelebration(shopCelebration, celebElapsed);
                }
            }

            // Hint about how stars are earned
            ctx.shadowBlur = 4;
            ctx.shadowColor = 'black';
            ctx.font = '11px Orbitron, sans-serif';
            ctx.fillStyle = '#7eaad6';
            ctx.textAlign = 'center';
            ctx.fillText('Earn stars by scoring points in Classic mode — every point is one star.', canvas.width / 2, 560);

            // BACK button
            const backY = 564, backW = 160, backH = 35;
            const backX = canvas.width / 2 - backW / 2;
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(26, 31, 44, 0.80)';
            ctx.strokeStyle = 'rgba(138, 43, 226, 0.5)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.roundRect(backX, backY, backW, backH, 10);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#f1f5f9';
            ctx.font = '18px Orbitron, sans-serif';
            ctx.textBaseline = 'middle';
            ctx.fillText('\u2190 BACK', canvas.width / 2, backY + backH / 2);
            menuButtons.push({ rect: { x: backX, y: backY, w: backW, h: backH }, action: 'shopBack' });

            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
            ctx.shadowBlur = 0;
        }

        // ===== 4.5 Game entities (stars, meteorites) =====
        function createStar() {
            const isLucky = Math.random() < 0.08;
            return {
                x: Math.random() * canvas.width,
                y: -10,
                radius: isLucky ? 14 + Math.random() * 3 : 8 + Math.random() * 10,
                speed: isLucky ? 1 + Math.random() * 1.3 : 1 + Math.random() * 3,
                color: isLucky
                    ? '#ffd84a'
                    : `hsl(${Math.random() * 60 + 30}, 100%, 60%)`,
                kind: isLucky ? 'lucky' : 'normal',
                spin: (Math.random() - 0.5) * 0.06,
                pointValue: isLucky ? 3 : 1
            };
        }

        function getComboMultiplier() {
            return 1 + Math.min(3, Math.floor(comboStreak / 5));
        }

        // ----- Flashing red poison star (Classic) -----
        // Catching it costs a life; unlike every other star in the mode,
        // MISSING it costs nothing — the penalty lives on the catch.
        function createRedStar() {
            return {
                x: 20 + Math.random() * (canvas.width - 40),
                y: -12,
                radius: 10 + Math.random() * 5,
                speed: 2.5 + Math.random() * 2,
                color: '#ff3b30',
                kind: 'red',
                spin: (Math.random() - 0.5) * 0.08,
                pointValue: 0
            };
        }

        // ----- Super Star (Classic) -----
        // Catching it begins the STARDANCE feast: rainbow filter + a
        // zigzag strip of stars for 20 seconds.
        function createSuperStar() {
            return {
                x: 30 + Math.random() * (canvas.width - 60),
                y: -14,
                radius: 15,
                speed: 1.6 + Math.random() * 0.8,
                color: '#ffffff',   // rainbow is drawn live in drawFallingStars
                kind: 'super',
                spin: 0.02,
                pointValue: 5
            };
        }

        function startStarDance() {
            starDanceFramesLeft = STAR_DANCE_FRAMES;
            starDanceFlashFramesLeft = STAR_DANCE_FLASH_FRAMES;
            // A single random, wide spot — the strip's starting column —
            // then it sweeps back and forth in a triangle wave (a literal
            // zigzag) between two bounds around that base x.
            starDanceBaseX = 80 + Math.random() * (canvas.width - 160);
            starDanceX = starDanceBaseX;
            starDanceDir = Math.random() < 0.5 ? -1 : 1;
            // The zigzag travel is clamped so the strip (≈100 px wide) can
            // never sweep fully off-canvas — at least half the band always
            // stays visible on screen.
            const half = STAR_DANCE_STRIP_WIDTH / 2;
            starDanceBound = Math.min(
                40 + Math.random() * 140,
                Math.max(0, starDanceBaseX - half - 20),
                Math.max(0, canvas.width - starDanceBaseX - half - 20)
            );
        }

        function updateStarDanceSpawner() {
            // The strip centre travels continuously in a triangle wave.
            starDanceX += STAR_DANCE_SWEEP_SPEED * starDanceDir;
            if (starDanceX > starDanceBaseX + starDanceBound) {
                starDanceX = starDanceBaseX + starDanceBound;
                starDanceDir = -1;
            }
            if (starDanceX < starDanceBaseX - starDanceBound) {
                starDanceX = starDanceBaseX - starDanceBound;
                starDanceDir = 1;
            }
            // Dense band of rainbow stars as wide as the player's catch
            // bubble (± half the strip width around the centre).
            const half = STAR_DANCE_STRIP_WIDTH / 2;
            for (let k = 0; k < (IS_MOBILE ? 1 : 2); k++) {
                if (Math.random() < 0.85) {
                    stars.push({
                        x: starDanceX + (Math.random() * 2 - 1) * half * 0.85,
                        y: -10 - Math.random() * 30,
                        radius: 8 + Math.random() * 5,
                        speed: 2 + Math.random() * 1.6,
                        color: 'hsl(' + Math.floor(Math.random() * 360) + ', 100%, 62%)',
                        kind: 'strip',
                        spin: (Math.random() - 0.5) * 0.05,
                        pointValue: 1
                    });
                }
            }
        }

        function createMeteorite() {
            // Meteorites spawn at the top and descend. They rotate while
            // falling, have a fiery trail, and come in varying sizes — larger
            // ones move slower but are harder to dodge.
            const sizes = [
                { radius: 22, speed: 1.4 + Math.random() * 0.6 },
                { radius: 30, speed: 1.1 + Math.random() * 0.5 },
                { radius: 40, speed: 0.8 + Math.random() * 0.4 }
            ];
            const pick = sizes[Math.floor(Math.random() * sizes.length)];
            return {
                x: Math.random() * (canvas.width - 80) + 40,
                y: -50,
                radius: pick.radius,
                speed: pick.speed,
                rotation: Math.random() * Math.PI * 2,
                rotationSpeed: (Math.random() - 0.5) * 0.08,
                hue: Math.random() * 360          // full spectrum - just like the stars
            };
        }

        // ===== 4.5 Run lifecycle =====
        function resetGame() {
            stars = [];
            meteorites = [];
            // Survival monster state must reset on every new run so a
            // half-finished monster from the previous run doesn't fade
            // in over the new player's first 8 seconds. The next-spawn
            // deadline goes back to the first-spawn constant so the
            // first monster still appears ~8 s into the new run.
            monster.active = false;
            monster.state = 'idle';
            monster.beamActive = false;
            monsterNextSpawnAtMs = SURVIVAL_MONSTER_FIRST_SPAWN_MS;
            playerInBeamSince = 0;
            // Battle mode keeps three independent collections so the
            // Classic star physics and Survival meteorite AI never leak
            // into each other (the Battle bullets move in a straight
            // line, neither with the stars' sideways drift nor with
            // meteorites' gravity). Wipe them on every new run so a
            // half-finished previous Battle cannot bleed its enemies or
            // bullets into the next game.
            battleEnemies = [];
            playerBullets = [];
            enemyBullets = [];
            // BOSS FIGHT reset — fresh king, fresh field. The boss is
            // present from frame 1 (no spawn delay: it's the match's
            // centrepiece). healStars wipe with the rest of the pools so
            // a previous run can't bleed green crosses into the next.
            boss.x = 400;
            boss.hp = boss.maxHp;
            boss.swayPhase = 0;
            boss.fireTimer = 90;
            boss.flashTimer = 0;
            boss.hitFlash = 0;
            bossDefeated = false;
            bossCompletionMs = 0;
            healStars = [];
            // Battle spawn cadence resets each new run too — the
            // `battleSpawnCooldown` initial value (90 frames) keeps the
            // first enemy from appearing off-screen and gives the
            // player roughly 1.5 seconds to read the field.
            battleSpawnCooldown = 90;
            battleElapsedMs = 0;
            // Reset HP to full so each new Battle run starts fresh.
            hp = 100;
            score = 0;
            lives = 3;
            gameOver = false;
            quickSaveEndedRun = false;
            comboStreak = 0;
            comboBest = 0;
            luckyStarsCaught = 0;
            isNewRecord = false;
            newRecordPosition = -1;
            inGameRecordShown = false;
            inGameRecordShownAt = 0;
            meteoriteHitCooldown = 0;
            playerHitFlash = 0;
            survivalStartTime = 0;
            survivalScorePerSecondTick = 0;
            superSpawnCooldown = 1500;     // first Super Star after ~25 s
            starDanceFramesLeft = 0;
            starDanceFlashFramesLeft = 0;
            survivalEnemySpawnCooldown = 0;
            player.x = 400;
            player.y = 550;
            player.targetX = 400;
            // ----- CO-OP reset -----
            // Wipe beams + cooldown so a half-finished CO-OP run cannot
            // bleed combat data into the next one; restore both ships
            // to their canonical x/y so the first frame looks the same
            // whether the player came from the menu or from a restart.
            // Green sits at y=350 (above Blue's y=550) and on top of
            // the centre line so the player can see both ships at a
            // glance from frame 1. coopGreenHitCooldown resets to 0 and
            // the SHARED health pool refills to full — both players
            // start healthy, with no individual lives to manage.
            greenPlayerBeams = [];
            greenPlayer.x = 400;
            greenPlayer.y = 350;
            coopHp = coopMaxHp;
            coopElapsedMs = 0;
            coopSpawnCooldown = 110;
            coopGreenHitCooldown = 0;
            lastGreenFireTimeMs = 0;
        }

        function startGame(mode) {
            if (typeof mode === 'string') {
                gameMode = mode;
            }
            if (!currentUser) {
                showMobileInput(false);
                gameState = GAME_STATES.ACCOUNT;
                accountInput = '';
                return;
            }
            stopMenuMusic();
            resetGame();
            showMobileInput(false);
            gameState = GAME_STATES.PLAYING;
            startPlayTimer();          // begin timing this play session
            if (gameMode === GAME_MODES.CLASSIC) {
                playClassicMusic();    // background song for the Classic run (no-op for Survival)
            } else if (gameMode === GAME_MODES.SURVIVAL) {
                playSurvivalMusic();   // background song for the Survival run (no-op for Classic)
            } else if (gameMode === GAME_MODES.BATTLE) {
                // Battle ships take the field under SFX alone — the user opted
                // to add a dedicated track later, so this branch is explicitly a
                // no-op. We still set gameMode via the inner branch above so
                // any pre-existing track for the previously-active mode stops
                // before play (Classic / Survival have already done so via
                // stopMenuMusic + resetGame clearing internal audio counters).
                lastFireTimeMs = 0;
            } else if (gameMode === GAME_MODES.BOSS) {
                // BOSS FIGHT reuses Battle's shooting + enemy pools, so it
                // gets the same SFX-only BGM discipline and a clean
                // firing-cooldown timestamp on every fresh run.
                lastFireTimeMs = 0;
            } else if (gameMode === GAME_MODES.COOP) {
                // CO-OP reuses Battle's enemy / bullet pools, so reset the
                // same firing-cooldown timestamp on every fresh run so the
                // first shot comes out clean (otherwise restarting with
                // mouse-down could fire instantly).
                lastFireTimeMs = 0;
                lastGreenFireTimeMs = 0;
            }
        }

        function togglePause() {
            // Clear sticky CO-OP keys so a held arrow + P pause
            // doesn't leave the green ship drifting on unpause. Also
            // a safety net for the window-blur handler that's
            // already firing — covering both leaves no path for
            // coopKeys to survive a pause-resume cycle.
            coopKeys.left = false;
            coopKeys.right = false;
            coopKeys.up = false;
            coopKeys.space = false;
            if (gameState === GAME_STATES.PLAYING && !gameOver) {
                flushPlayTime();       // stop the clock while paused
                gameState = GAME_STATES.PAUSED;
                isPaused = true;
                pauseClassicMusic();   // silence the Classic BGM while paused (keeps position)
                pauseSurvivalMusic();  // silence the Survival BGM while paused (keeps position)
                playClickSound();
            } else if (gameState === GAME_STATES.PAUSED) {
                startPlayTimer();      // resume the clock on unpause
                gameState = GAME_STATES.PLAYING;
                isPaused = false;
                playClassicMusic();    // resume the Classic BGM (no-op for Survival)
                playSurvivalMusic();   // resume the Survival BGM (no-op for Classic)
                playClickSound();
            }
        }

        function updatePauseButton() {
            const pauseButton = document.getElementById('pauseButton');
            const hint = document.getElementById('pauseKeyHint');
            if (!pauseButton) return;

            const showable = gameState === GAME_STATES.PLAYING || gameState === GAME_STATES.PAUSED;
            if (showable) {
                pauseButton.style.display = 'flex';
                const pauseSvg = pauseButton.querySelector('svg');
                if (pauseSvg) {
                    pauseSvg.innerHTML = gameState === GAME_STATES.PAUSED
                        ? '<path d="M8 5v14l11-7z"/>'
                        : '<rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/>';
                }
                pauseButton.setAttribute('aria-label', gameState === GAME_STATES.PAUSED ? 'Resume Game' : 'Pause Game');
                // Pin the S-pill reference once per call so the
                // display / opacity bookkeeping for both pills is in
                // lock-step with the P-pill's lifecycle.
                const sHint = document.getElementById('saveKeyHint');
                if (hint) {
                    // Cancel any in-flight fade-out timeout so a stale
                    // timer from a previous hide can't undo our re-show on
                    // rapid state transitions (e.g. PLAYING -> MENU ->
                    // PLAYING inside the 350 ms fade window).
                    if (hint._hideTimer) {
                        clearTimeout(hint._hideTimer);
                        hint._hideTimer = null;
                    }
                    hint.style.display = 'flex';
                }
                if (sHint) {
                    // Same hideTimer bookkeeping as the P pill so
                    // a stale pending-hide from a prior state can't
                    // undo the re-show on rapid PLAYING → MENU →
                    // PLAYING transitions inside the 350 ms fade.
                    if (sHint._hideTimer) {
                        clearTimeout(sHint._hideTimer);
                        sHint._hideTimer = null;
                    }
                    sHint.style.display = 'flex';
                }
                positionPauseButton();
                if (hint) hint.style.opacity = '1';
                if (sHint) sHint.style.opacity = '1';
            } else {
                pauseButton.style.display = 'none';
                const sHint = document.getElementById('saveKeyHint');
                if (hint) {
                    // Fade the pill out before un-mounting it so it doesn't
                    // pop in / out abruptly across state transitions.
                    hint.style.opacity = '0';
                    if (hint._hideTimer) clearTimeout(hint._hideTimer);
                    hint._hideTimer = setTimeout(() => {
                        hint.style.display = 'none';
                        hint._hideTimer = null;
