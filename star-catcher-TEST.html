        // ===== 6.4 Account screen =====
        function drawAccountScreen() {
            drawBackground();

            ctx.textAlign = 'center';
            ctx.shadowBlur = 30;
            ctx.shadowColor = 'rgba(138, 43, 226, 0.5)';

            ctx.font = 'bold 44px Orbitron, sans-serif';
            ctx.fillStyle = 'white';
            // Baseline nudged down (was 62) so the 44px title's glow isn't
            // clipped by the canvas top edge.
            drawIconLabelCenter('account', 'ACCOUNT', canvas.width / 2, 74, 'bold 44px Orbitron, sans-serif', 'white', 'white', 24);

            ctx.shadowBlur = 10;
            ctx.shadowColor = 'black';
            ctx.font = '18px Orbitron, sans-serif';
            ctx.fillStyle = '#aaa';
            ctx.fillText('Enter your name (max 12 characters)', canvas.width / 2, 120);

            const isMobile = window.innerWidth <= 768;
            if (isMobile) {
                showMobileInput(true);
            }

            ctx.textAlign = 'left';
            ctx.shadowBlur = 0;
        }

        // ===== 6.5 Stars, meteorites + survival overlay =====
        function drawFallingStars() {
            for (const star of stars) {
                ctx.save();
                ctx.translate(star.x, star.y);
                ctx.rotate(star.spin || 0);
                const lucky = star.kind === 'lucky';
                ctx.shadowColor = lucky ? '#ffd84a' : star.color;
                ctx.shadowBlur = lucky ? 28 : 20;
                if (lucky) {
                    const glow = ctx.createRadialGradient(0, 0, 1, 0, 0, star.radius * 2.4);
                    glow.addColorStop(0, 'rgba(255, 240, 168, 0.95)');
                    glow.addColorStop(0.45, 'rgba(255, 184, 77, 0.45)');
                    glow.addColorStop(1, 'rgba(255, 159, 67, 0)');
                    ctx.fillStyle = glow;
                    ctx.beginPath();
                    ctx.arc(0, 0, star.radius * 1.7, 0, Math.PI * 2);
                    ctx.fill();
                }

                if (star.kind === 'red') {
                    // Flashing poison star — a bright/dim pulse driven by
                    // the star's own height + time so each one flashes out
                    // of sync with its neighbours.
                    const pulse = 0.5 + 0.5 * Math.sin(star.y * 0.22 + performance.now() * 0.02);
                    ctx.shadowColor = '#ff2d2d';
                    ctx.shadowBlur = 16 + pulse * 18;
                    ctx.fillStyle = 'rgb(255,' + Math.round(40 + pulse * 50) + ',' + Math.round(38 + pulse * 40) + ')';
                    ctx.strokeStyle = pulse > 0.55 ? '#ffe0e0' : '#ff9090';
                    ctx.lineWidth = 1.4;
                    const redSpikes = 5;
                    const redOuter = star.radius;
                    const redInner = star.radius * 0.42;
                    ctx.beginPath();
                    for (let i = 0; i < redSpikes * 2; i++) {
                        const radius = i % 2 === 0 ? redOuter : redInner;
                        const angle = (i * Math.PI) / redSpikes - Math.PI / 2;
                        const x = radius * Math.cos(angle);
                        const y = radius * Math.sin(angle);
                        if (i === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                    ctx.restore();
                    continue;
                }

                if (star.kind === 'super') {
                    // Super Star — big pulsing rainbow star that triggers
                    // the STARDANCE feast when caught.
                    const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 130);
                    const hue = (performance.now() / 22) % 360;
                    ctx.shadowColor = 'hsl(' + hue + ', 100%, 70%)';
                    ctx.shadowBlur = 26 + pulse * 16;
                    ctx.strokeStyle = 'hsla(' + hue + ', 100%, 72%, ' + (0.55 + pulse * 0.4).toFixed(2) + ')';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.arc(0, 0, star.radius * (1.3 + pulse * 0.3), 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.fillStyle = 'hsl(' + ((hue + 45) % 360) + ', 100%, 66%)';
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1.2;
                    const superSpikes = 8;
                    const superOuter = star.radius;
                    const superInner = star.radius * 0.38;
                    ctx.beginPath();
                    for (let i = 0; i < superSpikes * 2; i++) {
                        const radius = i % 2 === 0 ? superOuter : superInner;
                        const angle = (i * Math.PI) / superSpikes - Math.PI / 2;
                        const x = radius * Math.cos(angle);
                        const y = radius * Math.sin(angle);
                        if (i === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                    ctx.restore();
                    continue;
                }

                ctx.fillStyle = star.color;
                ctx.strokeStyle = lucky ? '#fff4c0' : '#fff';
                ctx.lineWidth = lucky ? 1.5 : 1;

                const spikes = lucky ? 8 : 5;
                const outerRadius = star.radius;
                const innerRadius = star.radius * 0.4;
                ctx.beginPath();
                for (let i = 0; i < spikes * 2; i++) {
                    const radius = i % 2 === 0 ? outerRadius : innerRadius;
                    const angle = (i * Math.PI) / spikes - Math.PI / 2;
                    const x = radius * Math.cos(angle);
                    const y = radius * Math.sin(angle);
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            }
        }

        function drawMeteorite(m) {
            // Fire trail: a soft comma-shaped flame painted underneath the
            // rock that gets fainter and smaller the further back it goes.
            ctx.save();
            ctx.translate(m.x, m.y);
            ctx.rotate(m.rotation);

            const trailLen = m.radius * 2.4;
            const trailGrad = ctx.createLinearGradient(0, m.radius * 0.6, 0, m.radius * 0.6 + trailLen);
            trailGrad.addColorStop(0, `hsla(${m.hue}, 95%, 65%, 0.85)`);
            trailGrad.addColorStop(0.4, `hsla(${m.hue + 10}, 95%, 55%, 0.45)`);
            trailGrad.addColorStop(1, `hsla(${m.hue + 20}, 95%, 45%, 0)`);
            ctx.fillStyle = trailGrad;
            ctx.beginPath();
            ctx.moveTo(-m.radius * 0.55, m.radius * 0.6);
            ctx.quadraticCurveTo(0, m.radius * 0.6 + trailLen * 0.55, m.radius * 0.55, m.radius * 0.6);
            ctx.lineTo(m.radius * 0.25, m.radius * 0.6 + trailLen);
            ctx.quadraticCurveTo(-m.radius * 0.4, m.radius * 0.6 + trailLen * 1.1, -m.radius * 0.25, m.radius * 0.6 + trailLen);
            ctx.closePath();
            ctx.fill();

            // Soft outer glow so the meteorite reads as burning.
            // Skip on mobile — shadowBlur is the most expensive per-meteorite
            // op and a phone can't sustain 25+ of them at 60fps.
            ctx.shadowColor = `hsl(${m.hue}, 95%, 60%)`;
            ctx.shadowBlur = IS_MOBILE ? 0 : 24;

            // Rocky body — irregular polygon with a fiery outer ring
            const sides = 7;
            const ringGrad = ctx.createRadialGradient(0, 0, m.radius * 0.4, 0, 0, m.radius);
            ringGrad.addColorStop(0, `hsl(${m.hue + 15}, 80%, 55%)`);
            ringGrad.addColorStop(0.7, `hsl(${m.hue}, 60%, 30%)`);
            ringGrad.addColorStop(1, `hsl(${m.hue + 20}, 45%, 9%)`);
            ctx.fillStyle = ringGrad;
            ctx.beginPath();
            for (let i = 0; i < sides; i++) {
                const wobble = 0.82 + ((i * 41) % 17) / 100;   // pseudo-random radius wobble
                const angle = (i / sides) * Math.PI * 2;
                const px = Math.cos(angle) * m.radius * wobble;
                const py = Math.sin(angle) * m.radius * wobble;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = `hsla(${m.hue + 10}, 95%, 70%, 0.8)`;
            ctx.lineWidth = 2;
            ctx.stroke();

            // A few bright crater highlights for texture
            ctx.shadowBlur = 0;
            ctx.fillStyle = `hsla(${m.hue + 20}, 100%, 75%, 0.6)`;
            ctx.beginPath();
            ctx.arc(-m.radius * 0.25, -m.radius * 0.15, m.radius * 0.18, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(m.radius * 0.3, m.radius * 0.18, m.radius * 0.12, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function drawMeteorites() {
            for (const m of meteorites) {
                drawMeteorite(m);
            }
        }

        function drawSurvivalOverlay() {
            // Same background, with a red filter on top so it is obvious
            // the player is in survival mode. The vignette darkens the
            // edges a bit to feel more "dangerous".
            const bodyRed = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bodyRed.addColorStop(0, 'rgba(180, 20, 20, 0.30)');
            bodyRed.addColorStop(0.5, 'rgba(200, 30, 30, 0.28)');
            bodyRed.addColorStop(1, 'rgba(140, 10, 10, 0.34)');
            ctx.fillStyle = bodyRed;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const vignette = ctx.createRadialGradient(
                canvas.width / 2, canvas.height / 2, canvas.height * 0.35,
                canvas.width / 2, canvas.height / 2, canvas.height * 0.9
            );
            vignette.addColorStop(0, 'rgba(255, 80, 80, 0)');
            vignette.addColorStop(1, 'rgba(120, 0, 0, 0.45)');
            ctx.fillStyle = vignette;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Subtle red scanline flicker, much weaker than the body tint.
            // Use a wider row stride on mobile so the loop cuts in half.
            ctx.fillStyle = 'rgba(255, 60, 60, 0.05)';
            const scanStride = IS_MOBILE ? 8 : 4;
            for (let y = 0; y < canvas.height; y += scanStride) {
                ctx.fillRect(0, y, canvas.width, 2);
            }
        }

        function drawStarDanceOverlay() {
            // Rainbow filter over the Classic scene while STARDANCE runs —
            // the same draw-after-the-field approach as the Survival red
            // overlay, just in rainbow instead of red.
            if (starDanceFramesLeft <= 0) return;
            const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
            const stops = [
                'rgba(255, 60, 60, 0.22)',
                'rgba(255, 160, 40, 0.20)',
                'rgba(255, 220, 60, 0.20)',
                'rgba(80, 220, 120, 0.20)',
                'rgba(70, 140, 255, 0.20)',
                'rgba(180, 90, 255, 0.22)'
            ];
            stops.forEach((c, i) => g.addColorStop(i / (stops.length - 1), c));
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Soft pulsing centre glow so the whole screen feels alive.
            const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 180);
            const rg = ctx.createRadialGradient(
                canvas.width / 2, canvas.height / 2, 40,
                canvas.width / 2, canvas.height / 2, canvas.height * 0.8
            );
            rg.addColorStop(0, 'rgba(255, 255, 255, ' + (0.04 + pulse * 0.05).toFixed(2) + ')');
            rg.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = rg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawStarDanceBanner() {
            // "STARDANCE" flashes in rainbow for the first two seconds of
            // the feast (alpha blinks via performance.now — the 2-second
            // WINDOW itself is governed by the frame counter so pause
            // freezes it).
            if (starDanceFlashFramesLeft <= 0) return;
            const alpha = 0.55 + 0.45 * Math.sin(performance.now() / 90);
            const g = ctx.createLinearGradient(canvas.width / 2 - 220, 0, canvas.width / 2 + 220, 0);
            g.addColorStop(0, '#ff5c5c');
            g.addColorStop(0.25, '#ffb13d');
            g.addColorStop(0.5, '#ffe95c');
            g.addColorStop(0.75, '#5ce0a0');
            g.addColorStop(1, '#7a9dff');
            ctx.save();
            ctx.globalAlpha = Math.max(0.12, alpha);
            ctx.font = 'bold 54px Orbitron, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'alphabetic';
            ctx.shadowColor = 'rgba(255, 255, 255, 0.9)';
            ctx.shadowBlur = 26;
            ctx.fillStyle = g;
            ctx.fillText('STARDANCE', canvas.width / 2, canvas.height / 2 - 40);
            ctx.restore();
        }

        // ===== 6.6 Ships (blue + green) + beams =====
        function drawShip() {
            // The ship wears the equipped skin, so buying a RED skin also
            // repaints the in-game player ship. The sprite is drawn by the
            // shared drawMiniShip(skin, cx, cy, scale) helper — the exact
            // same art the shop previews — so the two can never drift.
            drawMiniShip(getEquippedSkin(), player.x, player.y, 1);

            // Damage flash: while playerHitFlash > 0 the blue ship tints
            // red — the same "small animation" the green CO-OP ship shows
            // during its i-frame window, so both players share one
            // hurt-feedback language in every mode.
            if (playerHitFlash > 0) {
                ctx.save();
                ctx.translate(player.x, player.y);
                ctx.globalCompositeOperation = 'source-atop';
                ctx.fillStyle = 'rgba(255, 80, 80, 0.5)';
                ctx.beginPath();
                ctx.ellipse(0, -5, 20, 16, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // ===== CO-OP draw helpers =====
        // Green ship (Player 2) sprite. Mirrors drawShip()'s layered
        // ellipse + fin + thruster recipe so both ships feel like a
        // matching pair visually. The only differences are the green
        // palette and the lack of an orange thruster flame (Green is
        // focused on shooting, not thrusting, so a subtle pulsating
        // thruster dot reads quieter).
        function drawGreenShip() {
            ctx.save();
            ctx.translate(greenPlayer.x, greenPlayer.y);
            ctx.shadowColor = '#6f6';
            ctx.shadowBlur = 25;

            // Body — angular green silhouette
            ctx.beginPath();
            ctx.ellipse(0, 0, 18, 14, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#3ec46d';
            ctx.fill();
            ctx.strokeStyle = '#8fdfa0';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Inner cockpit disc
            ctx.beginPath();
            ctx.ellipse(0, -6, 10, 7, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#8fdfa0';
            ctx.fill();
            ctx.strokeStyle = '#cfffd6';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Twin eye dots (matches Blue ship)
            ctx.fillStyle = '#fff';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(-4, -8, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(4, -8, 2, 0, Math.PI * 2);
            ctx.fill();

            // Side fins
            ctx.fillStyle = '#26884a';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.moveTo(-20, 5);
            ctx.lineTo(-8, -2);
            ctx.lineTo(-8, 8);
            ctx.closePath();
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(20, 5);
            ctx.lineTo(8, -2);
            ctx.lineTo(8, 8);
            ctx.closePath();
            ctx.fill();

            // Thruster: small green-tinted flame so the reader can see
            // the ship is moving and which direction it's facing.
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#6f6';
            ctx.fillStyle = '#6f6';
            ctx.beginPath();
            ctx.moveTo(-5, 14);
            ctx.lineTo(0, 22);
            ctx.lineTo(5, 14);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#cfffd6';
            ctx.beginPath();
            ctx.moveTo(-3, 14);
            ctx.lineTo(0, 18);
            ctx.lineTo(3, 14);
            ctx.closePath();
            ctx.fill();

            // i-frame tint: when coopGreenHitCooldown > 0 the ship has
            // recently taken damage and we tint it red so the player
            // can see the i-frame window.
            if (coopGreenHitCooldown > 0) {
                ctx.globalCompositeOperation = 'source-atop';
                ctx.fillStyle = 'rgba(255, 80, 80, 0.5)';
                ctx.beginPath();
                ctx.ellipse(0, 0, 20, 16, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        // Green beams (Player 2's light-green laser shots). Same
        // dual-shape recipe as the Battle blue rays but with a green
        // palette: wider dimmer halo + narrower bright white core.
        function drawGreenBeams() {
            for (const b of greenPlayerBeams) {
                ctx.save();
                ctx.shadowBlur = 16;
                ctx.shadowColor = '#6f6';
                ctx.fillStyle = '#6f6';
                ctx.fillRect(b.x - 5, b.y - 11, 10, 22);
                ctx.shadowBlur = 10;
                ctx.fillStyle = '#eaffea';
                ctx.fillRect(b.x - 2, b.y - 9, 4, 18);
                ctx.restore();
            }
        }

        // ===== 6.7 Battle / BOSS renderers =====
        // ====== Battle mode renderers ======
        // These three renderers are only invoked when gameMode === BATTLE
        // (see the GAME_STATES.PLAYING switch in the draw() loop below).
        // They were added together with updateBattle() / createEnemy()
        // / fireBullet() but were forgotten at integration time — the
        // update loop was mutating battleEnemies / playerBullets /
        // enemyBullets while nothing drew them, leaving the canvas empty
        // during a Battle run.

        function drawEnemies() {
            for (const e of battleEnemies) {
                ctx.save();
                ctx.translate(e.x, e.y);
                // HP bar: rendered ABOVE the enemy sprite so the player
                // can read it without having to overlay onto the ship
                // art. Colour-matches the player HP bar so the eye
                // learns one colour → fraction mapping. Ratio is against
                // each enemy's own maxHp (elites have 120). Skipped in
                // Survival, where these ships are pure dodge-hazards (no
                // player bullets) — a full green bar would wrongly imply
                // they can be destroyed.
                if (gameMode !== GAME_MODES.SURVIVAL) {
                    const hpRatio = Math.max(0, e.hp / (e.maxHp || 100));
                    const barW = e.elite ? 64 : 52;
                    const barX = -barW / 2;
                    const barY = -42;
                    ctx.fillStyle = 'rgba(0,0,0,0.7)';
                    ctx.fillRect(barX, barY, barW, 4);
                    let barColor;
                    if (hpRatio > 0.5) barColor = '#3ec46d';
                    else if (hpRatio > 0.25) barColor = '#ffaa33';
                    else barColor = '#ff4060';
                    ctx.fillStyle = barColor;
                    ctx.fillRect(barX, barY, barW * hpRatio, 4);
                }

                // While the pre-fire telegraph flash is active
                // (flashTimer > 0) both silhouettes swap to white for a
                // clearly visible "DODGE!" cue.
                const isTelegraph = e.flashTimer > 0;

                if (e.elite) {
                    // Orange elite — a hexagonal hull so it reads as a
                    // completely different geometric class from the red
                    // arrow-shaped ships, with twin engine pods + a
                    // central diamond cockpit.
                    ctx.shadowBlur = isTelegraph ? 30 : 22;
                    ctx.shadowColor = isTelegraph ? '#ffffff' : '#ff9a3c';
                    ctx.fillStyle = isTelegraph ? '#ffffff' : '#c2601a';
                    ctx.beginPath();
                    ctx.moveTo(0, -27);
                    ctx.lineTo(24, -11);
                    ctx.lineTo(24, 11);
                    ctx.lineTo(0, 27);
                    ctx.lineTo(-24, 11);
                    ctx.lineTo(-24, -11);
                    ctx.closePath();
                    ctx.fill();
                    ctx.strokeStyle = isTelegraph ? '#ffffff' : '#ffb066';
                    ctx.lineWidth = isTelegraph ? 2 : 1.5;
                    ctx.stroke();

                    // Horizontal band lines across the hexagon
                    ctx.strokeStyle = isTelegraph ? '#ffffff' : 'rgba(255, 176, 102, 0.55)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(-18, -3);
                    ctx.lineTo(18, -3);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(-20, 8);
                    ctx.lineTo(20, 8);
                    ctx.stroke();

                    // Twin engine pods at the lower corners
                    ctx.fillStyle = isTelegraph ? '#ffffff' : '#8a3d0f';
                    ctx.beginPath();
                    ctx.arc(-16, 15, 5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(16, 15, 5, 0, Math.PI * 2);
                    ctx.fill();

                    // Diamond cockpit in the centre
                    ctx.shadowBlur = 14;
                    ctx.shadowColor = isTelegraph ? '#ffffff' : '#ffb066';
                    ctx.fillStyle = isTelegraph ? '#ffffff' : '#ffd9a8';
                    ctx.beginPath();
                    ctx.moveTo(0, -9);
                    ctx.lineTo(8, -2);
                    ctx.lineTo(0, 5);
                    ctx.lineTo(-8, -2);
                    ctx.closePath();
                    ctx.fill();
                } else {
                    // Body — angular red silhouette.
                    ctx.shadowBlur = isTelegraph ? 26 : 18;
                    ctx.shadowColor = isTelegraph ? '#ffffff' : '#ff3030';
                    ctx.fillStyle = isTelegraph ? '#ffffff' : '#a01818';
                    ctx.beginPath();
                    ctx.moveTo(0, -22);
                    ctx.lineTo(20, 4);
                    ctx.lineTo(14, 18);
                    ctx.lineTo(-14, 18);
                    ctx.lineTo(-20, 4);
                    ctx.closePath();
                    ctx.fill();
                    ctx.strokeStyle = isTelegraph ? '#ffffff' : '#ff5050';
                    ctx.lineWidth = isTelegraph ? 2 : 1.5;
                    ctx.stroke();

                    // Cockpit — inner ellipse with a glow that intensifies
                    // during telegraph so the cursor knows the shot is
                    // about to leave the bay.
                    ctx.shadowBlur = 14;
                    ctx.shadowColor = isTelegraph ? '#ffffff' : '#ff8888';
                    ctx.fillStyle = isTelegraph ? '#ffffff' : '#ff8866';
                    ctx.beginPath();
                    ctx.ellipse(0, -2, 6, 4, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        function drawPlayerBullets() {
            // Blue ray bolts. Two stacked rects: a wider, dimmer
            // outer glow + a narrower bright white core. Travels
            // straight up (set in updateBattle).
            for (const b of playerBullets) {
                ctx.save();
                ctx.shadowBlur = 16;
                ctx.shadowColor = 'rgba(138, 43, 226, 0.5)';
                ctx.fillStyle = '#4af';
                ctx.fillRect(b.x - 5, b.y - 8, 10, 16);
                ctx.shadowBlur = 10;
                ctx.fillStyle = '#fff';
                ctx.fillRect(b.x - 2, b.y - 6, 4, 12);
                ctx.restore();
            }
        }

        function drawEnemyBullets() {
            // Red ray bolts. Same dual-shape recipe as the player
            // bullets for visual parity, but inverted palette. The
            // outer soft halo helps the player distinguish friend vs
            // foe at a glance.
            for (const b of enemyBullets) {
                if (b.boss) {
                    // Boss missile: a fast elongated bolt rotated along
                    // its travel direction with a flickering flame trail,
                    // so the player can tell the king's shots apart from
                    // the enemies' straight-down rays.
                    const angle = Math.atan2(b.vy, b.vx || 0.0001);
                    ctx.save();
                    ctx.translate(b.x, b.y);
                    ctx.rotate(angle);
                    ctx.shadowColor = '#ff3030';
                    ctx.shadowBlur = 20;
                    ctx.fillStyle = '#ff3030';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 15, 5.5, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 8;
                    ctx.fillStyle = '#ffe7b3';
                    ctx.beginPath();
                    ctx.arc(6, 0, 3.4, 0, Math.PI * 2);
                    ctx.fill();
                    // Flame trail behind the bolt
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'rgba(255, 130, 60, 0.6)';
                    ctx.beginPath();
                    ctx.moveTo(-10, -3.2);
                    ctx.lineTo(-23, 0);
                    ctx.lineTo(-10, 3.2);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                    continue;
                }
                if (b.elite) {
                    // Elite missile — a slightly LARGER yellow ball than
                    // the normal red spheres (r14 vs r9) so the
                    // higher-damage threat pops from across the field.
                    ctx.save();
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = '#ffd84a';
                    ctx.fillStyle = '#ffd84a';
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, 14, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 10;
                    ctx.fillStyle = '#fff3c4';
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, 8.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                    continue;
                }
                ctx.save();
                ctx.shadowBlur = 16;
                ctx.shadowColor = '#ff3030';
                ctx.fillStyle = '#ff3030';
                ctx.beginPath();
                ctx.arc(b.x, b.y, 9, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 8;
                ctx.fillStyle = '#ffe7b3';
                ctx.beginPath();
                ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // ----- BOSS FIGHT renderers -----
        // The crowned alien king: a translucent green dome over a grey
        // saucer with a ring of blinking belly lights, a gold crown on
        // top and a small green alien peeking out. HP bar + 'BOSS'
        // label sit above the crown. hitFlash tints the saucer red so
        // landed shots read instantly.
        function drawBoss() {
            if (bossDefeated) return;
            ctx.save();
            ctx.translate(boss.x, boss.y);

            const hpRatio = Math.max(0, boss.hp / boss.maxHp);
            const isTelegraph = boss.flashTimer > 0;
            const flash = boss.hitFlash > 0;

            // HP bar above the crown
            const barW = 150;
            const barX = -barW / 2;
            const barY = -66;
            ctx.fillStyle = 'rgba(0,0,0,0.78)';
            ctx.fillRect(barX, barY, barW, 6);
            let barColor;
            if (hpRatio > 0.5) barColor = '#ffd84a';
            else if (hpRatio > 0.25) barColor = '#ff9f43';
            else barColor = '#ff4060';
            ctx.fillStyle = barColor;
            ctx.fillRect(barX, barY, barW * hpRatio, 6);
            // Crown icon + 'BOSS' label, centred above the HP bar.
            drawIconLabelCenter('crown', 'BOSS', 0, barY - 9,
                'bold 12px Orbitron, sans-serif', '#ffd84a', '#ffd84a', 13);

            // Crown (gold, three points + twin gem studs)
            ctx.shadowBlur = isTelegraph ? 30 : 16;
            ctx.shadowColor = isTelegraph ? '#ffffff' : '#ffd84a';
            ctx.fillStyle = isTelegraph ? '#ffffff' : '#ffd84a';
            ctx.beginPath();
            ctx.moveTo(-28, -24);
            ctx.lineTo(-33, -50);
            ctx.lineTo(-14, -38);
            ctx.lineTo(0, -54);
            ctx.lineTo(14, -38);
            ctx.lineTo(33, -50);
            ctx.lineTo(28, -24);
            ctx.closePath();
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = isTelegraph ? '#ffffff' : '#ff5b6e';
            ctx.beginPath();
            ctx.arc(-9, -37, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(9, -37, 3, 0, Math.PI * 2);
            ctx.fill();

            // Dome with the alien inside
            const domeGrad = ctx.createRadialGradient(0, -8, 4, 0, -8, 38);
            domeGrad.addColorStop(0, 'rgba(160, 255, 205, 0.95)');
            domeGrad.addColorStop(1, 'rgba(60, 160, 110, 0.55)');
            ctx.fillStyle = domeGrad;
            ctx.strokeStyle = isTelegraph ? '#ffffff' : 'rgba(130, 255, 175, 0.9)';
            ctx.lineWidth = 2;
            ctx.shadowColor = isTelegraph ? '#ffffff' : '#4aff9e';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.ellipse(0, -10, 34, 26, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Alien head + eyes + grin inside the dome
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#2e8b57';
            ctx.beginPath();
            ctx.arc(0, -14, 13, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-6, -16, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(6, -16, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#0a1f14';
            ctx.beginPath();
            ctx.arc(-6, -16, 1.8, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(6, -16, 1.8, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#0a3a22';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(0, -7, 6, 0.15 * Math.PI, 0.85 * Math.PI);
            ctx.stroke();

            // Saucer body
            ctx.shadowBlur = flash ? 28 : 14;
            ctx.shadowColor = flash ? '#ff5050' : 'rgba(200, 200, 220, 0.6)';
            ctx.fillStyle = flash ? '#ff8080' : '#9aa0b5';
            ctx.strokeStyle = '#d9dce6';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.ellipse(0, 4, 60, 19, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Blinking belly lights
            const lights = ['#ffd84a', '#4aff9e', '#6ea8ff', '#ff8a5b', '#d14aff', '#ffd84a', '#4aff9e', '#6ea8ff'];
            const pulse = Math.sin(boss.swayPhase * 4);
            ctx.shadowBlur = 10;
            for (let i = 0; i < lights.length; i++) {
                const ang = Math.PI + (i / (lights.length - 1)) * Math.PI;
                const lx = Math.cos(ang) * 44;
                const ly = 5 + Math.sin(ang) * 8;
                ctx.shadowColor = lights[i];
                ctx.fillStyle = lights[i];
                ctx.beginPath();
                ctx.arc(lx, ly, 2.6 + pulse * 0.8, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;
            ctx.restore();
        }

        // Healing stars: green medical crosses with a soft glow. Catching
        // one restores one third of the player's total HP (see updateBoss).
        function drawHealStars() {
            for (const s of healStars) {
                ctx.save();
                ctx.translate(s.x, s.y);
                ctx.rotate(s.spin);
                ctx.shadowColor = '#5dff8a';
                ctx.shadowBlur = 24;
                ctx.fillStyle = '#3ec46d';
                ctx.strokeStyle = '#c8ffdd';
                ctx.lineWidth = 1.5;
                const hw = s.radius * 0.34;
                const hl = s.radius;
                ctx.beginPath();
                ctx.roundRect(-hw, -hl, hw * 2, hl * 2, 3);
                ctx.fill();
                ctx.stroke();
                ctx.beginPath();
                ctx.roundRect(-hl, -hw, hl * 2, hw * 2, 3);
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            }
        }

        // ===== 6.8 HUD (health, score, lives) =====
        function drawGameUI() {
            const isSurvival = gameMode === GAME_MODES.SURVIVAL;
            const isBattle = gameMode === GAME_MODES.BATTLE;
            const isBoss = gameMode === GAME_MODES.BOSS;
            const isCoop = gameMode === GAME_MODES.COOP;
            // ----- Battle HUD overlay -----
            // Two visual elements render BEFORE anything else:
            //   1) a big KILLS counter in the top-left (no POINTS / BEST
            //      / COMBO clutter — kills are the only metric that
            //      matters in Battle modes).
            //   2) a detailed player HP bar pinned to the BOTTOM of the
            //      screen, colour-coded green/yellow/red, with segment
            //      ticks + a numeric readout so HP stays readable under
            //      the action.
            // BOSS FIGHT reuses this exact HUD and adds a gold BOSS HP
            // readout in the top-right so both health pools stay visible.
            if (isBattle || isBoss) {
                // ----- Battle / BOSS FIGHT HUD -----
                // A single large KILLS readout in the top-left (no
                // POINTS / BEST / COMBO clutter — kills are the only
                // metric that matters in Battle modes) plus a detailed
                // player HP bar pinned to the BOTTOM of the screen so
                // it stays readable even while the action rages.
                ctx.shadowBlur = 18;
                ctx.shadowColor = '#ff6b6b';
                ctx.fillStyle = '#ff6b6b';
                ctx.font = 'bold 36px Orbitron, sans-serif';
                ctx.fillText(`${score}`, 22, 46);
                ctx.shadowBlur = 10;
                ctx.font = 'bold 13px Orbitron, sans-serif';
                ctx.fillStyle = 'rgba(255, 107, 107, 0.85)';
                drawIconLabel('shield', 'KILLS', 24, 66, 'bold 13px Orbitron, sans-serif', 'rgba(255, 107, 107, 0.85)', '#ff6b6b', 14);
                ctx.shadowBlur = 0;

                // ----- Detailed player HP bar (bottom of screen) -----
                const hpMax = 100;
                const ratio = Math.max(0, hp) / hpMax;
                const barW = 480;
                const barH = 22;
                const barX = (canvas.width - barW) / 2;
                const barY = canvas.height - barH - 8;
                let hpColor, hpShade;
                if (ratio > 0.5) { hpColor = '#3ec46d'; hpShade = '#1f7a46'; }
                else if (ratio > 0.25) { hpColor = '#ffaa33'; hpShade = '#b06d12'; }
                else { hpColor = '#ff6b6b'; hpShade = '#b33333'; }
                const fillW = Math.max(0, barW * ratio);

                // Outer frame with colour-matched glow
                ctx.save();
                ctx.shadowColor = hpColor;
                ctx.shadowBlur = 20;
                ctx.fillStyle = 'rgba(10, 14, 22, 0.92)';
                ctx.beginPath();
                ctx.roundRect(barX - 4, barY - 4, barW + 8, barH + 8, 10);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(255,255,255,0.22)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.roundRect(barX - 4, barY - 4, barW + 8, barH + 8, 10);
                ctx.stroke();
                // Inner track
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.beginPath();
                ctx.roundRect(barX, barY, barW, barH, 7);
                ctx.fill();
                // Gradient fill + glass highlight
                const grad = ctx.createLinearGradient(barX, barY, barX, barY + barH);
                grad.addColorStop(0, hpColor);
                grad.addColorStop(1, hpShade);
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.roundRect(barX, barY, fillW, barH, 7);
                ctx.fill();
                if (fillW > 4) {
                    ctx.fillStyle = 'rgba(255,255,255,0.28)';
                    ctx.beginPath();
                    ctx.roundRect(barX + 1, barY + 1, Math.max(0, fillW - 2), barH / 3, 6);
                    ctx.fill();
                }
                // Segment tick marks every 25 HP for the detailed read
                ctx.strokeStyle = 'rgba(255,255,255,0.30)';
                ctx.lineWidth = 1;
                for (let s = 1; s < 4; s++) {
                    const sx = barX + (barW * s) / 4;
                    ctx.beginPath();
                    ctx.moveTo(sx, barY + 3);
                    ctx.lineTo(sx, barY + barH - 3);
                    ctx.stroke();
                }
                // Numeric HP inside the bar
                ctx.font = 'bold 14px Orbitron, sans-serif';
                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = 'black';
                ctx.shadowBlur = 6;
                ctx.textAlign = 'center';
                drawIconLabelCenter('shield', `${Math.max(0, Math.ceil(hp))}/${hpMax}`, barX + barW / 2, barY + barH / 2 + 5, 'bold 14px Orbitron, sans-serif', '#ffffff', '#ffffff', 13);
                ctx.restore();
                ctx.textAlign = 'left';

                // ----- BOSS HP readout (top-right, gold) -----
                if (isBoss && !bossDefeated) {
                    ctx.fillStyle = '#ffd84a';
                    ctx.shadowColor = '#ffd84a';
                    ctx.shadowBlur = 12;
                    ctx.font = 'bold 16px Orbitron, sans-serif';
                    const bossHpText = `${Math.max(0, Math.ceil(boss.hp))}/${boss.maxHp}`;
                    drawIconLabelRight('crown', bossHpText, canvas.width - 20, 46, 'bold 16px Orbitron, sans-serif', '#ffd84a', '#ffd84a', 15, 18);
                    ctx.shadowBlur = 0;
                }
            }
            if (isCoop) {
                // ----- CO-OP HUD overlay -----
                // The shared health pool now renders with the EXACT same
                // bar style as Battle mode: a bottom-centred rounded bar
                // with gradient fill, glass highlight, 25-HP tick marks
                // and the numeric readout drawn INSIDE the bar. SCORE and
                // the heal legend stay up top as secondary readouts.
                const coopMax = coopMaxHp;
                const crRatio = Math.max(0, coopHp) / coopMax;
                const barW = 480;
                const barH = 22;
                const barX = (canvas.width - barW) / 2;
                const barY = canvas.height - barH - 8;
                let hpColor, hpShade;
                if (crRatio > 0.5) { hpColor = '#3ec46d'; hpShade = '#1f7a46'; }
                else if (crRatio > 0.25) { hpColor = '#ffaa33'; hpShade = '#b06d12'; }
                else { hpColor = '#ff6b6b'; hpShade = '#b33333'; }
                const fillW = Math.max(0, barW * crRatio);

                // Outer frame with colour-matched glow
                ctx.save();
                ctx.shadowColor = hpColor;
                ctx.shadowBlur = 20;
                ctx.fillStyle = 'rgba(10, 14, 22, 0.92)';
                ctx.beginPath();
                ctx.roundRect(barX - 4, barY - 4, barW + 8, barH + 8, 10);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(255,255,255,0.22)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.roundRect(barX - 4, barY - 4, barW + 8, barH + 8, 10);
                ctx.stroke();
                // Inner track
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.beginPath();
                ctx.roundRect(barX, barY, barW, barH, 7);
                ctx.fill();
                // Gradient fill + glass highlight
                const grad = ctx.createLinearGradient(barX, barY, barX, barY + barH);
                grad.addColorStop(0, hpColor);
                grad.addColorStop(1, hpShade);
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.roundRect(barX, barY, fillW, barH, 7);
                ctx.fill();
                if (fillW > 4) {
                    ctx.fillStyle = 'rgba(255,255,255,0.28)';
                    ctx.beginPath();
                    ctx.roundRect(barX + 1, barY + 1, Math.max(0, fillW - 2), barH / 3, 6);
                    ctx.fill();
                }
                // Segment tick marks every 25 HP for the detailed read
                ctx.strokeStyle = 'rgba(255,255,255,0.30)';
                ctx.lineWidth = 1;
                for (let s = 1; s < 4; s++) {
                    const sx = barX + (barW * s) / 4;
                    ctx.beginPath();
                    ctx.moveTo(sx, barY + 3);
                    ctx.lineTo(sx, barY + barH - 3);
                    ctx.stroke();
                }
                // Numeric SHARED HP inside the bar (same as Battle)
                ctx.font = 'bold 14px Orbitron, sans-serif';
                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = 'black';
                ctx.shadowBlur = 6;
                ctx.textAlign = 'center';
                drawIconLabelCenter('shield', `${Math.max(0, Math.ceil(coopHp))}/${coopMax}`, barX + barW / 2, barY + barH / 2 + 5, 'bold 14px Orbitron, sans-serif', '#ffffff', '#ffffff', 13);
                ctx.restore();
                ctx.textAlign = 'left';

                // SCORE (top-centre) + heal legend (top-right, below the account
                // name) remain above the bar so both players can read them
                // mid-action.
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#ffd84a';
                ctx.font = 'bold 16px Orbitron, sans-serif';
                drawIconLabelCenter('star', `SCORE: ${score}`, canvas.width / 2, 32, 'bold 16px Orbitron, sans-serif', '#ffd84a', '#ffd84a', 15);
                const legend = 'catch +2 · kill +5 · miss −10';
                const legendWidth = ctx.measureText(legend).width;
                ctx.fillStyle = '#9bd9ff';
                ctx.shadowColor = 'black';
                ctx.textAlign = 'right';
                ctx.fillText(legend, canvas.width - 16, 64);
                ctx.shadowBlur = 0;
                ctx.textAlign = 'left';
            }
            const highScore = currentUser
                ? (isSurvival
                    ? getMaxSurvivalScore(currentUser)
                    : (isBoss
                        ? getBestBossTime(currentUser)
                        : (isCoop ? getMaxCoopScore(currentUser) : getMaxScore(currentUser))))
                : 0;

            ctx.font = 'bold 20px Orbitron, sans-serif';
            ctx.shadowColor = 'black';
            ctx.shadowBlur = 10;

            if (isSurvival) {
                // Survival mode badge in the top-left so the player always
                // remembers they're in the harder variant.
                ctx.fillStyle = '#ff6b6b';
                ctx.font = 'bold 16px Orbitron, sans-serif';
                ctx.shadowColor = 'rgba(138, 43, 226, 0.6)';
                ctx.shadowBlur = 12;
                drawIconLabel('skull', 'SURVIVAL', 20, 20, 'bold 16px Orbitron, sans-serif', '#ff6b6b', '#ff6b6b', 15);
                ctx.shadowBlur = 10;
            }

            if (currentUser) {
                ctx.fillStyle = '#66dd88';
                ctx.textAlign = 'right';
                drawIconLabelRight('account', currentUser, canvas.width - 20, 30, 'bold 20px Orbitron, sans-serif', '#66dd88', '#66dd88', 16);
                ctx.textAlign = 'left';
            }

            const scoreLabelY = isSurvival ? 60 : 40;
            const scoreValueY = isSurvival ? 85 : 40;
            const highScoreY = isSurvival ? 110 : 80;
            const topLabelOffset = isSurvival ? 22 : 0;

            // Score readout (with mode-appropriate label)
            if (isSurvival) {
                ctx.font = '14px Orbitron, sans-serif';
                ctx.fillStyle = '#ff9999';
                ctx.shadowBlur = 4;
                drawIconLabel('skull', 'SURVIVED', 20, scoreLabelY, '14px Orbitron, sans-serif', '#ff9999', '#ff9999', 14);
                ctx.font = 'bold 26px Orbitron, sans-serif';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff5b5b';
                ctx.fillStyle = '#ffcccc';
                ctx.fillText(`${score}s`, 20, scoreValueY);
            } else if (!isBattle && !isBoss && !isCoop) {
                ctx.font = 'bold 20px Orbitron, sans-serif';
                ctx.fillStyle = 'white';
                drawIconLabel('star', `Points: ${score}`, 20, scoreValueY, 'bold 20px Orbitron, sans-serif', 'white', '#ffd84a', 16);

                // Combo / gold-star hints are Classic mechanics — BOSS
                // FIGHT has neither (score = kills, heal stars restore
                // HP instead of hearts), and CO-OP scores +1/+2 with no
                // combo or lucky stars either, so skip the noise there.
                if (!isBoss && !isCoop) {
                    const comboMultiplier = getComboMultiplier();
                    ctx.font = 'bold 14px Orbitron, sans-serif';
                    ctx.fillStyle = comboStreak > 0 ? '#ffd56a' : '#9aa6b2';
                    ctx.fillText(`⟲ Combo x${comboMultiplier} · ${comboStreak}`, 20, 110);
                    ctx.font = '11px Orbitron, sans-serif';
                    ctx.fillStyle = '#8e9aad';
                    ctx.fillText('Gold stars refill a heart', 20, 130);
                }
            }

            // POINTS / BEST readouts are Classic-mode info — Battle and
            // BOSS FIGHT drop them (the big KILLS counter is the only
            // metric they show), and CO-OP scores via its own HUD, so
            // skip those readouts there too.
            if (!isBattle && !isBoss && !isCoop) {
                ctx.font = 'bold 20px Orbitron, sans-serif';
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'black';
                ctx.fillStyle = '#ffd700';
                drawIconLabel('trophy', `Best: ${highScore}${isSurvival ? 's' : ''}`, 20, highScoreY, 'bold 20px Orbitron, sans-serif', '#ffd700', '#ffd700', 16);
            }

            const recordBannerActive = inGameRecordShown
                && gameState === GAME_STATES.PLAYING
                && currentUser
                && !gameOver
                && (Date.now() - inGameRecordShownAt) < RECORD_NOTIFICATION_DURATION;
            if (recordBannerActive) {
                ctx.shadowColor = isSurvival ? '#ff6b6b' : '#ffd700';
                ctx.shadowBlur = 30;
                ctx.fillStyle = isSurvival ? '#ff6b6b' : '#ffd700';
                ctx.font = 'bold 26px Orbitron, sans-serif';
                ctx.fillText('✦ NEW RECORD! ✦', canvas.width / 2 - 110, 130 + topLabelOffset);
                ctx.shadowBlur = 0;
            }

            // Heart / lives readout is pointless in Battle and CO-OP
            // (HP bars replace lives there) — hide it for BATTLE +
            // BOSS FIGHT + CO-OP.
            if (!isBattle && !isBoss && !isCoop) {
                ctx.fillStyle = isSurvival ? '#ff9999' : 'white';
                ctx.font = 'bold 20px Orbitron, sans-serif';
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'black';
                drawIconLabel('heart', `x ${lives}`, canvas.width - 120, isSurvival ? 110 : 80, 'bold 20px Orbitron, sans-serif', isSurvival ? '#ff9999' : 'white', isSurvival ? '#ff6b6b' : '#ff4d6d', 15);
            }

            // Saved-overlay render LAST so it sits ON TOP of the
            // Battle HP bar and the rest of the HUD overlay — the
            // centred ✓ Saved toast is the single screen-spanning
            // confirmation the player can't miss even if attention
            // was elsewhere at the moment of save. drawSavedOverlay()
            // short-circuits itself when savedOverlayUntil has
            // expired, so the call costs nothing in steady state.
            drawSavedOverlay();
        }

        // ===== 6.9 Pause screen =====
        function drawPauseScreen() {
            // Phase-2A Glassmorphism overlay
            ctx.fillStyle = 'rgba(26, 31, 44, 0.75)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            updateButtonHover();  // Phase-2B hover tracking

            ctx.textAlign = 'center';
            ctx.shadowColor = 'rgba(138, 43, 226, 0.6)';
            ctx.shadowBlur = 30;

            ctx.font = 'bold 78px Orbitron, sans-serif';
            ctx.fillStyle = '#f1f5f9';
            drawIconLabelCenter('pause', 'PAUSED', canvas.width / 2, 175, 'bold 78px Orbitron, sans-serif', '#f1f5f9', '#f1f5f9', 28);

            ctx.shadowBlur = 8;
            ctx.shadowColor = 'black';
            ctx.font = '18px Orbitron, sans-serif';
            ctx.fillStyle = '#9aa6b2';
            ctx.fillText('Press "P" or tap RESUME to continue', canvas.width / 2, 220);

            // Three-button row: RESUME | SETTINGS | MENU.
            const btnW = 170;
            const btnH = 56;
            const gap = 25;
            const totalW = btnW * 3 + gap * 2;
            const btnY = canvas.height / 2 + 30;
            const rowLeftX = canvas.width / 2 - totalW / 2;
            const resumeX = rowLeftX;
            const settingsPauseX = rowLeftX + btnW + gap;
            const menuPauseX = rowLeftX + (btnW + gap) * 2;

            // ----- RESUME button (primary CTA → amber-gold glow) -----
            drawGlassButton(resumeX, btnY, btnW, btnH, 12, 'RESUME', 'bold 22px Orbitron, sans-serif', {
                isPrimary: true,
                hoverStrength: hoverFor('pauseResume'),
                icon: 'play'
            });

            // ----- SETTINGS button -----
            drawGlassButton(settingsPauseX, btnY, btnW, btnH, 12, 'SETTINGS', 'bold 20px Orbitron, sans-serif', {
                hoverStrength: hoverFor('pauseSettings'),
                icon: 'settings'
            });

            // ----- MENU button -----
            drawGlassButton(menuPauseX, btnY, btnW, btnH, 12, 'MENU', 'bold 22px Orbitron, sans-serif', {
                hoverStrength: hoverFor('pauseMenu'),
                icon: 'home'
            });

            // ----- SAVE button (second row, centred below the
            // RESUME/SETTINGS/MENU row). Width bumped to 220 so the
            // "SAVE" label has room to render without truncation.
            // Distinct gold/teal accent palette — uses the project's
            // --accent-alt teal (#49d7c8) for the frame so it reads
            // as a meta / data action rather than a gameplay action.
            const saveBtnW = 220;
            const saveBtnH = 56;
            const saveBtnGap = 22;
            // Sit 22 px below the row's bottom edge so the SAVE row
            // reads as a distinct second band rather than glued to
            // the first one. Visually symmetric with the
            // MISSION-row-on-pause-overlay spacing used elsewhere.
            const saveBtnY = btnY + btnH + saveBtnGap;
            const saveBtnX = canvas.width / 2 - saveBtnW / 2;
            // ----- SAVE button -----
            // Mirrors the S hotkey exactly: quick save & review (see
            // quickSaveGame). The label stays a static "SAVE".
            drawGlassButton(saveBtnX, saveBtnY, saveBtnW, saveBtnH, 12, 'SAVE', 'bold 22px Orbitron, sans-serif', {
                isPrimary: true,
                hoverStrength: hoverFor('pauseSave'),
                icon: 'save'
            });

            menuButtons = [
                { rect: { x: resumeX, y: btnY, w: btnW, h: btnH }, action: 'pauseResume' },
                { rect: { x: settingsPauseX, y: btnY, w: btnW, h: btnH }, action: 'pauseSettings' },
                { rect: { x: menuPauseX, y: btnY, w: btnW, h: btnH }, action: 'pauseMenu' },
                { rect: { x: saveBtnX, y: saveBtnY, w: saveBtnW, h: saveBtnH }, action: 'pauseSave' }
            ];

            // Saved-overlay render LAST so it sits ON TOP of the
            // pause backdrop and the SAVE-button itself — the player
            // gets immediate visible feedback the moment they tap
            // SAVE, even while paused. drawSavedOverlay() handles its
            // own fade-out + short-circuit when inactive.
            drawSavedOverlay();

            ctx.textAlign = 'left';
            ctx.shadowBlur = 0;
        }

        // ===== 6.10 Game-over screen =====
        function drawGameOver() {
            updateButtonHover();  // Phase-2B hover tracking
            const isSurvival = gameMode === GAME_MODES.SURVIVAL;
            const isBattle = gameMode === GAME_MODES.BATTLE;
            const isBoss = gameMode === GAME_MODES.BOSS;
            const isCoop = gameMode === GAME_MODES.COOP;
            const highScore = currentUser
                ? (isSurvival
                    ? getMaxSurvivalScore(currentUser)
                    : (isBoss
                        ? getBestBossTime(currentUser)
                        : (isBattle ? getMaxBattleScore(currentUser) : (isCoop ? getMaxCoopScore(currentUser) : getMaxScore(currentUser)))))
                : 0;

            // Phase-2A Glassmorphism overlay
            ctx.fillStyle = 'rgba(26, 31, 44, 0.80)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.textAlign = 'center';

            ctx.shadowColor = 'rgba(138, 43, 226, 0.6)';
            ctx.shadowBlur = 30;
            ctx.font = 'bold 60px Orbitron, sans-serif';
            ctx.fillStyle = '#f1f5f9';
            const titleIcon = isBattle ? 'boom'
                : (isBoss ? 'crown'
                    : (isSurvival ? 'skull'
                        : (isCoop ? 'coop' : null)));
            const titleText = isBattle ? 'BATTLE OVER'
                : (isBoss ? (bossDefeated ? 'BOSS DEFEATED!' : 'BOSS FIGHT OVER')
                    : (isSurvival ? 'SURVIVAL OVER'
                        : (isCoop ? 'CO-OP OVER' : 'GAME OVER')));
            if (quickSaveEndedRun) {
                ctx.fillText('✓ SAVED', canvas.width / 2, 100);
            } else if (titleIcon) {
                drawIconLabelCenter(titleIcon, titleText, canvas.width / 2, 100, 'bold 60px Orbitron, sans-serif', '#f1f5f9', '#f1f5f9', 26);
            } else {
                ctx.fillText(titleText, canvas.width / 2, 100);
            }

            ctx.shadowColor = 'black';
            ctx.shadowBlur = 15;
            ctx.font = 'bold 28px Orbitron, sans-serif';
            ctx.fillStyle = 'white';
            const subIcon = isSurvival ? 'skull' : (isBoss && bossDefeated ? 'crown' : null);
            const subText = isSurvival ? `Survived ${score}s`
                : (isBoss && bossDefeated
                    ? `Time: ${Math.max(1, Math.round(bossCompletionMs / 1000))}s · Score: ${score}`
                    : `Score: ${score}`);
            if (subIcon) {
                drawIconLabelCenter(subIcon, subText, canvas.width / 2, 150, 'bold 28px Orbitron, sans-serif', 'white', 'white', 16);
            } else {
                ctx.fillText(subText, canvas.width / 2, 150);
            }

            if (isBoss && bossDefeated) {
                // Victory flourish: the +100 BOSS DOWN bonus is already
                // baked into score; surface it so the win feels earned.
                ctx.shadowColor = '#ffd84a';
                ctx.shadowBlur = 30;
                ctx.font = 'bold 20px Orbitron, sans-serif';
                ctx.fillStyle = '#ffd84a';
                drawIconLabelCenter('crown', 'BOSS DOWN! +100', canvas.width / 2, 178, 'bold 20px Orbitron, sans-serif', '#ffd84a', '#ffd84a', 15);
            } else if (!isSurvival && !isBattle && !isBoss && !isCoop && score > 0) {
                // Classic run: every point scored is a star banked into
                // the shop balance (1 point = 1 star).
                ctx.shadowColor = '#ffd84a';
                ctx.shadowBlur = 25;
                ctx.font = 'bold 16px Orbitron, sans-serif';
                ctx.fillStyle = '#ffd84a';
                drawIconLabelCenter('star', '+' + score + ' stars added to your balance', canvas.width / 2, 178, 'bold 16px Orbitron, sans-serif', '#ffd84a', '#ffd84a', 14);
            }

            if (isNewRecord && currentUser && score > 0) {
                let label = '';
                let labelIcon = null;
                const pos = newRecordPosition;
                if (isSurvival) {
                    // Survival uses a red-ish badge to stay on-brand with
                    // the mode's colour scheme.
                    labelIcon = 'skull';
                    if (pos === 0) {
                        label = 'BEST SURVIVAL TIME';
                    } else if (pos === 1) {
                        label = 'NEW SURVIVAL RECORD! (2nd)';
                    } else if (pos === 2) {
                        label = 'NEW SURVIVAL RECORD! (3rd)';
                    } else {
                        label = `NEW SURVIVAL RECORD! (${pos + 1}th)`;
                    }
                } else if (pos === 0) {
                    labelIcon = 'trophy';
                    label = 'NEW BEST RECORD!';
                } else if (pos === 1) {
                    labelIcon = 'medal';
                    label = 'NEW RECORD! (2nd place)';
                } else if (pos === 2) {
                    labelIcon = 'medal';
                    label = 'NEW RECORD! (3rd place)';
                } else {
                    labelIcon = 'target';
                    label = `NEW RECORD! (${pos + 1}th place)`;
                }

                ctx.shadowColor = isSurvival ? '#ff6b6b' : '#ffd700';
                ctx.shadowBlur = 50;
                ctx.font = 'bold 30px Orbitron, sans-serif';
                ctx.fillStyle = isSurvival ? '#ff8a8a' : '#ffd700';
                if (labelIcon) {
                    const labelColor = isSurvival ? '#ff8a8a' : (pos === 1 ? '#c0c0c0' : pos === 2 ? '#cd7f32' : '#ffd700');
                    drawIconLabelCenter(labelIcon, label, canvas.width / 2, 200, 'bold 30px Orbitron, sans-serif', isSurvival ? '#ff8a8a' : '#ffd700', labelColor, 20);
                } else {
                    ctx.fillText(label, canvas.width / 2, 200);
                }

                ctx.font = '50px Arial';
                ctx.shadowBlur = 60;
                const medalIcon = isSurvival ? 'skull'
                    : (pos === 0 ? 'trophy' : pos === 1 ? 'medal' : pos === 2 ? 'medal' : 'target');
                const medalColor = isSurvival ? '#ff8a8a'
                    : (pos === 0 ? '#ffd700' : pos === 1 ? '#c0c0c0' : pos === 2 ? '#cd7f32' : '#ffd700');
                drawVectorIcon(medalIcon, canvas.width / 2, 248, medalColor, 2.4);
            } else {
                ctx.shadowColor = 'black';
                ctx.shadowBlur = 10;
                ctx.font = '20px Orbitron, sans-serif';
                ctx.fillStyle = '#aaa';
                ctx.fillText(
                    `Best${isSurvival ? ' Survival Time' : (isBoss ? ' Time' : ' Record')}: ${highScore}${(isSurvival || isBoss) ? 's' : ''}`,
                    canvas.width / 2, 200
                );
            }

            const leftColX = 60;
            const col2X = 300;
            const top5Y = 290;

            // Phase-2A glassmorphism panel
            ctx.fillStyle = 'rgba(26, 31, 44, 0.55)';
            ctx.beginPath();
            ctx.roundRect(leftColX - 20, top5Y - 30, 480, 220, 12);
            ctx.fill();
            ctx.strokeStyle = 'rgba(138, 43, 226, 0.4)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.roundRect(leftColX - 20, top5Y - 30, 480, 220, 12);
            ctx.stroke();

            ctx.textAlign = 'left';
            ctx.shadowColor = isSurvival ? '#ff8a8a' : '#ffd700';
            ctx.shadowBlur = 20;
            ctx.font = 'bold 24px Orbitron, sans-serif';
            ctx.fillStyle = isSurvival ? '#ff8a8a' : '#ffd700';
            const top10Icon = isSurvival ? 'skull' : (isBoss ? 'crown' : (isCoop ? 'coop' : 'trophy'));
            const top10Text = isSurvival ? 'TOP 10 SURVIVAL'
                : (isBoss ? 'TOP 10 BOSS'
                    : (isCoop ? 'TOP 10 CO-OP' : 'TOP 10'));
            drawIconLabel(top10Icon, top10Text, leftColX, top5Y, 'bold 24px Orbitron, sans-serif', isSurvival ? '#ff8a8a' : '#ffd700', isSurvival ? '#ff8a8a' : '#ffd700', 18);
            // (Previously a '⚔ BATTLE BEST' inline badge sat here as
            // a placeholder for the third column. It has been replaced
            // by the dedicated Battle column on drawRecordsScreen —
            // search for `col3X` to find the new layout.)

            if (currentUser) {
                const records = isSurvival
                    ? getSurvivalRecords(currentUser)
                    : (isBoss
                        ? getBossRecords(currentUser)
                        : (isCoop ? getCoopRecords(currentUser) : getUserRecords(currentUser)));
                const validRecords = records.filter(r => r > 0);

                if (validRecords.length > 0) {
                    ctx.shadowBlur = 5;
                    const suffix = (isSurvival || isBoss) ? 's' : ' pts';
                    for (let i = 0; i < Math.min(10, validRecords.length); i++) {
                        const colX = i < 5 ? leftColX : col2X;
                        const rowIndex = i < 5 ? i : i - 5;
                        const medalEmoji = `${i + 1}.`;
                        const color = i === 0 ? '#ffd700' : i === 1 ? '#c0c0c0' : i === 2 ? '#cd7f32' : '#ccc';
                        ctx.fillStyle = color;
                        ctx.font = i < 3 ? 'bold 20px Orbitron, sans-serif' : '18px Orbitron, sans-serif';
                        ctx.fillText(
                            `${medalEmoji} ${validRecords[i]}${suffix}`,
                            colX,
                            top5Y + 40 + rowIndex * 32
                        );
                    }
                } else {
                    ctx.fillStyle = '#666';
                    ctx.font = '16px Orbitron, sans-serif';
                    ctx.fillText('No records yet', leftColX, top5Y + 40);
                }
            } else {
                ctx.fillStyle = '#666';
                ctx.font = '16px Orbitron, sans-serif';
                ctx.fillText('Create an account', leftColX, top5Y + 40);
            }

            const shipX = canvas.width - 150;
            const shipY = 320;

            ctx.shadowBlur = 30;
            ctx.shadowColor = isSurvival ? '#ff5555' : '#44ff88';
            ctx.beginPath();
            ctx.arc(shipX, shipY, 95, 0, Math.PI * 2);
            ctx.fillStyle = isSurvival ? 'rgba(255, 80, 80, 0.12)' : 'rgba(68, 255, 136, 0.12)';
            ctx.fill();
            ctx.strokeStyle = isSurvival ? 'rgba(255, 80, 80, 0.3)' : 'rgba(68, 255, 136, 0.3)';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.save();
            ctx.translate(shipX, shipY);
            ctx.shadowColor = 'rgba(138, 43, 226, 0.5)';
            ctx.shadowBlur = 30;

            ctx.beginPath();
            ctx.ellipse(0, -8, 30, 20, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#4a8cff';
            ctx.fill();
            ctx.strokeStyle = '#8cf';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.beginPath();
            ctx.ellipse(0, -20, 16, 12, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#8cf';
            ctx.fill();
            ctx.strokeStyle = '#adf';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.shadowBlur = 15;
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(-6, -22, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(6, -22, 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#222';
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(-5, -21, 1.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(7, -21, 1.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#3a7add';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.moveTo(-32, 8);
            ctx.lineTo(-14, -2);
            ctx.lineTo(-14, 14);
            ctx.closePath();
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(32, 8);
            ctx.lineTo(14, -2);
            ctx.lineTo(14, 14);
            ctx.closePath();
            ctx.fill();

            ctx.shadowBlur = 40;
            ctx.shadowColor = '#f90';
            ctx.fillStyle = '#f90';
            ctx.beginPath();
            ctx.moveTo(-10, 20);
            ctx.lineTo(0, 36);
            ctx.lineTo(10, 20);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#fd0';
            ctx.shadowBlur = 30;
            ctx.beginPath();
            ctx.moveTo(-5, 20);
            ctx.lineTo(0, 30);
            ctx.lineTo(5, 20);
            ctx.closePath();
            ctx.fill();

            ctx.restore();

            ctx.textAlign = 'center';
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'black';
            ctx.font = 'bold 16px Orbitron, sans-serif';
            ctx.fillStyle = isSurvival ? '#ff9999' : '#66dd88';
            if (isSurvival) {
                drawIconLabelCenter('skull', 'YOU', shipX, shipY + 125, 'bold 16px Orbitron, sans-serif', '#ff9999', '#ff6b6b', 14);
            } else {
                ctx.fillText('★ YOU', shipX, shipY + 125);
            }

            // End-of-run summary phrases (best combo, lucky stars) sit
            // directly BELOW the "YOU" label, anchored to the ship, so
            // they never collide with the centred record medal emoji.
            if (!isSurvival) {
                ctx.shadowColor = '#ffd56a';
                ctx.shadowBlur = 12;
                ctx.font = '18px Orbitron, sans-serif';
                ctx.fillStyle = '#ffd56a';
                ctx.fillText(`Best combo: x${comboBest}`, shipX, shipY + 155);
                if (luckyStarsCaught > 0) {
                    ctx.shadowBlur = 6;
                    ctx.font = '14px Orbitron, sans-serif';
                    ctx.fillStyle = '#f5d488';
                    ctx.fillText(`Lucky stars caught: ${luckyStarsCaught}`, shipX, shipY + 182);
                }
            }

            const btnY = 500;
            const btnW = 170;
            const btnH = 50;
            const gap = 40;
            const btnRadius = 14;

            const playAgainX = canvas.width / 2 - btnW - gap / 2;
            const playAgainCenterX = playAgainX + btnW / 2;
            drawGlassButton(playAgainX, btnY, btnW, btnH, btnRadius, isSurvival ? 'RETRY' : 'PLAY AGAIN', 'bold 22px Orbitron, sans-serif', {
                isPrimary: true,
                hoverStrength: hoverFor('playAgain'),
                icon: isSurvival ? 'refresh' : 'play'
            });

            const menuX = canvas.width / 2 + gap / 2;
            const menuCenterX = menuX + btnW / 2;
            drawGlassButton(menuX, btnY, btnW, btnH, btnRadius, 'MENU', 'bold 22px Orbitron, sans-serif', {
                hoverStrength: hoverFor('menu'),
                icon: 'home'
            });

            menuButtons = [
                { rect: { x: playAgainX, y: btnY, w: btnW, h: btnH }, action: 'playAgain' },
                { rect: { x: menuX, y: btnY, w: btnW, h: btnH }, action: 'menu' }
            ];

            ctx.shadowBlur = 5;
            ctx.shadowColor = 'black';
            ctx.font = '14px Orbitron, sans-serif';
            ctx.fillStyle = 'rgba(255,255,255,0.25)';
            ctx.textAlign = 'center';
            ctx.fillText('Press "R" to restart', canvas.width / 2, btnY + btnH + 35);

            ctx.textAlign = 'left';
            ctx.shadowBlur = 0;
        }

        // ===== 6.11 Records screen =====
        function drawRecordsScreen() {
            drawBackground();
            updateButtonHover();  // Phase-2B

            ctx.textAlign = 'center';
            ctx.shadowBlur = 20;
            ctx.shadowColor = 'rgba(138, 43, 226, 0.6)';
            ctx.font = 'bold 38px Orbitron, sans-serif';
            ctx.fillStyle = '#f1f5f9';
            drawIconLabelCenter('trophy', 'RECORDS', canvas.width / 2, 60, 'bold 38px Orbitron, sans-serif', '#f1f5f9', '#ffd700', 22);

            // ----- Auth gate + shared back button -----
            // Render the BACK button first so it is always present — both
            // the "create an account" branch and the full records grid
            // call this. Doing it once centralises the click target so
            // users are never stuck on the screen without an exit.
            const backW = 160;
            const backH = 35;
            const backX = canvas.width / 2 - backW / 2;
            const backY = 540;
            menuButtons = [];

            if (!currentUser) {
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'black';
                ctx.font = '20px Orbitron, sans-serif';
                ctx.fillStyle = '#aaa';
                ctx.fillText('Create an account to see your records!', canvas.width / 2, 110);
                ctx.shadowBlur = 0;
                drawRecordsBackButton(backX, backY, backW, backH);
                ctx.textAlign = 'left';
                return;
            }

            // ----- Logged-in: layout + 3 columns + play-time card -----
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'black';
            ctx.font = '15px Orbitron, sans-serif';
            ctx.fillStyle = '#66dd88';
            ctx.fillText(`Account: ${currentUser}`, canvas.width / 2, 92);

            const classicRecords = getUserRecords(currentUser).filter(r => r > 0);
            const survivalRecords = getSurvivalRecords(currentUser).filter(r => r > 0);
            const battleRecords = getBattleRecords(currentUser).filter(r => r > 0);
            // CO-OP records bucket added with the new mode so the
            // player can see their best two-player runs in the same
            // Records screen as the other modes.
            const coopRecords = getCoopRecords(currentUser).filter(r => r > 0);
            // BOSS FIGHT records — 5th column, best boss-fight runs.
            const bossRecords = getBossRecords(currentUser).filter(r => r > 0);
            const playMs = getPlayTime(currentUser);

            // Five side-by-side cards, sized so the play-time band fits
            // beneath them. leftColX / rightColX are kept as aliases for
            // the Classic and Survival column bodies that already use
            // those names so we don’t have to retouch them.
            // colW = 136 keeps all five inside the 800 px canvas
            // (5 × 136 + 4 × 18 + 30 left margin = 782 ≤ 800).
            const colW = 136;
            const colY = 110;
            const colH = 290;
            const colGap = 18;
            const col1X = 30;
            const col2X = col1X + colW + colGap;
            const col3X = col2X + colW + colGap;
            const col4X = col3X + colW + colGap;
            const col5X = col4X + colW + colGap;
            const leftColX = col1X;
            const rightColX = col2X;

            // ----- Classic column -----
            ctx.shadowBlur = 12;
            ctx.shadowColor = 'rgba(138, 43, 226, 0.6)';
            ctx.fillStyle = 'rgba(26, 31, 44, 0.55)';
            ctx.beginPath();
            ctx.roundRect(leftColX, colY, colW, colH, 12);
            ctx.fill();
            // Phase-2A glassmorphism border
            ctx.strokeStyle = 'rgba(138, 43, 226, 0.4)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.roundRect(leftColX, colY, colW, colH, 12);
            ctx.stroke();

            ctx.font = 'bold 20px Orbitron, sans-serif';
            ctx.fillStyle = '#f1f5f9';
            ctx.shadowColor = 'rgba(138, 43, 226, 0.5)';
            ctx.shadowBlur = 15;
            drawIconLabelCenter('star', 'CLASSIC', leftColX + colW / 2, colY + 30, 'bold 20px Orbitron, sans-serif', '#f1f5f9', '#ffd84a', 15);

            ctx.font = '14px Orbitron, sans-serif';
            ctx.shadowBlur = 4;
            ctx.fillStyle = '#aac8ff';
            ctx.fillText('Stars caught', leftColX + colW / 2, colY + 50);

            ctx.shadowBlur = 4;
            ctx.textAlign = 'left';
            const classicStartY = colY + 85;
            if (classicRecords.length === 0) {
                ctx.fillStyle = '#666';
                ctx.font = '14px Orbitron, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('No records yet', leftColX + colW / 2, classicStartY + 10);
            } else {
                for (let i = 0; i < Math.min(5, classicRecords.length); i++) {
                    const medal = (i + 1) + '.';
                    const color = i === 0 ? '#ffd700' : i === 1 ? '#c0c0c0' : i === 2 ? '#cd7f32' : '#aac8ff';
                    ctx.fillStyle = color;
                    ctx.font = i < 3 ? 'bold 18px Orbitron, sans-serif' : '15px Orbitron, sans-serif';
                    ctx.shadowBlur = 4;
                    ctx.shadowColor = 'black';
                    ctx.fillText(medal + '  ' + classicRecords[i], leftColX + 10, classicStartY + i * 38);
                }
            }

            // ----- Survival column -----
            ctx.textAlign = 'center';
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(26, 31, 44, 0.55)';
            ctx.strokeStyle = 'rgba(138, 43, 226, 0.4)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.roundRect(rightColX, colY, colW, colH, 12);
            ctx.fill();
            ctx.stroke();

            ctx.font = 'bold 20px Orbitron, sans-serif';
            ctx.fillStyle = '#f1f5f9';
            ctx.shadowColor = 'rgba(138, 43, 226, 0.5)';
            ctx.shadowBlur = 10;
            drawIconLabelCenter('skull', 'SURVIVAL', rightColX + colW / 2, colY + 30, 'bold 20px Orbitron, sans-serif', '#f1f5f9', '#ff6b6b', 15);

            ctx.font = '14px Orbitron, sans-serif';
            ctx.shadowBlur = 4;
            ctx.fillStyle = '#ffb0b0';
            ctx.fillText('Time survived', rightColX + colW / 2, colY + 50);

            ctx.textAlign = 'left';
            const survivalStartY = colY + 85;

                ctx.font = '14px Orbitron, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('No records yet', rightColX + colW / 2, survivalStartY + 10);
            } else {
                for (let i = 0; i < Math.min(5, survivalRecords.length); i++) {
                    const medal = (i + 1) + '.';
                    const color = i === 0 ? '#ffd700' : i === 1 ? '#c0c0c0' : i === 2 ? '#cd7f32' : '#ffb0b0';
                    ctx.fillStyle = color;
                    ctx.font = i < 3 ? 'bold 18px Orbitron, sans-serif' : '15px Orbitron, sans-serif';
                    ctx.shadowBlur = 4;
                    ctx.shadowColor = 'black';
                    ctx.fillText(medal + '  ' + survivalRecords[i] + 's', rightColX + 10, survivalStartY + i * 38);
                }
            }

            // ----- Battle column -----
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(26, 31, 44, 0.55)';
            ctx.strokeStyle = 'rgba(138, 43, 226, 0.4)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.roundRect(col3X, colY, colW, colH, 12);
            ctx.fill();
            ctx.stroke();

            ctx.textAlign = 'center';
            ctx.font = 'bold 22px Orbitron, sans-serif';
            ctx.fillStyle = '#f1f5f9';
            ctx.shadowBlur = 8;
            ctx.shadowColor = 'rgba(138, 43, 226, 0.5)';
            drawIconLabelCenter('target', 'BATTLE', col3X + colW / 2, colY + 32, 'bold 22px Orbitron, sans-serif', '#f1f5f9', '#ffbf24', 15);
            ctx.shadowBlur = 0;
            ctx.font = '13px Orbitron, sans-serif';
            ctx.fillStyle = '#9aa6b2';
            ctx.fillText('Enemies killed', col3X + colW / 2, colY + 52);

            // Body. battleRecords is already filtered by .filter(r > 0)
            // above so an empty filtered array is a true "no data"
            // case — use that instead of re-scanning the raw bucket
            // to keep parity with how the Classic / Survival columns
            // decide "No records yet".
            if (battleRecords.length === 0) {
                ctx.font = 'bold 14px Orbitron, sans-serif';
                ctx.fillStyle = '#ffd2a8';
                ctx.fillText('No records yet', col3X + colW / 2, colY + 110);
            } else {
                ctx.font = '15px Orbitron, sans-serif';
                for (let idx = 0; idx < Math.min(5, battleRecords.length); idx++) {
                    const record = battleRecords[idx];
                    let label, color;
                    let weight = 'normal';
                    if (idx === 0) { label = '1. ' + record; color = '#ffd700'; weight = 'bold'; }
                    else if (idx === 1) { label = '2. ' + record; color = '#c0c0c0'; weight = 'bold'; }
                    else if (idx === 2) { label = '3. ' + record; color = '#cd7f32'; weight = 'bold'; }
                    else { label = (idx + 1) + '. ' + record; color = '#ffb59c'; }
                    ctx.font = (weight === 'bold' ? 'bold ' : '') + '15px Orbitron, sans-serif';
                    ctx.fillStyle = color;
                    ctx.fillText(label + ' kills', col3X + colW / 2, colY + 90 + idx * 28);
                }
            }
            ctx.textAlign = 'left';
            ctx.restore();

            // ----- CO-OP column -----
            ctx.shadowBlur = 0;
