<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 Star Catcher - Space Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #f4f1e8;
            --muted: #9aa6b2;
            --panel: rgba(10, 15, 24, 0.86);
            --panel-strong: rgba(7, 10, 16, 0.96);
            --accent: #ff9f43;
            --accent-soft: #ffd56a;
            --accent-alt: #49d7c8;
            --border: rgba(255, 255, 255, 0.14);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 12px;
            background:
                radial-gradient(circle at 18% 18%, rgba(73, 215, 200, 0.18), transparent 26%),
                radial-gradient(circle at 82% 78%, rgba(255, 159, 67, 0.16), transparent 28%),
                linear-gradient(160deg, #04050a 0%, #0c1120 48%, #141b2d 100%);
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
            user-select: none;
            color: var(--ink);
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                radial-gradient(circle at center, rgba(255, 255, 255, 0.08), transparent 64%);
            background-size: 100% 4px, 4px 100%, auto;
            mix-blend-mode: screen;
            opacity: 0.16;
        }

        #gameCanvas {
            width: min(100vw - 24px, 800px);
            height: auto;
            max-height: calc(100vh - 24px);
            aspect-ratio: 4 / 3;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 28px;
            box-shadow:
                0 24px 80px rgba(0, 0, 0, 0.56),
                0 0 0 6px rgba(73, 215, 200, 0.08),
                0 0 0 1px rgba(255, 159, 67, 0.18) inset;
            background: rgba(6, 10, 18, 0.58);
            backdrop-filter: blur(8px) saturate(120%);
            cursor: pointer;
            touch-action: none;
            user-select: none;
        }

        .hud-button {
            position: fixed;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            user-select: none;
            touch-action: manipulation;
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, background 0.18s ease;
        }

        .hud-button:active {
            transform: translateY(1px) scale(0.98);
        }

        .hud-button--pause {
            width: 72px;
            height: 72px;
            border-radius: 22px;
            border: 1px solid rgba(73, 215, 200, 0.55);
            background: linear-gradient(180deg, rgba(10, 15, 24, 0.96), rgba(22, 28, 42, 0.92));
            color: #f9d56e;
            font-size: 32px;
            font-weight: 900;
            box-shadow: 0 0 24px rgba(73, 215, 200, 0.18), 0 0 36px rgba(255, 159, 67, 0.16);
        }

        .hud-button--pause:hover {
            border-color: rgba(255, 159, 67, 0.75);
            box-shadow: 0 0 28px rgba(73, 215, 200, 0.28), 0 0 44px rgba(255, 159, 67, 0.22);
        }

        .key-hint {
            position: fixed;
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0 12px;
            min-width: 42px;
            height: 30px;
            border-radius: 15px;
            background: linear-gradient(180deg, rgba(70, 50, 10, 0.95), rgba(35, 22, 5, 0.95));
            border: 1px solid #ffd84a;
            color: #ffd84a;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(255, 216, 74, 0.7);
            box-shadow: 0 0 14px rgba(255, 216, 74, 0.4);
            opacity: 0;
            transition: opacity 0.28s ease;
            pointer-events: none;
            user-select: none;
            white-space: nowrap;
        }

        .account-card {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 30;
            background: linear-gradient(180deg, rgba(9, 15, 24, 0.96), rgba(13, 21, 34, 0.92));
            padding: 24px 22px 20px;
            border-radius: 24px;
            border: 1px solid rgba(73, 215, 200, 0.35);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 159, 67, 0.12) inset;
            width: min(92vw, 360px);
            text-align: center;
        }

        .account-card__title {
            color: var(--ink);
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            margin-bottom: 18px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .account-card__input {
            width: 100%;
            background: rgba(16, 22, 34, 0.96);
            color: white;
            border: 1px solid rgba(73, 215, 200, 0.55);
            border-radius: 14px;
            padding: 12px;
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            text-align: center;
            box-sizing: border-box;
            outline: none;
        }

        .account-card__input:focus {
            border-color: rgba(255, 159, 67, 0.8);
            box-shadow: 0 0 0 3px rgba(255, 159, 67, 0.16);
        }

        .account-card__actions {
            margin-top: 18px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .account-card__button {
            flex: 1 1 112px;
            min-height: 40px;
            border-radius: 14px;
            border: 1px solid transparent;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .account-card__button--ghost {
            background: rgba(84, 65, 28, 0.9);
            color: #f3d27a;
            border-color: rgba(255, 216, 74, 0.3);
        }

        .account-card__button--primary {
            background: linear-gradient(180deg, #ffb14d, #de7a21);
            color: #1c1206;
            box-shadow: 0 0 16px rgba(255, 159, 67, 0.35);
        }

        .account-card__button--secondary {
            background: rgba(57, 64, 84, 0.95);
            color: #d8dde8;
            border-color: rgba(135, 152, 181, 0.2);
        }

        .account-card__button--danger {
            margin-top: 10px;
            background: rgba(98, 33, 33, 0.95);
            color: #ffb0b0;
            border-color: rgba(255, 120, 120, 0.22);
        }
    </style>
</head>

<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <button id="pauseButton" class="hud-button hud-button--pause" aria-label="Game Pause" aria-keyshortcuts="P"
        title="Pause / Resume (press P)" style="display: none;">⏸</button>

    <!-- Small "P" key hint pill that sits BESIDE the pause button so the
         player sees that the keyboard shortcut exists. Hidden by default
         (display:none) and shown only during PLAYING / PAUSED via JS. The
         same gold palette as the menu's "M KEY" pill keeps it on-brand and
         gives the indicator visual weight without competing with the
         pause ⏸ icon for attention. -->
    <span id="pauseKeyHint" class="key-hint" aria-hidden="true">P</span>
    <!-- S key hint pill — stacked directly below the P pill by the
         modified positionPauseKeyHint function so the player sees
         that the keyboard shortcut exists. Hidden by default
         (display:none) and shown only during PLAYING / PAUSED via
         JS, mirroring the P pill exactly. Same gold palette so it
         reads as its sibling rather than a separate widget. -->
    <span id="saveKeyHint" class="key-hint" aria-hidden="true">S</span>

    <div id="mobileAccountInput" class="account-card">
        <div class="account-card__title">👤 NEW ACCOUNT</div>
        <input type="text" id="accountMobileInput" maxlength="12" placeholder="Name (max 12 char)"
            class="account-card__input">
        <div class="account-card__actions">
            <button id="mobileClearNameBtn" class="account-card__button account-card__button--ghost">🗑️ Clear
                Name</button>
            <button id="mobileConfirmBtn" class="account-card__button account-card__button--primary">✅ CONFIRM</button>
            <button id="mobileCancelBtn" class="account-card__button account-card__button--secondary">✖ CANCEL</button>
        </div>
        <div style="margin-top: 15px;">
            <button id="mobileClearAccountBtn" class="account-card__button account-card__button--danger">🗑️ Clear
                Account</button>
        </div>
    </div>


    <script>
        /* ============================================================
           0. SETUP CANVAS AND CONTEXT
        ============================================================ */
        const FIRE_RATE_COOLDOWN_MS = 140; // minimum delay between shots in Battle mode

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        // Right-click on the canvas normally pops the browser context
        // menu (Reload, Inspect, etc.). Battle Mode uses right-click to
        // fire a blue ray bullet, so the menu must be suppressed while
        // the player is interacting with the game. preventDefault on
        // `contextmenu` does not affect left-click behaviour, so the
        // existing ship-move handler keeps working untouched.
        canvas.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        // ===== Settings-panel wheel scroll ===========================
        // Mouse-wheel / trackpad vertical scroll acts ONLY while the
        // SETTINGS screen is up; in every other state the event is a
        // no-op so the existing targetX-write in mousemove keeps the
        // ship steering untouched. deltaY is sign-only-amplified by a
        // fixed step (~120 px) so a single physical wheel notch jumps
        // roughly one row instead of micro-scrolling by line height.
        // preventDefault stops the browser from intercepting it for
        // page-scroll on touch devices that emulate wheel events.
        canvas.addEventListener('wheel', (e) => {
            if (gameState !== GAME_STATES.SETTINGS) return;
            const step = 120;
            const next = settingsScrollY + Math.sign(e.deltaY) * step;
            // Use SETTINGS_SCROLL_MAX (module-level) instead of the
            // local `scrollRange` declared inside drawSettingsScreen,
            // otherwise the reference would throw a ReferenceError
            // when the wheel handler fires before that function has
            // ever been called.
            settingsScrollY = Math.max(0, Math.min(next, SETTINGS_SCROLL_MAX));
            e.preventDefault();
        }, { passive: false });

        // Detect a touch-first device or narrow viewport — used to dial
        // back background / overlay work on phones. Re-evaluated on
        // resize and orientationchange so a tablet that narrows after
        // boot picks up the same perf tweaks.
        function detectMobile() {
            return ('ontouchstart' in window || navigator.maxTouchPoints > 0)
                || window.innerWidth <= 768;
        }
        let IS_MOBILE = detectMobile();
        window.addEventListener('resize', () => {
            IS_MOBILE = detectMobile();
            positionPauseButton();
        });
        window.addEventListener('orientationchange', () => {
            IS_MOBILE = detectMobile();
            // Reposition after the orientationchange event finishes —
            // some browsers fire before the new viewport dimensions are
            // committed, so a short timeout locks in the correct layout.
            setTimeout(positionPauseButton, 100);
        });

        // Convert a DOM event (mouse OR touch) into canvas-internal pixel
        // coordinates. Re-evaluates the bounding rect on every call so
        // it stays correct across orientation changes and address-bar
        // resizes, which cost essentially nothing.
        function getGameCoords(event) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX, clientY;
            if (event.touches && event.touches.length > 0) {
                clientX = event.touches[0].clientX;
                clientY = event.touches[0].clientY;
            } else if (event.changedTouches && event.changedTouches.length > 0) {
                clientX = event.changedTouches[0].clientX;
                clientY = event.changedTouches[0].clientY;
            } else {
                clientX = event.clientX;
                clientY = event.clientY;
            }
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        /* ============================================================
           1. GAME STATE AND GLOBAL VARIABLES
        ============================================================ */
        const GAME_STATES = {
            MENU: 'menu',
            ACCOUNT: 'account',
            // 'difficulty' sits BETWEEN MENU and PLAYING / BATTLE: when
            // the player taps the Battle button on the menu they
            // briefly land here to pick Easy / Normal / Hard before the
            // run actually starts. drawDifficultyScreen() handles the
            // 3-card UI + the menuButtons entries; handleMenuAction's
            // `pickDifficulty_*` cases route through startGame() with
            // the chosen difficulty set on `battleDifficulty`.
            DIFFICULTY: 'difficulty',
            PLAYING: 'playing',
            PAUSED: 'paused',
            SETTINGS: 'settings',
            RECORDS: 'records',
            MISSIONS: 'missions'
        };

        const GAME_MODES = {
            CLASSIC: 'classic',
            SURVIVAL: 'survival',
            BATTLE: 'battle',
            // CO-OP: two-player mode on the same keyboard.
            //   * Blue (mouse) collects stars AND takes damage from
            //     missed stars (3 lives, like Classic).
            //   * Green (arrow keys) shoots light-green beams at enemies
            //     AND has its own HP bar (like Battle).
            //   If either player is eliminated, both lose. Score is
            //   1 per star + 2 per enemy kill.
            COOP: 'coop'
        };

        let gameState = GAME_STATES.MENU;
        let gameMode = GAME_MODES.CLASSIC;
        let survivalStartTime = 0;        // Date.now() when survival run starts
        let survivalScorePerSecondTick = 0; // accumulator that turns real time into integer seconds
        let currentUser = null;
        let accountInput = '';
        let isPaused = false;
        // Remembers where the user was BEFORE entering SETTINGS so the
        // 'settingsBack' case can route BACK to PAUSED when SETTINGS was
        // opened from the pause overlay, and BACK to MENU otherwise.
        let gameStateBeforeSettings = GAME_STATES.MENU;
        let mobileInputVisible = false;

        // Play-time tracking: how long the player spent in the
        // PLAYING state on the current account. The timer is paused
        // while the game is PAUSED so only active play counts toward
        // the "How much time did you play" totals shown on the
        // Records screen.
        let playingStartedAt = 0;

        let settings = {
            schemaVersion: 4,                  // bump when migrations land so loadSettings skips them
            music: true,
            classicMusic: true,
            survivalMusic: true,
            sfx: true,
            menuVolume: 0.7,
            classicVolume: 0.7,
            survivalVolume: 0.7,
            // Survival mode: when true the player follows the mouse cursor
            // EXACTLY (no smoothing) and can roam anywhere on screen —
            // affects player.x AND player.y. Defaults to false so the
            // original bottom-strip dodging behaviour stays the default.
            survivalFreeMovement: false
        };

        const player = {
            x: 400,
            y: 550,
            radius: 100,
            targetX: 400,
            // Battle Mode uses HP instead of lives (Battle ships are tougher
            // and the player must weather sustained enemy fire without
            // losing all their hearts in 2 seconds).
            hp: 100
        };

        // Raw mouse/touch coordinates in canvas pixels. The mousemove
        // handler updates these on every event regardless of gameState,
        // so update() can read them in the very first frame after
        // entering Survival-with-free-movement (when the player model
        // still sits at its default y=550 but the cursor already lives
        // somewhere up at, say, y=120).
        let mouseX = 400;
        let mouseY = 550;

        // ----- Settings-panel scroll state -----
        // The Settings screen hosts two categories (SOUNDS CONTROLS +
        // GAME CONTROLS) which together are taller than a single on-
        // canvas panel can show without colliding with the BACK button
        // at canvas.height - 50. Rather than overflow the canvas, we
        // scroll vertically: settingsScrollY is the translate offset,
        // clamped each frame to [0, SETTINGS_CONTENT_H - panelH] so
        // the user cannot scroll past the end of the content.
        let settingsScrollY = 0;
        // Logical (un-clipped) content height for the Settings panel:
        //   15 (top padding to first row) + existing audio rows + new
        //   GAME CONTROLS sub-header + new Free-Movement toggle +
        //   bottom padding.  With panelH = 449 this gives a 61 px
        //   scroll range, just enough to reveal the new toggle.
        const SETTINGS_CONTENT_H = 510;
        // Max scroll = content_height - visible_panel_height. Declared
        // MODULE-level (instead of inside drawSettingsScreen) so the
        // top-level wheel event listener can reference it directly
        // without dispatching through drawSettingsScreen first. The
        // 449 is the post-fix Settings panelH; if that constant ever
        // changes, update BOTH this AND the panelH declaration.
        const SETTINGS_SCROLL_MAX = SETTINGS_CONTENT_H - 449;
        // Drag-scroll state for the scroll-thumb on the right edge
        // of the panel. The mousedown on the thumb flips this true
        // and records the starting mouse y; mousemove updates scrollY
        // until mouseup clears it.
        let isSettingsScrollDrag = false;
        let settingsScrollDragAnchorY = 0;
        let settingsScrollAnchorOffset = 0;

        let stars = [];
        let meteorites = [];
        // ----- Battle mode arrays -----
        // Players and enemies shoot discrete blue / red energy bolts at
        // each other. We keep them in their own arrays (rather than
        // reusing the existing `stars` / `meteorites` collections) so
        // the Battle physics — straight-line motion either up or down —
        // never accidentally inherits the falling-stars sideways drift
        // or the meteorite gravity well.
        let battleEnemies = [];
        let playerBullets = [];
        let enemyBullets = [];
        // ----- CO-OP mode (Player 2 = Green) -----
        // Green is a fully independent ship above Blue. The green
        // ship moves exclusively with the LEFT and RIGHT arrow keys
        // (mirroring the mouse-driven Blue ship), shoots light-green
        // beams straight up at enemies with UP arrow, and has its own
        // HP bar — when green reaches 0 HP, both players lose.
        // Reusing the battleEnemies/playerBullets/enemyBullets arrays
        // keeps the CO-OP spawn + combat math identical to Battle, so
        // a freshly-tuned Battle balance also improves CO-OP.
        // greenPlayerBeams is the only CO-OP-specific projectile pool
        // because their visual + collision semantics are distinct
        // (light green + instantly-kills enemies).
        const greenPlayer = {
            x: 400,
            y: 350,
            radius: 28,        // hitbox half-width; clamp keeps it on-canvas
            hp: 100,
            maxHp: 100,
            // Same visual diameter as the drawable blue ship so both
            // ships feel evenly sized on screen.
            drawRadius: 26
        };
        let greenPlayerBeams = [];
        // Tracks which arrow keys are currently held down. The Blue
        // ship's mouse-driven smoothing still uses targetX (no change).
        // CO-OP green movement is direct (no smoothing — instant
        // feedback for an arcade co-op feel).
        const coopKeys = {
            left: false,
            right: false,
            up: false,
            // Space is kept as a redundant shoot trigger so users
            // reaching for either UP or SPACE both get a beam. Mirrors
            // how classic arcade co-op titles model "primary action".
            space: false
        };
        // Same cooldown discipline as the Battle player's right-click
        // firing. Prevents green from machine-gunning beams when UP
        // (or SPACE) is held down.
        let lastGreenFireTimeMs = 0;
        // CO-OP also has its own elapsed-Ms clock so the enemy-spawn
        // ramp (from Battle) eases in at the start of a CO-OP run
        // instead of dumping the full wave on frame 1.
        let coopElapsedMs = 0;
        let coopSpawnCooldown = 110;
        // CO-OP_i-frames after the green player takes damage to avoid
        // being melted in a single 5-bullet volley. Reset to 30 in the
        // damage handler, ticks down toward 0 each frame.
        let coopGreenHitCooldown = 0;
        let score = 0;
        let lives = 3;
        let hp = 100;
        // Battle-Mode difficulty selection. Defaults to 'easy' so
        // drawing this state on a fresh page load keeps the original
        // Battle cadence identical to before this picker existed.
        // Normal + Hard scale the enemy-spawn cadence tighter and add
        // rare fast-moving meteorites; Hard is currently a 1:1 mirror
        // of Normal so the existing UI/state wiring is in place before
        // the future Hard-only rules are spec'd in.
        let battleDifficulty = 'easy';
        // Battle-mode spawn pacing knobs. Tuned for a 60fps game but the
        // one-line cooldown math scales OK on mobile because the
        // requestAnimationFrame-driven logic below treats it as elapsed
        // time rather than frame count, see update().
        let battleSpawnCooldown = 90;
        let battleElapsedMs = 0;
        // Generic i-frame countdown reused across Survival and Battle.
        // Both modes use it the same way: if > 0 the player cannot take
        // damage; the value counts down to zero each frame.
        let meteoriteHitCooldown = 0; // frames of i-frames after a hit in survival

        // ----- Survival-mode monster -----
        // Only its face appears on screen — a dark-green cyclops with a
        // wide mouth and a small antenna with a glowing dot on its
        // forehead. The face anchors to either the left or right edge
        // of the canvas (random per spawn), with the body cropping
        // off-canvas. The face ALSO randomly picks one of three vertical
        // rows (see MONSTER_SPAWN_ROWS — TOP, CENTER, BOTTOM) so the
        // player can't memorise a single safe row and must dodge
        // vertically in addition to horizontally. When its beam is
        // active, damage is purely dwell-based: the player loses one
        // life for every full 2-second window they spend inside the
        // beam (hit-window aligned to the visible beam + a tight ship-
        // body radius). Stepping into the beam and immediately stepping
        // out is harmless — the entry timestamp is cleared the moment
        // the player exits and armed again only on the next entry.
        const SURVIVAL_MONSTER_FIRST_SPAWN_MS = 8000;   // ease-in first 8 s
        const SURVIVAL_MONSTER_RESPAWN_MIN_MS = 14000; // 14-22 s randomised respawn
        const SURVIVAL_MONSTER_RESPAWN_MAX_MS = 22000;
        const MONSTER_WARP_IN_MS = 800;                // alpha ease-in
        const MONSTER_ACTIVE_MS = 3500;               // total beam-on window
        const MONSTER_FADE_OUT_MS = 800;                // alpha ease-out
        const MONSTER_BEAM_ONSET_MS = 700;              // beam fires 0.7 s into "active" so the player can read the monster first
        // Beam-vs-player collision: tighter than player.radius (which
        // is 100 for the star-catching bubble in Classic mode). Without
        // this smaller value, the player kept losing a life even when
        // only the very edge of their drawn ship grazed the beam — the
        // player described this as "1 HP at end of beam for no reason".
        // 30 px matches the visible blue/green ship body (~26 px draw
        // radius in Battle/CO-OP) so damage is now felt only when the
        // ship visibly overlaps the beam.
        const MONSTER_BEAM_PLAYER_HIT_RADIUS = 30;
        // Three vertical rows the monster face can spawn at: TOP, CENTER,
        // and BOTTOM. One row is picked uniformly per spawn so the
        // player must dodge vertically as well as horizontally and
        // can't cache a single safe y-coordinate. BOTTOM (480) places
        // the default player (y=550) just inside the beam hitbox so
        // this row acts as a deliberate challenge spawn.
        const MONSTER_SPAWN_ROWS = [120, 300, 480];
        const monster = {
            active: false,
            state: 'idle',                  // 'warp-in' | 'active' | 'fade-out'
            side: 'right',                  // 'left' | 'right'
            cx: 0,
            // Fixed vertical centre so the player can learn one safe
            // row to dodge into. cy=300 sits clearly above the player's
            // bottom-strip default (y=550) and below the survival
            // score-row at y≈80, giving a predictable horizontal band.
            cy: 300,
            faceRadius: 95,
            stateStartedMs: 0,
            beamActive: false,
            beamStrokeW: 36,                // vertical slab thickness (kept for future tuning)
            beamSpanY: 110                  // half-height of beam rectangle
        };
        // Date.now() when player FIRST entered the beam; 0 = not in beam.
        // Used by the 2-second recurring-tick damage rule: while
        // playerInBeamSince > 0, every 2 s of continuous exposure
        // subtracts another life. Resetting to 0 the moment the player
        // exits the beam is what makes "if you avoid it, the game
        // continues as usual" actually true.
        let playerInBeamSince = 0;
        // Wall-clock-style deadline in survival-elapsed-MS for the next
        // monster appearance. Seeded from FIRST_SPAWN_MS at game start
        // and re-seeded after every fade-out so back-to-back runs of
        // the monster don't feel mechanical.
        let monsterNextSpawnAtMs = SURVIVAL_MONSTER_FIRST_SPAWN_MS;
        // Hook into the existing score clock for survival-elapsed time
        // (score is "seconds survived"). score * 1000 gets us back to
        // ms-aligned numbers without introducing a parallel timer.
        function survivalElapsedMs() { return score * 1000; }
        let isNewRecord = false;
        let newRecordPosition = -1;
        const RECORD_NOTIFICATION_DURATION = 3000; // 3 seconds
        let inGameRecordShown = false;        // banner visibility flag
        let inGameRecordShownAt = 0;          // ms timestamp when the banner started

        const rocketEmoji = {

        function pickNewBlueLine() {
            if (BLUE_LINES.length <= 1) {
                blueCharacter.currentLineIndex = 0;
                blueCharacter.currentLine = BLUE_LINES[0];
                return;
            }
            let next = blueCharacter.currentLineIndex;
            while (next === blueCharacter.currentLineIndex) {
                next = Math.floor(Math.random() * BLUE_LINES.length);
            }
            blueCharacter.currentLineIndex = next;
            blueCharacter.lastShownIndex = next;
            blueCharacter.currentLine = BLUE_LINES[next];

        function updateBlueCharacter(now) {
            blueCharacter.bobPhase = now / 600;
            // On mobile, the bubble was forced open by a tap and should
            // auto-close after the short window so the screen doesn't
            // stay sticky.
            if (IS_MOBILE && blueCharacter.isHovering
                && blueCharacter.hoverResetAt
                && now > blueCharacter.hoverResetAt) {
                blueCharacter.isHovering = false;
            }
            const target = blueCharacter.isHovering ? 1 : 0;
            blueCharacter.bubbleFadeTarget = target;
            const cur = blueCharacter.bubbleAlpha;
            const step = 0.08;
            if (cur < target) blueCharacter.bubbleAlpha = Math.min(target, cur + step);
            else if (cur > target) blueCharacter.bubbleAlpha = Math.max(target, cur - step);
        }

        function blueHoverHitTest(mx, my) {
            const dx = mx - blueCharacter.cx;
            const dy = my - (blueCharacter.cy + Math.sin(blueCharacter.bobPhase) * 6);

                if (classicAudio && !classicAudio.paused) {

            if (gameMode !== GAME_MODES.CLASSIC) return;

        // ----- Volume setters -----
        // Always round to the nearest 0.1 step + clamp to [0, 1]. The
        // Audio API rejects anything outside [0, 1] silently, so an
        // out-of-range persist call could leave the user's music at a
        // different level than what the slider displays. setMenuVolume()
        // and setClassicVolume() share clampVolume() so both tracks
        // behave identically. We lazily init the Audio element on the
        // first volume change so the user's chosen level survives even
        // before the song has actually been played. Mission integration:
        // every change bumps settingsToggledCountToday; the 'toggle_setting'
        // mission just needs ≥1, so multiple clicks still only count once
        // toward unlock.
        function clampVolume(v) {
            // Audio API rejects anything outside [0, 1] silently, so
            // rounding + clamping here keeps in-game and stored values
            // consistent. Fallback default bumped from 0.3 to 0.7 so
            // an empty/missing/invalid value lands at a comfortable
            // listening level rather than the previous barely-audible 30%.
            if (typeof v !== 'number' || !isFinite(v)) return 0.7;
            return Math.round(Math.min(1, Math.max(0, v)) * 10) / 10;
        }

        function setMenuVolume(v) {
            settings.menuVolume = clampVolume(v);
            saveSettings();
            if (!menuAudio) initMenuAudio();
            menuAudio.volume = settings.menuVolume;

        function getAllRecords() {

            localStorage.setItem('starCatcherAllRecords', JSON.stringify(records));

        function getUserRecords(username) {
            const all = getAllRecords();
            if (!all[username]) {
                all[username] = Array(10).fill(0);
                saveAllRecords(all);
            }
            return all[username];
        }

        function setUserRecords(username, records) {
            const all = getAllRecords();
            all[username] = records;
            saveAllRecords(all);
        }

        function addScoreToUser(username, newScore) {
            if (newScore <= 0) return -1;

            let records = getUserRecords(username);
            const previousMin = records.length >= 10 ? records[9] : 0;

            records.push(newScore);
            records.sort((a, b) => b - a);
            records = records.slice(0, 10);
            setUserRecords(username, records);

            if (newScore <= previousMin && records.length >= 10) {
                return -1;
            }

            return records.indexOf(newScore);
        }

        function getMaxScore(username) {
            if (!username) return 0;
            const records = getUserRecords(username);
            return records.length > 0 ? records[0] : 0;

            if (newScore <= 0) return -1;

            let records = getCoopRecords(username);
            const previousMin = records.length >= 10 ? records[9] : 0;

            records.push(newScore);
            records.sort((a, b) => b - a);
            records = records.slice(0, 10);
            setCoopRecords(username, records);

            if (newScore <= previousMin && records.length >= 10) {
                return -1;
            }

            return records.indexOf(newScore);
        }

        function getMaxCoopScore(username) {
            if (!username) return 0;
            const records = getCoopRecords(username);
            return records.length > 0 ? records[0] : 0;
        }

        // ----- Play-time helpers (per account) -----
        // Stored as a single integer (ms) under `${user}__playTime`
        // alongside the records so the Records screen can answer
        // "how much time have you been gaming on this account".
        function getPlayTime(username) {
            if (!username) return 0;
            const key = `${username}__playTime`;
            const all = getAllRecords();
            const v = all[key];
            return typeof v === 'number' && v > 0 ? v : 0;
        }

        function addPlayTimeToUser(username, ms) {
            if (!username || !ms || ms <= 0) return;
            const key = `${username}__playTime`;
            const all = getAllRecords();
            const prev = typeof all[key] === 'number' ? all[key] : 0;
            all[key] = prev + ms;
            saveAllRecords(all);
        }

        // Save any in-flight session time to the current user's bucket.
        // Called whenever we leave the PLAYING state, the game ends,
        // the player pauses, or they back out to the menu.
        function flushPlayTime() {
            if (currentUser && playingStartedAt > 0) {
                const elapsed = Date.now() - playingStartedAt;
                if (elapsed > 0) addPlayTimeToUser(currentUser, elapsed);
                playingStartedAt = 0;
            }
        }

        // Start (or restart) the play-time clock for the next run.
        function startPlayTimer() {
            playingStartedAt = Date.now();
        }

        // Render ms as a friendly "Xh Ym Zs". The records screen
        // uses this to answer "how much time did you play".
        function formatPlayTime(ms) {
            if (!ms || ms <= 0) return '0s';
            const totalSec = Math.floor(ms / 1000);
            const hours = Math.floor(totalSec / 3600);
            const minutes = Math.floor((totalSec % 3600) / 60);
            const seconds = totalSec % 60;
            if (hours > 0) return `${hours}h ${minutes}m ${seconds}s`;
            if (minutes > 0) return `${minutes}m ${seconds}s`;
            return `${seconds}s`;
        }

        function saveLastUser(username) {
            if (username) {
                localStorage.setItem('starCatcherLastUser', username);
            } else {
                localStorage.removeItem('starCatcherLastUser');
            }
        }

        function loadLastUser() {
            return localStorage.getItem('starCatcherLastUser') || null;
        }

        // Settings are stored per-account so each player keeps their own
        // audio preferences. A separate "default" key is used when no
        // account is active (before creating one, or after clearing it).
        function settingsStorageKey() {
            return currentUser
                ? `starCatcherSettings_${currentUser}`
                : 'starCatcherSettings__default';
        }

        function loadSettings() {
            // Defensive defaults that match the let-settings initialiser
            // above. We return them as a fresh object on every call so
            // mutation by callers (e.g. toggle handlers) never bleeds
            // across accounts.
            // Same defaults as the let-settings initialiser above. 0.7 here
            // means brand-new visitors (no localStorage yet) hear the
            // menu + classic BGM at a comfortable level — the previous
            // 0.3 default was easy to mistake for a broken control since
            // many devices barely audibly play at 30%.
            const defaults = {
                music: true,
                classicMusic: true,
                survivalMusic: true,
                sfx: true,
                menuVolume: 0.7,
                classicVolume: 0.7,
                survivalVolume: 0.7,
                // Mirror of the let-settings initialiser: brand-new
                // visitors (no localStorage yet) get free movement in
                // Survival OFF so they experience the same classic game
                // flow as before this option existed.
                survivalFreeMovement: false
            };
            try {
                const raw = localStorage.getItem(settingsStorageKey());
                if (raw) {
                    const parsed = JSON.parse(raw);
                    // Migration rules:
                    //   * the music / classicMusic split (old accounts
                    //     used music to silence BOTH tracks) is filled
                    //     in on a per-field basis so the legacy value
                    //     sticks for the few users who relied on it.
                    //   * before this deploy, every volume defaulted to
                    //     0.3. If this account pre-dates the bump (i.e.
                    //     no schemaVersion) AND its stored value matches
                    //     that legacy 0.3 default, push it to the new
                    //     default.  Otherwise the user clearly chose
                    //     this number, so pass it through clampVolume
                    //     untouched.
                    //   * schemaVersion is bumped (and included in the
                    //     return object) so saveSettings persists it;
                    //     future loads skip the migration branch.
                    // Bumped migration threshold from <2 → <3 so accounts
                    // that saved during the previous deploy (which only
                    // had music + classicMusic) get the new survivalMusic
                    // + survivalVolume fields added with the same 0.3→0.7
                    // bump rule we used for the menu / classic volumes.
                    // Bumped again <3 → <4 so accounts created before the
                    // free-movement toggle was added get survivalFreeMovement
                    // backfilled as false (preserves the legacy feel).
                    const needsMigration = (parsed.schemaVersion || 0) < 4;
                    const musicVal = typeof parsed.music === 'boolean' ? parsed.music : defaults.music;
                    const result = {
                        schemaVersion: 4,                  // always current after migration runs
                        music: musicVal,
                        classicMusic: parsed.classicMusic ?? musicVal,
                        survivalMusic: parsed.survivalMusic ?? musicVal,
                        sfx: typeof parsed.sfx === 'boolean' ? parsed.sfx : defaults.sfx,
                        menuVolume: (needsMigration && clampVolume(parsed.menuVolume) === 0.3)
                            ? defaults.menuVolume
                            : clampVolume(parsed.menuVolume),
                        classicVolume: (needsMigration && clampVolume(parsed.classicVolume) === 0.3)
                            ? defaults.classicVolume
                            : clampVolume(parsed.classicVolume),
                        survivalVolume: (needsMigration && clampVolume(parsed.survivalVolume) === 0.3)
                            ? defaults.survivalVolume
                            : clampVolume(parsed.survivalVolume),
                        // Free movement is a NEW gameplay-affecting flag —
                        // never inherited from the old `music` umbrella so
                        // legacy accounts that kept music on don't suddenly
                        // find the ship glued to the cursor on first load.
                        survivalFreeMovement: typeof parsed.survivalFreeMovement === 'boolean'
                            ? parsed.survivalFreeMovement
                            : defaults.survivalFreeMovement
                    };
                    if (needsMigration) {
                        try { localStorage.setItem(settingsStorageKey(), JSON.stringify(result)); } catch (e) { }
                    }
                    return result;
                }
            } catch (e) { /* fall through to defaults */ }
            return defaults;
        }

        function saveSettings() {
            try {
                localStorage.setItem(settingsStorageKey(), JSON.stringify(settings));
            } catch (e) { /* silent fail on quota / disabled storage */ }
        }

        function showMobileInput(show) {
            const wrapper = document.getElementById('mobileAccountInput');
            if (!wrapper) return;
            if (show) {
                wrapper.style.display = 'block';
                const input = document.getElementById('accountMobileInput');
                if (input) {
                    input.value = accountInput || '';
                    // Focus con ritardo per mobile
                    setTimeout(() => input.focus(), 150);
                }
                mobileInputVisible = true;
            } else {
                wrapper.style.display = 'none';
                mobileInputVisible = false;
            }
        }

        /* ============================================================
           4. GAME LOGIC FUNCTIONS
        ============================================================ */
        // ----- Daily missions + streaks -----
        // Swipeable page accessible from the main menu. Two streaks
        // per account: a yellow/orange manual-claim "daily streak"
        // and a red/burgundy auto-bumped "super streak" earned by
        // completing all of today's 3 missions.
        const MISSION_POOL = [
            { id: 'catch5', label: 'Catch 1000 stars in Classic', target: 5, type: 'classic_score' },
            { id: 'catch10', label: 'Catch 100 stars in Classic', target: 10, type: 'classic_score' },
            { id: 'catch15', label: 'Catch 550 stars in Classic', target: 15, type: 'classic_score' },
            { id: 'survive20', label: 'Survive 20s in Survival', target: 20, type: 'survival_time' },
            { id: 'survive30', label: 'Survive 30s in Survival', target: 30, type: 'survival_time' },
            { id: 'survive45', label: 'Survive 45s in Survival', target: 45, type: 'survival_time' },
            { id: 'battle_kill_5', label: 'Destroy 5 enemies in Battle', target: 5, type: 'battle_kills' },
            { id: 'battle_kill_15', label: 'Destroy 15 enemies in Battle', target: 15, type: 'battle_kills' },
            { id: 'visit_set', label: 'Visit Settings today', type: 'visit_settings' },
            { id: 'toggle_set', label: 'Toggle a setting today', type: 'toggle_setting' },
            { id: 'both_modes', label: 'Play both Classic + Survival', type: 'both_modes' },
            { id: 'all_modes', label: 'Play Battle Classic  and Survival modes today', type: 'all_modes' }
        ];

        // Deterministic seed from a YYYY-MM-DD string. Every player sees
        // the same 3 missions on a given calendar day so friends can
        // talk about the same set.
        function dailySeedForToday(todayKey) {
            let h = 0;
            for (let i = 0; i < todayKey.length; i++) {
                h = ((h << 5) - h + todayKey.charCodeAt(i)) | 0;
            }
            return Math.abs(h);
        }

        function localDayKey(date = new Date()) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function generateDailyMissions(todayKey) {
            const seed = dailySeedForToday(todayKey);
            const pool = MISSION_POOL.slice();
            const picked = [];
            for (let i = 0; i < 3 && pool.length > 0; i++) {
                const idx = (seed * (i + 7) + Math.floor(seed / 13)) % pool.length;
                picked.push(pool.splice(idx, 1)[0]);
            }
            return picked;
        }

        // Idempotent per day. Resets to 1 if a day was skipped, grows
        // by 1 if last claim was yesterday.
        function claimDailyStreak() {
            if (!currentUser) return null;
            const m = refreshMissionsForUser(currentUser);
            const today = m.currentDayKey;
            if (m.lastClaimedDate === today) return m.streakCount;
            if (m.lastClaimedDate && isYesterday(m.lastClaimedDate, today)) {
                m.streakCount += 1;
            } else {
                m.streakCount = 1;
            }
            m.lastClaimedDate = today;
            saveUserMissions(currentUser, m);
            playRecordSound();
            return m.streakCount;
        }

        // Note-completion-only: stamps _lastAllCompleteDayKey so the Super
        // Streak Button can appear on the Missions screen. The counter bump
        // itself happens inside claimSuperStreak() so the button is the
        // single, user-visible path that changes the super-streak count.
        // Bump at most once per day.
        function maybeAdvanceSuperStreak(arg) {
            // Bug-fix friendly overload: accept either (m) directly OR a
            // legacy (username) string. The previous single-string version
            // re-fetched m from localStorage via getUserMissions(), but
            // recordMissionEvent had not yet saved the just-updated
            // m.missionsCompleted — so the freshly-parsed copy was stale,
            // mis-counted done < total, and the SUPER CLAIM! button
            // stayed LOCKED forever.
            //
            // Fix: recordMissionEvent now passes the SAME m object it
            // already mutated, so the m._lastAllCompleteDayKey write lands
            // on the reference that the caller's final saveUserMissions()
            // is about to persist. The legacy (username) path stays in
            // place for any future caller and self-saves for safety.
            let m = null;
            let usernameToSave = null;
            if (typeof arg === 'string') {
                m = getUserMissions(arg);
                usernameToSave = arg;
            } else if (arg && typeof arg === 'object') {
                m = arg;
            }
            if (!m) return;
            const total = (m.missionsForDay || []).length;
            if (total === 0) return;
            const done = Object.values(m.missionsCompleted || {}).filter(Boolean).length;
            if (done < total) return;
            const today = m.currentDayKey;
            if (m._lastAllCompleteDayKey === today) return;
            m._lastAllCompleteDayKey = today;
            // Only auto-save in the legacy (username) call-site: the (m)
            // call-site is always followed by the caller saving its own
            // m, which would otherwise overwrite our write with the same
            // data on a fresh parse anyway.
            if (usernameToSave) saveUserMissions(usernameToSave, m);
        }

        // Manually bumps the super-streak count when the user clicks the
        // Super Streak Button on the Missions screen. Mirrors the daily
        // `claimDailyStreak()` pattern: once per day, with consecutive
        // days incrementing and missed days resetting to 1. The button is
        // the only thing that can advance m.superStreakCount now that
        // maybeAdvanceSuperStreak no longer auto-bumps.
        function claimSuperStreak() {
            if (!currentUser) return null;
            const m = refreshMissionsForUser(currentUser);
            const today = m.currentDayKey;
            // Locked-state guard: the button is always rendered under
            // the SUPER STREAK counter (greyed-out "🔒 LOCKED" until all
            // 3 daily missions are done), so a click on the locked
            // version MUST be a no-op here. Once _lastAllCompleteDayKey
            // matches today, this guard lets the click through to bump
            // m.superStreakCount and flip superClaimedDate.
            if (m._lastAllCompleteDayKey !== today) return null;
            // Already claimed today — accidental double-click must not
            // inflate the count.
            if (m.superClaimedDate === today) return m.superStreakCount;
            if (m.lastSuperClaimDate && isYesterday(m.lastSuperClaimDate, today)) {
                m.superStreakCount += 1;
            } else {
                m.superStreakCount = 1;
            }
            m.lastSuperClaimDate = today;
            m.superClaimedDate = today;
            saveUserMissions(currentUser, m);
            playRecordSound();
            return m.superStreakCount;
        }

        function recordMissionEvent(eventType, value) {
            if (!currentUser) return;
            const m = refreshMissionsForUser(currentUser);
            if (eventType === 'finished_classic') {
                m.modesPlayedToday.classic = true;
                if (value > m.bestClassicScoreToday) m.bestClassicScoreToday = value;
                if (lives > 0) m.noDeathClassicToday = true;
            } else if (eventType === 'finished_survival') {
                m.modesPlayedToday.survival = true;
                if (value > m.bestSurvivalTimeToday) m.bestSurvivalTimeToday = value;
            } else if (eventType === 'finished_battle') {
                // `value` is the kill count of the Battle run that just
                // ended. Two flags flip off this event:
                //   * modesPlayedToday.battle — toggles the
                //     play-counter used by the Super Streak heuristic.
                //   * bestBattleKillsToday — fuels the two
                //     `battle_kills` daily missions.
                // `noDamageBattleToday` was already flagged at the moment
                // a hit actually reduced `hp`, so its truth value here is
                // simply observed via recheckMissionCompletion below.
                m.modesPlayedToday.battle = true;
                if (typeof value === 'number' && value > m.bestBattleKillsToday) {
                    m.bestBattleKillsToday = value;
                }
            } else if (eventType === 'visited_settings') {
                m.settingsVisitedToday = true;
            } else if (eventType === 'toggled_setting') {
                m.settingsToggledCountToday = (m.settingsToggledCountToday || 0) + 1;
            }
            recheckMissionCompletion(m);
            // Pass m (not currentUser) so the _lastAllCompleteDayKey write
            // lands on the same reference our final saveUserMissions()
            // call below will persist. Using currentUser here re-fetches
            // from localStorage BEFORE the in-memory mission updates are
            // saved, which used to skip the unlock step on the third event.
            maybeAdvanceSuperStreak(m);
            saveUserMissions(currentUser, m);
        }


        function navigateToMissionsScreen() {
            if (!currentUser) return;
            refreshMissionsForUser(currentUser);
            gameState = GAME_STATES.MISSIONS;
            playClickSound();
        }

        function navigateFromMissionsScreen() {
            gameState = GAME_STATES.MENU;
            playClickSound();
        }

        function newMissionsRecord() {
            return {
                lastClaimedDate: null,
                streakCount: 0,
                superStreakCount: 0,
                lastSuperClaimDate: null,
                superClaimedDate: null,
                currentDayKey: null,
                missionsForDay: [],
                missionsCompleted: {},
                _lastAllCompleteDayKey: null,
                modesPlayedToday: { classic: false, survival: false, battle: false },
                settingsVisitedToday: false,
                settingsToggledCountToday: 0,
                bestClassicScoreToday: 0,
                bestSurvivalTimeToday: 0,
                bestBattleKillsToday: 0,
                noDeathClassicToday: false,
                noDamageBattleToday: false
            };
        }

        function getUserMissions(username) {
            if (!username) return newMissionsRecord();
            const all = getAllRecords();
            const key = `${username}__missions`;
            if (!all[key]) {
                all[key] = newMissionsRecord();
                saveAllRecords(all);
            }
            return all[key];
        }

        function saveUserMissions(username, data) {
            if (!username) return;
            const all = getAllRecords();
            all[`${username}__missions`] = data;
            saveAllRecords(all);
        }

        function recheckMissionCompletion(m) {
            if (!m.missionsForDay) return;
            m.missionsCompleted = {};
            for (const mission of m.missionsForDay) {
                let done = false;
                switch (mission.type) {
                    case 'classic_score': done = m.bestClassicScoreToday >= mission.target; break;
                    case 'survival_time': done = m.bestSurvivalTimeToday >= mission.target; break;
                    case 'no_death_run': done = m.noDeathClassicToday; break;
                    case 'battle_kills': done = m.bestBattleKillsToday >= mission.target; break;
                    case 'battle_no_damage_run': done = !!(m.noDamageBattleToday && m.bestBattleKillsToday >= 1); break;
                    case 'visit_settings': done = m.settingsVisitedToday; break;
                    case 'toggle_setting': done = (m.settingsToggledCountToday || 0) >= 1; break;
                    case 'both_modes': done = !!(m.modesPlayedToday.classic && m.modesPlayedToday.survival); break;
                }
                m.missionsCompleted[mission.id] = done;
            }
        }

        function refreshMissionsForUser(username) {
            const m = getUserMissions(username);
            const today = localDayKey();
            if (m.currentDayKey !== today) {
                m.currentDayKey = today;
                m.missionsForDay = generateDailyMissions(today);
                m.missionsCompleted = {};
                m.modesPlayedToday = { classic: false, survival: false, battle: false };
                m.settingsVisitedToday = false;
                m.settingsToggledCountToday = 0;
                m.bestClassicScoreToday = 0;
                m.bestSurvivalTimeToday = 0;
                m.bestBattleKillsToday = 0;
                m.noDeathClassicToday = false;
                m.noDamageBattleToday = false;
                m._lastAllCompleteDayKey = null;
                m.superClaimedDate = null;
            }
            recheckMissionCompletion(m);
            const all = getAllRecords();
            all[`${username}__missions`] = m;
            saveAllRecords(all);
            return m;
        }

        function isYesterday(prev, today) {
            if (!prev) return false;
            const aParts = prev.split('-').map(Number);
            const bParts = today.split('-').map(Number);
            const a = new Date(aParts[0], aParts[1] - 1, aParts[2]).getTime();
            const b = new Date(bParts[0], bParts[1] - 1, bParts[2]).getTime();
            return Math.round((b - a) / (1000 * 60 * 60 * 24)) === 1;
        }

        // ----- Missions page renderer -----
        function drawMissionsScreen() {
            drawBackground();

            const m = currentUser
                ? refreshMissionsForUser(currentUser)
                : newMissionsRecord();

            ctx.textAlign = 'center';
            ctx.shadowBlur = 30;
            ctx.shadowColor = '#ffd84a';
            ctx.font = 'bold 38px Orbitron, sans-serif';
            ctx.fillStyle = '#ffd84a';
            ctx.fillText('\u{1f4cb} MISSIONS', canvas.width / 2, 60);

            if (!currentUser) {
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'black';
                ctx.font = '20px Orbitron, sans-serif';
                ctx.fillStyle = '#aaa';
                ctx.fillText('Create an account to track your progress!', canvas.width / 2, 110);
                const backY = 540, backW = 160, backH = 35;
                const backX = canvas.width / 2 - backW / 2;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#4af';
                ctx.fillStyle = '#2a4a7a';
                ctx.beginPath();
                ctx.roundRect(backX, backY, backW, backH, 10);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'white';
                ctx.font = '18px Orbitron, sans-serif';
                ctx.fillText('\u2190 BACK', canvas.width / 2, backY + 25);
                menuButtons = [{ rect: { x: backX, y: backY, w: backW, h: backH }, action: 'missionsBack' }];
                ctx.textAlign = 'left';
                ctx.shadowBlur = 0;
                return;
            }

            // Date badge
            ctx.shadowBlur = 8;
            ctx.shadowColor = 'black';
            ctx.font = '13px Orbitron, sans-serif';
            ctx.fillStyle = '#9cd3ff';
            const dateStr = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
            ctx.fillText('\u{1f4c5} ' + dateStr, canvas.width / 2, 92);

            // Streak panel
            const streakY = 125, streakH = 110, streakW = 360;
            const streakX = canvas.width / 2 - streakW / 2;
            ctx.shadowBlur = 22;
            ctx.shadowColor = '#ffaa55';
            const streakGrad = ctx.createLinearGradient(streakX, streakY, streakX, streakY + streakH);
            streakGrad.addColorStop(0, 'rgba(70, 40, 10, 0.85)');
            streakGrad.addColorStop(1, 'rgba(35, 18, 5, 0.95)');
            ctx.fillStyle = streakGrad;
            ctx.beginPath();
            ctx.roundRect(streakX, streakY, streakW, streakH, 12);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(255, 170, 70, 0.55)';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Verical divider between the two streak columns
            ctx.strokeStyle = 'rgba(255,170,70,0.4)';
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, streakY + 14);
            ctx.lineTo(canvas.width / 2, streakY + streakH - 14);
            ctx.stroke();

            const dailyX = streakX + streakW * 0.25;
            const superX = streakX + streakW * 0.75;
            ctx.textAlign = 'center';

            ctx.font = 'bold 11px Orbitron, sans-serif';
            ctx.shadowBlur = 4;
            ctx.shadowColor = 'black';
            ctx.fillStyle = '#ffcc88';
            ctx.fillText('DAILY STREAK', dailyX, streakY + 18);
            ctx.font = 'bold 38px Arial';
            ctx.shadowColor = '#ff7300';
            ctx.shadowBlur = 22;
            ctx.fillText('\u{1f525}', dailyX, streakY + 60);
            ctx.shadowBlur = 0;
            ctx.font = 'bold 30px Orbitron, sans-serif';
            ctx.fillStyle = '#ff9933';
            ctx.fillText(m.streakCount, dailyX, streakY + 95);

            ctx.font = 'bold 11px Orbitron, sans-serif';
            ctx.shadowBlur = 4;
            ctx.shadowColor = 'black';
            ctx.fillStyle = '#ffaaaa';
            ctx.fillText('SUPER STREAK', superX, streakY + 18);
            ctx.font = 'bold 38px Arial';
            ctx.shadowColor = '#8a0303';
            ctx.shadowBlur = 22;
            ctx.fillText('\u{1f525}', superX, streakY + 60);
            ctx.shadowBlur = 0;
            ctx.font = 'bold 30px Orbitron, sans-serif';
            ctx.fillStyle = '#cc4040';
            ctx.fillText(m.superStreakCount, superX, streakY + 95);

            // Claim button under the daily side
            const claimW = 130, claimH = 28;
            const claimX = dailyX - claimW / 2;
            const claimY = streakY + streakH + 14;
            const claimedToday = m.lastClaimedDate === m.currentDayKey;
            ctx.shadowBlur = 12;
            if (claimedToday) {
                ctx.shadowColor = 'rgba(120,255,120,0.6)';
                ctx.fillStyle = '#1a4a2a';
                ctx.strokeStyle = '#66ee88';
            } else {
                ctx.shadowColor = 'rgba(255,140,0,0.75)';
                ctx.fillStyle = '#5a2a0a';
                ctx.strokeStyle = '#ff9933';
            }
            ctx.beginPath();
            ctx.roundRect(claimX, claimY, claimW, claimH, 10);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.font = 'bold 12px Orbitron, sans-serif';
            ctx.fillStyle = claimedToday ? '#aaffaa' : '#ffd84a';
            ctx.fillText(claimedToday ? '\u2713 CLAIMED' : 'CLAIM TODAY', claimX + claimW / 2, claimY + 19);

            // ---- Super Streak Button ----
            // Always rendered under the SUPER STREAK counter so the player
            // sees it the whole day. Three visual states, in priority order:
            //   1) claimed (green ✓) — already collected today's super bonus
            //   2) ready     (red glow) — all 3 daily missions are done; clickable
            //   3) locked    (dim grey) — default; render shows "🔒 LOCKED"
            // Mirrors the daily claim button on the right side of the streak
            // panel so the two stay visually symmetric.
            const allMissionsDone = m._lastAllCompleteDayKey === m.currentDayKey;
            const superClaimW = 130;
            const superClaimX = superX - superClaimW / 2;
            const superClaimed = m.superClaimedDate === m.currentDayKey;
            const superLabel = superClaimed
                ? '\u2713 CLAIMED'
                : (allMissionsDone ? 'SUPER CLAIM!' : '\ud83d\udd12 LOCKED');
            ctx.shadowBlur = 12;
            if (superClaimed) {
                ctx.shadowColor = 'rgba(120,255,120,0.6)';
                ctx.fillStyle = '#1a4a2a';
                ctx.strokeStyle = '#66ee88';
            } else if (allMissionsDone) {
                ctx.shadowColor = 'rgba(204,64,64,0.85)';
                ctx.fillStyle = '#5a0a0a';
                ctx.strokeStyle = '#ff4040';
            } else {
                // Locked / disabled: dim grey, no glow, so the player can
                // tell at a glance that all 3 missions aren't done yet.
                ctx.shadowColor = 'rgba(0,0,0,0.35)';
                ctx.fillStyle = '#2a2a3a';
                ctx.strokeStyle = 'rgba(150,150,150,0.4)';
            }
            ctx.beginPath();
            ctx.roundRect(superClaimX, claimY, superClaimW, claimH, 10);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.font = 'bold 12px Orbitron, sans-serif';
            ctx.fillStyle = superClaimed ? '#aaffaa' : (allMissionsDone ? '#ffcccc' : '#777');
            ctx.fillText(superLabel, superClaimX + superClaimW / 2, claimY + 19);

            // ----- Today's mission cards -----
            const missionsY = claimY + 60;
            ctx.textAlign = 'center';
            ctx.shadowColor = '#88aaff';
            ctx.shadowBlur = 14;
            ctx.font = 'bold 14px Orbitron, sans-serif';
            ctx.fillStyle = '#88aaff';
            ctx.fillText("TODAY'S MISSIONS", canvas.width / 2, missionsY - 18);

            if (m.missionsForDay && m.missionsForDay.length > 0) {
                const cardW = 440, cardH = 54;
                const cardX = canvas.width / 2 - cardW / 2;
                m.missionsForDay.forEach((mission, idx) => {
                    const y = missionsY + idx * (cardH + 10);
                    const done = (m.missionsCompleted && m.missionsCompleted[mission.id]) || false;

                    ctx.shadowBlur = 14;
                    ctx.shadowColor = done ? 'rgba(120,255,120,0.55)' : 'rgba(74,140,255,0.4)';
                    ctx.fillStyle = done ? 'rgba(30,70,40,0.85)' : 'rgba(15,25,50,0.85)';
                    ctx.beginPath();
                    ctx.roundRect(cardX, y, cardW, cardH, 10);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = done ? 'rgba(140,255,140,0.7)' : 'rgba(74,170,255,0.4)';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    ctx.font = 'bold 28px Arial';
                    ctx.textAlign = 'center';
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = done ? 'rgba(120,255,120,0.7)' : 'rgba(255,255,255,0.18)';
                    ctx.fillStyle = done ? '#9eff9e' : 'rgba(255,255,255,0.35)';
                    ctx.fillText(done ? '\u2705' : '\u26d5', cardX + 30, y + 38);

                    ctx.shadowBlur = 0;
                    ctx.font = 'bold 14px Orbitron, sans-serif';
                    ctx.textAlign = 'left';
                    ctx.fillStyle = done ? '#cfffcf' : '#ffffff';
                    ctx.fillText(mission.label, cardX + 62, y + 23);

                    ctx.font = '11px Orbitron, sans-serif';
                    ctx.fillStyle = done ? '#a2e6a2' : '#88aaff';
                    let progressText = '';
                    if (mission.type === 'classic_score') {
                        progressText = `Best today: ${m.bestClassicScoreToday} / ${mission.target} \u2b50`;
                    } else if (mission.type === 'survival_time') {
                        progressText = `Best today: ${m.bestSurvivalTimeToday}s / ${mission.target}s \u2620`;
                    } else if (mission.type === 'no_death_run') {
                        progressText = m.noDeathClassicToday ? 'No-death run complete!' : 'Survive Classic with all 3 lives';
                    } else if (mission.type === 'visit_settings') {
                        progressText = m.settingsVisitedToday ? 'Visited Settings today' : 'Open the Settings screen';
                    } else if (mission.type === 'toggle_setting') {
                        progressText = `Toggled ${m.settingsToggledCountToday || 0} time(s)`;
                    } else if (mission.type === 'both_modes') {
                        const parts = [m.modesPlayedToday.classic ? '\u2b50 Classic \u2713' : '\u2606 Classic',
                        m.modesPlayedToday.survival ? '\u2620 Survival \u2713' : '\u2620 Survival'];
                        progressText = parts.join('   \u00b7   ');
                    }
                    ctx.fillText(progressText, cardX + 62, y + 42);
                });
            }

            // BACK button + swipe hint
            ctx.shadowBlur = 4;
            ctx.shadowColor = 'black';
            ctx.font = '11px Orbitron, sans-serif';
            ctx.fillStyle = '#7eaad6';
            ctx.textAlign = 'center';
            ctx.fillText('\u2190 arrow-left / Esc to go back to menu', canvas.width / 2, 530);

            const backY = 560, backW = 160, backH = 35;
            const backX = canvas.width / 2 - backW / 2;
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#4af';
            ctx.fillStyle = '#2a4a7a';
            ctx.beginPath();
            ctx.roundRect(backX, backY, backW, backH, 10);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'white';
            ctx.font = '18px Orbitron, sans-serif';
            ctx.fillText('\u2190 BACK', canvas.width / 2, backY + 25);
            menuButtons = [{ rect: { x: backX, y: backY, w: backW, h: backH }, action: 'missionsBack' }];
            if (!claimedToday) {
                menuButtons.push({ rect: { x: claimX, y: claimY, w: claimW, h: claimH }, action: 'claimStreak' });
            }
            // Super Streak Button is ALWAYS click-targetable while today
            // is not yet claimed (so the locked visual still feels
            // tappable — clicking is intentionally a no-op inside
            // claimSuperStreak() until the 3 daily missions are done).
            // We skip the click target entirely once it's already
            // claimed for today so it stops accepting input.
            if (!superClaimed) {
                menuButtons.push({ rect: { x: superClaimX, y: claimY, w: superClaimW, h: claimH }, action: 'claimSuperStreak' });
            }

            ctx.textAlign = 'left';
            ctx.shadowBlur = 0;
        }

        function createStar() {
            const isLucky = Math.random() < 0.08;
            return {
                x: Math.random() * canvas.width,
                y: -10,
                radius: isLucky ? 14 + Math.random() * 3 : 8 + Math.random() * 10,
                speed: isLucky ? 1 + Math.random() * 1.3 : 1 + Math.random() * 3,
                color: isLucky
                    ? '#ffd84a'
                    : `hsl(${Math.random() * 60 + 30}, 100%, 60%)`,
                kind: isLucky ? 'lucky' : 'normal',
                spin: (Math.random() - 0.5) * 0.06,
                pointValue: isLucky ? 3 : 1
            };
        }

        function getComboMultiplier() {
            return 1 + Math.min(3, Math.floor(comboStreak / 5));
        }

        function createMeteorite() {
            // Meteorites spawn at the top and descend. They rotate while
            // falling, have a fiery trail, and come in varying sizes — larger
            // ones move slower but are harder to dodge.
            const sizes = [
                { radius: 22, speed: 1.4 + Math.random() * 0.6 },
                { radius: 30, speed: 1.1 + Math.random() * 0.5 },
                { radius: 40, speed: 0.8 + Math.random() * 0.4 }
            ];
            const pick = sizes[Math.floor(Math.random() * sizes.length)];
            return {
                x: Math.random() * (canvas.width - 80) + 40,
                y: -50,
                radius: pick.radius,
                speed: pick.speed,
                rotation: Math.random() * Math.PI * 2,
                rotationSpeed: (Math.random() - 0.5) * 0.08,
                hue: Math.random() * 360          // full spectrum - just like the stars
            };
        }

        function resetGame() {
            stars = [];
            meteorites = [];
            // Survival monster state must reset on every new run so a
            // half-finished monster from the previous run doesn't fade
            // in over the new player's first 8 seconds. The next-spawn
            // deadline goes back to the first-spawn constant so the
            // first monster still appears ~8 s into the new run.
            monster.active = false;
            monster.state = 'idle';
            monster.beamActive = false;
            monsterNextSpawnAtMs = SURVIVAL_MONSTER_FIRST_SPAWN_MS;
            playerInBeamSince = 0;
            // Battle mode keeps three independent collections so the
            // Classic star physics and Survival meteorite AI never leak
            // into each other (the Battle bullets move in a straight
            // line, neither with the stars' sideways drift nor with
            // meteorites' gravity). Wipe them on every new run so a
            // half-finished previous Battle cannot bleed its enemies or
            // bullets into the next game.
            battleEnemies = [];
            playerBullets = [];
            enemyBullets = [];
            // Battle spawn cadence resets each new run too — the
            // `battleSpawnCooldown` initial value (90 frames) keeps the
            // first enemy from appearing off-screen and gives the
            // player roughly 1.5 seconds to read the field.
            battleSpawnCooldown = 90;
            battleElapsedMs = 0;
            // Reset HP to full so each new Battle run starts fresh.
            hp = 100;
            score = 0;
            lives = 3;
            gameOver = false;
            comboStreak = 0;
            comboBest = 0;
            luckyStarsCaught = 0;
            isNewRecord = false;
            newRecordPosition = -1;
            inGameRecordShown = false;
            inGameRecordShownAt = 0;
            meteoriteHitCooldown = 0;
            survivalStartTime = 0;
            survivalScorePerSecondTick = 0;
            player.x = 400;
            player.y = 550;
            player.targetX = 400;
            // ----- CO-OP reset -----
            // Wipe beams + cooldown so a half-finished CO-OP run cannot
            // bleed combat data into the next one; restore both ships
            // to their canonical x/y so the first frame looks the same
            // whether the player came from the menu or from a restart.
            // Green sits at y=350 (above Blue's y=550) and on top of
            // the centre line so the player can see both ships at a
            // glance from frame 1. coopGreenHitCooldown resets to 0 —
            // the green player starts with full, non-invulnerable HP.
            greenPlayerBeams = [];
            greenPlayer.x = 400;
            greenPlayer.y = 350;
            greenPlayer.hp = 100;
            greenPlayer.maxHp = 100;
            coopElapsedMs = 0;
            coopSpawnCooldown = 110;
            coopGreenHitCooldown = 0;
            lastGreenFireTimeMs = 0;
        }

        function startGame(mode) {
            if (typeof mode === 'string') {
                gameMode = mode;
            }
            if (!currentUser) {
                showMobileInput(false);
                gameState = GAME_STATES.ACCOUNT;
                accountInput = '';
                return;
            }
            stopMenuMusic();
            resetGame();
            showMobileInput(false);
            gameState = GAME_STATES.PLAYING;
            startPlayTimer();          // begin timing this play session
            if (gameMode === GAME_MODES.CLASSIC) {
                playClassicMusic();    // background song for the Classic run (no-op for Survival)
            } else if (gameMode === GAME_MODES.SURVIVAL) {
                playSurvivalMusic();   // background song for the Survival run (no-op for Classic)
            } else if (gameMode === GAME_MODES.BATTLE) {
                // Battle ships take the field under SFX alone — the user opted
                // to add a dedicated track later, so this branch is explicitly a
                // no-op. We still set gameMode via the inner branch above so
                // any pre-existing track for the previously-active mode stops
                // before play (Classic / Survival have already done so via
                // stopMenuMusic + resetGame clearing internal audio counters).
                lastFireTimeMs = 0;
            } else if (gameMode === GAME_MODES.COOP) {
                // CO-OP reuses Battle's enemy / bullet pools, so reset the
                // same firing-cooldown timestamp on every fresh run so the
                // first shot comes out clean (otherwise restarting with
                // mouse-down could fire instantly).
                lastFireTimeMs = 0;
                lastGreenFireTimeMs = 0;
            }
        }

        function togglePause() {
            // Clear sticky CO-OP keys so a held arrow + P pause
            // doesn't leave the green ship drifting on unpause. Also
            // a safety net for the window-blur handler that's
            // already firing — covering both leaves no path for
            // coopKeys to survive a pause-resume cycle.
            coopKeys.left = false;
            coopKeys.right = false;
            coopKeys.up = false;
            coopKeys.space = false;
            if (gameState === GAME_STATES.PLAYING && !gameOver) {
                flushPlayTime();       // stop the clock while paused
                gameState = GAME_STATES.PAUSED;
                isPaused = true;
                pauseClassicMusic();   // silence the Classic BGM while paused (keeps position)
                pauseSurvivalMusic();  // silence the Survival BGM while paused (keeps position)
                playClickSound();
            } else if (gameState === GAME_STATES.PAUSED) {
                startPlayTimer();      // resume the clock on unpause
                gameState = GAME_STATES.PLAYING;
                isPaused = false;
                playClassicMusic();    // resume the Classic BGM (no-op for Survival)
                playSurvivalMusic();   // resume the Survival BGM (no-op for Classic)
                playClickSound();
            }
        }

        function updatePauseButton() {
            const pauseButton = document.getElementById('pauseButton');
            const hint = document.getElementById('pauseKeyHint');
            if (!pauseButton) return;

            const showable = gameState === GAME_STATES.PLAYING || gameState === GAME_STATES.PAUSED;
            if (showable) {
                pauseButton.style.display = 'flex';
                pauseButton.textContent = gameState === GAME_STATES.PAUSED ? '▶' : '⏸';
                pauseButton.setAttribute('aria-label', gameState === GAME_STATES.PAUSED ? 'Resume Game' : 'Pause Game');
                // Pin the S-pill reference once per call so the
                // display / opacity bookkeeping for both pills is in
                // lock-step with the P-pill's lifecycle.
                const sHint = document.getElementById('saveKeyHint');
                if (hint) {
                    // Cancel any in-flight fade-out timeout so a stale
                    // timer from a previous hide can't undo our re-show on
                    // rapid state transitions (e.g. PLAYING -> MENU ->
                    // PLAYING inside the 350 ms fade window).
                    if (hint._hideTimer) {
                        clearTimeout(hint._hideTimer);
                        hint._hideTimer = null;
                    }
                    hint.style.display = 'flex';
                }
                if (sHint) {
                    // Same hideTimer bookkeeping as the P pill so
                    // a stale pending-hide from a prior state can't
                    // undo the re-show on rapid PLAYING → MENU →
                    // PLAYING transitions inside the 350 ms fade.
                    if (sHint._hideTimer) {
