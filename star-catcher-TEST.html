<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 Star Catcher - Space Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="palette.css">
    <style>
        :root {
            --ink: #f4f1e8;
            --muted: #9aa6b2;
            --panel: rgba(10, 15, 24, 0.86);
            --panel-strong: rgba(7, 10, 16, 0.96);
            --accent: #ff9f43;
            --accent-soft: #ffd56a;
            --accent-alt: #49d7c8;
            --border: rgba(255, 255, 255, 0.14);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 12px;
            background-color: var(--ink-black);
            background: radial-gradient(circle at 50% 30%, var(--shadow-grey) 0%, var(--ink-black) 70%);
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
            user-select: none;
            color: var(--platinum);
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(138, 43, 226, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(138, 43, 226, 0.02) 1px, transparent 1px),
                radial-gradient(circle at 50% 30%, rgba(138, 43, 226, 0.06), transparent 64%);
            background-size: 100% 4px, 4px 100%, auto;
            mix-blend-mode: screen;
            opacity: 0.20;
        }

        #gameCanvas {
            width: min(100vw - 24px, 800px);
            height: auto;
            max-height: calc(100vh - 24px);
            aspect-ratio: 4 / 3;
            border: 1px solid rgba(138, 43, 226, 0.4);
            border-radius: 28px;
            box-shadow:
                0 24px 80px rgba(0, 0, 0, 0.56),
                0 0 32px rgba(138, 43, 226, 0.15),
                0 0 0 1px rgba(138, 43, 226, 0.12) inset;
            background: rgba(6, 10, 18, 0.58);
            backdrop-filter: blur(8px) saturate(120%);
            cursor: pointer;
            touch-action: none;
            user-select: none;
        }

        .hud-button {
            position: fixed;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            user-select: none;
            touch-action: manipulation;
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, background 0.18s ease;
        }

        .hud-button:active {
            transform: translateY(1px) scale(0.98);
        }

        .hud-button--pause {
            width: 72px;
            height: 72px;
            border-radius: 16px;
            border: 1px solid rgba(138, 43, 226, 0.4);
            background: rgba(26, 31, 44, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--amber-gold);
            font-size: 32px;
            font-weight: 900;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 24px rgba(138, 43, 226, 0.15);
            transition: all 0.25s ease-in-out;
        }

        .hud-button--pause:hover {
            border-color: rgba(138, 43, 226, 0.9);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 15px rgba(138, 43, 226, 0.8);
            transform: translateY(-2px) scale(1.03);
        }

        .hud-button--pause:active {
            transform: scale(0.98);
            border-color: rgba(255, 191, 36, 0.8);
        }

        .key-hint {
            position: fixed;
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0 12px;
            min-width: 42px;
            height: 30px;
            border-radius: 15px;
            background: linear-gradient(180deg, rgba(70, 50, 10, 0.95), rgba(35, 22, 5, 0.95));
            border: 1px solid #ffd84a;
            color: #ffd84a;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(255, 216, 74, 0.7);
            box-shadow: 0 0 14px rgba(255, 216, 74, 0.4);
            opacity: 0;
            transition: opacity 0.28s ease;
            pointer-events: none;
            user-select: none;
            white-space: nowrap;
        }

        .account-card {
            display: none;
            position: absolute;
            /* Dropped from 50% so the card sits clearly below the
               account title/subtitle drawn at the top of the canvas. */
            top: 56%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 30;
            /* Phase-2A Glassmorphism: shadow-grey semi-transparent with blur */
            background: rgba(26, 31, 44, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 24px 22px 20px;
            border-radius: 16px;
            border: 1px solid rgba(138, 43, 226, 0.4);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), 0 0 20px rgba(138, 43, 226, 0.08);
            width: min(92vw, 360px);
            text-align: center;
        }

        .account-card__title {
            color: var(--platinum);
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            margin-bottom: 18px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(138, 43, 226, 0.6);
        }

        .account-card__input {
            width: 100%;
            background: rgba(26, 31, 44, 0.85);
            color: white;
            border: 1px solid rgba(138, 43, 226, 0.4);
            border-radius: 12px;
            padding: 12px;
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            text-align: center;
            box-sizing: border-box;
            outline: none;
        }

        .account-card__input:focus {
            border-color: rgba(138, 43, 226, 0.8);
            box-shadow: 0 0 0 3px rgba(138, 43, 226, 0.2);
        }

        .account-card__actions {
            margin-top: 18px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .account-card__button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex: 1 1 112px;
            min-height: 40px;
            border-radius: 14px;
            border: 1px solid transparent;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.25s ease-in-out;
        }

        .account-card__button:hover {
            transform: translateY(-2px) scale(1.03);
        }

        .account-card__button:active {
            transform: scale(0.98);
        }

        .account-card__button--ghost {
            background: rgba(26, 31, 44, 0.75);
            color: var(--platinum);
            border-color: rgba(138, 43, 226, 0.3);
            transition: all 0.25s ease-in-out;
        }

        .account-card__button--ghost:hover {
            border-color: rgba(138, 43, 226, 0.7);
            box-shadow: 0 0 12px rgba(138, 43, 226, 0.4);
            transform: translateY(-2px) scale(1.03);
        }

        .account-card__button--ghost:active {
            transform: scale(0.98);
        }

        .account-card__button--primary {
            background: linear-gradient(135deg, #8a2be2, #6a1fb0);
            color: #ffffff;
            box-shadow: 0 0 16px rgba(138, 43, 226, 0.35);
            transition: all 0.25s ease-in-out;
        }

        .account-card__button--primary:hover {
            box-shadow: 0 0 15px rgba(255, 191, 36, 0.8);
            border-color: rgba(255, 191, 36, 0.6);
            background: linear-gradient(135deg, #a03cf0, #7a2ac0);
            transform: translateY(-2px) scale(1.03);
        }

        .account-card__button--primary:active {
            transform: scale(0.98);
            border-color: rgba(255, 191, 36, 0.9);
        }

        .account-card__button--secondary {
            background: rgba(26, 31, 44, 0.85);
            color: var(--platinum);
            border-color: rgba(138, 43, 226, 0.3);
            transition: all 0.25s ease-in-out;
        }

        .account-card__button--secondary:hover {
            border-color: rgba(138, 43, 226, 0.8);
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.5);
            transform: translateY(-2px) scale(1.03);
        }

        .account-card__button--secondary:active {
            transform: scale(0.98);
        }

        .account-card__button--danger {
            margin-top: 10px;
            background: rgba(26, 31, 44, 0.85);
            color: #ffb0b0;
            border-color: rgba(255, 120, 120, 0.22);
            transition: all 0.25s ease-in-out;
        }

        .account-card__button--danger:hover {
            border-color: rgba(255, 120, 120, 0.6);
            box-shadow: 0 0 15px rgba(255, 80, 80, 0.4);
            transform: translateY(-2px) scale(1.03);
        }

        .account-card__button--danger:active {
            transform: scale(0.98);
        }
    </style>
</head>

<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <button id="pauseButton" class="hud-button hud-button--pause" aria-label="Game Pause" aria-keyshortcuts="P"
        title="Pause / Resume (press P)" style="display: none;">
        <svg id="pauseIcon" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <rect x="5" y="4" width="5" height="16" rx="1.5" />
            <rect x="14" y="4" width="5" height="16" rx="1.5" />
        </svg>
    </button>

    <!-- Small "P" key hint pill that sits BESIDE the pause button so the
         player sees that the keyboard shortcut exists. Hidden by default
         (display:none) and shown only during PLAYING / PAUSED via JS. The
         same gold palette as the menu's "M KEY" pill keeps it on-brand and
         gives the indicator visual weight without competing with the
         pause icon for attention. -->
    <span id="pauseKeyHint" class="key-hint" aria-hidden="true">P</span>
    <!-- S key hint pill — stacked directly below the P pill by the
         modified positionPauseKeyHint function so the player sees
         that the keyboard shortcut exists. Hidden by default
         (display:none) and shown only during PLAYING / PAUSED via
         JS, mirroring the P pill exactly. Same gold palette so it
         reads as its sibling rather than a separate widget. -->
    <span id="saveKeyHint" class="key-hint" aria-hidden="true">S</span>

    <div id="mobileAccountInput" class="account-card">
        <div class="account-card__title"><svg width="16" height="16" viewBox="-9 -9 18 18" fill="none"
                stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
                <circle cx="0" cy="-3.5" r="3.2" />
                <path d="M-7 7a7 7 0 0 1 14 0" />
            </svg> NEW ACCOUNT</div>
        <input type="text" id="accountMobileInput" maxlength="12" placeholder="Name (max 12 char)"
            class="account-card__input">
        <div class="account-card__actions">
            <button id="mobileClearNameBtn" class="account-card__button account-card__button--ghost"><svg width="14"
                    height="14" viewBox="-1 -1 14 14" fill="none" stroke="currentColor" stroke-width="1.5"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M2 3.5h8M3.5 3.5l.6 7a1 1 0 0 0 1 .9h3.8a1 1 0 0 0 1-.9l.6-7" />
                    <path d="M5.5 3V2.2a.8.8 0 0 1 .8-.7h1.4a.8.8 0 0 1 .8.7V3" />
                </svg> Clear Name</button>
            <button id="mobileConfirmBtn" class="account-card__button account-card__button--primary"><svg width="14"
                    height="14" viewBox="-1 -1 14 14" fill="none" stroke="currentColor" stroke-width="2.2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M2 7l3 3L12 3" />
                </svg> CONFIRM</button>
            <button id="mobileCancelBtn" class="account-card__button account-card__button--secondary"><svg width="14"
                    height="14" viewBox="-1 -1 14 14" fill="none" stroke="currentColor" stroke-width="2.2"
                    stroke-linecap="round" aria-hidden="true">
                    <path d="M3 3l8 8M11 3l-8 8" />
                </svg> CANCEL</button>
        </div>
        <div style="margin-top: 15px;">
            <button id="mobileClearAccountBtn" class="account-card__button account-card__button--danger"><svg width="14"
                    height="14" viewBox="-1 -1 14 14" fill="none" stroke="currentColor" stroke-width="1.5"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M2 3.5h8M3.5 3.5l.6 7a1 1 0 0 0 1 .9h3.8a1 1 0 0 0 1-.9l.6-7" />
                    <path d="M5.5 3V2.2a.8.8 0 0 1 .8-.7h1.4a.8.8 0 0 1 .8.7V3" />
                </svg> Clear Account</button>
        </div>
    </div>


    <script>
        /* ============================================================
           STAR CATCHER - single-file game code
           ------------------------------------------------------------
           TABLE OF CONTENTS
            0.  Setup: canvas, context, device helpers
            1.  Game state and global variables
            2.  Audio setup (music + SFX)
            3.  Records management (localStorage)
            4.  Game logic (missions, entities, run lifecycle)
            5.  Update loops (classic/survival/battle/boss/coop)
            6.  Drawing functions (screens + renderers)
            7.  Menu action dispatch
            8.  Input handlers, save helpers and DOM wiring
            9.  Polyfill and utilities
            10. Game loop and initialization
           ------------------------------------------------------------
           Conventions
            - Top-level sections are numbered "N. TITLE".
            - Subsections are marked "// ===== N.M title =====".
            - All comments are written in English.
        ============================================================ */
        /* ============================================================
           0. SETUP CANVAS AND CONTEXT
        ============================================================ */
        const FIRE_RATE_COOLDOWN_MS = 140; // minimum delay between shots in Battle mode

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        // Right-click on the canvas normally pops the browser context
        // menu (Reload, Inspect, etc.). Battle Mode uses right-click to
        // fire a blue ray bullet, so the menu must be suppressed while
        // the player is interacting with the game. preventDefault on
        // `contextmenu` does not affect left-click behaviour, so the
        // existing ship-move handler keeps working untouched.
        // ===== 0.1 Canvas + right-click suppression =====
        canvas.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        // ===== Settings-panel wheel scroll ===========================
        // Mouse-wheel / trackpad vertical scroll acts ONLY while the
        // SETTINGS screen is up; in every other state the event is a
        // no-op so the existing targetX-write in mousemove keeps the
        // ship steering untouched. deltaY is sign-only-amplified by a
        // fixed step (~120 px) so a single physical wheel notch jumps
        // roughly one row instead of micro-scrolling by line height.
        // preventDefault stops the browser from intercepting it for
        // page-scroll on touch devices that emulate wheel events.
        // ===== 0.2 Settings-panel wheel scroll =====
        canvas.addEventListener('wheel', (e) => {
            if (gameState !== GAME_STATES.SETTINGS) return;
            const step = 120;
            const next = settingsScrollY + Math.sign(e.deltaY) * step;
            // Use SETTINGS_SCROLL_MAX (module-level) instead of the
            // local `scrollRange` declared inside drawSettingsScreen,
            // otherwise the reference would throw a ReferenceError
            // when the wheel handler fires before that function has
            // ever been called.
            settingsScrollY = Math.max(0, Math.min(next, SETTINGS_SCROLL_MAX));
            e.preventDefault();
        }, { passive: false });

        // Detect a touch-first device or narrow viewport — used to dial
        // back background / overlay work on phones. Re-evaluated on
        // resize and orientationchange so a tablet that narrows after
        // boot picks up the same perf tweaks.
        // ===== 0.3 Device detection (mobile) =====
        function detectMobile() {
            return ('ontouchstart' in window || navigator.maxTouchPoints > 0)
                || window.innerWidth <= 768;
        }
        let IS_MOBILE = detectMobile();
        window.addEventListener('resize', () => {
            IS_MOBILE = detectMobile();
            positionPauseButton();
        });
        window.addEventListener('orientationchange', () => {
            IS_MOBILE = detectMobile();
            // Reposition after the orientationchange event finishes —
            // some browsers fire before the new viewport dimensions are
            // committed, so a short timeout locks in the correct layout.
            setTimeout(positionPauseButton, 100);
        });

        // Convert a DOM event (mouse OR touch) into canvas-internal pixel
        // coordinates. Re-evaluates the bounding rect on every call so
        // it stays correct across orientation changes and address-bar
        // resizes, which cost essentially nothing.
        // ===== 0.4 Input -> canvas-coordinate helper =====
        function getGameCoords(event) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX, clientY;
            if (event.touches && event.touches.length > 0) {
                clientX = event.touches[0].clientX;
                clientY = event.touches[0].clientY;
            } else if (event.changedTouches && event.changedTouches.length > 0) {
                clientX = event.changedTouches[0].clientX;
                clientY = event.changedTouches[0].clientY;
            } else {
                clientX = event.clientX;
                clientY = event.clientY;
            }
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        /* ============================================================
           1. GAME STATE AND GLOBAL VARIABLES
        ============================================================ */
        // ===== 1.1 Game states + modes =====
        const GAME_STATES = {
            MENU: 'menu',
            ACCOUNT: 'account',
            // 'difficulty' sits BETWEEN MENU and PLAYING / BATTLE: when
            // the player taps the Battle button on the menu they
            // briefly land here to pick Easy / Normal / Hard before the
            // run actually starts. drawDifficultyScreen() handles the
            // 3-card UI + the menuButtons entries; handleMenuAction's
            // `pickDifficulty_*` cases route through startGame() with
            // the chosen difficulty set on `battleDifficulty`.
            DIFFICULTY: 'difficulty',
            // 'coopSelect' is the CO-OP equivalent of 'difficulty': a
            // small picker between the menu and the run where the player
            // chooses Same Device (the classic two-player CO-OP) or
            // Separate Devices (currently a coming-soon placeholder).
            COOP_SELECT: 'coop_select',
            PLAYING: 'playing',
            PAUSED: 'paused',
            SETTINGS: 'settings',
            RECORDS: 'records',
            MISSIONS: 'missions',
            // 'shop' is the SKIN SHOP sub-screen reachable from the main
            // menu: players spend stars (earned in Classic matches) to
            // unlock different-colored skins for the main character and
            // the Blue mascot.
            SHOP: 'shop',
            // 'bossUnlock' is a second page INSIDE the MISSION section:
            // a dedicated screen listing the three record achievements
            // that unlock BOSS FIGHT mode, with live progress and how
            // much is still missing. Opened via the '−' button on the
            // Missions screen, or automatically when a locked BOSS FIGHT
            // card is tapped in the Battle difficulty picker.
            BOSS_UNLOCK: 'boss_unlock'
        };

        const GAME_MODES = {
            CLASSIC: 'classic',
            SURVIVAL: 'survival',
            BATTLE: 'battle',
            // CO-OP: two-player mode on the same keyboard with ONE
            // shared health pool.
            //   * Blue (mouse) collects stars; catching heals the pool,
            //     missing a star drains it.
            //   * Green (arrow keys) shoots light-green beams at enemies;
            //     kills score +2 and heal the pool, enemy bullets drain it.
            //   If the shared pool hits 0, both players lose together.
            //   Score is 1 per star + 2 per enemy kill.
            COOP: 'coop',
            // BOSS FIGHT: a Battle-style duel against the crowned alien
            // UFO king. HP, kills and the HUD behave exactly like Battle;
            // on top of the usual enemies the field also carries fast
            // boss missiles, meteorites and healing stars. The mode
            // is unlocked only after the three record achievements.
            BOSS: 'boss'
        };

        // ===== 1.2 Runtime state =====
        let gameState = GAME_STATES.MENU;
        let gameMode = GAME_MODES.CLASSIC;
        let survivalStartTime = 0;        // Date.now() when survival run starts
        let survivalScorePerSecondTick = 0; // accumulator that turns real time into integer seconds
        let currentUser = null;
        let accountInput = '';
        let isPaused = false;
        // Remembers where the user was BEFORE entering SETTINGS so the
        // 'settingsBack' case can route BACK to PAUSED when SETTINGS was
        // opened from the pause overlay, and BACK to MENU otherwise.
        let gameStateBeforeSettings = GAME_STATES.MENU;
        let mobileInputVisible = false;

        // Play-time tracking: how long the player spent in the
        // PLAYING state on the current account. The timer is paused
        // while the game is PAUSED so only active play counts toward
        // the "How much time did you play" totals shown on the
        // Records screen.
        let playingStartedAt = 0;

        let settings = {
            schemaVersion: 4,                  // bump when migrations land so loadSettings skips them
            music: true,
            classicMusic: true,
            survivalMusic: true,
            sfx: true,
            menuVolume: 0.7,
            classicVolume: 0.7,
            survivalVolume: 0.7,
            // Survival mode: when true the player follows the mouse cursor
            // EXACTLY (no smoothing) and can roam anywhere on screen —
            // affects player.x AND player.y. Defaults to false so the
            // original bottom-strip dodging behaviour stays the default.
            survivalFreeMovement: false
        };

        const player = {
            x: 400,
            y: 550,
            radius: 100,
            targetX: 400,
            // Battle Mode uses HP instead of lives (Battle ships are tougher
            // and the player must weather sustained enemy fire without
            // losing all their hearts in 2 seconds).
            hp: 100
        };

        // Raw mouse/touch coordinates in canvas pixels. The mousemove
        // handler updates these on every event regardless of gameState,
        // so update() can read them in the very first frame after
        // entering Survival-with-free-movement (when the player model
        // still sits at its default y=550 but the cursor already lives
        // somewhere up at, say, y=120).
        let mouseX = 400;
        let mouseY = 550;

        // ===== 1.3 Button hover system =====
        // ----- Phase-2B Button hover tracking -----
        // Tracks which menuButtons action is currently hovered and
        // smoothly interpolates hoverStrength 0→1 (enter) / 1→0 (exit)
        // so buttons animate rather than snapping between states.
        let btnHoverTarget = null;   // menuButtons[].action string or null
        let btnHoverCurrent = null;  // currently displayed hover target (lerps toward btnHoverTarget)
        let btnHoverStrength = 0;    // 0 = idle, 1 = fully hovered
        let btnHoverLastMs = 0;      // Date.now() of last strength update
        const BTN_HOVER_LERP = 0.18; // lerp rate per ~16ms frame

        // Phase-2B: reusable glassmorphism button renderer.
        // Draws a rounded-rect button with fill + stroke + text, then
        // optionally layers a glow and scale transform when hovered.
        //   isPrimary: amber-gold glow instead of blue-violet
        //   hoverStrength: 0..1 from btnHoverStrength
        // ---- Vector icon helper (used by drawGlassButton) ----
        // Draws a small geometric icon (no emoji) inside a 22 x 22 box
        // centred on (x, y). Vector icons render pixel-identically on every
        // device (emoji does not) and read as deliberately designed.
        function drawVectorIcon(type, x, y, color, scale) {
            ctx.save();
            ctx.translate(x, y);
            // 'trophy' is an alias for the 'records' trophy artwork so
            // screens can name the icon semantically.
            if (type === 'trophy') type = 'records';
            // Optional uniform scale lets one 22x22 box serve both small
            // badges (scale ~0.6) and large hero glyphs (scale ~2.4).
            const s = scale || 1;
            if (s !== 1) ctx.scale(s, s);
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = 1.8;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';

            switch (type) {
                case 'play': // filled triangle, points right
                    ctx.beginPath();
                    ctx.moveTo(-3, -6);
                    ctx.lineTo(5, 0);
                    ctx.lineTo(-3, 6);
                    ctx.closePath();
                    ctx.fill();
                    break;
                case 'chevron': { // solid right-pointing chevron (nav arrows)
                    ctx.beginPath();
                    ctx.moveTo(-5, -7);
                    ctx.lineTo(4, 0);
                    ctx.lineTo(-5, 7);
                    ctx.closePath();
                    ctx.fill();
                    break;
                }
                case 'chevronLeft': { // solid left-pointing chevron (back arrows)
                    ctx.beginPath();
                    ctx.moveTo(5, -7);
                    ctx.lineTo(-4, 0);
                    ctx.lineTo(5, 7);
                    ctx.closePath();
                    ctx.fill();
                    break;
                }
                case 'account': // head + shoulders
                    ctx.beginPath();
                    ctx.arc(0, -4, 4.2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(0, 9, 7.5, Math.PI, 0);
                    ctx.stroke();

                case 'records': { // trophy: bowl, handles, stem, base
                    ctx.beginPath();
                    ctx.arc(0, -1.5, 5, Math.PI, 0);
                    ctx.lineTo(4, 1.5);
                    ctx.quadraticCurveTo(0, 3.5, -4, 1.5);
                    ctx.closePath();
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(0, 2.5);
                    ctx.lineTo(0, 7.5);
                    ctx.moveTo(-4.5, 9.5);

                }
                case 'settings': { // three sliders with knobs
                    ctx.lineWidth = 1.6;
                    for (let i = 0; i < 3; i++) {
                        const sy = -5 + i * 5;
                        ctx.beginPath();

                    }
                    ctx.beginPath();
                    ctx.arc(3, -5, 2.3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(-3, 0, 2.3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(5, 5, 2.3, 0, Math.PI * 2);
                    ctx.fill();

                }
                case 'missions': { // clipboard with a couple of lines
                    ctx.beginPath();
                    ctx.roundRect(-6, -8, 12, 16, 2.5);
                    ctx.stroke();
                    ctx.fillRect(-2, -10, 4, 2.5);
                    ctx.beginPath();
                    ctx.moveTo(-3, -2);
                    ctx.lineTo(3, -2);
                    ctx.moveTo(-3, 2);
                    ctx.lineTo(3, 2);
                    ctx.moveTo(-3, 6);

                case 'battle': { // crosshair
                    ctx.beginPath();
                    ctx.arc(0, 0, 5, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(-8, 0);
                    ctx.lineTo(8, 0);
                    ctx.moveTo(0, -8);
                    ctx.lineTo(0, 8);
                    ctx.stroke();
                    break;
                }
                case 'coop': { // two overlapping player silhouettes
                    ctx.beginPath();
                    ctx.arc(-4, -4, 3.4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(4, -4, 3.4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(-5.5, 8, 5.5, Math.PI, 0);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(5.5, 8, 5.5, Math.PI, 0);
                    ctx.stroke();
                    break;
                }
                case 'survival': { // shield (protection)
                    ctx.beginPath();
                    ctx.moveTo(0, -7.5);
                    ctx.lineTo(6, -4.5);
                    ctx.lineTo(6, 1.5);
                    ctx.lineTo(0, 7.5);
                    ctx.lineTo(-6, 1.5);
                    ctx.lineTo(-6, -4.5);
                    ctx.closePath();
                    ctx.stroke();
                    break;
                }
                case 'shield': { // shield outline (HUD)
                    ctx.beginPath();
                    ctx.moveTo(0, -8);
                    ctx.lineTo(6.5, -5.5);
                    ctx.lineTo(6.5, 2);
                    ctx.quadraticCurveTo(6.5, 6.5, 0, 9);
                    ctx.quadraticCurveTo(-6.5, 6.5, -6.5, 2);
                    ctx.lineTo(-6.5, -5.5);
                    ctx.closePath();
                    ctx.stroke();
                    break;
                }
                case 'star': { // 4-point sparkle star
                    ctx.beginPath();
                    ctx.moveTo(0, -8);
                    ctx.quadraticCurveTo(1.8, -1.8, 8, 0);
                    ctx.quadraticCurveTo(1.8, 1.8, 0, 8);
                    ctx.quadraticCurveTo(-1.8, 1.8, -8, 0);
                    ctx.quadraticCurveTo(-1.8, -1.8, 0, -8);
                    ctx.closePath();
                    ctx.fill();
                    break;
                }
                case 'skull': { // skull: cranium + eyes + jaw
                    ctx.beginPath();
                    ctx.arc(0, -2, 6.5, Math.PI, 0);
                    ctx.lineTo(6.5, 4);
                    ctx.quadraticCurveTo(6.5, 8, 4, 8);
                    ctx.lineTo(-4, 8);
                    ctx.quadraticCurveTo(-6.5, 8, -6.5, 4);
                    ctx.closePath();
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(-2.6, 0.5, 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(2.6, 0.5, 2, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                }
                case 'target': { // concentric rings + centre dot
                    ctx.beginPath();
                    ctx.arc(0, 0, 7, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(0, 0, 4.2, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(0, 0, 1.4, 0, Math.PI * 2);
                    ctx.fill();

                case 'lock': { // padlock: shackle + body
                    ctx.beginPath();
                    ctx.arc(0, -3.5, 4, Math.PI, 0);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.roundRect(-6.5, -1, 13, 9, 2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(0, 2.5, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                }
                case 'crown': { // three-point crown
                    ctx.beginPath();
                    ctx.moveTo(-8, 6.5);
                    ctx.lineTo(-8, -1.5);
                    ctx.lineTo(-3.5, 3);
                    ctx.lineTo(0, -6);
                    ctx.lineTo(3.5, 3);
                    ctx.lineTo(8, -1.5);
                    ctx.lineTo(8, 6.5);
                    ctx.closePath();
                    ctx.stroke();
                    break;
                }
                case 'flame': { // flame silhouette: pointed wavy top + notched side
                    ctx.beginPath();
                    ctx.moveTo(0, -8);
                    ctx.quadraticCurveTo(1, -4.5, 4.5, -1);
                    ctx.quadraticCurveTo(7.5, 1, 7.8, 3.5);
                    ctx.quadraticCurveTo(8, 5.5, 5.5, 6);
                    ctx.quadraticCurveTo(3, 7.6, 0, 7.2);
                    ctx.quadraticCurveTo(-3.8, 7, -6.8, 4.5);
                    ctx.quadraticCurveTo(-7.8, 1.5, -5.5, -1.5);
                    ctx.quadraticCurveTo(-3.5, -4.5, -1, -5);
                    ctx.quadraticCurveTo(0, -6.5, 0, -8);
                    ctx.closePath();
                    ctx.fill();
                    break;
                }
                case 'calendar': { // calendar: header + rings
                    ctx.beginPath();
                    ctx.roundRect(-8, -6, 16, 13, 2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(-8, -2);
                    ctx.lineTo(8, -2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(-4.5, -8.5, 1.4, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(4.5, -8.5, 1.4, 0, Math.PI * 2);
                    ctx.stroke();
                    break;
                }
                case 'check': { // check mark
                    ctx.beginPath();
                    ctx.moveTo(-6.5, 0.5);
                    ctx.lineTo(-2, 5.5);
                    ctx.lineTo(6.5, -4.5);
                    ctx.stroke();
                    break;
                }
                case 'box': { // empty rounded box (un-checked)
                    ctx.beginPath();
                    ctx.roundRect(-6.5, -6.5, 13, 13, 3);
                    ctx.stroke();
                    break;
                }
                case 'heart': { // heart
                    ctx.beginPath();
                    ctx.moveTo(0, 7);
                    ctx.bezierCurveTo(-9, 1, -6, -7, 0, -2);
                    ctx.bezierCurveTo(6, -7, 9, 1, 0, 7);
                    ctx.closePath();
                    ctx.fill();
                    break;
                }
                case 'medal': { // medal: ribbon + coin
                    ctx.beginPath();
                    ctx.arc(0, 2.5, 5.5, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(-3.5, -0.5);
                    ctx.lineTo(-6, -8);
                    ctx.lineTo(-1.5, -5);
                    ctx.moveTo(3.5, -0.5);
                    ctx.lineTo(6, -8);
                    ctx.lineTo(1.5, -5);
                    ctx.stroke();
                    break;
                }
                case 'boom': { // explosion starburst
                    ctx.beginPath();
                    ctx.moveTo(0, -9);
                    for (let i = 1; i < 8; i++) {
                        const a = i * Math.PI / 4 - Math.PI / 2;
                        const r = i % 2 === 0 ? 9 : 4.2;
                        ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
                    }
                    ctx.closePath();
                    ctx.fill();
                    break;
                }
                case 'home': { // house: roof + body + door
                    ctx.beginPath();
                    ctx.moveTo(-9, 2);
                    ctx.lineTo(0, -8);
                    ctx.lineTo(9, 2);
                    ctx.closePath();
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.roundRect(-6, 1.5, 12, 7, 1.5);
                    ctx.stroke();
                    ctx.fillRect(-2, 4.5, 4, 4);
                    break;
                }
                case 'save': { // floppy disk
                    ctx.beginPath();
                    ctx.roundRect(-8, -7, 16, 14, 1.5);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.roundRect(-6, 4, 7, 3, 1);
                    ctx.stroke();
                    ctx.fillRect(3.5, -5, 3, 3);
                    break;
                }
                case 'shop': { // shopping bag: handle + body + stitch
                    ctx.beginPath();
                    ctx.arc(0, -5.5, 3.8, Math.PI * 1.12, Math.PI * -0.12);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.roundRect(-7.5, -4, 15, 12.5, 2.5);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(-5, 0.5);
                    ctx.lineTo(5, 0.5);
                    ctx.stroke();
                    break;
                }
                case 'note': { // music note
                    ctx.beginPath();
                    ctx.ellipse(-4, 4.5, 2.8, 2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(-1.2, 4.5);
                    ctx.lineTo(-1.2, -5.5);
                    ctx.lineTo(6, -3.5);
                    ctx.lineTo(6, 3);
                    ctx.stroke();
                    break;
                }
                case 'speaker': { // speaker: box + cone + waves
                    ctx.beginPath();
                    ctx.roundRect(-8, -6, 5, 12, 1.5);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(-3, -6);
                    ctx.lineTo(3, -9);
                    ctx.lineTo(3, 9);
                    ctx.lineTo(-3, 6);
                    ctx.closePath();
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(5, 0, 2, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(8.5, 0, 3, -0.9, 0.9);
                    ctx.stroke();
                    break;
                }
                case 'gamepad': { // gamepad: body + d-pad + buttons
                    ctx.beginPath();
                    ctx.roundRect(-9, -5, 18, 10, 5);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(-4.5, -2);
                    ctx.lineTo(-4.5, 2);
                    ctx.moveTo(-6.5, 0);
                    ctx.lineTo(-2.5, 0);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(4.5, -1.5, 1.2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(6.5, 1.5, 1.2, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                }
                case 'mouse': { // computer mouse
                    ctx.beginPath();
                    ctx.roundRect(-5, -8, 10, 16, 5);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(0, -8);
                    ctx.lineTo(0, -2.5);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(0, 8);
                    ctx.lineTo(0, 11);
                    ctx.stroke();
                    break;
                }
                case 'monitor': { // desktop monitor
                    ctx.beginPath();
                    ctx.roundRect(-9, -8, 18, 12, 2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(-3, 4);
                    ctx.lineTo(3, 4);
                    ctx.moveTo(0, 4);
                    ctx.lineTo(0, 8);
                    ctx.moveTo(-4.5, 8);
                    ctx.lineTo(4.5, 8);
                    ctx.stroke();
                    break;
                }
                case 'antenna': { // satellite dish + signal
                    ctx.beginPath();
                    ctx.arc(0, -3, 6, Math.PI * 0.8, Math.PI * 0.2, true);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(-2.5, -7.5);
                    ctx.lineTo(2.5, -7.5);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(0, 2);
                    ctx.lineTo(0, 9);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(-8, 2, 1.5, 0, Math.PI * 2);
                    ctx.stroke();
                    break;
                }
                case 'clock': { // stopwatch / timer
                    ctx.beginPath();
                    ctx.arc(0, -1, 7, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(0, -1);
                    ctx.lineTo(0, -5);
                    ctx.moveTo(0, -1);
                    ctx.lineTo(4, 1.5);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(-3, -8);
                    ctx.lineTo(-3, -11);
                    ctx.moveTo(3, -8);
                    ctx.lineTo(3, -11);
                    ctx.stroke();
                    break;
                }
                case 'rocket': { // rocket: nose + body + window
                    ctx.beginPath();
                    ctx.moveTo(0, -9);
                    ctx.quadraticCurveTo(5.5, -2, 5.5, 3);
                    ctx.lineTo(5.5, 5);
                    ctx.lineTo(2.5, 4);
                    ctx.lineTo(2.5, 8);
                    ctx.lineTo(-2.5, 8);
                    ctx.lineTo(-2.5, 4);
                    ctx.lineTo(-5.5, 5);
                    ctx.lineTo(-5.5, 3);
                    ctx.quadraticCurveTo(-5.5, -2, 0, -9);
                    ctx.closePath();
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(0, -2, 2, 0, Math.PI * 2);
                    ctx.stroke();
                    break;
                }
                case 'refresh': { // circular retry arrow
                    ctx.beginPath();
                    ctx.arc(0, 0, 7, -0.6, 4.7, true);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(-4.5, -7);
                    ctx.lineTo(-1.5, -2.5);
                    ctx.lineTo(3.5, -4.5);
                    ctx.stroke();
                    break;
                }
                case 'pause': { // two vertical bars
                    ctx.fillRect(-6.5, -7, 4.5, 14);
                    ctx.fillRect(2, -7, 4.5, 14);

                }

            ctx.restore();
        }

        // ----- Layered flame renderer (menu + missions streaks) -----
        // The old single-shape flame icon read as a water droplet; this
        // draws a real flame in the classic palette — an outer body,
        // an inner tongue and a hot white-yellow core, all in the default
        // red/orange/yellow colours when lit, or a grey silhouette when
        // off. The caller's shadow (flicker glow) is left untouched so
        // the streak flames keep their animated halo.
        function drawFlameIcon(x, y, scale, lit, baseColor) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);
            const body = lit ? (baseColor || '#ff8a2b') : '#5a6470';
            const inner = lit
                ? (baseColor === '#e74c3c' || baseColor === '#cc4040' ? '#ff9d8a' : '#ffd98a')
                : '#6f7a88';
            const core = lit ? '#fff6da' : '#8a95a3';
            // Outer flame silhouette — pointed, wavy top with an inward
            // notch on the right so it reads as flickering fire.
            ctx.fillStyle = body;
            ctx.beginPath();
            ctx.moveTo(0, -9);
            ctx.bezierCurveTo(2.5, -5.5, 5, -2, 7.8, 1.5);
            ctx.quadraticCurveTo(9.5, 4.5, 7, 6);
            ctx.quadraticCurveTo(4.5, 7.5, 1.8, 8.4);
            ctx.quadraticCurveTo(4.2, 6.6, 3.2, 4.6);
            ctx.quadraticCurveTo(-0.5, 8.6, -4.5, 7.6);
            ctx.quadraticCurveTo(-8.5, 6.6, -8, 1.5);
            ctx.quadraticCurveTo(-7.5, -3, -4.5, -5.8);
            ctx.closePath();
            ctx.fill();
            // Inner flame tongue
            ctx.fillStyle = inner;
            ctx.beginPath();
            ctx.moveTo(0, -5.5);
            ctx.quadraticCurveTo(3.2, -2, 3.6, 2);
            ctx.quadraticCurveTo(3.8, 5, 1, 5.6);
            ctx.quadraticCurveTo(-2.5, 6, -2.8, 1.5);
            ctx.quadraticCurveTo(-3, -2.8, 0, -5.5);
            ctx.closePath();
            ctx.fill();
            // Hot white-yellow core
            ctx.fillStyle = core;
            ctx.beginPath();
            ctx.moveTo(0, -2.2);
            ctx.quadraticCurveTo(1.4, -0.2, 1.5, 1.8);
            ctx.quadraticCurveTo(1.6, 3.4, 0.4, 3.6);
            ctx.quadraticCurveTo(-1, 3.8, -1.1, 1.2);
            ctx.quadraticCurveTo(-1.2, -0.6, 0, -2.2);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        // ----- Icon + text label helpers -----
        // drawIconLabel* draw a vector icon immediately LEFT of a text
        // label (left / centre / right-aligned variants), replacing the
        // old emoji-prefix style ('Points: 100') so every screen
        // uses the same geometric icon language as the main menu. The
        // icon is vertically centred on the text's optical middle and
        // sits ~22 px wide + 7 px gap, matching drawGlassButton's own
        // icon+label grouping. Each helper saves/restores the context
        // so callers keep their own textAlign / fillStyle.
        function drawIconLabel(iconType, text, x, y, font, color, iconColor, iconSize) {
            const size = iconSize || 16;
            const m = /(\d+(?:\.\d+)?)px/.exec(font);
            const fontPx = m ? parseFloat(m[1]) : 18;
            ctx.save();
            ctx.font = font;
            ctx.fillStyle = color;
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
            const gap = Math.round(size * 0.35);
            drawVectorIcon(iconType, x + size / 2, y - fontPx * 0.36, iconColor || color, size / 22);
            ctx.fillText(text, x + size + gap, y);
            ctx.restore();
        }

        function drawIconLabelCenter(iconType, text, cx, y, font, color, iconColor, iconSize) {
            const size = iconSize || 18;
            const m = /(\d+(?:\.\d+)?)px/.exec(font);
            const fontPx = m ? parseFloat(m[1]) : 18;
            ctx.save();
            ctx.font = font;
            ctx.fillStyle = color;
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
            const tw = ctx.measureText(text).width;
            const gap = Math.round(size * 0.35);
            const groupW = tw + gap + size;
            const startX = cx - groupW / 2;
            drawVectorIcon(iconType, startX + size / 2, y - fontPx * 0.36, iconColor || color, size / 22);
            ctx.fillText(text, startX + size + gap, y);
            ctx.restore();
        }

        function drawIconLabelRight(iconType, text, x, y, font, color, iconColor, iconSize, iconGap) {
            const size = iconSize || 16;
            const m = /(\d+(?:\.\d+)?)px/.exec(font);
            const fontPx = m ? parseFloat(m[1]) : 18;
            ctx.save();
            ctx.font = font;
            ctx.fillStyle = color;
            ctx.textAlign = 'right';
            ctx.textBaseline = 'alphabetic';
            const tw = ctx.measureText(text).width;
            const gap = iconGap !== undefined ? iconGap : Math.round(size * 0.35);
            const groupW = tw + gap + size;
            const startX = x - groupW;
            drawVectorIcon(iconType, startX + size / 2, y - fontPx * 0.36, iconColor || color, size / 22);
            ctx.fillText(text, x, y);
            ctx.restore();
        }

        function drawGlassButton(x, y, w, h, radius, text, fontSize, opts) {
            opts = opts || {};
            const hs = opts.hoverStrength || 0;
            const isPrimary = opts.isPrimary || false;
            const textColor = opts.textColor || '#f1f5f9';
            const glowColor = isPrimary ? 'rgba(255, 191, 36, ' : 'rgba(138, 43, 226, ';
            const scale = 1 + hs * 0.03;             // scale 1.00→1.03
            const offsetY = -hs * 2;                  // translateY 0→-2px
            const glowAlpha = 0.05 + hs * 0.75;       // glow 0.05→0.80

            ctx.save();
            const cx = x + w / 2, cy = y + h / 2;
            ctx.translate(cx, cy);
            ctx.scale(scale, scale);
            ctx.translate(-cx, -cy);
            ctx.translate(0, offsetY);

            // Fill
            const fillAlpha = 0.55 + hs * 0.25;  // darken slightly on hover
            ctx.fillStyle = `rgba(26, 31, 44, ${fillAlpha.toFixed(2)})`;
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, radius);
            ctx.fill();

            // Glow shadow
            if (hs > 0.01) {
                ctx.shadowColor = glowColor + glowAlpha.toFixed(2) + ')';
                ctx.shadowBlur = 8 + hs * 16;
                ctx.strokeStyle = glowColor + (0.4 + hs * 0.5).toFixed(2) + ')';
            } else {
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(138, 43, 226, 0.5)';
            }
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, radius);
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Text with subtle glow on hover
            ctx.shadowBlur = 0;
            if (hs > 0.01) {
                ctx.shadowColor = glowColor + (hs * 0.6).toFixed(2) + ')';
                ctx.shadowBlur = 4 + hs * 8;
            }
            ctx.fillStyle = textColor;
            ctx.font = fontSize;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const iconType = opts.icon || null;
            if (iconType) {
                // Icon + label are centred as one group. Icons use the
                // accent colour (gold on primary CTAs, silver elsewhere).
                const tw = ctx.measureText(text).width;
                const iconW = 20, gap = 7;
                const groupW = tw + gap + iconW;
                const iconX = cx - groupW / 2 + iconW / 2;
                const textX = cx + groupW / 2 - tw / 2;
                drawVectorIcon(iconType, iconX, cy, opts.iconColor || (isPrimary ? '#ffbf24' : (opts.textColor && opts.textColor !== '#f1f5f9' ? opts.textColor : '#aeb9c9')));
                ctx.fillText(text, textX, cy);
            } else {
                ctx.fillText(text, cx, cy);
            }
            ctx.shadowBlur = 0;

            ctx.restore();
        }

        // Phase-2B: scan menuButtons[] for a rect containing (mx, my).
        // Returns the hovered button's action string, or null.
        function findHoveredButton(mx, my) {

            // clear, refresh) so the song doesn't sneak back in on the

        // player hears it from the very first moment the game opens.
        // 300 ms is short enough to feel instant but long enough for

        // On strict mobile autoplay policies the .catch() in
        // playMenuMusic() swallows the rejection; tapping anywhere
        // afterwards re-triggers playback via the in-game hooks.
        setTimeout(playMenuMusic, 300);

        // ----- Volume setters -----
        // Always round to the nearest 0.1 step + clamp to [0, 1]. The
        // Audio API rejects anything outside [0, 1] silently, so an
        // out-of-range persist call could leave the user's music at a
        // different level than what the slider displays. setMenuVolume()
        // and setClassicVolume() share clampVolume() so both tracks
        // behave identically. We lazily init the Audio element on the
        // first volume change so the user's chosen level survives even
        // before the song has actually been played. Mission integration:
        // every change bumps settingsToggledCountToday; the 'toggle_setting'
        // mission just needs ≥1, so multiple clicks still only count once
        // toward unlock.
        // ===== 2.5 Volume setters =====
        function clampVolume(v) {
            // Audio API rejects anything outside [0, 1] silently, so
            // rounding + clamping here keeps in-game and stored values
            // consistent. Fallback default bumped from 0.3 to 0.7 so
            // an empty/missing/invalid value lands at a comfortable
            // listening level rather than the previous barely-audible 30%.
            if (typeof v !== 'number' || !isFinite(v)) return 0.7;
            return Math.round(Math.min(1, Math.max(0, v)) * 10) / 10;
        }

        function setMenuVolume(v) {
            settings.menuVolume = clampVolume(v);
            saveSettings();
            if (!menuAudio) initMenuAudio();
            menuAudio.volume = settings.menuVolume;
        }

        function setClassicVolume(v) {
            settings.classicVolume = clampVolume(v);
            saveSettings();
            if (!classicAudio) initClassicAudio();
            classicAudio.volume = settings.classicVolume;
        }

        function setSurvivalVolume(v) {
            // Mirrors setClassicVolume() — same clamp + persist flow so
            // the +/- stepper behaviour is identical across all three

            settings.survivalVolume = clampVolume(v);
            saveSettings();
            if (!survivalAudio) initSurvivalAudio();
            survivalAudio.volume = settings.survivalVolume;

        // Star-collect sound, loaded from the star-sound.txt file

        let starSound = null;

        function loadStarSound() {
            if (!starSound) {
                // Read the file contents as a blob (requires the file to be served over HTTP)
                fetch('star-sound.txt')
                    .then(response => response.blob())
                    .then(blob => {
                        starSound = new Audio(URL.createObjectURL(blob));
                    })
                    .catch(e => {
                        // Fallback: synthesize a beep when the sound file is unavailable
                        console.log('Star sound file not available, using synthesized sound');
                        starSound = null;

                    const gainNode = audioCtx.createGain();
                    oscillator.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);

        // ===== 2.7 Battle-mode SFX =====

        // Player damage re-uses the existing playLoseLifeSound so the

        function playShootSound() {

        // Last fire timestamp so the player cannot machine-gun by

        /* ============================================================
           3. RECORDS MANAGEMENT (localStorage)
        ============================================================ */
        // ===== 3.1 Generic records store =====
        function getAllRecords() {
            const data = localStorage.getItem('starCatcherAllRecords');
            return data ? JSON.parse(data) : {};
        }

        function saveAllRecords(records) {
            localStorage.setItem('starCatcherAllRecords', JSON.stringify(records));
        }

        function getUserRecords(username) {
            const all = getAllRecords();
            if (!all[username]) {
                all[username] = Array(10).fill(0);
                saveAllRecords(all);
            }
            return all[username];
        }

        function setUserRecords(username, records) {
            const all = getAllRecords();
            all[username] = records;
            saveAllRecords(all);
        }

        // ===== 3.2 Classic records =====
        function addScoreToUser(username, newScore) {
            if (newScore <= 0) return -1;

            let records = getUserRecords(username);
            const previousMin = records.length >= 10 ? records[9] : 0;

            records.push(newScore);
            records.sort((a, b) => b - a);
            records = records.slice(0, 10);
            setUserRecords(username, records);

            if (newScore <= previousMin && records.length >= 10) {
                return -1;
            }

            return records.indexOf(newScore);
        }

        function getMaxScore(username) {
            if (!username) return 0;
            const records = getUserRecords(username);
            return records.length > 0 ? records[0] : 0;
        }

        // Survival mode uses a separate bucket of records (per-mode top-10),
        // identified by a `${user}__survival` key in the same localStorage object.
        // ===== 3.3 Survival records =====
        function getSurvivalRecords(username) {
            const key = `${username}__survival`;
            const all = getAllRecords();
            if (!all[key]) {
                all[key] = Array(10).fill(0);
                saveAllRecords(all);
            }
            return all[key];
        }

        function setSurvivalRecords(username, records) {
            const key = `${username}__survival`;
            const all = getAllRecords();

            saveAllRecords(all);
        }

        function addSurvivalScoreToUser(username, newScore) {

            records.push(newScore);
            records.sort((a, b) => b - a);

        }

        // ----- Battle Mode records -----
        // Top-10 best Battle runs keyed by kill count. Mirrors the
        // `${user}__survival` bucket so the existing JSON.parse on
        // `starCatcherAllRecords` continues to work and the per-mode
        // top-10 shape is identical (Array(10).fill(0) → sorted → first
        // 10 entries) so the Records screen can iterate mode buckets
        // uniformly with `getUserRecords / getSurvivalRecords / getBattleRecords`.
        // ===== 3.4 Battle records =====
        function getBattleRecords(username) {
            const key = `${username}__battle`;
            const all = getAllRecords();
            if (!all[key]) {
                all[key] = Array(10).fill(0);

        // ===== 3.5 BOSS-FIGHT unlock tracking + records =====
        // ----- BOSS-FIGHT unlock tracking -----
        // BOSS FIGHT unlocks once the account has three single-game
        // records: 1000 stars in Classic, 60 s in Survival and 100 kills
        // in Battle NORMAL mode. The generic `${user}__battle` bucket is
        // difficulty-agnostic, so Normal-mode runs ALSO persist their
        // best to a dedicated `${user}__battleNormal` key; otherwise a
        // player who hit 100 kills on Easy could unlock the boss fight
        // without ever touching Normal.
        function getBattleNormalBest(username) {
            const key = `${username}__battleNormal`;
            const all = getAllRecords();
            const v = all[key];
            if (typeof v !== 'number' || !isFinite(v)) {
                all[key] = 0;
                saveAllRecords(all);
                return 0;
            }
            return v;
        }

        function setBattleNormalBest(username, newBest) {
            const key = `${username}__battleNormal`;
            const all = getAllRecords();
            all[key] = newBest;
            saveAllRecords(all);
        }

        function isBossFightUnlocked() {
            if (!currentUser) return false;
            return getMaxScore(currentUser) >= 1000
                && getMaxSurvivalScore(currentUser) >= 60
                && getBattleNormalBest(currentUser) >= 100;
        }

        // ----- BOSS FIGHT Mode records -----
        // Top-10 best boss-fight runs stored as the completion TIME in
        // seconds (lower = better). They are ONLY written when the boss
        // is actually defeated — a loss leaves the bucket untouched.
        // Mirrors the `${user}__battle` bucket shape so the Records
        // screen and drawGameOver can iterate it uniformly.
        function getBossRecords(username) {
            const key = `${username}__boss`;
            const all = getAllRecords();
            if (!all[key]) {
                all[key] = Array(10).fill(0);
                saveAllRecords(all);
            }
            return all[key];
        }

        function setBossRecords(username, records) {
            const key = `${username}__boss`;
            const all = getAllRecords();
            all[key] = records;
            saveAllRecords(all);
        }

        function addBossTimeToUser(username, seconds) {
            if (!seconds || seconds <= 0) return -1;

            // Drop the placeholder 0s (the bucket is seeded with
            // Array(10).fill(0)) BEFORE sorting ascending — otherwise
            // the zeros would sink to the front and records[0] (the
            // "best time") would read 0 until the bucket was full.
            let records = getBossRecords(username).filter(r => r > 0);
            records.push(seconds);
            // Fastest (lowest) first — unlike the score buckets, a lower
            // value is a better record here.
            records.sort((a, b) => a - b);
            records = records.slice(0, 10);
            setBossRecords(username, records);

            // -1 when the new time did not make the top-10, otherwise its
            // rank position in the (ascending) leaderboard.
            return records.indexOf(seconds);
        }

        function getBestBossTime(username) {
            if (!username) return 0;
            const records = getBossRecords(username);
            // records[0] is the fastest (best) completion time.
            return records.length > 0 ? records[0] : 0;
        }

        // ===== 3.6 CO-OP records =====
        // ----- CO-OP Mode records -----
        // Top-10 best CO-OP runs (1 star + 2 enemy-kill per score).
        // Identical shape / storage convention to the `${user}__battle`

        function getCoopRecords(username) {

        function addCoopScoreToUser(username, newScore) {

            let records = getCoopRecords(username);
            const previousMin = records.length >= 10 ? records[9] : 0;

            records.push(newScore);
            records.sort((a, b) => b - a);
            records = records.slice(0, 10);
            setCoopRecords(username, records);

            if (newScore <= previousMin && records.length >= 10) {
                return -1;
            }

            return records.indexOf(newScore);

        function getMaxCoopScore(username) {

        // ----- Play-time helpers (per account) -----
        // Stored as a single integer (ms) under `${user}__playTime`
        // alongside the records so the Records screen can answer
        // "how much time have you been gaming on this account".
        // ===== 3.7 Play-time tracking =====
        function getPlayTime(username) {
            if (!username) return 0;
            const key = `${username}__playTime`;
            const all = getAllRecords();
            const v = all[key];
            return typeof v === 'number' && v > 0 ? v : 0;
        }

        function addPlayTimeToUser(username, ms) {
            if (!username || !ms || ms <= 0) return;
            const key = `${username}__playTime`;
            const all = getAllRecords();
            const prev = typeof all[key] === 'number' ? all[key] : 0;
            all[key] = prev + ms;
            saveAllRecords(all);
        }

        // Save any in-flight session time to the current user's bucket.
        // Called whenever we leave the PLAYING state, the game ends,
        // the player pauses, or they back out to the menu.
        function flushPlayTime() {
            if (currentUser && playingStartedAt > 0) {
                const elapsed = Date.now() - playingStartedAt;
                if (elapsed > 0) addPlayTimeToUser(currentUser, elapsed);
                playingStartedAt = 0;
            }
        }

        // Start (or restart) the play-time clock for the next run.
        function startPlayTimer() {
            playingStartedAt = Date.now();
        }

        // Render ms as a friendly "Xh Ym Zs". The records screen
        // uses this to answer "how much time did you play".
        function formatPlayTime(ms) {
            if (!ms || ms <= 0) return '0s';
            const totalSec = Math.floor(ms / 1000);
            const hours = Math.floor(totalSec / 3600);
            const minutes = Math.floor((totalSec % 3600) / 60);
            const seconds = totalSec % 60;
            if (hours > 0) return `${hours}h ${minutes}m ${seconds}s`;
            if (minutes > 0) return `${minutes}m ${seconds}s`;
            return `${seconds}s`;
        }

        // ===== 3.8 Account + settings persistence =====
        function saveLastUser(username) {
            if (username) {
                localStorage.setItem('starCatcherLastUser', username);
            } else {
                localStorage.removeItem('starCatcherLastUser');
            }
        }

        function loadLastUser() {
            return localStorage.getItem('starCatcherLastUser') || null;
        }

        // Settings are stored per-account so each player keeps their own
        // audio preferences. A separate "default" key is used when no
        // account is active (before creating one, or after clearing it).
        function settingsStorageKey() {
            return currentUser
                ? `starCatcherSettings_${currentUser}`
                : 'starCatcherSettings__default';
        }

        function loadSettings() {
            // Defensive defaults that match the let-settings initialiser
            // above. We return them as a fresh object on every call so
            // mutation by callers (e.g. toggle handlers) never bleeds
            // across accounts.
            // Same defaults as the let-settings initialiser above. 0.7 here
            // means brand-new visitors (no localStorage yet) hear the
            // menu + classic BGM at a comfortable level — the previous
            // 0.3 default was easy to mistake for a broken control since
            // many devices barely audibly play at 30%.
            const defaults = {
                music: true,
                classicMusic: true,
                survivalMusic: true,
                sfx: true,
                menuVolume: 0.7,
                classicVolume: 0.7,
                survivalVolume: 0.7,
                // Mirror of the let-settings initialiser: brand-new
                // visitors (no localStorage yet) get free movement in
                // Survival OFF so they experience the same classic game
                // flow as before this option existed.
                survivalFreeMovement: false
            };
            try {
                const raw = localStorage.getItem(settingsStorageKey());
                if (raw) {
                    const parsed = JSON.parse(raw);
                    // Migration rules:
                    //   * the music / classicMusic split (old accounts
                    //     used music to silence BOTH tracks) is filled
                    //     in on a per-field basis so the legacy value
                    //     sticks for the few users who relied on it.
                    //   * before this deploy, every volume defaulted to
                    //     0.3. If this account pre-dates the bump (i.e.
                    //     no schemaVersion) AND its stored value matches
                    //     that legacy 0.3 default, push it to the new
                    //     default.  Otherwise the user clearly chose
                    //     this number, so pass it through clampVolume
                    //     untouched.
                    //   * schemaVersion is bumped (and included in the
                    //     return object) so saveSettings persists it;
                    //     future loads skip the migration branch.
                    // Bumped migration threshold from <2 → <3 so accounts
                    // that saved during the previous deploy (which only
                    // had music + classicMusic) get the new survivalMusic
                    // + survivalVolume fields added with the same 0.3→0.7
                    // bump rule we used for the menu / classic volumes.
                    // Bumped again <3 → <4 so accounts created before the
                    // free-movement toggle was added get survivalFreeMovement
                    // backfilled as false (preserves the legacy feel).
                    const needsMigration = (parsed.schemaVersion || 0) < 4;
                    const musicVal = typeof parsed.music === 'boolean' ? parsed.music : defaults.music;
                    const result = {
                        schemaVersion: 4,                  // always current after migration runs
                        music: musicVal,
                        classicMusic: parsed.classicMusic ?? musicVal,
                        survivalMusic: parsed.survivalMusic ?? musicVal,
                        sfx: typeof parsed.sfx === 'boolean' ? parsed.sfx : defaults.sfx,
                        menuVolume: (needsMigration && clampVolume(parsed.menuVolume) === 0.3)
                            ? defaults.menuVolume
                            : clampVolume(parsed.menuVolume),
                        classicVolume: (needsMigration && clampVolume(parsed.classicVolume) === 0.3)
                            ? defaults.classicVolume
                            : clampVolume(parsed.classicVolume),
                        survivalVolume: (needsMigration && clampVolume(parsed.survivalVolume) === 0.3)
                            ? defaults.survivalVolume
                            : clampVolume(parsed.survivalVolume),
                        // Free movement is a NEW gameplay-affecting flag —
                        // never inherited from the old `music` umbrella so
                        // legacy accounts that kept music on don't suddenly
                        // find the ship glued to the cursor on first load.
                        survivalFreeMovement: typeof parsed.survivalFreeMovement === 'boolean'
                            ? parsed.survivalFreeMovement
                            : defaults.survivalFreeMovement
                    };
                    if (needsMigration) {
                        try { localStorage.setItem(settingsStorageKey(), JSON.stringify(result)); } catch (e) { }
                    }
                    return result;
                }
            } catch (e) { /* fall through to defaults */ }
            return defaults;
        }

        function saveSettings() {
            try {
                localStorage.setItem(settingsStorageKey(), JSON.stringify(settings));
            } catch (e) { /* silent fail on quota / disabled storage */ }
        }

        // ===== 3.9 Mobile account input card =====

        // ===== 3.10 Star currency + skin shop =====
        // ----- Star currency -----
        // Stars are the shop's currency. They are earned in CLASSIC mode
        // only: every point scored in a Classic match is one star added to
        // the player's balance ("1 point = 1 star"). The balance is stored
        // per-account under a `${user}__stars` key in the same
        // `starCatcherAllRecords` object as every other per-user bucket.
        function getStars(username) {
            if (!username) return 0;
            const all = getAllRecords();
            const v = all[`${username}__stars`];
            return typeof v === 'number' && v > 0 ? v : 0;
        }

        function addStarsToUser(username, n) {
            if (!username || !n || n <= 0) return;
            const all = getAllRecords();
            all[`${username}__stars`] = getStars(username) + n;
            saveAllRecords(all);
            _starCountCache = null;
        }

        // Returns false when the balance is too low (nothing is deducted).
        function spendStars(username, n) {
            if (!username || !n || n <= 0) return true;
            const cur = getStars(username);
            if (cur < n) return false;
            const all = getAllRecords();
            all[`${username}__stars`] = cur - n;
            saveAllRecords(all);
            _starCountCache = null;
            return true;
        }

        // The menu / shop draw the star balance every frame; caching it
        // (invalidated on every add / spend / account switch) avoids a
        // full localStorage JSON.parse per frame, mirroring the
        // `_cachedMissions` pattern the menu already uses.
        let _starCountCache = null;
        let _starCountCacheUser = null;
        function getStarCountCached() {
            if (_starCountCache !== null && _starCountCacheUser === currentUser) {
                return _starCountCache;
            }
            _starCountCache = getStars(currentUser);
            _starCountCacheUser = currentUser;
            return _starCountCache;
        }
