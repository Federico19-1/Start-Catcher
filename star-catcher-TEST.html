            ctx.fillStyle = 'rgba(26, 31, 44, 0.55)';
            ctx.strokeStyle = 'rgba(138, 43, 226, 0.4)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.roundRect(col4X, colY, colW, colH, 12);
            ctx.fill();
            ctx.stroke();

            ctx.textAlign = 'center';
            ctx.font = 'bold 20px Orbitron, sans-serif';
            ctx.fillStyle = '#f1f5f9';
            ctx.shadowBlur = 8;
            ctx.shadowColor = 'rgba(138, 43, 226, 0.5)';
            drawIconLabelCenter('coop', 'CO-OP', col4X + colW / 2, colY + 32, 'bold 20px Orbitron, sans-serif', '#f1f5f9', '#49d7c8', 15);
            ctx.shadowBlur = 0;
            ctx.font = '12px Orbitron, sans-serif';
            ctx.fillStyle = '#9aa6b2';
            // Subtitle spelling out the scoring formula so a casual
            // reader can connect the "pts" suffix below to the game's
            // +1/star + +2/kill rule without leaving the screen.
            ctx.fillText('1/star + 2/kill', col4X + colW / 2, colY + 52);

            if (coopRecords.length === 0) {
                ctx.font = 'bold 14px Orbitron, sans-serif';
                ctx.fillStyle = '#cfffe5';
                ctx.fillText('No records yet', col4X + colW / 2, colY + 110);
            } else {
                ctx.font = '15px Orbitron, sans-serif';
                for (let idx = 0; idx < Math.min(5, coopRecords.length); idx++) {
                    const record = coopRecords[idx];
                    let label, color;
                    let weight = 'normal';
                    if (idx === 0) { label = '1. ' + record; color = '#ffd700'; weight = 'bold'; }
                    else if (idx === 1) { label = '2. ' + record; color = '#c0c0c0'; weight = 'bold'; }
                    else if (idx === 2) { label = '3. ' + record; color = '#cd7f32'; weight = 'bold'; }
                    else { label = (idx + 1) + '. ' + record; color = '#a8e8c8'; }
                    ctx.font = (weight === 'bold' ? 'bold ' : '') + '15px Orbitron, sans-serif';
                    ctx.fillStyle = color;
                    ctx.fillText(label + ' pts', col4X + colW / 2, colY + 90 + idx * 28);
                }
            }
            ctx.textAlign = 'left';

            // ----- BOSS FIGHT column -----
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(26, 31, 44, 0.55)';
            ctx.strokeStyle = 'rgba(138, 43, 226, 0.4)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.roundRect(col5X, colY, colW, colH, 12);
            ctx.fill();
            ctx.stroke();

            ctx.textAlign = 'center';
            ctx.font = 'bold 20px Orbitron, sans-serif';
            ctx.fillStyle = '#f1f5f9';
            ctx.shadowBlur = 8;
            ctx.shadowColor = 'rgba(138, 43, 226, 0.5)';
            drawIconLabelCenter('crown', 'BOSS', col5X + colW / 2, colY + 32, 'bold 20px Orbitron, sans-serif', '#f1f5f9', '#ffd84a', 15);
            ctx.shadowBlur = 0;
            ctx.font = '12px Orbitron, sans-serif';
            ctx.fillStyle = '#9aa6b2';
            ctx.fillText('Best time (sec)', col5X + colW / 2, colY + 52);

            if (bossRecords.length === 0) {
                ctx.font = 'bold 14px Orbitron, sans-serif';
                ctx.fillStyle = '#ffe9b3';
                ctx.fillText('No records yet', col5X + colW / 2, colY + 110);
            } else {
                ctx.font = '15px Orbitron, sans-serif';
                for (let idx = 0; idx < Math.min(5, bossRecords.length); idx++) {
                    const record = bossRecords[idx];
                    let label, color;
                    let weight = 'normal';
                    if (idx === 0) { label = '1. ' + record; color = '#ffd700'; weight = 'bold'; }
                    else if (idx === 1) { label = '2. ' + record; color = '#c0c0c0'; weight = 'bold'; }
                    else if (idx === 2) { label = '3. ' + record; color = '#cd7f32'; weight = 'bold'; }
                    else { label = (idx + 1) + '. ' + record; color = '#ffe0a8'; }
                    ctx.font = (weight === 'bold' ? 'bold ' : '') + '15px Orbitron, sans-serif';
                    ctx.fillStyle = color;
                    ctx.fillText(label + 's', col5X + colW / 2, colY + 90 + idx * 28);
                }
            }
            ctx.textAlign = 'left';
            ctx.restore();

            // ----- Play-time card -----
            const cardX = 75;
            const cardY = 425;
            const cardW = canvas.width - cardX * 2;
            const cardH = 90;
            ctx.shadowBlur = 22;
            ctx.shadowColor = '#66e0ff';
            const cardGrad = ctx.createLinearGradient(cardX, cardY, cardX, cardY + cardH);
            cardGrad.addColorStop(0, 'rgba(20, 50, 80, 0.85)');
            cardGrad.addColorStop(1, 'rgba(10, 25, 50, 0.95)');
            ctx.fillStyle = cardGrad;
            ctx.beginPath();
            ctx.roundRect(cardX, cardY, cardW, cardH, 14);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(102, 224, 255, 0.55)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(cardX, cardY, cardW, cardH, 14);
            ctx.stroke();

            ctx.textAlign = 'left';
            ctx.font = 'bold 13px Orbitron, sans-serif';
            ctx.shadowColor = 'black';
            ctx.shadowBlur = 4;
            ctx.fillStyle = '#9cd3ff';
            drawIconLabel('clock', 'HOW MUCH TIME DID YOU PLAY', cardX + 22, cardY + 26, 'bold 13px Orbitron, sans-serif', '#9cd3ff', '#9cd3ff', 14);

            ctx.font = '11px Orbitron, sans-serif';
            ctx.shadowBlur = 3;
            ctx.fillStyle = '#7eaad6';
            ctx.fillText('Active gameplay across this account', cardX + 22, cardY + 46);

            // formatPlayTime(0) returns '0s' so a brand-new account with
            // no recorded play time still sees a populated card instead
            // of an empty placeholder.
            ctx.textAlign = 'right';
            ctx.font = 'bold 30px Orbitron, sans-serif';
            ctx.shadowColor = '#66e0ff';
            ctx.shadowBlur = 18;
            ctx.fillStyle = '#ffffff';
            ctx.fillText(formatPlayTime(playMs), cardX + cardW - 22, cardY + 60);
            ctx.shadowBlur = 0;

            ctx.font = '11px Orbitron, sans-serif';
            ctx.fillStyle = '#7eaad6';
            ctx.shadowBlur = 3;
            ctx.fillText('h   m   s', cardX + cardW - 22, cardY + 78);

            // ----- Back button (logged-in branch) -----
            drawRecordsBackButton(backX, backY, backW, backH);
            ctx.textAlign = 'left';
            ctx.shadowBlur = 0;
        }

        // ----- Shared back-button helper -----
        // Used by both the "logged-out" early-return branch and the
        // "logged-in records grid" branch of drawRecordsScreen so the
        // player always has a way out. Centralising the rect+text+hit
        // push here also keeps the same action string ('back') in one
        // place, which makes the action dispatcher in handleMenuAction
        // the single source of truth for "exit the records screen".
        function drawRecordsBackButton(x, y, w, h) {
            const hoverForAction = hoverFor('back');
            drawGlassButton(x, y, w, h, 10, '← BACK', '18px Orbitron, sans-serif', {
                hoverStrength: hoverForAction
            });
            menuButtons.push({
                rect: { x: x, y: y, w: w, h: h },
                action: 'back'
            });
        }

        // ----- Volume row (used as a sub-row under MUSIC / CLASSIC MUSIC) -----
        // Renders "VOLUME" label + −/+ step buttons + filled bar + % readout.
        // The bar is CONTINUOUS (one rect), not segmented, so it expands/
        // contracts smoothly with each step. Only the step buttons are
        // click targets — tapping the bar itself does nothing, matching
        // the surrounding tap-driven UI. The gold/orange palette ties
        // the stepper to the rest of the settings chrome (distinct from
        // the dark-glass BACK button).
        // With 11 volume levels (0.0 → 1.0 in 0.1 steps) and matching the
        // existing Orbitron typography, the row reads as a sibling of
        // drawSettingsRow rather than a foreign widget.
        function drawVolumeRow(x, y, w, h, level, decAction, incAction) {
            // "VOLUME" label on the left.
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.font = 'bold 11px Orbitron, sans-serif';
            ctx.shadowColor = 'black';
            ctx.shadowBlur = 3;
            ctx.fillStyle = '#88ddff';
            ctx.fillText('VOLUME', x + 6, y + h / 2);

            // − button (28×28 square)
            const btnSize = 28;
            const btnY = y + (h - btnSize) / 2;
            const decBtnX = x + 65;

            // Continuous bar (200×12)
            const barW = 200;
            const barH = 12;
            const barX = decBtnX + btnSize + 12;
            const barY = y + (h - barH) / 2;

            // + button (28×28 square)
            const incBtnX = barX + barW + 12;

            // Step button geometry is reused both for rendering and for
            // registering click targets, so wrap it in a tiny helper.
            function drawStep(cx, label) {
                ctx.shadowBlur = 6;
                ctx.shadowColor = 'rgba(255,170,80,0.55)';
                ctx.fillStyle = '#3a2a1a';
                ctx.beginPath();
                ctx.roundRect(cx, btnY, btnSize, btnSize, 8);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(255,170,80,0.7)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.roundRect(cx, btnY, btnSize, btnSize, 8);
                ctx.stroke();
                ctx.fillStyle = '#ffd84a';
                ctx.font = 'bold 18px Orbitron, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(label, cx + btnSize / 2, btnY + btnSize / 2);
            }

            drawStep(decBtnX, '−');
            drawStep(incBtnX, '+');

            // Bar background pill
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#0e1a2e';
            ctx.strokeStyle = 'rgba(74,170,255,0.45)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.roundRect(barX, barY, barW, barH, 6);
            ctx.fill();
            ctx.stroke();

            // Filled portion (clamped to [0, 1] for safety even though
            // the setter already rounded — defence in depth for cases
            // like a hand-tampered localStorage value).
            const safeLevel = Math.min(1, Math.max(0, level));
            const fillW = Math.round(barW * safeLevel);
            if (fillW > 0) {
                const fillGrad = ctx.createLinearGradient(barX, barY, barX + fillW, barY);
                fillGrad.addColorStop(0, '#ffaa55');
                fillGrad.addColorStop(1, '#ffd84a');
                ctx.fillStyle = fillGrad;
                ctx.beginPath();
                ctx.roundRect(barX, barY, fillW, barH, 6);
                ctx.fill();
            }

            // Numeric readout on the right
            ctx.font = 'bold 13px Orbitron, sans-serif';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'right';
            ctx.shadowColor = 'black';
            ctx.shadowBlur = 3;
            ctx.fillText(Math.round(safeLevel * 100) + '%', x + w - 6, y + h / 2);

            // Click targets for ±, only. Bar itself is NOT clickable
            // (tapping it would imply continuous drag, which is out of
            // scope for "standard buttons").
            menuButtons.push({
                rect: { x: decBtnX, y: btnY - settingsScrollY, w: btnSize, h: btnSize },
                action: decAction
            });
            menuButtons.push({
                rect: { x: incBtnX, y: btnY - settingsScrollY, w: btnSize, h: btnSize },
                action: incAction
            });

            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
            ctx.shadowBlur = 0;
        }

        function drawSettingsRow(x, y, w, h, iconType, title, description, value, action) {
            // Label (left) — a small vector icon sits left of the title
            ctx.textAlign = 'left';
            ctx.font = 'bold 22px Orbitron, sans-serif';
            ctx.shadowColor = 'black';
            ctx.shadowBlur = 6;
            ctx.fillStyle = '#ffffff';
            if (iconType) {
                const iconGap = 28;
                drawVectorIcon(iconType, x + 11, y + 22, '#ffffff', 1.0);
                ctx.fillText(title, x + iconGap, y + 30);
            } else {
                ctx.fillText(title, x, y + 30);
            }

            // Description (left, smaller)
            ctx.font = '12px Orbitron, sans-serif';
            ctx.fillStyle = '#8cf';
            ctx.shadowBlur = 3;
            ctx.fillText(description, x, y + 52);

            // Toggle pill (right)
            const pillW = 96;
            const pillH = 44;
            const pillX = x + w - pillW;
            const pillY = y + (h - pillH) / 2;

            // Pill background
            ctx.shadowBlur = 10;
            ctx.shadowColor = value ? 'rgba(0, 200, 100, 0.6)' : 'rgba(0, 0, 0, 0.5)';
            ctx.fillStyle = value ? '#1a4a2a' : '#2a2a3a';
            ctx.beginPath();
            ctx.roundRect(pillX, pillY, pillW, pillH, 22);
            ctx.fill();

            // ON / OFF label
            ctx.shadowBlur = 0;
            ctx.fillStyle = value ? '#aaffaa' : '#888';
            ctx.font = 'bold 16px Orbitron, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(value ? 'ON' : 'OFF', pillX + pillW / 2, pillY + 28);

            // Knob (decorative, positioned left or right)
            ctx.shadowBlur = 8;
            ctx.shadowColor = value ? '#aaffaa' : '#cccccc';
            ctx.fillStyle = value ? '#ddffdd' : '#dddddd';
            ctx.beginPath();
            ctx.arc(value ? pillX + pillW - 22 : pillX + 22, pillY + pillH / 2, 13, 0, Math.PI * 2);
            ctx.fill();

            // The whole pill is the click target
            menuButtons.push({
                rect: { x: pillX, y: pillY - settingsScrollY, w: pillW, h: pillH },
                action: action
            });

            ctx.textAlign = 'center';
            ctx.shadowBlur = 0;
        }

        // ===== 6.12 Settings screen =====
        function drawSettingsScreen() {
            drawBackground();
            updateButtonHover();  // Phase-2B

            // Reset menuButtons at the start so stale entries from the
            // previous screen (MENU, MISSIONS, RECORDS, PAUSED, GAMEOVER...)
            // cannot intercept clicks meant for the toggle pills / steppers
            // / BACK button. Without this, stale entries from the previous
            // screen could overlap a Settings control and fire the wrong
            // action on the first click.
            menuButtons = [];

            ctx.textAlign = 'center';

            // Title moved up (100 → 70) so the panel below has room
            // for the newly-added SURVIVAL MUSIC section. The matching
            // subtitle follows; see the panel-sizing block below for
            // the full layout math.
            ctx.font = 'bold 44px Orbitron, sans-serif';
            ctx.shadowColor = 'rgba(138, 43, 226, 0.6)';
            ctx.shadowBlur = 20;
            // Phase-2A title text glow
            ctx.fillStyle = '#f1f5f9';
            drawIconLabelCenter('settings', 'SETTINGS', canvas.width / 2, 70, 'bold 44px Orbitron, sans-serif', '#f1f5f9', '#f1f5f9', 24);

            // Subtitle
            ctx.shadowBlur = 0;
            ctx.font = '15px Orbitron, sans-serif';
            ctx.fillStyle = '#9aa6b2';
            ctx.fillText('Customize your settings', canvas.width / 2, 98);

            // Outer panel — sized for 4 toggle rows + 3 volume sub-rows.
            // Each music track (menu / classic / survival) owns its own
            // toggle + +/− stepper directly underneath; the SFX row
            // stays toggle-only since there is no SFX BGM track.
            //
            // Vertical layout (offsets inside the panel, top edge = 0):
            //   * MUSIC toggle         +15  h=56  (sub gap to Menu vol:   5)
            //   * Menu volume          +76  h=36  (section gap to SFX:   15)
            //   * SFX toggle          +127  h=56  (section gap to CLASSIC: 15)
            //   * CLASSIC MUSIC       +198  h=56  (sub gap to Classic vol: 5)
            //   * Classic volume      +259  h=36  (section gap to SURVIVAL: 15)
            //   * SURVIVAL MUSIC      +310  h=56  (sub gap to Survival vol: 5)
            //   * Survival volume     +371  h=36
            //   + 22 px bottom padding  → panelH = 429
            // Toggle row height shrunk 72 → 56 to keep the panel bottom
            // (panelY 100 + 429 = 529) clear of the BACK button anchored
            // at canvas.height - 50 (= 550), leaving a 21 px gap.
            const panelW = 480;
            // Trimmed back 497 → 449 (Mar 2026 follow-up). TOP reason: the
            // previous 497 pushed the panel's bottom edge to y=588,
            // overlapping the BACK button rendered at canvas.height-50
            // (=550, spanning 550..595) and partly covering the new
            // toggle's ON/OFF pill. 449 lets the panel stop at y=549,
            // giving a 1 px clearance to the BACK button. The new
            // GAME CONTROLS section + Free-Movement toggle now live
            // in the SCROLLED region of the panel: visible by default
            // when the user scrolls all the way down (scrollY = ~61).
            const panelH = 449;
            const panelX = canvas.width / 2 - panelW / 2;
            const panelY = 100;

            // Clamp scrollY each frame BEFORE drawing so a stale value
            // from a previous taller-content build never pushes rows
            // off the top of the panel. scrollY is in panel-local px.
            const scrollRange = Math.max(0, SETTINGS_CONTENT_H - panelH);
            if (settingsScrollY < 0) settingsScrollY = 0;
            if (settingsScrollY > scrollRange) settingsScrollY = scrollRange;

            ctx.shadowBlur = 25;
            ctx.shadowColor = 'rgba(138, 43, 226, 0.6)';
            ctx.fillStyle = 'rgba(26, 31, 44, 0.80)';
            ctx.beginPath();
            ctx.roundRect(panelX, panelY, panelW, panelH, 16);
            ctx.fill();
            ctx.shadowBlur = 0;
            // Phase-2A glassmorphism settings panel
            ctx.strokeStyle = 'rgba(138, 43, 226, 0.4)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.roundRect(panelX, panelY, panelW, panelH, 16);
            ctx.stroke();

            // 7 audio sections + 1 new GAME CONTROLS section inside the
            // panel (positioned at panelY + 425 sub-header, panelY + 440
            // toggle). With SETTINGS_CONTENT_H = 510 the content is
            // taller than panelH = 449, so we CLIP the panel rect AND
            // translate up by scrollY before drawing the rows that
            // follow. The per-account note is drawn BEFORE the clip so
            // it never scrolls off-screen at the top.
            ctx.save();
            // Per-account note (always visible at the very top of the
            // panel) — see comment above on why it sits inside now.
            ctx.font = '11px Orbitron, sans-serif';
            ctx.textAlign = 'left';
            ctx.fillStyle = currentUser
                ? 'rgba(73, 215, 200, 0.85)'
                : 'rgba(255, 255, 255, 0.5)';
            ctx.fillText(
                currentUser
                    ? '✓ Saved for ' + currentUser
                    : 'Settings saved locally (no account)',
                panelX + 18, panelY + 14
            );
            ctx.restore();

            ctx.save();
            // Clip to the panel INNER rect so a row that overflows the
            // bottom is hidden (instead of leaking over the BACK button).
            // We use a plain rect — roundRect would clip along the curve
            // which our quad rows can't follow anyway.
            ctx.beginPath();
            ctx.rect(panelX, panelY, panelW, panelH);
            ctx.clip();
            // Scroll content up by settingsScrollY.  All row draws below
            // share the same translate, but keyboard + mouse hit-tests
            // (via menuButtons.push) use un-translated coords (which is
            // what we want — the toggle hit-rect matches the visible row
            // after the translate).
            ctx.translate(0, -settingsScrollY);

            const padX = 30;
            const innerW = panelW - padX * 2;
            const rowX = panelX + padX;

            drawSettingsRow(rowX, panelY + 15, innerW, 56,
                'note', 'MUSIC',
                'Background song in the main menu',
                settings.music, 'toggleMusic');

            drawVolumeRow(rowX, panelY + 76, innerW, 36,
                settings.menuVolume, 'menuVolDown', 'menuVolUp');

            drawSettingsRow(rowX, panelY + 127, innerW, 56,
                'speaker', 'SFX',
                'All other sounds during gameplay',
                settings.sfx, 'toggleSfx');

            drawSettingsRow(rowX, panelY + 198, innerW, 56,
                'star', 'CLASSIC MUSIC',
                'Plays during Classic Mode runs',
                settings.classicMusic, 'toggleClassicMusic');

            drawVolumeRow(rowX, panelY + 259, innerW, 36,
                settings.classicVolume, 'classicVolDown', 'classicVolUp');

            drawSettingsRow(rowX, panelY + 310, innerW, 56,
                'skull', 'SURVIVAL MUSIC',
                'Plays during Survival Mode runs',
                settings.survivalMusic, 'toggleSurvivalMusic');

            drawVolumeRow(rowX, panelY + 371, innerW, 36,
                settings.survivalVolume, 'survivalVolDown', 'survivalVolUp');

            // ----- GAME CONTROLS section (closes with ctx.restore below) -
            // Visually separate from the SOUNDS controls above so the new
            // gameplay-affecting toggle is clearly its own category.
            ctx.save();
            ctx.fillStyle = 'rgba(73, 215, 200, 0.9)';
            ctx.shadowColor = 'rgba(73, 215, 200, 0.6)';
            ctx.shadowBlur = 6;
            ctx.font = 'bold 14px Orbitron, sans-serif';
            ctx.textAlign = 'left';
            drawIconLabel('gamepad', 'GAME CONTROLS', rowX, panelY + 425, 'bold 14px Orbitron, sans-serif', 'rgba(73, 215, 200, 0.9)', '#49d7c8', 14);
            ctx.restore();

            drawSettingsRow(rowX, panelY + 440, innerW, 56,
                'mouse', 'FREE MOVEMENT (Survival)',
                'Ship follows the cursor exactly — no smoothing, full screen.',
                settings.survivalFreeMovement, 'toggleSurvivalFreeMovement');

            ctx.restore();  // End of scroll-clip + translate group

            // ----- Side scroll bar (right edge of the panel) -------------
            // Drawn AFTER the scroll-clip ctx.restore so the thumb sits
            // on top of the clipped content rather than being scrolled
            // with it. Only meaningful when the logical content height
            // (SETTINGS_CONTENT_H = 510) is taller than the visible
            // panelH (449); when there is no overflow the thumb fills
            // the entire track.
            const sbTrackX = panelX + panelW - 12;
            const sbTrackY = panelY + 12;
            const sbTrackH = panelH - 24;
            const sbThumbH = Math.max(
                28,
                sbTrackH * (panelH / SETTINGS_CONTENT_H)
            );
            const sbThumbY = sbTrackY
                + (scrollRange > 0
                    ? (sbTrackH - sbThumbH) * (settingsScrollY / scrollRange)
                    : 0);

            // Subtle track — a narrow vertical strip on the right edge
            // of the panel, low-opacity white so it blends with the
            // dark teal panel glow rather than competing with the rows.
            ctx.fillStyle = 'rgba(255, 255, 255, 0.10)';
            ctx.fillRect(sbTrackX, sbTrackY, 4, sbTrackH);

            // Thumb — teal pill in the same accent as the GAME
            // CONTROLS section header so the scrollbar reads as part
            // of the panel chrome, not foreign UI. Glows brighter
            // while the user is actively dragging it; in this MVP
            // we DO NOT implement drag-from-thumb (wheel scrolling
            // is the only scroll input), so the brighter state is
            // reserved as a hook for future keyboard-scroll arrows.
            ctx.save();
            const thumbActive = isSettingsScrollDrag;
            ctx.shadowColor = thumbActive
                ? 'rgba(73, 215, 200, 0.85)'
                : 'rgba(73, 215, 200, 0.45)';
            ctx.shadowBlur = thumbActive ? 10 : 6;
            ctx.fillStyle = thumbActive
                ? 'rgba(73, 215, 200, 1.0)'
                : 'rgba(73, 215, 200, 0.7)';
            ctx.beginPath();
            ctx.roundRect(sbTrackX - 2, sbThumbY, 8, sbThumbH, 4);
            ctx.fill();
            ctx.restore();

            // ----- "Scrolled away from top" hint -------------------------
            // The per-account note lives inside the wrap (so it scrolls
            // with the content), which means once the user scrolls down
            // the original "Saved for ..." line disappears above the
            // panel edge. Re-print a SHORTER version next to the thumb
            // tip when scrollY > 4 so they still get visual confirmation
            // that their settings persist for this account.
            if (settingsScrollY > 4 && currentUser) {
                ctx.save();
                ctx.font = '10px Orbitron, sans-serif';
                ctx.shadowColor = 'rgba(73, 215, 200, 0.7)';
                ctx.shadowBlur = 4;
                ctx.fillStyle = 'rgba(73, 215, 200, 0.95)';
                ctx.textAlign = 'right';
                ctx.fillText('\u2713 Saved', panelX + panelW - 22, sbThumbY - 4);
                ctx.restore();
            }

            // BACK button — sits below the now-taller panel (5 rows
            // total) and below the per-account footer line above it.
            // Restyled to match the MISSIONS screen BACK button (dark
            // glass fill + blue-violet border + platinum label) and the
            // label is now truly centred horizontally — the old version
            // offset the text 50px left of the button centre, which made
            // it look crooked.
            const btnW = 180;
            const btnH = 45;
            const btnX = canvas.width / 2 - btnW / 2;
            const btnY = canvas.height - 50;

            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(26, 31, 44, 0.80)';
            ctx.strokeStyle = 'rgba(138, 43, 226, 0.5)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.roundRect(btnX, btnY, btnW, btnH, 14);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#f1f5f9';
            ctx.font = '18px Orbitron, sans-serif';
            // Draw the label with textBaseline='middle' so it sits
            // vertically centred inside the 45-px button regardless
            // of Orbitron's (slightly taller than average) ascent/
            // descent — the previous btnY + 30 trick left the cap-top
            // peeking above the border, so the button visibly "spilled"
            // its text on the upper edge.
            ctx.textBaseline = 'middle';
            ctx.fillText('\u2190 BACK', canvas.width / 2, btnY + btnH / 2);
            ctx.textBaseline = 'alphabetic';   // restore default for later code

            // Preserve the pill hit-rects that drawSettingsRow() pushed
            // earlier in this call, then add the BACK button rect.
            menuButtons.push({ rect: { x: btnX, y: btnY, w: btnW, h: btnH }, action: 'settingsBack' });

            ctx.textAlign = 'left';
            ctx.shadowBlur = 0;
        }

        // Shared glassmorphism mode-card renderer used by BOTH the
        // Battle difficulty picker and the CO-OP picker. `locked`
        // renders the card at ~45% opacity with a status emoji badge
        // drawn BELOW the description text (kept at full alpha so it
        // stays legible over the greyed-out card).
        // ===== 6.13 Difficulty / CO-OP picker cards =====
        function drawDiffCard(cx, cy, w, h, title, descLines, accent, locked, badge, titleIcon) {
            if (locked) ctx.globalAlpha = 0.45;
            // Card fill
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(26, 31, 44, 0.70)';
            ctx.strokeStyle = accent.border;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.roundRect(cx, cy, w, h, 12);
            ctx.fill();
            ctx.stroke();

            // Top accent line
            ctx.strokeStyle = accent.border;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(cx + 20, cy + 2);
            ctx.lineTo(cx + w - 20, cy + 2);
            ctx.stroke();
            ctx.lineWidth = 1;

            // Title — optional vector icon sits left of the label. When
            // the icon + label group would overflow the card box (e.g.
            // 'BOSS FIGHT' on the narrow Battle picker), a two-word title
            // wraps onto two lines so the text stays inside its box,
            // centred on the card.
            ctx.shadowBlur = 0;
            ctx.font = 'bold 28px Orbitron, sans-serif';
            ctx.fillStyle = accent.text;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const iconW = titleIcon ? 24 : 0;
            const gap = titleIcon ? 8 : 0;
            const titleW = ctx.measureText(title).width;
            const maxTitleW = w - 24;
            if (titleW + gap + iconW <= maxTitleW) {
                if (titleIcon) {
                    const groupW = titleW + gap + iconW;
                    const startX = cx + w / 2 - groupW / 2;
                    drawVectorIcon(titleIcon, startX + iconW / 2, cy + 50, accent.text, 1.0);
                    ctx.fillText(title, startX + iconW + gap, cy + 50);
                } else {
                    ctx.fillText(title, cx + w / 2, cy + 50);
                }
            } else {
                // Wrap a two-word title onto two lines ('BOSS' / 'FIGHT').
                const parts = title.split(' ');
                const line1 = parts[0] || title;
                const line2 = parts.slice(1).join(' ') || '';
                ctx.font = 'bold 24px Orbitron, sans-serif';
                const lw = Math.max(ctx.measureText(line1).width,
                    line2 ? ctx.measureText(line2).width : 0);
                const groupW = lw + gap + iconW;
                const startX = cx + w / 2 - groupW / 2;
                if (titleIcon) drawVectorIcon(titleIcon, startX + iconW / 2, cy + 50, accent.text, 1.0);
                ctx.fillText(line1, startX + iconW + gap, line2 ? cy + 50 - 12 : cy + 50);
                if (line2) ctx.fillText(line2, startX + iconW + gap, cy + 50 + 12);
            }

            // Description
            ctx.font = '12px Arial, sans-serif';
            ctx.fillStyle = '#9aa6b2';
            ctx.textBaseline = 'top';
            let dy = cy + 90;
            for (const line of descLines) {
                ctx.fillText(line, cx + w / 2, dy);
                dy += 18;
            }

            // Lock / status badge — drawn at full alpha so it stays
            // legible even over the greyed-out card, and placed BELOW
            // the description text for a cleaner look. Passing null as the
            // badge suppresses it (the CO-OP Separate Devices card
            // shows no logo on purpose).
            if (locked && badge !== null) {
                ctx.globalAlpha = 1;
                ctx.font = '32px Arial, sans-serif';
                ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
                drawVectorIcon(badge || 'lock', cx + w / 2, dy + 10, 'rgba(255,255,255,0.95)', 1.4);
            }
            ctx.globalAlpha = 1;
        }

        // ===== 6.14 Main draw dispatcher =====
        function draw() {
            updatePauseButton();
            // Battle mode ships a mobile FIRE pad positioned outside the
            // canvas. The pad's visibility follows the current run-state,
            // so calling updateFireButton() at the top of draw() each
            // frame keeps it correctly shown / hidden during state
            // transitions (PLAYING → PAUSED → MENU, etc).
            updateFireButton();
            switch (gameState) {
                case GAME_STATES.MENU:
                    drawMenu();
                    break;
                case GAME_STATES.ACCOUNT:
                    drawAccountScreen();
                    break;
                case GAME_STATES.SETTINGS:
                    drawSettingsScreen();
                    break;
                case GAME_STATES.RECORDS:
                    drawRecordsScreen();
                    break;
                case GAME_STATES.MISSIONS:
                    drawMissionsScreen();
                    break;
                case GAME_STATES.SHOP:
                    drawShopScreen();
                    break;
                case GAME_STATES.BOSS_UNLOCK:
                    drawBossObjectivesScreen();
                    break;
                case GAME_STATES.DIFFICULTY: {
                    // =================================================
                    // Phase-2D: Glassmorphism Difficulty Picker
                    // =================================================
                    menuButtons = [];
                    updateButtonHover();

                    // --- Dark backdrop overlay (hides menu) ---
                    ctx.fillStyle = 'rgba(11, 14, 20, 0.85)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    // --- Header with blue-violet glow ---
                    ctx.textAlign = 'center';
                    ctx.shadowBlur = 0;
                    ctx.font = 'bold 40px Orbitron, sans-serif';
                    ctx.fillStyle = '#f1f5f9';
                    ctx.fillText('CHOOSE BATTLE MODE', canvas.width / 2, 100);

                    // --- Mode accent colours ---
                    const ACCENT_EASY = { border: 'rgba(46, 204, 113, 0.6)', text: '#2ecc71' };
                    const ACCENT_NORMAL = { border: 'rgba(255, 191, 36, 0.6)', text: '#ffbf24' };
                    const ACCENT_BOSS = { border: 'rgba(255, 191, 36, 0.75)', text: '#ffd84a' };

                    // --- Glassmorphism card panel ---
                    const px = 80;                    // panel left edge
                    const pw = canvas.width - px * 2; // panel width (640)
                    const py = 140;                   // panel top
                    const ph = 330;                   // panel height
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'rgba(26, 31, 44, 0.60)';
                    ctx.strokeStyle = 'rgba(138, 43, 226, 0.30)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.roundRect(px, py, pw, ph, 16);
                    ctx.fill();
                    ctx.stroke();

                    // --- Three cards side-by-side ---
                    const cardPad = 30;
                    const cardW = (pw - cardPad * 4) / 3;
                    const cardH = 210;
                    const cardsY = py + 35;
                    const easyX = px + cardPad;
                    const normalX = px + cardPad * 2 + cardW;
                    const bossX = px + cardPad * 3 + cardW * 2;

                    drawDiffCard(easyX, cardsY, cardW, cardH, 'EASY', ['Original enemy cadence.', 'Best place to start.', 'Relaxed combat flow.'], ACCENT_EASY);
                    drawDiffCard(normalX, cardsY, cardW, cardH, 'NORMAL', ['Enemies 2× faster.', 'Rare fast meteorites', 'also appear.'], ACCENT_NORMAL);

                    // BOSS FIGHT replaces the old HARD slot. Locked until
                    // the three record achievements are met; greyed out
                    // with a lock icon until then (see isBossFightUnlocked).
                    const bossUnlocked = isBossFightUnlocked();
                    drawDiffCard(bossX, cardsY, cardW, cardH, 'BOSS FIGHT', bossUnlocked
                        ? ['Defeat the alien king!', 'Fast missiles + meteorites', 'beam + healing stars.']
                        : ['UNLOCK REQUIREMENTS:', '1000 stars · 60 s', '100 kills'],
                        ACCENT_BOSS, !bossUnlocked, 'lock', 'crown');

                    // --- Click targets ---
                    menuButtons.push({ rect: { x: easyX, y: cardsY, w: cardW, h: cardH }, action: 'pickDifficulty_easy' });
                    menuButtons.push({ rect: { x: normalX, y: cardsY, w: cardW, h: cardH }, action: 'pickDifficulty_normal' });
                    menuButtons.push({ rect: { x: bossX, y: cardsY, w: cardW, h: cardH }, action: 'pickBossFight' });

                    // --- BACK button ---
                    const backW = 200;
                    const backH = 48;
                    const backX = canvas.width / 2 - backW / 2;
                    const backY = py + ph - backH - 20;
                    drawGlassButton(backX, backY, backW, backH, 10, '← BACK', 'bold 18px Orbitron, sans-serif', {
                        hoverStrength: hoverFor('difficultyBack')
                    });
                    menuButtons.push({ rect: { x: backX, y: backY, w: backW, h: backH }, action: 'difficultyBack' });

                    ctx.shadowBlur = 0;
                    ctx.textAlign = 'start';
                    ctx.textBaseline = 'alphabetic';
                    break;
                }
                case GAME_STATES.COOP_SELECT: {
                    // =================================================
                    // CO-OP Picker — same glassmorphism style as the
                    // Battle difficulty screen. Two cards:
                    //   * SAME DEVICE      — classic two-player CO-OP
                    //   * SEPARATE DEVICES — coming soon (locked card)
                    // =================================================
                    menuButtons = [];
                    updateButtonHover();

                    // --- Dark backdrop overlay (hides menu) ---
                    ctx.fillStyle = 'rgba(11, 14, 20, 0.85)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    // --- Header with blue-violet glow ---
                    ctx.textAlign = 'center';
                    ctx.shadowBlur = 0;
                    ctx.font = 'bold 40px Orbitron, sans-serif';
                    ctx.fillStyle = '#f1f5f9';
                    ctx.fillText('CHOOSE CO-OP MODE', canvas.width / 2, 100);

                    // --- Coming-soon hint toast (Separate Devices) ---
                    if (coopSoonHintUntil > Date.now()) {
                        ctx.shadowBlur = 14;
                        ctx.shadowColor = '#49d7c8';
                        ctx.font = 'bold 15px Orbitron, sans-serif';
                        ctx.fillStyle = '#49d7c8';
                        drawIconLabelCenter('antenna', 'Separate-device play is coming soon!', canvas.width / 2, 128, 'bold 15px Orbitron, sans-serif', '#49d7c8', '#49d7c8', 14);
                        ctx.shadowBlur = 0;
                    }

                    // --- Card accent colours ---
                    const ACCENT_SHARED = { border: 'rgba(73, 215, 200, 0.6)', text: '#49d7c8' };
                    const ACCENT_ONLINE = { border: 'rgba(255, 191, 36, 0.75)', text: '#ffd84a' };

                    // --- Glassmorphism card panel ---
                    const px = 80;
                    const pw = canvas.width - px * 2;
                    const py = 140;
                    const ph = 330;
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'rgba(26, 31, 44, 0.60)';
                    ctx.strokeStyle = 'rgba(138, 43, 226, 0.30)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.roundRect(px, py, pw, ph, 16);
                    ctx.fill();
                    ctx.stroke();

                    // --- Two cards side-by-side ---
                    const cardPad = 30;
                    const cardW = (pw - cardPad * 3) / 2;
                    const cardH = 210;
                    const cardsY = py + 35;
                    const sharedX = px + cardPad;
                    const onlineX = px + cardPad * 2 + cardW;

                    drawDiffCard(sharedX, cardsY, cardW, cardH, 'SAME DEVICE',
                        ['Blue: mouse · Green: arrows.', 'One screen, two players,', 'one shared health pool.'],
                        ACCENT_SHARED, false, null, null);
                    drawDiffCard(onlineX, cardsY, cardW, cardH, 'SEPARATE DEVICES',
                        ['Not available yet.', 'Two-player online play', 'is on the roadmap.'],
                        ACCENT_ONLINE, true, null, null);

                    // --- Click targets ---
                    menuButtons.push({ rect: { x: sharedX, y: cardsY, w: cardW, h: cardH }, action: 'pickCoopShared' });
                    menuButtons.push({ rect: { x: onlineX, y: cardsY, w: cardW, h: cardH }, action: 'pickCoopOnline' });

                    // --- BACK button ---
                    const backW = 200;
                    const backH = 48;
                    const backX = canvas.width / 2 - backW / 2;
                    const backY = py + ph - backH - 20;
                    drawGlassButton(backX, backY, backW, backH, 10, '← BACK', 'bold 18px Orbitron, sans-serif', {
                        hoverStrength: hoverFor('coopSelectBack')
                    });
                    menuButtons.push({ rect: { x: backX, y: backY, w: backW, h: backH }, action: 'coopSelectBack' });

                    ctx.shadowBlur = 0;
                    ctx.textAlign = 'start';
                    ctx.textBaseline = 'alphabetic';
                    break;
                }
                case GAME_STATES.PLAYING:
                    drawBackground();
                    if (gameMode === GAME_MODES.SURVIVAL) {
                        drawMeteorites();
                        drawSurvivalOverlay();   // red filter on top of bg + meteorites
                        drawMonster();          // cyclops face + beam drawn AFTER vignette so the dark green reads true
                        drawEnemies();          // red Battle ships once the run passes 60 s
                        drawEnemyBullets();     // and the red bolts they fire
                    } else if (gameMode === GAME_MODES.BATTLE) {
                        // Battle mode owns its own scene: red enemy
                        // ships with HP bars, blue ray bullets, red
                        // ray bullets. Shared drawShip() still draws
                        // the player vessel underneath so dodging is
                        // visible. Ordering is bottom → top.
                        drawEnemies();
                        drawMeteorites();        // Normal/Hard Battle spawns rare meteorites — must render them or they'd be invisible damage sources
                        drawPlayerBullets();
                        drawEnemyBullets();
                    } else if (gameMode === GAME_MODES.BOSS) {
                        // BOSS FIGHT scene: crowned king + Battle enemies
                        // + meteorites + healing stars + both ray pools.
                        // (The Survival monster was removed from boss
                        // fights — meteorites + the king's missiles are
                        // the hazards here.)
                        drawBoss();
                        drawEnemies();
                        drawMeteorites();
                        drawHealStars();
                        drawPlayerBullets();
                        drawEnemyBullets();
                    } else if (gameMode === GAME_MODES.COOP) {
                        // CO-OP scene: BOTH stars (Blue) and enemies
                        // (Green) live on-screen together like the
                        // player spec asks. Green beams render BEFORE
                        // the enemy so the explosion spark reads on top
                        // of the green beam glow. Blue ship draws
                        // BEFORE Green so Green's HP reads as a
                        // foreground ship (closer to the action zone).
                        drawEnemies();
                        drawGreenBeams();
                        drawFallingStars();
                        drawEnemyBullets();
                    } else {
                        drawFallingStars();
                        // STARDANCE rainbow filter + banner (Classic feast)
                        if (starDanceFramesLeft > 0) {
                            drawStarDanceOverlay();
                            if (starDanceFlashFramesLeft > 0) drawStarDanceBanner();
                        }
                    }
                    drawShip();
                    if (gameMode === GAME_MODES.COOP) drawGreenShip();
                    drawGameUI();
                    if (gameOver) drawGameOver();
                    break;
                case GAME_STATES.PAUSED:
                    drawBackground();
                    if (gameMode === GAME_STATES.SURVIVAL || gameMode === GAME_MODES.SURVIVAL) {
                        drawMeteorites();
                        drawSurvivalOverlay();
                        drawMonster();          // keep the frozen frame identical to PLAYING
                        drawEnemies();
                        drawEnemyBullets();
                    } else if (gameMode === GAME_MODES.BOSS) {
                        // BOSS FIGHT paused frame mirrors the PLAYING scene
                        // so the frozen snapshot is byte-identical.
                        drawBoss();
                        drawEnemies();
                        drawMeteorites();
                        drawHealStars();
                        drawPlayerBullets();
                        drawEnemyBullets();
                    } else if (gameMode === GAME_MODES.COOP) {
                        // CO-OP paused frame: show both ships + the
                        // frozen enemy / star field so the player can
                        // read where everything was when they hit P.
                        // Falling stars + enemies + beams + enemy
                        // bullets render in the same order as the
                        // PLAYING state above so the paused frame is
                        // byte-identical to a single PLAYING frame
                        // snapshot.
                        drawEnemies();
                        drawGreenBeams();
                        drawFallingStars();
                        drawEnemyBullets();
                    } else {
                        drawFallingStars();
                        // STARDANCE rainbow filter + banner (Classic feast)
                        if (starDanceFramesLeft > 0) {
                            drawStarDanceOverlay();
                            if (starDanceFlashFramesLeft > 0) drawStarDanceBanner();
                        }
                    }
                    drawShip();
                    if (gameMode === GAME_MODES.COOP) drawGreenShip();
                    drawGameUI();
                    drawPauseScreen();
                    break;
            }
        }

        /* ============================================================
           7. HANDLE MENU ACTIONS
        ============================================================ */
        // ===== 7.1 Action dispatch =====
        function handleMenuAction(action) {
            switch (action) {
                case 'play':
                    if (!currentUser) {
                        gameState = GAME_STATES.ACCOUNT;
                        accountInput = '';
                        showMobileInput(true);
                    } else {
                        startGame(GAME_MODES.CLASSIC);
                    }
                    break;
                case 'survival':
                    if (!currentUser) {
                        gameState = GAME_STATES.ACCOUNT;
                        accountInput = '';
                        showMobileInput(true);
                    } else {
                        startGame(GAME_MODES.SURVIVAL);
                    }
                    break;
                case 'playBattle':
                    if (!currentUser) {
                        gameState = GAME_STATES.ACCOUNT;
                        accountInput = '';
                        showMobileInput(true);
                    } else {
                        // Route through the difficulty picker so the
                        // player chooses Easy / Normal / Hard before
                        // the BGM kicks in. Resetting battleDifficulty
                        // each visit means a player isn't silently
                        // dropped into Normal or Hard after opting in
                        // once — the next menu-tap always starts fresh.
                        battleDifficulty = 'easy';
                        gameState = GAME_STATES.DIFFICULTY;
                    }
                    break;
                case 'pickDifficulty_easy':
                    battleDifficulty = 'easy';
                    startGame(GAME_MODES.BATTLE);
                    break;
                case 'pickDifficulty_normal':
                    battleDifficulty = 'normal';
                    startGame(GAME_MODES.BATTLE);
                    break;
                case 'pickBossFight':
                    // BOSS FIGHT only starts when the three record
                    // achievements are met. A locked tap redirects the
                    // player to the BOSS OBJECTIVES page in the MISSION
                    // section so they can see exactly what is still missing.
                    if (isBossFightUnlocked()) {
                        startGame(GAME_MODES.BOSS);
                    } else {
                        playClickSound();
                        gameState = GAME_STATES.BOSS_UNLOCK;
                    }
                    break;
                case 'playCoop':
                    // CO-OP now routes through its own picker (same
                    // style as the Battle difficulty screen) so the
                    // player chooses Same Device or Separate Devices
                    // before the run starts.
                    if (!currentUser) {
                        gameState = GAME_STATES.ACCOUNT;
                        accountInput = '';
                        showMobileInput(true);
                    } else {
                        gameState = GAME_STATES.COOP_SELECT;
                    }
                    break;
                case 'pickCoopShared':
                    // Classic same-device CO-OP: one keyboard, two
                    // players (Blue = mouse, Green = arrows).
                    startGame(GAME_MODES.COOP);
                    break;
                case 'pickCoopOnline':
                    // Separate-device play isn't implemented yet — flash
                    // the coming-soon toast and stay on the picker.
                    coopSoonHintUntil = Date.now() + 3000;
                    break;
                case 'coopSelectBack':
                    // User changed their mind; drop back to the menu.
                    gameState = GAME_STATES.MENU;
                    break;
                case 'difficultyBack':
                    // User changed their mind; drop back to the main
                    // menu without touching battleDifficulty (which is
                    // already reset on the next menu-tap-to-battle).
                    gameState = GAME_STATES.MENU;
                    break;
                case 'account':
                    gameState = GAME_STATES.ACCOUNT;
                    accountInput = currentUser || '';
                    showMobileInput(true);
                    break;
                case 'missions':
                    if (!currentUser) {
                        gameState = GAME_STATES.ACCOUNT;
                        accountInput = '';
                        showMobileInput(true);
                    } else {
                        navigateToMissionsScreen();
                    }
                    break;
                case 'missionsBack':
                    navigateFromMissionsScreen();
                    break;
                case 'shop':
                    // The SKIN SHOP needs an account: stars are per-user,
                    // so a logged-out tap sends the player to the account
                    // screen first (same gate as Missions / Records).
                    if (!currentUser) {
                        gameState = GAME_STATES.ACCOUNT;
                        accountInput = '';
                        showMobileInput(true);
                    } else {
                        playClickSound();
                        gameState = GAME_STATES.SHOP;
                    }
                    break;
                case 'shopBack':
                    playClickSound();
                    // Drop any in-flight purchase celebration so it can't
                    // linger and replay stale confetti on the next visit.
                    shopCelebration = null;
                    gameState = GAME_STATES.MENU;
                    break;
                case 'claimStreak':
                    claimDailyStreak();
                    break;
                case 'claimSuperStreak':
                    claimSuperStreak();
                    break;
                case 'bossObjectives':
                case 'bossObjectivesMinus':
                    // Open the BOSS FIGHT unlock objectives page (the '→'
                    // arrow beside the first daily mission card). The
                    // 'bossObjectivesMinus' alias is kept for old saves.
                    playClickSound();
                    gameState = GAME_STATES.BOSS_UNLOCK;
                    break;
                case 'bossObjectivesBack':
                    // Back from the objectives page → Missions screen.
                    playClickSound();
                    gameState = GAME_STATES.MISSIONS;
                    break;
                case 'bossObjectivesPlay':
                    // Unlocked-banner CTA: jump straight into the fight.
                    startGame(GAME_MODES.BOSS);
                    break;
                case 'records':
                    if (!currentUser) {
                        gameState = GAME_STATES.ACCOUNT;
                        accountInput = '';
                        showMobileInput(true);
                    } else {
                        flushPlayTime();      // ensure displayed time is current
                        gameState = GAME_STATES.RECORDS;
                    }
                    break;
                case 'confirm':
                    if (accountInput.trim().length > 0) {
                        const newUser = accountInput.trim();
                        if (newUser.length > 12) {
                            alert('The name must be at most 12 characters!');
                            return;
                        }
                        // A new name different from currentUser resets the old account's records
                        if (newUser !== currentUser && currentUser) {
                            if (confirm(`Changing account from "${currentUser}" to "${newUser}".\nYour previous records will be reset. Continue?`)) {
                                // Remove the previous account's records
                                const allRecords = getAllRecords();
                                delete allRecords[currentUser];
                                delete allRecords[currentUser + '__survival'];
                                delete allRecords[currentUser + '__missions'];
                                delete allRecords[currentUser + '__playTime'];
                                delete allRecords[currentUser + '__battleNormal'];
                                delete allRecords[currentUser + '__boss'];
                                delete allRecords[currentUser + '__stars'];
                                delete allRecords[currentUser + '__shop'];
                                saveAllRecords(allRecords);
                                currentUser = newUser;
                                getUserRecords(currentUser);
                                saveLastUser(currentUser);
                                settings = loadSettings();
                                resetGame();
                                gameState = GAME_STATES.MENU;
                                accountInput = newUser; // keep the new name visible
                                showMobileInput(false);
                            }
                            // If the user cancels, stay on the account screen
                        } else {
                            currentUser = newUser;
                            getUserRecords(currentUser);
                            saveLastUser(currentUser);
                            settings = loadSettings();
                            resetGame();
                            gameState = GAME_STATES.MENU;
                            accountInput = newUser; // keep the name visible
                            showMobileInput(false);
                        }
                    } else {
                        alert('Please enter a name!');
                    }
                    break;
                case 'cancel':
                    gameState = GAME_STATES.MENU;
                    accountInput = '';
                    showMobileInput(false);
                    break;
                case 'back':
                    gameState = GAME_STATES.MENU;
                    showMobileInput(false);
                    break;
                case 'playAgain':
                    stopMenuMusic();
                    flushPlayTime();
                    resetGame();
                    gameState = GAME_STATES.PLAYING;
                    startPlayTimer();
                    break;
                case 'menu':
                    flushPlayTime();
                    resetGame();
                    gameState = GAME_STATES.MENU;
                    stopClassicMusic();   // Classic BGM off before menu song takes over
                    stopSurvivalMusic();  // Survival BGM off before menu song takes over
                    playMenuMusic();
                    break;
                case 'pauseResume':
                    togglePause();
                    break;
                case 'pauseSave':
                    // Same function as the S hotkey: quick save & review.
                    // quickSaveGame() saves the run (snapshot + records),
                    // ends it and shows the game-over review screen with
                    // the title swapped to "✓ SAVED".
                    quickSaveGame();
                    break;
                case 'pauseSettings':
                    gameStateBeforeSettings = GAME_STATES.PAUSED;
                    gameState = GAME_STATES.SETTINGS;
                    showMobileInput(false);
                    recordMissionEvent('visited_settings');
                    break;
                case 'pauseMenu':
                    flushPlayTime();
                    stopMenuMusic();
                    resetGame();
                    gameState = GAME_STATES.MENU;
                    stopClassicMusic();   // Classic BGM off before menu song takes over
                    stopSurvivalMusic();  // Survival BGM off before menu song takes over
                    playMenuMusic();
                    break;
                case 'settings':
                    gameStateBeforeSettings = GAME_STATES.MENU;
                    gameState = GAME_STATES.SETTINGS;
                    showMobileInput(false);
                    recordMissionEvent('visited_settings');
                    break;
                case 'toggleMusic':
                    settings.music = !settings.music;
                    saveSettings();
                    playMenuMusic();       // respects new settings.music value
                    playClickSound();
                    recordMissionEvent('toggled_setting');
                    break;
                case 'toggleClassicMusic':
                    settings.classicMusic = !settings.classicMusic;
                    saveSettings();
                    playClassicMusic();    // respects new settings.classicMusic value (silences or resumes the Classic BGM)
                    playClickSound();
                    recordMissionEvent('toggled_setting');
                    break;
                case 'toggleSfx':
                    settings.sfx = !settings.sfx;
                    saveSettings();
                    playClickSound();
                    recordMissionEvent('toggled_setting');
                    break;
                case 'menuVolDown':
                    if (settings.menuVolume > 0) {
                        setMenuVolume(settings.menuVolume - 0.1);
                        playMenuMusic();   // re-evaluate play/pause so a previously-paused song resumes when bumped back up
                        playClickSound();
                        recordMissionEvent('toggled_setting');
                    }
                    break;
                case 'menuVolUp':
                    if (settings.menuVolume < 1) {
                        setMenuVolume(settings.menuVolume + 0.1);
                        playMenuMusic();   // re-evaluate play/pause so a previously-paused song resumes when bumped back up
                        playClickSound();
                        recordMissionEvent('toggled_setting');
                    }
                    break;
                case 'classicVolDown':
                    if (settings.classicVolume > 0) {
                        setClassicVolume(settings.classicVolume - 0.1);
                        playClickSound();
                        recordMissionEvent('toggled_setting');
                    }
                    break;
                case 'classicVolUp':
                    if (settings.classicVolume < 1) {
                        setClassicVolume(settings.classicVolume + 0.1);
                        playClickSound();
                        recordMissionEvent('toggled_setting');
                    }
                    break;
                case 'toggleSurvivalMusic':
                    settings.survivalMusic = !settings.survivalMusic;
                    saveSettings();
                    playSurvivalMusic();   // respects new settings.survivalMusic value (silences or resumes the Survival BGM)
                    playClickSound();
                    recordMissionEvent('toggled_setting');
                    break;
                case 'toggleSurvivalFreeMovement':
                    // Flips the new GAME CONTROLS toggle: when ON, the
                    // Survival-mode ship tracks the cursor EXACTLY (no
                    // smoothing) and roams anywhere on canvas. No audio
                    // side-effect — this is purely a movement setting.
                    settings.survivalFreeMovement = !settings.survivalFreeMovement;
                    saveSettings();
                    playClickSound();
                    recordMissionEvent('toggled_setting');
                    break;
                case 'survivalVolDown':
                    if (settings.survivalVolume > 0) {
                        setSurvivalVolume(settings.survivalVolume - 0.1);
                        playClickSound();
                        recordMissionEvent('toggled_setting');
                    }
                    break;
                case 'survivalVolUp':
                    if (settings.survivalVolume < 1) {
                        setSurvivalVolume(settings.survivalVolume + 0.1);
                        playClickSound();
                        recordMissionEvent('toggled_setting');
                    }
                    break;
                case 'settingsBack':
                    if (gameStateBeforeSettings === GAME_STATES.PAUSED) {
                        gameState = GAME_STATES.PAUSED;
                    } else {
                        gameState = GAME_STATES.MENU;
                        showMobileInput(false);
                    }
                    gameStateBeforeSettings = GAME_STATES.MENU;
                    // Reset the Settings-panel scroll position so the
                    // user always re-enters the screen at the top and
                    // sees the SOUNDS controls without scrolling back
                    // up first; also clear any in-flight thumb-drag
                    // flag so a stuck drag doesn't keep modulating
                    // scrollY on subsequent visits.
                    settingsScrollY = 0;
                    isSettingsScrollDrag = false;
                    break;
                default:
                    // SKIN SHOP actions: 'shopBuy_<id>' buys + auto-equips a
                    // skin for SKIN_PRICE stars; 'shopEquip_<id>' switches
                    // to an already-owned skin.
                    if (action.indexOf('shopBuy_') === 0) {
                        const skinId = action.slice('shopBuy_'.length);
                        if (buySkin(skinId)) {
                            playRecordSound();
                            // Celebrate the new skin: confetti + banner.
                            const bought = SKINS.find(s => s.id === skinId);
                            if (bought) startShopCelebration(bought);
                        } else {
                            playClickSound();
                        }
                        break;
                    }
                    if (action.indexOf('shopEquip_') === 0) {
                        equipSkin(action.slice('shopEquip_'.length));
                        playClickSound();
                        break;
                    }
                    break;
            }
            menuButtons = [];
        }

        /* ============================================================
           8. INPUT HANDLERS, SAVE HELPERS AND DOM WIRING
        ============================================================ */
        // ===== 8.1 Mouse / touch clicks =====
        canvas.addEventListener('click', (event) => {
            const c = getGameCoords(event);
            for (const btn of menuButtons) {
                const r = btn.rect;
                if (c.x >= r.x && c.x <= r.x + r.w && c.y >= r.y && c.y <= r.y + r.h) {
                    handleMenuAction(btn.action);
                    break;
                }
            }
        });

        // ===== 8.2 Cursor tracking + menu hover =====
        canvas.addEventListener('mousemove', (event) => {
            const c = getGameCoords(event);
            // Mirror the latest cursor position into the module-level
            // mouseX/mouseY globals so update() can read them in any
            // gameState. This is shared with touch events because
            // getGameCoords() already handles touches/touch-changed.
            mouseX = c.x;
            mouseY = c.y;
            const wasHovering = blueCharacter.isHovering;
            if (gameState === GAME_STATES.MENU) {
                if (!rocketEmoji.isEscaping) {
                    const dx = c.x - rocketEmoji.x;
                    const dy = c.y - rocketEmoji.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < 50) {
                        rocketEmoji.isEscaping = true;
                        rocketEmoji.escapeTimer = 1200; // ~20 s at 60 FPS
                        const speed = 5 + Math.random() * 4;
                        const angle = Math.random() * Math.PI * 2;
                        rocketEmoji.vx = Math.cos(angle) * speed;
                        rocketEmoji.vy = Math.sin(angle) * speed;
                    }
                }
                const hoverNow = blueHoverHitTest(c.x, c.y);
                blueCharacter.isHovering = hoverNow;
                if (hoverNow && !wasHovering) {
                    pickNewBlueLine();
                }
            } else {
                blueCharacter.isHovering = false;
            }

            if (gameState === GAME_STATES.PLAYING) {
                player.targetX = c.x;
            }
        });

        // ----- Save-game state + helper functions -----
        // The pause-menu SAVE button and the S/s hotkey share ONE code
        // path: quickSaveGame() → saveCurrentRun(). Both save the run
        // and end it, showing the game-over review screen with the
        // title swapped to "✓ SAVED".

        // ----- Centered "Saved" overlay state -----
        // Time-bounded slot for the big centered ✓ Saved confirmation
        // armed by saveCurrentRun(). quickSaveGame() — the shared path
        // for BOTH the S/s hotkey and the pause-menu SAVE button —
        // immediately clears the timer (savedOverlayUntil = 0) because
        // the game-over review screen itself carries the "✓ SAVED"
        // title, so the toast is currently dormant by design. Drawn in
        // drawSavedOverlay(), called at the END of drawGameUI() and
        // drawPauseScreen(); it short-circuits when inactive.
        let savedOverlayUntil = 0;
        // True after a quick save (S hotkey) ends the run: drawGameOver
        // then swaps the "GAME OVER"-style title for "✓ SAVED" so the
        // player recognises the screen as a save confirmation. Reset in
        // resetGame() so the next run's overlay shows the normal title.
        let quickSaveEndedRun = false;

        // Render the centred ✓ Saved confirmation. Single source of
        // truth for the overlay's appearance so PLAYING and PAUSED
        // states always agree on font, colour, position, and fade-out
        // curve. ctx.save() / ctx.restore() wrap the draw so the rest
        // of the frame's ctx state (font, shadow, baseline, alpha)
        // isn't polluted by this overlay.
        // ===== 7.2 Save-run helpers =====
        function drawSavedOverlay() {
            const now = Date.now();
            if (now >= savedOverlayUntil) return;
            const remain = savedOverlayUntil - now;
            const alpha = remain > 500 ? 1 : (remain / 500);
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            // Light-green (#aaffaa) + matching green glow — same
            // palette family as the green Resume button / green
            // "success" cues elsewhere in the project — so the toast
            // reads as the "saved / safe / continue" family.
            ctx.shadowColor = '#aaffaa';
            ctx.shadowBlur = 40;
            ctx.fillStyle = '#aaffaa';
            ctx.font = 'bold 64px Orbitron, sans-serif';
            ctx.fillText('\u2713 Saved', canvas.width / 2, canvas.height / 2);
            ctx.restore();
        }

        // Pulse the S pill in the HUD at full opacity for 1.5 s,
        // then fade it back to whatever opacity it had before (0
        // while idle, 1 while the pause overlay is up — the
        // function does NOT touch display state, only the toast
        // flash is layered on top).
        function flashSavePill() {
            const sHint = document.getElementById('saveKeyHint');
            if (!sHint) return;
            // Bright snap-in so the pulse reads as "something
            // happened" rather than as a normal show transition.
            sHint.style.transition = 'opacity 0.18s ease';
            sHint.style.opacity = '1';
            if (sHint._saveFlashTimer) clearTimeout(sHint._saveFlashTimer);
            sHint._saveFlashTimer = setTimeout(() => {
                // Restore the default fade the .key-hint CSS class
                // provides (0.28 s ease) so the next show / hide
                // cycles in lock-step with the P pill.
                sHint.style.opacity = '';
                sHint.style.transition = '';
            }, 1500);
        }

        // Snapshot the current in-flight run to localStorage under
        // the per-account __save bucket so a future Resume feature
        // (out of scope today) can re-launch the same mode at the
        // same score / lives / hp / survival-start-time. The
        // function is intentionally cheap and idempotent — repeated
        // presses just overwrite the previous snapshot.
        function saveCurrentRun() {
            // Silent no-op for logged-out users: progress belongs to
            // an account, and a __default key would conflict with
            // anyone who later logs in with that same default key.
            if (!currentUser) return;
            // gameOver=true means the run has just ended — the
            // records bucket already holds the just-completed score,
            // and resuming a dead run would let the player dodge a
            // death by saving mid-damage-frame then reloading.
            if (gameOver) return;
            // Rank of the just-saved run on its mode's top-10: -1 when
            // the save did not place, 0..9 when it did (0 = new best).
            // Returned to quickSaveGame so the review screen can flash
            // the NEW RECORD badge.
            let savedRank = -1;
            try {
                const all = getAllRecords();
                // Survival absolute Date.now() so resume can copy
                // the value verbatim into survivalStartTime without
                // a discontinuity in the per-second score tick —
                // the same Date.now()-arithmetic the run uses while
                // playing will continue to work after resume.
                const survivalStartAbs = (gameMode === GAME_MODES.SURVIVAL
                    && survivalStartTime > 0)
                    ? survivalStartTime
                    : (gameMode === GAME_MODES.SURVIVAL ? Date.now() : 0);
                const battleElapsed = gameMode === GAME_MODES.BATTLE
                    ? (typeof battleElapsedMs === 'number' ? battleElapsedMs : 0)
                    : 0;
                all[`${currentUser}__save`] = {
                    savedAt: Date.now(),
                    mode: gameMode,
                    score: score,
                    lives: lives,
                    hp: hp,
                    battleElapsedMs: battleElapsed,
                    survivalStartTime: survivalStartAbs
                };
                saveAllRecords(all);
                // Audio feedback: the click tick confirms the save
                // without startling the player mid-run, and the S pill
                // in the HUD flashes for 1.5 s as the visual cue.
                playClickSound();
                flashSavePill();
                // ----- Persist score to per-mode records -----
                // The previous iteration saved only to the
                // ${user}__save bucket (snapshot for a future Resume
                // feature). The player expects Save to ALSO show up
                // in the RECORDS screen for the matching mode, so the
                // current run's score is additionally pushed into the
                // per-mode top-10 via the same helper gameOver uses.
                // addScoreToUser / addSurvivalScoreToUser /
                // addBattleScoreToUser / addCoopScoreToUser /
                // addBossTimeToUser silently no-op on score <= 0
                // (e.g. saving before catching anything), so a
                // 0-score save doesn't bloat the records bucket.
                if (score > 0) {
                    if (gameMode === GAME_MODES.CLASSIC) {
                        savedRank = addScoreToUser(currentUser, score);
                        // Quick-saving a Classic run also banks its stars
                        // (1 point = 1 star), matching endGame().
                        addStarsToUser(currentUser, score);
                    } else if (gameMode === GAME_MODES.SURVIVAL) {
                        savedRank = addSurvivalScoreToUser(currentUser, score);
                    } else if (gameMode === GAME_MODES.BATTLE) {
                        savedRank = addBattleScoreToUser(currentUser, score);
                        if (battleDifficulty === 'normal'
                            && score > getBattleNormalBest(currentUser)) {
                            setBattleNormalBest(currentUser, score);
                        }
                    } else if (gameMode === GAME_MODES.BOSS) {
                        // Boss records only count a WIN (bossDefeated), so
                        // a quick-save mid-fight never adds a time.
                        if (bossDefeated) {
                            savedRank = addBossTimeToUser(
                                currentUser,
                                Math.max(1, Math.round(bossCompletionMs / 1000))
                            );
                        }
                    } else if (gameMode === GAME_MODES.COOP) {
                        // CO-OP save parity: the quick save writes to the
                        // `${user}__coop` bucket exactly like endGame()
                        // does, so a saved CO-OP run shows up on the
                        // Records screen like every other mode (previously
                        // only the game-over path did).
                        savedRank = addCoopScoreToUser(currentUser, score);
                    }
                }
                // ----- Trigger the screen-spanning overlay -----
                // 2.0 s window so the player has time to read the
                // toast even if their eyes were elsewhere at the
                // moment of save. drawSavedOverlay() handles the fade
                // out automatically — no separate timer needed here.
                savedOverlayUntil = Date.now() + 2000;
            } catch (e) {
                // localStorage quota / disabled storage: best-effort.
                // The audio cue is INSIDE the try so a quota error
                // also skips the click-sound false-positive.
            }
            return savedRank;
        }

        // Quick save = save & review. Saves the run (snapshot + records,
        // exactly like saveCurrentRun) and then ENDS the run so the full
        // game-over review screen appears. drawGameOver replaces the
        // "GAME OVER"-style title with "✓ SAVED" via quickSaveEndedRun.
        // This is the SAME function the pause-menu SAVE button now calls.
        function quickSaveGame() {
            if (!currentUser) return;
            if (gameOver) return;
            const savedRank = saveCurrentRun();
            // The title itself is now the confirmation, so suppress the
            // redundant centred "✓ Saved" toast.
            savedOverlayUntil = 0;
            quickSaveEndedRun = true;
            flushPlayTime();
