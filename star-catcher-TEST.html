            // "Get the stars, beat the record!" subtitle (y=215) and
            // the account-name label (y=350).
            // Width was bumped from 220 -> 360 so the now-three-color
            // title "MISSIONS and STREAK" has comfortable padding inside
            // the pill; the button is centered on the canvas, so widening
            // automatically grows it equally on the left AND the right.
            const mpW = 360, mpH = 56;
            const mpX = canvas.width / 2 - mpW / 2;
            const mpY = 250;
            ctx.shadowBlur = 30;
            ctx.shadowColor = '#ffd84a';
            const mpGrad = ctx.createLinearGradient(mpX, mpY, mpX, mpY + mpH);
            mpGrad.addColorStop(0, 'rgba(70, 50, 10, 0.95)');
            mpGrad.addColorStop(1, 'rgba(35, 22, 5, 0.95)');
            ctx.fillStyle = mpGrad;
            ctx.beginPath();
            ctx.roundRect(mpX, mpY, mpW, mpH, 12);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#ffd84a';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(mpX, mpY, mpW, mpH, 12);
            ctx.stroke();
            ctx.font = 'bold 24px Orbitron, sans-serif';
            // Three-color title inside the pill:
            //   * MISSIONS (yellow) — unchanged, matches the gold pill palette
            //   * and      (white)  — standard body text color
            //   * STREAK   (red)    — mirrors the SUPER STREAK counter on
            //                         the missions screen, so the pill
            //                         visually rhymes with what it opens onto
            // Each chunk is drawn separately so it can carry its own color
            // + glow. measureText() is used to compute the total rendered
            // width so the whole "MISSIONS and STREAK" group stays centered
            // in the (now wider) pill even though alignment is 'left'.
            const _mpPart1 = 'MISSIONS ';
            const _mpPart2 = 'and ';
            const _mpPart3 = 'STREAK';
            const _mpW1 = ctx.measureText(_mpPart1).width;
            const _mpW2 = ctx.measureText(_mpPart2).width;
            const _mpTextTotal = _mpW1 + _mpW2 + ctx.measureText(_mpPart3).width;
            const _mpStartX = mpX + mpW / 2 - _mpTextTotal / 2;
            const _mpBaseY = mpY + 26;
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';

            // MISSIONS — yellow (kept from the previous design)
            ctx.shadowColor = '#ff7300';
            ctx.shadowBlur = 14;
            ctx.fillStyle = '#ffd84a';
            ctx.fillText(_mpPart1, _mpStartX, _mpBaseY);

            // and — plain white, no glow so it doesn't fight the title
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ffffff';
            ctx.fillText(_mpPart2, _mpStartX + _mpW1, _mpBaseY);

            // STREAK — red glow
            ctx.shadowColor = '#cc0000';
            ctx.shadowBlur = 14;
            ctx.fillStyle = '#ff4040';
            ctx.fillText(_mpPart3, _mpStartX + _mpW1 + _mpW2, _mpBaseY);

            // Sub-text under the title — back to centered alignment
            // because the next line is a single fillText call.
            ctx.shadowBlur = 0;
            ctx.font = 'bold 11px Orbitron, sans-serif';
            ctx.fillStyle = '#ffcc88';
            ctx.textAlign = 'center';
            ctx.fillText('click or press M key', mpX + mpW / 2, mpY + 46);
            menuButtons.push({ rect: { x: mpX, y: mpY, w: mpW, h: mpH }, action: 'missions' });
            ctx.textAlign = 'left';
            ctx.textAlign = 'left';
            ctx.shadowBlur = 0;
        }

        function drawAccountScreen() {
            drawBackground();

            ctx.textAlign = 'center';
            ctx.shadowBlur = 30;
            ctx.shadowColor = '#4af';

            ctx.font = 'bold 44px Orbitron, sans-serif';
            ctx.fillStyle = 'white';
            ctx.fillText('👤 ACCOUNT', canvas.width / 2, 150);

            ctx.shadowBlur = 10;
            ctx.shadowColor = 'black';
            ctx.font = '18px Orbitron, sans-serif';
            ctx.fillStyle = '#aaa';
            ctx.fillText('Enter your name (max 12 characters)', canvas.width / 2, 210);

            const isMobile = window.innerWidth <= 768;

        function drawFallingStars() {
            for (const star of stars) {
                ctx.save();
                ctx.translate(star.x, star.y);
                ctx.rotate(star.spin || 0);
                const lucky = star.kind === 'lucky';
                ctx.shadowColor = lucky ? '#ffd84a' : star.color;
                ctx.shadowBlur = lucky ? 28 : 20;
                if (lucky) {
                    const glow = ctx.createRadialGradient(0, 0, 1, 0, 0, star.radius * 2.4);
                    glow.addColorStop(0, 'rgba(255, 240, 168, 0.95)');
                    glow.addColorStop(0.45, 'rgba(255, 184, 77, 0.45)');
                    glow.addColorStop(1, 'rgba(255, 159, 67, 0)');
                    ctx.fillStyle = glow;
                    ctx.beginPath();
                    ctx.arc(0, 0, star.radius * 1.7, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.fillStyle = star.color;
                ctx.strokeStyle = lucky ? '#fff4c0' : '#fff';
                ctx.lineWidth = lucky ? 1.5 : 1;

                const spikes = lucky ? 8 : 5;
                const outerRadius = star.radius;
                const innerRadius = star.radius * 0.4;
                ctx.beginPath();
                for (let i = 0; i < spikes * 2; i++) {
                    const radius = i % 2 === 0 ? outerRadius : innerRadius;
                    const angle = (i * Math.PI) / spikes - Math.PI / 2;
                    const x = radius * Math.cos(angle);
                    const y = radius * Math.sin(angle);
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            }
        }

        function drawMeteorite(m) {
            // Fire trail: a soft comma-shaped flame painted underneath the
            // rock that gets fainter and smaller the further back it goes.
            ctx.save();
            ctx.translate(m.x, m.y);
            ctx.rotate(m.rotation);

            const trailLen = m.radius * 2.4;
            const trailGrad = ctx.createLinearGradient(0, m.radius * 0.6, 0, m.radius * 0.6 + trailLen);
            trailGrad.addColorStop(0, `hsla(${m.hue}, 95%, 65%, 0.85)`);
            trailGrad.addColorStop(0.4, `hsla(${m.hue + 10}, 95%, 55%, 0.45)`);
            trailGrad.addColorStop(1, `hsla(${m.hue + 20}, 95%, 45%, 0)`);
            ctx.fillStyle = trailGrad;
            ctx.beginPath();
            ctx.moveTo(-m.radius * 0.55, m.radius * 0.6);
            ctx.quadraticCurveTo(0, m.radius * 0.6 + trailLen * 0.55, m.radius * 0.55, m.radius * 0.6);
            ctx.lineTo(m.radius * 0.25, m.radius * 0.6 + trailLen);
            ctx.quadraticCurveTo(-m.radius * 0.4, m.radius * 0.6 + trailLen * 1.1, -m.radius * 0.25, m.radius * 0.6 + trailLen);
            ctx.closePath();
            ctx.fill();

            // Soft outer glow so the meteorite reads as burning.
            // Skip on mobile — shadowBlur is the most expensive per-meteorite
            // op and a phone can't sustain 25+ of them at 60fps.
            ctx.shadowColor = `hsl(${m.hue}, 95%, 60%)`;
            ctx.shadowBlur = IS_MOBILE ? 0 : 24;

            // Rocky body — irregular polygon with a fiery outer ring
            const sides = 7;
            const ringGrad = ctx.createRadialGradient(0, 0, m.radius * 0.4, 0, 0, m.radius);
            ringGrad.addColorStop(0, `hsl(${m.hue + 15}, 80%, 55%)`);
            ringGrad.addColorStop(0.7, `hsl(${m.hue}, 60%, 30%)`);
            ringGrad.addColorStop(1, `hsl(${m.hue + 20}, 45%, 9%)`);
            ctx.fillStyle = ringGrad;
            ctx.beginPath();
            for (let i = 0; i < sides; i++) {
                const wobble = 0.82 + ((i * 41) % 17) / 100;   // pseudo-random radius wobble
                const angle = (i / sides) * Math.PI * 2;
                const px = Math.cos(angle) * m.radius * wobble;
                const py = Math.sin(angle) * m.radius * wobble;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = `hsla(${m.hue + 10}, 95%, 70%, 0.8)`;
            ctx.lineWidth = 2;
            ctx.stroke();

            // A few bright crater highlights for texture
            ctx.shadowBlur = 0;
            ctx.fillStyle = `hsla(${m.hue + 20}, 100%, 75%, 0.6)`;
            ctx.beginPath();
            ctx.arc(-m.radius * 0.25, -m.radius * 0.15, m.radius * 0.18, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(m.radius * 0.3, m.radius * 0.18, m.radius * 0.12, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function drawMeteorites() {
            for (const m of meteorites) {
                drawMeteorite(m);
            }
        }

        function drawSurvivalOverlay() {
            // Same background, with a red filter on top so it is obvious
            // the player is in survival mode. The vignette darkens the
            // edges a bit to feel more "dangerous".
            const bodyRed = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bodyRed.addColorStop(0, 'rgba(180, 20, 20, 0.30)');
            bodyRed.addColorStop(0.5, 'rgba(200, 30, 30, 0.28)');
            bodyRed.addColorStop(1, 'rgba(140, 10, 10, 0.34)');
            ctx.fillStyle = bodyRed;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const vignette = ctx.createRadialGradient(
                canvas.width / 2, canvas.height / 2, canvas.height * 0.35,
                canvas.width / 2, canvas.height / 2, canvas.height * 0.9
            );
            vignette.addColorStop(0, 'rgba(255, 80, 80, 0)');
            vignette.addColorStop(1, 'rgba(120, 0, 0, 0.45)');
            ctx.fillStyle = vignette;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Subtle red scanline flicker, much weaker than the body tint.
            // Use a wider row stride on mobile so the loop cuts in half.
            ctx.fillStyle = 'rgba(255, 60, 60, 0.05)';
            const scanStride = IS_MOBILE ? 8 : 4;
            for (let y = 0; y < canvas.height; y += scanStride) {
                ctx.fillRect(0, y, canvas.width, 2);
            }
        }

        function drawShip() {
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.shadowColor = '#4af';
            ctx.shadowBlur = 25;

            ctx.beginPath();
            ctx.ellipse(0, -5, 18, 12, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#4a8cff';
            ctx.fill();
            ctx.strokeStyle = '#8cf';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.beginPath();
            ctx.ellipse(0, -12, 10, 7, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#8cf';
            ctx.fill();
            ctx.strokeStyle = '#adf';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.fillStyle = '#fff';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(-4, -14, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(4, -14, 2, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#3a7add';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.moveTo(-20, 5);
            ctx.lineTo(-8, -2);
            ctx.lineTo(-8, 8);
            ctx.closePath();
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(20, 5);
            ctx.lineTo(8, -2);
            ctx.lineTo(8, 8);
            ctx.closePath();
            ctx.fill();

            ctx.shadowBlur = 30;
            ctx.shadowColor = '#f90';
            ctx.fillStyle = '#f90';
            ctx.beginPath();
            ctx.moveTo(-6, 12);
            ctx.lineTo(0, 22);
            ctx.lineTo(6, 12);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#fd0';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.moveTo(-3, 12);
            ctx.lineTo(0, 18);
            ctx.lineTo(3, 12);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        // ===== CO-OP draw helpers =====
        // Green ship (Player 2) sprite. Mirrors drawShip()'s layered
        // ellipse + fin + thruster recipe so both ships feel like a
        // matching pair visually. The only differences are the green
        // palette and the lack of an orange thruster flame (Green is
        // focused on shooting, not thrusting, so a subtle pulsating
        // thruster dot reads quieter).
        function drawGreenShip() {
            ctx.save();
            ctx.translate(greenPlayer.x, greenPlayer.y);
            ctx.shadowColor = '#6f6';
            ctx.shadowBlur = 25;

            // Body — angular green silhouette
            ctx.beginPath();
            ctx.ellipse(0, 0, 18, 14, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#3ec46d';
            ctx.fill();
            ctx.strokeStyle = '#8fdfa0';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Inner cockpit disc
            ctx.beginPath();
            ctx.ellipse(0, -6, 10, 7, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#8fdfa0';
            ctx.fill();
            ctx.strokeStyle = '#cfffd6';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Twin eye dots (matches Blue ship)
            ctx.fillStyle = '#fff';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(-4, -8, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(4, -8, 2, 0, Math.PI * 2);
            ctx.fill();

            // Side fins
            ctx.fillStyle = '#26884a';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.moveTo(-20, 5);
            ctx.lineTo(-8, -2);
            ctx.lineTo(-8, 8);
            ctx.closePath();
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(20, 5);
            ctx.lineTo(8, -2);
            ctx.lineTo(8, 8);
            ctx.closePath();
            ctx.fill();

            // Thruster: small green-tinted flame so the reader can see
            // the ship is moving and which direction it's facing.
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#6f6';
            ctx.fillStyle = '#6f6';
            ctx.beginPath();
            ctx.moveTo(-5, 14);
            ctx.lineTo(0, 22);
            ctx.lineTo(5, 14);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#cfffd6';
            ctx.beginPath();
            ctx.moveTo(-3, 14);
            ctx.lineTo(0, 18);
            ctx.lineTo(3, 14);
            ctx.closePath();
            ctx.fill();

            // i-frame tint: when coopGreenHitCooldown > 0 the ship has
            // recently taken damage and we tint it red so the player
            // can see the i-frame window.
            if (coopGreenHitCooldown > 0) {
                ctx.globalCompositeOperation = 'source-atop';
                ctx.fillStyle = 'rgba(255, 80, 80, 0.5)';
                ctx.beginPath();
                ctx.ellipse(0, 0, 20, 16, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        // Green beams (Player 2's light-green laser shots). Same
        // dual-shape recipe as the Battle blue rays but with a green
        // palette: wider dimmer halo + narrower bright white core.
        function drawGreenBeams() {
            for (const b of greenPlayerBeams) {
                ctx.save();
                ctx.shadowBlur = 16;
                ctx.shadowColor = '#6f6';
                ctx.fillStyle = '#6f6';
                ctx.fillRect(b.x - 5, b.y - 11, 10, 22);
                ctx.shadowBlur = 10;
                ctx.fillStyle = '#eaffea';
                ctx.fillRect(b.x - 2, b.y - 9, 4, 18);
                ctx.restore();
            }
        }

        // ====== Battle mode renderers ======
        // These three renderers are only invoked when gameMode === BATTLE
        // (see the GAME_STATES.PLAYING switch in the draw() loop below).
        // They were added together with updateBattle() / createEnemy()
        // / fireBullet() but were forgotten at integration time — the
        // update loop was mutating battleEnemies / playerBullets /
        // enemyBullets while nothing drew them, leaving the canvas empty
        // during a Battle run.

        function drawEnemies() {
            for (const e of battleEnemies) {
                ctx.save();
                ctx.translate(e.x, e.y);
                // HP bar: rendered ABOVE the enemy sprite so the player
                // can read it without having to overlay onto the ship
                // art. Colour-matches the player HP bar so the eye
                // learns one colour → fraction mapping.
                const hpRatio = Math.max(0, e.hp / 100);
                const barW = 52;
                const barX = -barW / 2;
                const barY = -42;
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(barX, barY, barW, 4);
                let barColor;
                if (hpRatio > 0.5) barColor = '#3ec46d';
                else if (hpRatio > 0.25) barColor = '#ffaa33';
                else barColor = '#ff4060';
                ctx.fillStyle = barColor;
                ctx.fillRect(barX, barY, barW * hpRatio, 4);

                // Body — angular red silhouette. While the pre-fire
                // telegraph flash is active (flashTimer > 0) we swap
                // red → white for a clearly visible "DODGE!" cue.
                const isTelegraph = e.flashTimer > 0;
                ctx.shadowBlur = isTelegraph ? 26 : 18;
                ctx.shadowColor = isTelegraph ? '#ffffff' : '#ff3030';
                ctx.fillStyle = isTelegraph ? '#ffffff' : '#a01818';
                ctx.beginPath();
                ctx.moveTo(0, -22);
                ctx.lineTo(20, 4);
                ctx.lineTo(14, 18);
                ctx.lineTo(-14, 18);
                ctx.lineTo(-20, 4);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = isTelegraph ? '#ffffff' : '#ff5050';
                ctx.lineWidth = isTelegraph ? 2 : 1.5;
                ctx.stroke();

                // Cockpit — inner ellipse with a glow that intensifies
                // during telegraph so the cursor knows the shot is
                // about to leave the bay.
                ctx.shadowBlur = 14;
                ctx.shadowColor = isTelegraph ? '#ffffff' : '#ff8888';
                ctx.fillStyle = isTelegraph ? '#ffffff' : '#ff8866';
                ctx.beginPath();
                ctx.ellipse(0, -2, 6, 4, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function drawPlayerBullets() {
            // Blue ray bolts. Two stacked rects: a wider, dimmer
            // outer glow + a narrower bright white core. Travels
            // straight up (set in updateBattle).
            for (const b of playerBullets) {
                ctx.save();
                ctx.shadowBlur = 16;
                ctx.shadowColor = '#4af';
                ctx.fillStyle = '#4af';
                ctx.fillRect(b.x - 5, b.y - 8, 10, 16);
                ctx.shadowBlur = 10;
                ctx.fillStyle = '#fff';
                ctx.fillRect(b.x - 2, b.y - 6, 4, 12);
                ctx.restore();
            }
        }

        function drawEnemyBullets() {
            // Red ray bolts. Same dual-shape recipe as the player
            // bullets for visual parity, but inverted palette. The
            // outer soft halo helps the player distinguish friend vs
            // foe at a glance.
            for (const b of enemyBullets) {
                ctx.save();
                ctx.shadowBlur = 16;
                ctx.shadowColor = '#ff3030';
                ctx.fillStyle = '#ff3030';
                ctx.beginPath();
                ctx.arc(b.x, b.y, 9, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 8;
                ctx.fillStyle = '#ffe7b3';
                ctx.beginPath();
                ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function drawGameUI() {
            const isSurvival = gameMode === GAME_MODES.SURVIVAL;
            const isBattle = gameMode === GAME_MODES.BATTLE;
            const isCoop = gameMode === GAME_MODES.COOP;
            // ----- Battle HUD overlay -----
            // Two visual elements render BEFORE anything else:
            //   1) a 6 px-tall health strip across the very top edge
            //      of the canvas, color-coded green/yellow/red so the
            //      player can read their remaining HP at a glance.
            //   2) a compact "KILLS / BEST" readout on the top so the
            //      player can compare their current run to their
            //      personal record without opening the Records screen.
            if (isBattle) {
                const hpMax = 100;
                const ratio = Math.max(0, hp) / hpMax;
                const barX = 0;
                const barW = canvas.width;
                const barY = 0;
                const barH = 6;
                ctx.fillStyle = 'rgba(0,0,0,0.72)';
                ctx.fillRect(barX, barY, barW, barH);
                const fillW = Math.max(0, barW * ratio);
                let hpColor;
                if (ratio > 0.5) hpColor = '#3ec46d';
                else if (ratio > 0.25) hpColor = '#ffaa33';
                else hpColor = '#ff6b6b';
                ctx.fillStyle = hpColor;
                ctx.fillRect(barX, barY, fillW, barH);
                // KILLS + HP readouts in the same conditional block so
                // the HUD has a single source of truth for "is this a
                // battle HUD" — avoids the prior nested if(isBattle)
                // that split the bar render from the readout render.
                ctx.shadowBlur = 14;
                ctx.shadowColor = '#ff6b6b';
                ctx.fillStyle = '#ff6b6b';
                ctx.font = 'bold 16px Orbitron, sans-serif';
                ctx.fillText(`🛡 KILLS: ${score}`, 20, 26);
                const hpText = `❤ ${hp}/100`;
                const hpTextWidth = ctx.measureText(hpText).width;
                ctx.fillStyle = hpColor;
                ctx.fillText(hpText, canvas.width - hpTextWidth - 20, 26);
                ctx.shadowBlur = 0;
            }
            if (isCoop) {
                // ----- CO-OP HUD overlay -----
                // Three elements at the top of the canvas:
                //   1) Black backdrop strip (8 px) so the green HP
                //      always reads on top of stars/enemies.
                //   2) Green HP bar sized to `[greenPlayer.hp, 100]`.
                //   3) Two text readouts under the bar:
                //      - left: BLUE LIVES (3 lives, red hearts)
                //      - right: GREEN HP
                //      - center: SCORE with star + kill feedback built
                //        into the score updateCounter so the player
                //        can always see their current combo of stars
                //        + enemy kills in real time.
                const hpMax = greenPlayer.maxHp;
                const grRatio = Math.max(0, greenPlayer.hp) / hpMax;
                const barX = 0;
                const barW = canvas.width;
                const barY = 0;
                const barH = 8;
                ctx.fillStyle = 'rgba(0,0,0,0.78)';
                ctx.fillRect(barX, barY, barW, barH);
                const greenFillW = Math.max(0, barW * grRatio);
                let grColor;
                if (grRatio > 0.5) grColor = '#5fe089';
                else if (grRatio > 0.25) grColor = '#ffd84a';
                else grColor = '#ff6b6b';
                ctx.fillStyle = grColor;
                ctx.fillRect(barX, barY, greenFillW, barH);

                ctx.shadowBlur = 12;
                ctx.shadowColor = '#3ec46d';
                ctx.font = 'bold 16px Orbitron, sans-serif';
                ctx.textAlign = 'left';
                // BLUE LIVES — render as N red hearts on the left so
                // the blue player understands their Classic-style
                // 3-life pile from frame 1.
                let blueLivesText = '';
                for (let i = 0; i < 3; i++) {
                    blueLivesText += (i < lives) ? '❤' : '🖤';
                }
                ctx.fillStyle = '#9bd9ff';
                ctx.fillText(`💙 ${blueLivesText}`, 16, 32);
                // SCORE in the centre
                const scoreLabel = `⭐ SCORE: ${score}`;
                const scoreWidth = ctx.measureText(scoreLabel).width;
                ctx.fillStyle = '#ffd84a';
                ctx.shadowColor = '#ffd84a';
                ctx.fillText(scoreLabel, canvas.width / 2 - scoreWidth / 2, 32);
                // GREEN HP on the right
                const grText = `💚 ${greenPlayer.hp}/100`;
                const grWidth = ctx.measureText(grText).width;
                ctx.fillStyle = grColor;
                ctx.shadowColor = '#3ec46d';
                ctx.fillText(grText, canvas.width - grWidth - 16, 32);
                ctx.shadowBlur = 0;
                ctx.textAlign = 'left';
            }
            const highScore = currentUser
                ? (isSurvival ? getMaxSurvivalScore(currentUser) : getMaxScore(currentUser))
                : 0;

            ctx.font = 'bold 20px Orbitron, sans-serif';
            ctx.shadowColor = 'black';
            ctx.shadowBlur = 10;

            if (isSurvival) {
                // Survival mode badge in the top-left so the player always
                // remembers they're in the harder variant.
                ctx.fillStyle = '#ff6b6b';
                ctx.font = 'bold 16px Orbitron, sans-serif';
                ctx.shadowColor = '#ff0000';
                ctx.shadowBlur = 12;
                ctx.fillText('☠ SURVIVAL', 20, 20);
                ctx.shadowBlur = 10;
            }

            if (currentUser) {
                ctx.fillStyle = '#66dd88';
                ctx.textAlign = 'right';
                ctx.fillText(`👤 ${currentUser}`, canvas.width - 20, 30);
                ctx.textAlign = 'left';
            }

            const scoreLabelY = isSurvival ? 60 : 40;
            const scoreValueY = isSurvival ? 85 : 40;
            const highScoreY = isSurvival ? 110 : 80;
            const topLabelOffset = isSurvival ? 22 : 0;

            // Score readout (with mode-appropriate label)
            if (isSurvival) {
                ctx.font = '14px Orbitron, sans-serif';
                ctx.fillStyle = '#ff9999';
                ctx.shadowBlur = 4;
                ctx.fillText('☠ SURVIVED', 20, scoreLabelY);
                ctx.font = 'bold 26px Orbitron, sans-serif';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff5b5b';
                ctx.fillStyle = '#ffcccc';
                ctx.fillText(`${score}s`, 20, scoreValueY);
            } else {
                ctx.font = 'bold 20px Orbitron, sans-serif';
                ctx.fillStyle = 'white';
                ctx.fillText(`⭐ Points: ${score}`, 20, scoreValueY);

                const comboMultiplier = getComboMultiplier();
                ctx.font = 'bold 14px Orbitron, sans-serif';
                ctx.fillStyle = comboStreak > 0 ? '#ffd56a' : '#9aa6b2';
                ctx.fillText(`⟲ Combo x${comboMultiplier} · ${comboStreak}`, 20, 110);
                ctx.font = '11px Orbitron, sans-serif';
                ctx.fillStyle = '#8e9aad';
                ctx.fillText('Gold stars refill a heart', 20, 130);
            }

            ctx.font = 'bold 20px Orbitron, sans-serif';
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'black';
            ctx.fillStyle = '#ffd700';
            ctx.fillText(`🏆 Best: ${highScore}${isSurvival ? 's' : ''}`, 20, highScoreY);

            const recordBannerActive = inGameRecordShown
                && gameState === GAME_STATES.PLAYING
                && currentUser
                && !gameOver
                && (Date.now() - inGameRecordShownAt) < RECORD_NOTIFICATION_DURATION;
            if (recordBannerActive) {
                ctx.shadowColor = isSurvival ? '#ff6b6b' : '#ffd700';
                ctx.shadowBlur = 30;
                ctx.fillStyle = isSurvival ? '#ff6b6b' : '#ffd700';
                ctx.font = 'bold 26px Orbitron, sans-serif';
                ctx.fillText('✦ NEW RECORD! ✦', canvas.width / 2 - 110, 130 + topLabelOffset);
                ctx.shadowBlur = 0;
            }

            ctx.fillStyle = isSurvival ? '#ff9999' : 'white';
            ctx.font = 'bold 20px Orbitron, sans-serif';
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'black';
            ctx.fillText(`❤️ x ${lives}`, canvas.width - 120, isSurvival ? 110 : 80);

            // Saved-overlay render LAST so it sits ON TOP of the
            // Battle HP bar and the rest of the HUD overlay — the
            // centred ✓ Saved toast is the single screen-spanning
            // confirmation the player can't miss even if attention
            // was elsewhere at the moment of save. drawSavedOverlay()
            // short-circuits itself when savedOverlayUntil has
            // expired, so the call costs nothing in steady state.
            drawSavedOverlay();
        }

        function drawPauseScreen() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.78)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.textAlign = 'center';
            ctx.shadowColor = '#4af';
            ctx.shadowBlur = 50;

            ctx.font = 'bold 78px Orbitron, sans-serif';
            ctx.fillStyle = '#4a8cff';
            ctx.fillText('⏸ PAUSED', canvas.width / 2, 175);

            ctx.shadowBlur = 12;
            ctx.shadowColor = 'black';
            ctx.font = '18px Orbitron, sans-serif';
            ctx.fillStyle = '#9bcfff';
            ctx.fillText('Press "P" or tap RESUME to continue', canvas.width / 2, 220);

            // Three-button row: RESUME | SETTINGS | MENU.
            const btnW = 170;
            const btnH = 56;
            const gap = 25;
            const totalW = btnW * 3 + gap * 2;
            const btnY = canvas.height / 2 + 30;
            const rowLeftX = canvas.width / 2 - totalW / 2;
            const resumeX = rowLeftX;
            const settingsPauseX = rowLeftX + btnW + gap;
            const menuPauseX = rowLeftX + (btnW + gap) * 2;

            // ----- RESUME button (green, the canonical "back to game") -----
            ctx.shadowBlur = 32;
            ctx.shadowColor = 'rgba(120, 255, 160, 0.7)';
            ctx.fillStyle = '#1a4a2a';
            ctx.beginPath();
            ctx.roundRect(resumeX, btnY, btnW, btnH, 12);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(120, 255, 160, 0.6)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(resumeX, btnY, btnW, btnH, 12);
            ctx.stroke();
            ctx.fillStyle = '#cfffcf';
            ctx.font = 'bold 22px Orbitron, sans-serif';
            ctx.textAlign = 'center';
            ctx.shadowColor = 'rgba(120, 255, 160, 0.4)';
            ctx.shadowBlur = 12;
            ctx.fillText('▶ RESUME', resumeX + btnW / 2, btnY + 36);
            ctx.shadowBlur = 0;

            // ----- SETTINGS button (blue/grey) -----
            ctx.shadowBlur = 28;
            ctx.shadowColor = 'rgba(74, 170, 255, 0.55)';
            ctx.fillStyle = '#2a2a3a';
            ctx.beginPath();
            ctx.roundRect(settingsPauseX, btnY, btnW, btnH, 12);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(74, 170, 255, 0.5)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(settingsPauseX, btnY, btnW, btnH, 12);
            ctx.stroke();
            ctx.fillStyle = '#88aaff';
            ctx.font = 'bold 20px Orbitron, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('⚙ SETTINGS', settingsPauseX + btnW / 2, btnY + 35);

            // ----- MENU button (existing orange/gold, kept) -----
            ctx.shadowBlur = 28;
            ctx.shadowColor = '#ff8800';
            ctx.fillStyle = '#6a3a1a';
            ctx.beginPath();
            ctx.roundRect(menuPauseX, btnY, btnW, btnH, 12);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(255, 170, 80, 0.5)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(menuPauseX, btnY, btnW, btnH, 12);
            ctx.stroke();
            ctx.fillStyle = '#ffd700';
            ctx.font = 'bold 22px Orbitron, sans-serif';
            ctx.fillText('🏠 MENU', menuPauseX + btnW / 2, btnY + 35);

            // ----- SAVE button (second row, centred below the
            // RESUME/SETTINGS/MENU row). Width bumped to 220 so the
            // 'menuSaveBtnText' string ("💾 SAVE" / "✓ SAVED") has
            // room to render without truncation. Distinct gold/teal
            // accent palette — uses the project's --accent-alt teal
            // (#49d7c8) for the frame so it reads as a meta / data
            // action rather than a gameplay action like Resume.
            const saveBtnW = 220;
            const saveBtnH = 56;
            const saveBtnGap = 22;
            // Sit 22 px below the row's bottom edge so the SAVE row
            // reads as a distinct second band rather than glued to
            // the first one. Visually symmetric with the
            // MISSION-row-on-pause-overlay spacing used elsewhere.
            const saveBtnY = btnY + btnH + saveBtnGap;
            const saveBtnX = canvas.width / 2 - saveBtnW / 2;
            // Revert the cached text after the 1.5 s flash window
            // expires so subsequent frames render "💾 SAVE" again
            // without needing a separate rAF-driven timer (the
            // draw call already runs every frame, so this is free).
            if (menuSaveBtnFlashUntil !== 0 && Date.now() > menuSaveBtnFlashUntil) {
                menuSaveBtnText = '\ud83d\udcbe SAVE';
                menuSaveBtnFlashUntil = 0;
            }
            // Use teal accent — different from the green Resume
            // (action), blue Settings (config), and gold Menu
            // (navigation) so the player's eye reads SAVE as its
            // own band rather than a fourth colour of the same row.
            ctx.shadowBlur = 28;
            ctx.shadowColor = 'rgba(73, 215, 200, 0.55)';
            ctx.fillStyle = '#1a3a3a';
            ctx.beginPath();
            ctx.roundRect(saveBtnX, saveBtnY, saveBtnW, saveBtnH, 12);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(73, 215, 200, 0.7)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(saveBtnX, saveBtnY, saveBtnW, saveBtnH, 12);
            ctx.stroke();
            ctx.fillStyle = '#aff5ec';
            ctx.font = 'bold 22px Orbitron, sans-serif';
            ctx.textAlign = 'center';
            ctx.shadowColor = 'rgba(73, 215, 200, 0.4)';
            ctx.shadowBlur = 12;
            ctx.fillText(menuSaveBtnText, saveBtnX + saveBtnW / 2, saveBtnY + 36);
            ctx.shadowBlur = 0;

            menuButtons = [
                { rect: { x: resumeX, y: btnY, w: btnW, h: btnH }, action: 'pauseResume' },
                { rect: { x: settingsPauseX, y: btnY, w: btnW, h: btnH }, action: 'pauseSettings' },
                { rect: { x: menuPauseX, y: btnY, w: btnW, h: btnH }, action: 'pauseMenu' },
                { rect: { x: saveBtnX, y: saveBtnY, w: saveBtnW, h: saveBtnH }, action: 'pauseSave' }
            ];

            // Saved-overlay render LAST so it sits ON TOP of the
            // pause backdrop and the SAVE-button itself — the player
            // gets immediate visible feedback the moment they tap
            // SAVE, even while paused. drawSavedOverlay() handles its
            // own fade-out + short-circuit when inactive.
            drawSavedOverlay();

            ctx.textAlign = 'left';
            ctx.shadowBlur = 0;
        }

        function drawGameOver() {
            const isSurvival = gameMode === GAME_MODES.SURVIVAL;
            // Battle Mode needs the same per-mode flag here as in drawGameUI():
            // the header ternary below branches on it to render
            // '💥 BATTLE OVER' instead of the survival / classic text.
            // Without this declaration the ternary throws a
            // ReferenceError the moment a Battle run ends.
            const isBattle = gameMode === GAME_MODES.BATTLE;
            const highScore = currentUser
                ? (isSurvival
                    ? getMaxSurvivalScore(currentUser)
                    : (isBattle ? getMaxBattleScore(currentUser) : getMaxScore(currentUser)))
                : 0;

            ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.textAlign = 'center';

            ctx.shadowColor = '#ff0000';
            ctx.shadowBlur = 40;
            ctx.font = 'bold 60px Orbitron, sans-serif';
            ctx.fillStyle = '#ff4444';
            ctx.fillText(isBattle ? '💥 BATTLE OVER' : (isSurvival ? '☠ SURVIVAL OVER' : 'GAME OVER'), canvas.width / 2, 100);

            ctx.shadowColor = 'black';
            ctx.shadowBlur = 15;
            ctx.font = 'bold 28px Orbitron, sans-serif';
            ctx.fillStyle = 'white';
            ctx.fillText(
                isSurvival ? `☠ Survived ${score}s` : `Score: ${score}`,
                canvas.width / 2, 150
            );

            if (isNewRecord && currentUser && score > 0) {
                let label = '';
                const pos = newRecordPosition;
                if (isSurvival) {
                    // Survival uses a red-ish badge to stay on-brand with
                    // the mode's colour scheme.
                    if (pos === 0) {
                        label = '☠ BEST SURVIVAL TIME ☠';
                    } else if (pos === 1) {
                        label = '☠ NEW SURVIVAL RECORD! (2nd)';
                    } else if (pos === 2) {
                        label = '☠ NEW SURVIVAL RECORD! (3rd)';
                    } else {
                        label = `☠ NEW SURVIVAL RECORD! (${pos + 1}th)`;
                    }
                } else if (pos === 0) {
                    label = '🏆 NEW BEST RECORD! 🏆';
                } else if (pos === 1) {
                    label = '🥈 NEW RECORD! (2nd place)';
                } else if (pos === 2) {
                    label = '🥉 NEW RECORD! (3rd place)';
                } else {
                    label = `🎯 NEW RECORD! (${pos + 1}th place)`;
                }

                ctx.shadowColor = isSurvival ? '#ff6b6b' : '#ffd700';
                ctx.shadowBlur = 50;
                ctx.font = 'bold 30px Orbitron, sans-serif';
                ctx.fillStyle = isSurvival ? '#ff8a8a' : '#ffd700';
                ctx.fillText(label, canvas.width / 2, 200);

                ctx.font = '50px Arial';
                ctx.shadowBlur = 60;
                const medal = isSurvival
                    ? '☠'
                    : (pos === 0 ? '🏆' : pos === 1 ? '🥈' : pos === 2 ? '🥉' : '🎯');
                ctx.fillText(medal, canvas.width / 2, 260);
            } else {
                ctx.shadowColor = 'black';
                ctx.shadowBlur = 10;
                ctx.font = '20px Orbitron, sans-serif';
                ctx.fillStyle = '#aaa';
                ctx.fillText(
                    `Best${isSurvival ? ' Survival Time' : ' Record'}: ${highScore}${isSurvival ? 's' : ''}`,
                    canvas.width / 2, 200
                );
            }

            if (!isSurvival) {
                ctx.shadowColor = '#ffd56a';
                ctx.shadowBlur = 18;
                ctx.font = '18px Orbitron, sans-serif';
                ctx.fillStyle = '#ffd56a';
                ctx.fillText(`Best combo: x${comboBest}`, canvas.width / 2, 228);
                if (luckyStarsCaught > 0) {
                    ctx.shadowBlur = 8;
                    ctx.font = '14px Orbitron, sans-serif';
                    ctx.fillStyle = '#f5d488';
                    ctx.fillText(`Lucky stars caught: ${luckyStarsCaught}`, canvas.width / 2, 252);
                }
            }

            const leftColX = 60;
            const col2X = 300;
            const top5Y = 290;

            ctx.shadowBlur = 0;
            ctx.fillStyle = isSurvival ? 'rgba(200, 30, 30, 0.18)' : 'rgba(200, 50, 50, 0.15)';
            ctx.beginPath();
            ctx.roundRect(leftColX - 20, top5Y - 30, 480, 220, 12);
            ctx.fill();
            ctx.strokeStyle = isSurvival ? 'rgba(255, 80, 80, 0.5)' : 'rgba(255, 80, 80, 0.4)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(leftColX - 20, top5Y - 30, 480, 220, 12);
            ctx.stroke();

            ctx.textAlign = 'left';
            ctx.shadowColor = isSurvival ? '#ff8a8a' : '#ffd700';
            ctx.shadowBlur = 20;
            ctx.font = 'bold 24px Orbitron, sans-serif';
            ctx.fillStyle = isSurvival ? '#ff8a8a' : '#ffd700';
            ctx.fillText(isSurvival ? '☠ TOP 10 SURVIVAL' : '🏆 TOP 10', leftColX, top5Y);
            // (Previously a '⚔ BATTLE BEST' inline badge sat here as
            // a placeholder for the third column. It has been replaced
            // by the dedicated Battle column on drawRecordsScreen —
            // search for `col3X` to find the new layout.)

            if (currentUser) {
                const records = isSurvival
                    ? getSurvivalRecords(currentUser)
                    : getUserRecords(currentUser);
                const validRecords = records.filter(r => r > 0);

                if (validRecords.length > 0) {
                    ctx.shadowBlur = 5;
                    const suffix = isSurvival ? 's' : ' pts';
                    for (let i = 0; i < Math.min(10, validRecords.length); i++) {
                        const colX = i < 5 ? leftColX : col2X;
                        const rowIndex = i < 5 ? i : i - 5;
                        const medalEmoji = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i + 1}.`;
                        const color = i === 0 ? '#ffd700' : i === 1 ? '#c0c0c0' : i === 2 ? '#cd7f32' : '#ccc';
                        ctx.fillStyle = color;
                        ctx.font = i < 3 ? 'bold 20px Orbitron, sans-serif' : '18px Orbitron, sans-serif';
                        ctx.fillText(
                            `${medalEmoji} ${validRecords[i]}${suffix}`,
                            colX,
                            top5Y + 40 + rowIndex * 32
                        );
                    }
                } else {
                    ctx.fillStyle = '#666';
                    ctx.font = '16px Orbitron, sans-serif';
                    ctx.fillText('No records yet', leftColX, top5Y + 40);
                }
            } else {
                ctx.fillStyle = '#666';
                ctx.font = '16px Orbitron, sans-serif';
                ctx.fillText('Create an account', leftColX, top5Y + 40);
            }

            const shipX = canvas.width - 150;
            const shipY = 320;

            ctx.shadowBlur = 30;
            ctx.shadowColor = isSurvival ? '#ff5555' : '#44ff88';
            ctx.beginPath();
            ctx.arc(shipX, shipY, 95, 0, Math.PI * 2);
            ctx.fillStyle = isSurvival ? 'rgba(255, 80, 80, 0.12)' : 'rgba(68, 255, 136, 0.12)';
            ctx.fill();
            ctx.strokeStyle = isSurvival ? 'rgba(255, 80, 80, 0.3)' : 'rgba(68, 255, 136, 0.3)';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.save();
            ctx.translate(shipX, shipY);
            ctx.shadowColor = '#4af';
            ctx.shadowBlur = 30;

            ctx.beginPath();
            ctx.ellipse(0, -8, 30, 20, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#4a8cff';
            ctx.fill();
            ctx.strokeStyle = '#8cf';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.beginPath();
            ctx.ellipse(0, -20, 16, 12, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#8cf';
            ctx.fill();
            ctx.strokeStyle = '#adf';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.shadowBlur = 15;
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(-6, -22, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(6, -22, 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#222';
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(-5, -21, 1.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(7, -21, 1.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#3a7add';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.moveTo(-32, 8);
            ctx.lineTo(-14, -2);
            ctx.lineTo(-14, 14);
            ctx.closePath();
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(32, 8);
            ctx.lineTo(14, -2);
            ctx.lineTo(14, 14);
            ctx.closePath();
            ctx.fill();

            ctx.shadowBlur = 40;
            ctx.shadowColor = '#f90';
            ctx.fillStyle = '#f90';
            ctx.beginPath();
            ctx.moveTo(-10, 20);
            ctx.lineTo(0, 36);
            ctx.lineTo(10, 20);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#fd0';
            ctx.shadowBlur = 30;
            ctx.beginPath();
            ctx.moveTo(-5, 20);
            ctx.lineTo(0, 30);
            ctx.lineTo(5, 20);
            ctx.closePath();
            ctx.fill();

            ctx.restore();

            ctx.textAlign = 'center';
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'black';
            ctx.font = 'bold 16px Orbitron, sans-serif';
            ctx.fillStyle = isSurvival ? '#ff9999' : '#66dd88';
            ctx.fillText(isSurvival ? '☠ YOU' : '★ YOU', shipX, shipY + 125);

            const btnY = 500;
            const btnW = 170;
            const btnH = 50;
            const gap = 40;
            const btnRadius = 14;

            const playAgainX = canvas.width / 2 - btnW - gap / 2;
            const playAgainCenterX = playAgainX + btnW / 2;
            ctx.shadowBlur = 25;
            ctx.shadowColor = isSurvival ? '#ff3333' : '#4af';
            ctx.fillStyle = isSurvival ? '#1a0606' : '#1a3a6a';
            ctx.beginPath();
            ctx.roundRect(playAgainX, btnY, btnW, btnH, btnRadius);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = isSurvival ? 'rgba(255, 80, 80, 0.6)' : 'rgba(74, 170, 255, 0.5)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(playAgainX, btnY, btnW, btnH, btnRadius);
            ctx.stroke();

            ctx.fillStyle = isSurvival ? '#ff8888' : 'white';
            ctx.shadowBlur = 0;
            ctx.font = 'bold 22px Orbitron, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(isSurvival ? '☠ RETRY' : '▶ PLAY AGAIN', playAgainCenterX, btnY + 34);

            const menuX = canvas.width / 2 + gap / 2;
            const menuCenterX = menuX + btnW / 2;
            ctx.shadowBlur = 25;
            ctx.shadowColor = '#ff8800';
            ctx.fillStyle = '#6a3a1a';
            ctx.beginPath();
            ctx.roundRect(menuX, btnY, btnW, btnH, btnRadius);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(255, 170, 80, 0.5)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(menuX, btnY, btnW, btnH, btnRadius);
            ctx.stroke();

            ctx.fillStyle = '#ffd700';
            ctx.shadowBlur = 0;
            ctx.font = 'bold 22px Orbitron, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('🏠 MENU', menuCenterX, btnY + 34);

            menuButtons = [
                { rect: { x: playAgainX, y: btnY, w: btnW, h: btnH }, action: 'playAgain' },
                { rect: { x: menuX, y: btnY, w: btnW, h: btnH }, action: 'menu' }
            ];

            ctx.shadowBlur = 5;
            ctx.shadowColor = 'black';
            ctx.font = '14px Orbitron, sans-serif';
            ctx.fillStyle = 'rgba(255,255,255,0.25)';
            ctx.textAlign = 'center';
            ctx.fillText('Press "R" to restart', canvas.width / 2, btnY + btnH + 35);

            ctx.textAlign = 'left';
            ctx.shadowBlur = 0;
        }

        function drawRecordsScreen() {
            drawBackground();

            ctx.textAlign = 'center';
            ctx.shadowBlur = 30;
            ctx.shadowColor = '#ffd700';
            ctx.font = 'bold 38px Orbitron, sans-serif';
            ctx.fillStyle = '#ffd700';
            ctx.fillText('🏆 RECORDS', canvas.width / 2, 60);

            // ----- Auth gate + shared back button -----
            // Render the BACK button first so it is always present — both
            // the "create an account" branch and the full records grid
            // call this. Doing it once centralises the click target so
            // users are never stuck on the screen without an exit.
            const backW = 160;
            const backH = 35;
            const backX = canvas.width / 2 - backW / 2;
            const backY = 540;
            menuButtons = [];

            if (!currentUser) {
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'black';
                ctx.font = '20px Orbitron, sans-serif';
                ctx.fillStyle = '#aaa';
                ctx.fillText('Create an account to see your records!', canvas.width / 2, 110);
                ctx.shadowBlur = 0;
                drawRecordsBackButton(backX, backY, backW, backH);
                ctx.textAlign = 'left';
                return;
            }

            // ----- Logged-in: layout + 3 columns + play-time card -----
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'black';
            ctx.font = '15px Orbitron, sans-serif';
            ctx.fillStyle = '#66dd88';
            ctx.fillText(`Account: ${currentUser}`, canvas.width / 2, 92);

            const classicRecords = getUserRecords(currentUser).filter(r => r > 0);
            const survivalRecords = getSurvivalRecords(currentUser).filter(r => r > 0);
            const battleRecords = getBattleRecords(currentUser).filter(r => r > 0);
            // CO-OP records bucket added with the new mode so the
            // player can see their best two-player runs in the same
            // Records screen as the other modes.
            const coopRecords = getCoopRecords(currentUser).filter(r => r > 0);
            const playMs = getPlayTime(currentUser);

            // Three side-by-side 235 px cards, sized so the play-time
            // band fits beneath them. leftColX / rightColX are kept as
            // aliases for the Classic and Survival column bodies that
            // already use those names so we don’t have to retouch them.
            const colW = 175;
            const colY = 110;
            const colH = 290;
            const colGap = 18;
            const col1X = 30;
            const col2X = col1X + colW + colGap;
            const col3X = col2X + colW + colGap;
            // 4th column hosts the new CO-OP records so a player can
            // see their co-op runs alongside Classic / Survival /
            // Battle. colW was shrunk from 235 → 175 so the four
            // cards still fit inside the 800 px canvas
            // (4 × 175 + 3 × 18 + 30 left margin = 784 ≤ 800).
            const col4X = col3X + colW + colGap;
            const leftColX = col1X;
            const rightColX = col2X;

            // ----- Classic column -----
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#ffd700';
            ctx.fillStyle = 'rgba(74, 140, 255, 0.10)';
            ctx.beginPath();
            ctx.roundRect(leftColX, colY, colW, colH, 12);
            ctx.fill();
            ctx.strokeStyle = 'rgba(74, 170, 255, 0.4)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(leftColX, colY, colW, colH, 12);
            ctx.stroke();

            ctx.font = 'bold 20px Orbitron, sans-serif';
            ctx.fillStyle = '#88aaff';
            ctx.shadowColor = '#4af';
            ctx.shadowBlur = 15;
            ctx.fillText('⭐ CLASSIC', leftColX + colW / 2, colY + 30);

            ctx.font = '14px Orbitron, sans-serif';
            ctx.shadowBlur = 4;
            ctx.fillStyle = '#aac8ff';
            ctx.fillText('Stars caught', leftColX + colW / 2, colY + 50);

            ctx.shadowBlur = 4;
            ctx.textAlign = 'left';
            const classicStartY = colY + 85;
            if (classicRecords.length === 0) {
                ctx.fillStyle = '#666';
                ctx.font = '14px Orbitron, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('No records yet', leftColX + colW / 2, classicStartY + 10);
            } else {
                for (let i = 0; i < Math.min(5, classicRecords.length); i++) {
                    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1) + '.';
                    const color = i === 0 ? '#ffd700' : i === 1 ? '#c0c0c0' : i === 2 ? '#cd7f32' : '#aac8ff';
                    ctx.fillStyle = color;
                    ctx.font = i < 3 ? 'bold 18px Orbitron, sans-serif' : '15px Orbitron, sans-serif';
                    ctx.shadowBlur = 4;
                    ctx.shadowColor = 'black';
                    ctx.fillText(medal + '  ' + classicRecords[i] + ' pts', leftColX + 25, classicStartY + i * 38);
                }
            }

            // ----- Survival column -----
            ctx.textAlign = 'center';
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#ff6b6b';
            ctx.fillStyle = 'rgba(180, 20, 20, 0.12)';
            ctx.beginPath();
            ctx.roundRect(rightColX, colY, colW, colH, 12);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255, 90, 90, 0.5)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(rightColX, colY, colW, colH, 12);
            ctx.stroke();

            ctx.font = 'bold 20px Orbitron, sans-serif';
            ctx.fillStyle = '#ff8888';
            ctx.shadowColor = '#ff0000';
            ctx.shadowBlur = 15;
            ctx.fillText('☠ SURVIVAL', rightColX + colW / 2, colY + 30);

            ctx.font = '14px Orbitron, sans-serif';
            ctx.shadowBlur = 4;
            ctx.fillStyle = '#ffb0b0';
            ctx.fillText('Time survived', rightColX + colW / 2, colY + 50);

            ctx.textAlign = 'left';
            const survivalStartY = colY + 85;
            if (survivalRecords.length === 0) {
                ctx.fillStyle = '#666';
                ctx.font = '14px Orbitron, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('No records yet', rightColX + colW / 2, survivalStartY + 10);
            } else {
                for (let i = 0; i < Math.min(5, survivalRecords.length); i++) {
                    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1) + '.';
                    const color = i === 0 ? '#ffd700' : i === 1 ? '#c0c0c0' : i === 2 ? '#cd7f32' : '#ffb0b0';
                    ctx.fillStyle = color;
                    ctx.font = i < 3 ? 'bold 18px Orbitron, sans-serif' : '15px Orbitron, sans-serif';
                    ctx.shadowBlur = 4;
                    ctx.shadowColor = 'black';
                    ctx.fillText(medal + '  ' + survivalRecords[i] + 's', rightColX + 25, survivalStartY + i * 38);
                }
            }

            // ----- Battle column -----
            ctx.save();
            ctx.shadowBlur = 18;
            ctx.shadowColor = '#ff8a3d';
            ctx.fillStyle = 'rgba(74, 26, 10, 0.40)';
            ctx.beginPath();
            ctx.roundRect(col3X, colY, colW, colH, 12);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(255, 138, 61, 0.6)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(col3X, colY, colW, colH, 12);
            ctx.stroke();

            ctx.textAlign = 'center';
            ctx.font = 'bold 22px Orbitron, sans-serif';
            ctx.fillStyle = '#ffd2a8';
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#ff8a3d';
            ctx.fillText('🎯 BATTLE', col3X + colW / 2, colY + 32);
            ctx.shadowBlur = 0;
            ctx.font = '13px Orbitron, sans-serif';
            ctx.fillStyle = '#9aa6b2';
            ctx.fillText('Enemies killed', col3X + colW / 2, colY + 52);

            // Body. battleRecords is already filtered by .filter(r > 0)
            // above so an empty filtered array is a true "no data"
            // case — use that instead of re-scanning the raw bucket
            // to keep parity with how the Classic / Survival columns
            // decide "No records yet".
            if (battleRecords.length === 0) {
                ctx.font = 'bold 14px Orbitron, sans-serif';
                ctx.fillStyle = '#ffd2a8';
                ctx.fillText('No records yet', col3X + colW / 2, colY + 110);
            } else {
                ctx.font = '15px Orbitron, sans-serif';
                for (let idx = 0; idx < Math.min(5, battleRecords.length); idx++) {
                    const record = battleRecords[idx];
                    let label, color;
                    let weight = 'normal';
                    if (idx === 0) { label = '🥇 ' + record; color = '#ffd700'; weight = 'bold'; }
                    else if (idx === 1) { label = '🥈 ' + record; color = '#c0c0c0'; weight = 'bold'; }
                    else if (idx === 2) { label = '🥉 ' + record; color = '#cd7f32'; weight = 'bold'; }
                    else { label = (idx + 1) + '. ' + record; color = '#ffb59c'; }
                    ctx.font = (weight === 'bold' ? 'bold ' : '') + '15px Orbitron, sans-serif';
                    ctx.fillStyle = color;
                    ctx.fillText(label + ' kills', col3X + colW / 2, colY + 90 + idx * 28);
                }
            }
            ctx.textAlign = 'left';
            ctx.restore();

            // ----- CO-OP column -----
            // 4th column with the green palette already established
            // by the menu's CO-OP button so the player recognises
            // the mode at a glance. Subtitle explicitly mentions the
            // scoring rule ("Stars + kills") because CO-OP scores mix
            // +1/star and +2/kill — a casual reader cannot tell from
            // the bare number what "10 pts" means. Suffix on each row
            // is "pts" rather than "kills" to mirror the Classic
            // column's vocabulary.
            ctx.save();
            ctx.shadowBlur = 18;
            ctx.shadowColor = '#6fe0a8';
            const coopPanel = ctx.createLinearGradient(col4X, colY, col4X, colY + colH);
            coopPanel.addColorStop(0, 'rgba(20, 60, 35, 0.40)');
            coopPanel.addColorStop(1, 'rgba(10, 30, 18, 0.45)');
            ctx.fillStyle = coopPanel;
            ctx.beginPath();
            ctx.roundRect(col4X, colY, colW, colH, 12);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(120, 240, 180, 0.6)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(col4X, colY, colW, colH, 12);
            ctx.stroke();

            ctx.textAlign = 'center';
            ctx.font = 'bold 20px Orbitron, sans-serif';
            ctx.fillStyle = '#cfffe5';
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#6fe0a8';
            ctx.fillText('🤝 CO-OP', col4X + colW / 2, colY + 32);
            ctx.shadowBlur = 0;
            ctx.font = '12px Orbitron, sans-serif';
            ctx.fillStyle = '#9aa6b2';
            // Subtitle spelling out the scoring formula so a casual
            // reader can connect the "pts" suffix below to the game's
            // +1/star + +2/kill rule without leaving the screen.
            ctx.fillText('Score (1/star + 2/kill)', col4X + colW / 2, colY + 52);

            if (coopRecords.length === 0) {
                ctx.font = 'bold 14px Orbitron, sans-serif';
                ctx.fillStyle = '#cfffe5';
                ctx.fillText('No records yet', col4X + colW / 2, colY + 110);
            } else {
                ctx.font = '15px Orbitron, sans-serif';
                for (let idx = 0; idx < Math.min(5, coopRecords.length); idx++) {
                    const record = coopRecords[idx];
                    let label, color;
                    let weight = 'normal';
                    if (idx === 0) { label = '🥇 ' + record; color = '#ffd700'; weight = 'bold'; }
                    else if (idx === 1) { label = '🥈 ' + record; color = '#c0c0c0'; weight = 'bold'; }
                    else if (idx === 2) { label = '🥉 ' + record; color = '#cd7f32'; weight = 'bold'; }
                    else { label = (idx + 1) + '. ' + record; color = '#a8e8c8'; }
                    ctx.font = (weight === 'bold' ? 'bold ' : '') + '15px Orbitron, sans-serif';
                    ctx.fillStyle = color;
                    ctx.fillText(label + ' pts', col4X + colW / 2, colY + 90 + idx * 28);
                }
            }
            ctx.textAlign = 'left';
            ctx.restore();

            // ----- Play-time card -----
            const cardX = 75;
            const cardY = 425;
            const cardW = canvas.width - cardX * 2;
            const cardH = 90;
            ctx.shadowBlur = 22;
            ctx.shadowColor = '#66e0ff';
            const cardGrad = ctx.createLinearGradient(cardX, cardY, cardX, cardY + cardH);
            cardGrad.addColorStop(0, 'rgba(20, 50, 80, 0.85)');
            cardGrad.addColorStop(1, 'rgba(10, 25, 50, 0.95)');
            ctx.fillStyle = cardGrad;
            ctx.beginPath();
            ctx.roundRect(cardX, cardY, cardW, cardH, 14);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(102, 224, 255, 0.55)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(cardX, cardY, cardW, cardH, 14);
            ctx.stroke();

            ctx.textAlign = 'left';
            ctx.font = 'bold 13px Orbitron, sans-serif';
            ctx.shadowColor = 'black';
            ctx.shadowBlur = 4;
            ctx.fillStyle = '#9cd3ff';
            ctx.fillText('⏱  HOW MUCH TIME DID YOU PLAY', cardX + 22, cardY + 26);

            ctx.font = '11px Orbitron, sans-serif';
            ctx.shadowBlur = 3;
            ctx.fillStyle = '#7eaad6';
            ctx.fillText('Active gameplay across this account', cardX + 22, cardY + 46);

            // formatPlayTime(0) returns '0s' so a brand-new account with
            // no recorded play time still sees a populated card instead
            // of an empty placeholder.
            ctx.textAlign = 'right';
            ctx.font = 'bold 30px Orbitron, sans-serif';
            ctx.shadowColor = '#66e0ff';
            ctx.shadowBlur = 18;
            ctx.fillStyle = '#ffffff';
            ctx.fillText(formatPlayTime(playMs), cardX + cardW - 22, cardY + 60);
            ctx.shadowBlur = 0;

            ctx.font = '11px Orbitron, sans-serif';
            ctx.fillStyle = '#7eaad6';
            ctx.shadowBlur = 3;
            ctx.fillText('h   m   s', cardX + cardW - 22, cardY + 78);

            // ----- Back button (logged-in branch) -----
            drawRecordsBackButton(backX, backY, backW, backH);
            ctx.textAlign = 'left';
            ctx.shadowBlur = 0;
        }

        // ----- Shared back-button helper -----
        // Used by both the "logged-out" early-return branch and the
        // "logged-in records grid" branch of drawRecordsScreen so the
        // player always has a way out. Centralising the rect+text+hit
        // push here also keeps the same action string ('back') in one
        // place, which makes the action dispatcher in handleMenuAction
        // the single source of truth for "exit the records screen".
        function drawRecordsBackButton(x, y, w, h) {
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#4af';
            ctx.fillStyle = '#2a4a7a';
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, 10);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'white';
            ctx.font = '18px Orbitron, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('← BACK', canvas.width / 2, y + 25);
            menuButtons.push({
                rect: { x: x, y: y, w: w, h: h },
                action: 'back'
            });
        }

        // ----- Volume row (used as a sub-row under MUSIC / CLASSIC MUSIC) -----
        // Renders "VOLUME" label + −/+ step buttons + filled bar + % readout.
        // The bar is CONTINUOUS (one rect), not segmented, so it expands/
        // contracts smoothly with each step. Only the step buttons are
        // click targets — tapping the bar itself does nothing, matching
        // the surrounding tap-driven UI. The same gold/orange palette
        // the BACK button uses ties the row to the panel's accent colour.
        // With 11 volume levels (0.0 → 1.0 in 0.1 steps) and matching the
        // existing Orbitron typography, the row reads as a sibling of
        // drawSettingsRow rather than a foreign widget.
        function drawVolumeRow(x, y, w, h, level, decAction, incAction) {
            // "VOLUME" label on the left.
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.font = 'bold 11px Orbitron, sans-serif';
            ctx.shadowColor = 'black';
            ctx.shadowBlur = 3;
            ctx.fillStyle = '#88ddff';
            ctx.fillText('VOLUME', x + 6, y + h / 2);

            // − button (28×28 square)
            const btnSize = 28;
            const btnY = y + (h - btnSize) / 2;
            const decBtnX = x + 65;

            // Continuous bar (200×12)
            const barW = 200;
            const barH = 12;
            const barX = decBtnX + btnSize + 12;
            const barY = y + (h - barH) / 2;

            // + button (28×28 square)
            const incBtnX = barX + barW + 12;

            // Step button geometry is reused both for rendering and for
            // registering click targets, so wrap it in a tiny helper.
            function drawStep(cx, label) {
                ctx.shadowBlur = 6;
                ctx.shadowColor = 'rgba(255,170,80,0.55)';
                ctx.fillStyle = '#3a2a1a';
                ctx.beginPath();
                ctx.roundRect(cx, btnY, btnSize, btnSize, 8);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(255,170,80,0.7)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.roundRect(cx, btnY, btnSize, btnSize, 8);
                ctx.stroke();
                ctx.fillStyle = '#ffd84a';
                ctx.font = 'bold 18px Orbitron, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(label, cx + btnSize / 2, btnY + btnSize / 2);
            }

            drawStep(decBtnX, '−');
            drawStep(incBtnX, '+');

            // Bar background pill
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#0e1a2e';
            ctx.strokeStyle = 'rgba(74,170,255,0.45)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.roundRect(barX, barY, barW, barH, 6);
            ctx.fill();
            ctx.stroke();

            // Filled portion (clamped to [0, 1] for safety even though
            // the setter already rounded — defence in depth for cases
            // like a hand-tampered localStorage value).
            const safeLevel = Math.min(1, Math.max(0, level));
            const fillW = Math.round(barW * safeLevel);
            if (fillW > 0) {
                const fillGrad = ctx.createLinearGradient(barX, barY, barX + fillW, barY);
                fillGrad.addColorStop(0, '#ffaa55');
                fillGrad.addColorStop(1, '#ffd84a');
                ctx.fillStyle = fillGrad;
                ctx.beginPath();
                ctx.roundRect(barX, barY, fillW, barH, 6);
                ctx.fill();
            }

            // Numeric readout on the right
            ctx.font = 'bold 13px Orbitron, sans-serif';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'right';
            ctx.shadowColor = 'black';
            ctx.shadowBlur = 3;
            ctx.fillText(Math.round(safeLevel * 100) + '%', x + w - 6, y + h / 2);

            // Click targets for ±, only. Bar itself is NOT clickable
            // (tapping it would imply continuous drag, which is out of
            // scope for "standard buttons").
            menuButtons.push({
                rect: { x: decBtnX, y: btnY - settingsScrollY, w: btnSize, h: btnSize },
                action: decAction
            });
            menuButtons.push({
                rect: { x: incBtnX, y: btnY - settingsScrollY, w: btnSize, h: btnSize },
                action: incAction
            });

            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
            ctx.shadowBlur = 0;
        }

        function drawSettingsRow(x, y, w, h, title, description, value, action) {
            // Label (left)
            ctx.textAlign = 'left';
            ctx.font = 'bold 22px Orbitron, sans-serif';
            ctx.shadowColor = 'black';
            ctx.shadowBlur = 6;
            ctx.fillStyle = '#ffffff';
            ctx.fillText(title, x, y + 30);

            // Description (left, smaller)
            ctx.font = '12px Orbitron, sans-serif';
            ctx.fillStyle = '#8cf';
            ctx.shadowBlur = 3;
            ctx.fillText(description, x, y + 52);

            // Toggle pill (right)
            const pillW = 96;
            const pillH = 44;
            const pillX = x + w - pillW;
            const pillY = y + (h - pillH) / 2;

            // Pill background
            ctx.shadowBlur = 10;
            ctx.shadowColor = value ? 'rgba(0, 200, 100, 0.6)' : 'rgba(0, 0, 0, 0.5)';
            ctx.fillStyle = value ? '#1a4a2a' : '#2a2a3a';
            ctx.beginPath();
            ctx.roundRect(pillX, pillY, pillW, pillH, 22);
            ctx.fill();

            // ON / OFF label
            ctx.shadowBlur = 0;
            ctx.fillStyle = value ? '#aaffaa' : '#888';
            ctx.font = 'bold 16px Orbitron, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(value ? 'ON' : 'OFF', pillX + pillW / 2, pillY + 28);

            // Knob (decorative, positioned left or right)
            ctx.shadowBlur = 8;
            ctx.shadowColor = value ? '#aaffaa' : '#cccccc';
            ctx.fillStyle = value ? '#ddffdd' : '#dddddd';
            ctx.beginPath();
            ctx.arc(value ? pillX + pillW - 22 : pillX + 22, pillY + pillH / 2, 13, 0, Math.PI * 2);
            ctx.fill();

            // The whole pill is the click target
            menuButtons.push({
                rect: { x: pillX, y: pillY - settingsScrollY, w: pillW, h: pillH },
                action: action
            });

            ctx.textAlign = 'center';
            ctx.shadowBlur = 0;
        }

        function drawSettingsScreen() {
            drawBackground();

            // Reset menuButtons at the start so stale entries from the
            // previous screen (MENU, MISSIONS, RECORDS, PAUSED, GAMEOVER...)
            // cannot intercept clicks meant for the toggle pills / steppers
            // / BACK button. Without this, stale entries from the previous
            // screen could overlap a Settings control and fire the wrong
            // action on the first click.
            menuButtons = [];

            ctx.textAlign = 'center';

            // Title moved up (100 → 70) so the panel below has room
            // for the newly-added SURVIVAL MUSIC section. The matching
            // subtitle follows; see the panel-sizing block below for
            // the full layout math.
            ctx.font = 'bold 44px Orbitron, sans-serif';
            ctx.shadowColor = '#4a8cff';
            ctx.shadowBlur = 30;
            ctx.fillStyle = 'white';
            ctx.fillText('⚙ SETTINGS', canvas.width / 2, 70);

            // Subtitle
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'black';
            ctx.font = '15px Orbitron, sans-serif';
            ctx.fillStyle = '#aaa';
            ctx.fillText('Customize your settings', canvas.width / 2, 98);

            // Outer panel — sized for 4 toggle rows + 3 volume sub-rows.
            // Each music track (menu / classic / survival) owns its own
            // toggle + +/− stepper directly underneath; the SFX row
            // stays toggle-only since there is no SFX BGM track.
            //
            // Vertical layout (offsets inside the panel, top edge = 0):
            //   * MUSIC toggle         +15  h=56  (sub gap to Menu vol:   5)
            //   * Menu volume          +76  h=36  (section gap to SFX:   15)
            //   * SFX toggle          +127  h=56  (section gap to CLASSIC: 15)
            //   * CLASSIC MUSIC       +198  h=56  (sub gap to Classic vol: 5)
            //   * Classic volume      +259  h=36  (section gap to SURVIVAL: 15)
            //   * SURVIVAL MUSIC      +310  h=56  (sub gap to Survival vol: 5)
            //   * Survival volume     +371  h=36
            //   + 22 px bottom padding  → panelH = 429
            // Toggle row height shrunk 72 → 56 to keep the panel bottom
            // (panelY 100 + 429 = 529) clear of the BACK button anchored
            // at canvas.height - 50 (= 550), leaving a 21 px gap.
            const panelW = 480;
            // Trimmed back 497 → 449 (Mar 2026 follow-up). TOP reason: the
            // previous 497 pushed the panel's bottom edge to y=588,
            // overlapping the BACK button rendered at canvas.height-50
            // (=550, spanning 550..595) and partly covering the new
            // toggle's ON/OFF pill. 449 lets the panel stop at y=549,
            // giving a 1 px clearance to the BACK button. The new
            // GAME CONTROLS section + Free-Movement toggle now live
            // in the SCROLLED region of the panel: visible by default
            // when the user scrolls all the way down (scrollY = ~61).
            const panelH = 449;
            const panelX = canvas.width / 2 - panelW / 2;
            const panelY = 100;

            // Clamp scrollY each frame BEFORE drawing so a stale value
            // from a previous taller-content build never pushes rows
            // off the top of the panel. scrollY is in panel-local px.
            const scrollRange = Math.max(0, SETTINGS_CONTENT_H - panelH);
            if (settingsScrollY < 0) settingsScrollY = 0;
            if (settingsScrollY > scrollRange) settingsScrollY = scrollRange;

            ctx.shadowBlur = 25;
            ctx.shadowColor = '#4a8cff';
            ctx.fillStyle = 'rgba(15, 25, 50, 0.85)';
            ctx.beginPath();
            ctx.roundRect(panelX, panelY, panelW, panelH, 16);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(74, 170, 255, 0.4)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(panelX, panelY, panelW, panelH, 16);
            ctx.stroke();

            // 7 audio sections + 1 new GAME CONTROLS section inside the
            // panel (positioned at panelY + 425 sub-header, panelY + 440
            // toggle). With SETTINGS_CONTENT_H = 510 the content is
            // taller than panelH = 449, so we CLIP the panel rect AND
            // translate up by scrollY before drawing the rows that
            // follow. The per-account note is drawn BEFORE the clip so
            // it never scrolls off-screen at the top.
            ctx.save();
            // Per-account note (always visible at the very top of the
            // panel) — see comment above on why it sits inside now.
            ctx.font = '11px Orbitron, sans-serif';
            ctx.textAlign = 'left';
            ctx.fillStyle = currentUser
                ? 'rgba(73, 215, 200, 0.85)'
                : 'rgba(255, 255, 255, 0.5)';
            ctx.fillText(
                currentUser
                    ? '✓ Saved for ' + currentUser
                    : 'Settings saved locally (no account)',
                panelX + 18, panelY + 14
            );
            ctx.restore();

            ctx.save();
            // Clip to the panel INNER rect so a row that overflows the
            // bottom is hidden (instead of leaking over the BACK button).
            // We use a plain rect — roundRect would clip along the curve
            // which our quad rows can't follow anyway.
            ctx.beginPath();
            ctx.rect(panelX, panelY, panelW, panelH);
            ctx.clip();
            // Scroll content up by settingsScrollY.  All row draws below
            // share the same translate, but keyboard + mouse hit-tests
            // (via menuButtons.push) use un-translated coords (which is
            // what we want — the toggle hit-rect matches the visible row
            // after the translate).
            ctx.translate(0, -settingsScrollY);

            const padX = 30;
            const innerW = panelW - padX * 2;
            const rowX = panelX + padX;

            drawSettingsRow(rowX, panelY + 15, innerW, 56,
                '🎵 MUSIC',
                'Background song in the main menu',
                settings.music, 'toggleMusic');

            drawVolumeRow(rowX, panelY + 76, innerW, 36,
                settings.menuVolume, 'menuVolDown', 'menuVolUp');

            drawSettingsRow(rowX, panelY + 127, innerW, 56,
                '🔊 SFX',
                'All other sounds during gameplay',
                settings.sfx, 'toggleSfx');

            drawSettingsRow(rowX, panelY + 198, innerW, 56,
                '⭐ CLASSIC MUSIC',
                'Plays during Classic Mode runs',
                settings.classicMusic, 'toggleClassicMusic');

            drawVolumeRow(rowX, panelY + 259, innerW, 36,
                settings.classicVolume, 'classicVolDown', 'classicVolUp');

            drawSettingsRow(rowX, panelY + 310, innerW, 56,
                '💀 SURVIVAL MUSIC',
                'Plays during Survival Mode runs',
                settings.survivalMusic, 'toggleSurvivalMusic');

            // ----- 🎮 GAME CONTROLS section (closes with ctx.restore below) -
