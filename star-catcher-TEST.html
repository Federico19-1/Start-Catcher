                    recordMissionEvent('finished_boss', score);
                } else if (gameMode === GAME_MODES.COOP) {
                    // CO-OP runs don't have a daily mission mapping today
                    // (no entries in MISSION_POOL use a coop_* type) but
                    // we still emit `finished_coop` so a future mission
                    // can hook in without a code change at the call site.
                    recordMissionEvent('finished_coop', score);
                }
            }
            gameOver = true;
            // Clear the blue-ship damage flash so the tint doesn't linger
            // on the game-over frame (drawShip still renders behind the
            // overlay).
            playerHitFlash = 0;
            playGameOverSound();
            if (currentUser) {
                if (gameMode === GAME_MODES.SURVIVAL) {
                    const pos = addSurvivalScoreToUser(currentUser, score);
                    if (pos !== -1) {
                        isNewRecord = true;
                        newRecordPosition = pos;
                        playRecordSound();
                    }
                } else if (gameMode === GAME_MODES.BATTLE) {
                    const pos = addBattleScoreToUser(currentUser, score);
                    if (pos !== -1) {
                        isNewRecord = true;
                        newRecordPosition = pos;
                        playRecordSound();
                    }
                    // BOSS FIGHT unlock requirement #3: best single-game
                    // kill count in Battle NORMAL mode. Tracked separately
                    // from the generic battle bucket because that bucket
                    // mixes difficulties.
                    if (battleDifficulty === 'normal'
                        && score > getBattleNormalBest(currentUser)) {
                        setBattleNormalBest(currentUser, score);
                    }
                } else if (gameMode === GAME_MODES.BOSS) {
                    // BOSS FIGHT records are the time taken to win, and
                    // are saved ONLY when the king actually falls — a
                    // loss leaves the boss leaderboard untouched.
                    if (bossDefeated) {
                        const bossSeconds = Math.max(1, Math.round(bossCompletionMs / 1000));
                        const pos = addBossTimeToUser(currentUser, bossSeconds);
                        if (pos !== -1) {
                            isNewRecord = true;
                            newRecordPosition = pos;
                            playRecordSound();
                        }
                    }
                } else if (gameMode === GAME_MODES.COOP) {
                    // CO-OP writes to its own bucket (`${user}__coop`)
                    // so the Records screen can show a separate top-10
                    // column without polluting Classic / Battle records.
                    const pos = addCoopScoreToUser(currentUser, score);
                    if (pos !== -1) {
                        isNewRecord = true;
                        newRecordPosition = pos;
                        playRecordSound();
                    }
                } else {
                    const pos = addScoreToUser(currentUser, score);
                    if (pos !== -1) {
                        isNewRecord = true;
                        newRecordPosition = pos;
                        playRecordSound();
                    }
                }
            }
        }

        /* ============================================================
           6. DRAWING FUNCTIONS
        ============================================================ */
        // ===== 6.1 Background + parallax =====
        function drawBackground() {
            // Phase-2A: radial gradient from shadow-grey center to ink-black edges
            const bgGrad = ctx.createRadialGradient(
                canvas.width / 2, canvas.height * 0.3, 0,
                canvas.width / 2, canvas.height * 0.3, canvas.width * 0.75
            );
            bgGrad.addColorStop(0, '#1a1f2c');   // shadow-grey
            bgGrad.addColorStop(1, '#0b0e14');   // ink-black
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Soft nebula haze in the upper right — depth without clutter.
            const nebula = ctx.createRadialGradient(
                canvas.width * 0.72, canvas.height * 0.16, 0,
                canvas.width * 0.72, canvas.height * 0.16, canvas.width * 0.55
            );
            nebula.addColorStop(0, 'rgba(96, 62, 190, 0.22)');
            nebula.addColorStop(0.55, 'rgba(64, 42, 140, 0.10)');
            nebula.addColorStop(1, 'transparent');
            ctx.fillStyle = nebula;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.shadowBlur = 0;
            const twinkleCount = IS_MOBILE ? 50 : 100;
            for (let i = 0; i < twinkleCount; i++) {
                const x = (i * 137 + 50) % canvas.width;
                const y = (i * 251 + 30) % canvas.height;
                const size = 0.5 + (i % 3) * 0.5;
                const brightness = 0.6 + Math.random() * 0.4;
                ctx.fillStyle = `rgba(255, 255, 255, ${brightness})`;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }

            // Far parallax star layer: small, dim stars that drift slowly
            // downward (matching the falling-star theme). Positions are
            // deterministic per index so there is no per-frame flicker —
            // only the vertical offset animates with time.
            const drift = (Date.now() / 1000) * 5;
            const farCount = IS_MOBILE ? 24 : 42;
            for (let i = 0; i < farCount; i++) {
                const fx = (i * 173.7 + 23) % canvas.width;
                const fy = (i * 97.3 + 11 + drift) % canvas.height;
                const fsize = 0.4 + (i % 2) * 0.4;
                ctx.fillStyle = 'rgba(170, 195, 255, ' + (0.22 + (i % 3) * 0.12).toFixed(2) + ')';
                ctx.beginPath();
                ctx.arc(fx, fy, fsize, 0, Math.PI * 2);
                ctx.fill();
            }

            // Phase-2A: subtle decorative orbs using palette colors
            const g1 = ctx.createRadialGradient(120, 100, 10, 120, 100, 60);
            g1.addColorStop(0, 'rgba(138, 43, 226, 0.35)');
            g1.addColorStop(0.7, 'rgba(26, 31, 44, 0.6)');
            g1.addColorStop(1, 'transparent');
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(120, 100, 60, 0, Math.PI * 2);
            ctx.fillStyle = g1;
            ctx.fill();
            ctx.strokeStyle = 'rgba(138, 43, 226, 0.15)';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.ellipse(120, 100, 90, 25, -0.2, 0, Math.PI * 2);
            ctx.stroke();

            const g2 = ctx.createRadialGradient(700, 500, 15, 700, 500, 45);
            g2.addColorStop(0, 'rgba(138, 43, 226, 0.25)');
            g2.addColorStop(0.5, 'rgba(26, 31, 44, 0.5)');
            g2.addColorStop(1, 'transparent');
            ctx.beginPath();
            ctx.arc(700, 500, 45, 0, Math.PI * 2);
            ctx.fillStyle = g2;
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.10)';
            ctx.beginPath();
            ctx.ellipse(690, 490, 20, 10, 0.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(710, 510, 15, 8, -0.3, 0, Math.PI * 2);
            ctx.fill();
        }

        // ===== 6.2 Blue mascot + speech bubble =====
        function drawBlueCharacter(now) {
            const c = blueCharacter;
            const bobY = Math.sin(c.bobPhase) * 6;
            const cx = c.cx;
            const cy = c.cy + bobY;
            // The mascot wears the equipped skin: body / stroke / glow /
            // face (pupils + smile) all come from the SKINS table so a
            // purchased RED skin turns him red and renames him RED.
            const skin = getEquippedSkin();
            const bodyColor = skin.body;
            const strokeColor = skin.stroke;
            const glowColor = skin.glow;
            const faceColor = skin.face;

            ctx.save();

            ctx.shadowColor = glowColor;
            ctx.shadowBlur = 22;
            ctx.fillStyle = bodyColor;
            ctx.beginPath();
            ctx.arc(cx, cy, c.bodyRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            const grad = ctx.createRadialGradient(cx - 8, cy - 10, 4, cx, cy, c.bodyRadius);
            grad.addColorStop(0, 'rgba(255,255,255,0.55)');
            grad.addColorStop(0.6, 'rgba(255,255,255,0.05)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(cx, cy, c.bodyRadius, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(cx, cy, c.bodyRadius, 0, Math.PI * 2);
            ctx.stroke();

            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(cx, cy - c.bodyRadius);
            ctx.lineTo(cx, cy - c.bodyRadius - 14);
            ctx.stroke();
            ctx.fillStyle = '#ffd84a';
            ctx.shadowColor = '#ffd84a';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(cx, cy - c.bodyRadius - 16, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.fillStyle = 'rgba(255, 140, 160, 0.55)';
            ctx.beginPath();
            ctx.arc(cx - 14, cy + 6, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(cx + 14, cy + 6, 5, 0, Math.PI * 2);
            ctx.fill();

            const blink = (Math.floor(now / 3500) % 7 === 0);
            const povX = c.isHovering ? 2 : 0;
            const povY = c.isHovering ? -2 : 0;
            const eyeY = cy - 4;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(cx - 8, eyeY, 6, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(cx + 8, eyeY, 6, 0, Math.PI * 2); ctx.fill();
            if (!blink) {
                ctx.fillStyle = faceColor;
                ctx.beginPath(); ctx.arc(cx - 8 + povX, eyeY + povY, 3, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(cx + 8 + povX, eyeY + povY, 3, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.beginPath(); ctx.arc(cx - 8 + povX + 1, eyeY + povY - 1, 1, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(cx + 8 + povX + 1, eyeY + povY - 1, 1, 0, Math.PI * 2); ctx.fill();
            } else {
                ctx.strokeStyle = faceColor;
                ctx.lineWidth = 1.5;
                ctx.beginPath(); ctx.moveTo(cx - 12, eyeY); ctx.lineTo(cx - 4, eyeY); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(cx + 4, eyeY); ctx.lineTo(cx + 12, eyeY); ctx.stroke();
            }

            ctx.strokeStyle = faceColor;
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.beginPath();
            const smileY = cy + 12;
            const smileR = c.isHovering ? c.bodyRadius * 0.7 : c.bodyRadius * 0.55;
            ctx.arc(cx, smileY - 2, smileR, 0.15 * Math.PI, 0.85 * Math.PI);
            ctx.stroke();
            ctx.lineCap = 'butt';

            ctx.font = 'bold 11px Orbitron, sans-serif';
            ctx.fillStyle = glowColor;
            ctx.shadowColor = 'black';
            ctx.shadowBlur = 4;
            ctx.textAlign = 'center';
            ctx.fillText(skin.name, cx, cy + c.bodyRadius + 14);
            ctx.shadowBlur = 0;

            ctx.restore();
        }

        function drawSpeechBubble() {
            const a = blueCharacter.bubbleAlpha;
            if (a <= 0.01) return;

            // The mascot's self-introduction always uses its CURRENT
            // name, so a RED / VIOLET / etc. mascot introduces itself
            // correctly instead of claiming to be Blue.
            const skin = getEquippedSkin();
            const text = blueCharacter.currentLineIndex === 0
                ? 'Hi, my name is ' + skin.name + '.'
                : blueCharacter.currentLine;
            const fontSize = 15;
            ctx.font = fontSize + 'px Orbitron, sans-serif';
            const padding = 11;
            // Keep bubble bottom clear of the GAME MODES buttons (row3Y = 490)
            // so the enlarged bubble never covers them.
            const maxWidth = 220;
            const words = text.split(' ');
            const lines = [];
            let cur = '';
            for (const w of words) {
                const candidate = cur ? cur + ' ' + w : w;
                const wWidth = ctx.measureText(candidate).width;
                if (wWidth > maxWidth && cur) {
                    lines.push(cur);
                    cur = w;
                } else {
                    cur = candidate;
                }
            }
            if (cur) lines.push(cur);

            const lineHeight = fontSize + 4;
            const boxW = Math.min(
                maxWidth + padding * 2,
                Math.max(...lines.map(l => ctx.measureText(l).width)) + padding * 2
            );
            const boxH = lineHeight * lines.length + padding * 2;

            // Speech bubble: positioned just above Blue and to the right.
            // Font bumped to 15px with wider padding for readability; boxY is
            // nudged up slightly so the larger bubble keeps the same visual
            // footprint (2-line bottom edge stays ~y=468, clear of the GAME
            // MODES row at y=490).
            const boxX = 165;
            const boxY = 408;
            // Tail anchors on the bubble's bottom edge (left side) and
            // its tip points down-left toward Blue's antenna.
            const tailBaseLeftX = boxX + 6;
            const tailBaseRightX = boxX + 46;
            const tailTipX = blueCharacter.cx + 8;
            const tailTipY = boxY + boxH + 18;

            ctx.save();
            ctx.globalAlpha = a;
            ctx.shadowColor = 'rgba(0, 0, 0, 0.65)';
            ctx.shadowBlur = 14;
            ctx.shadowOffsetY = 4;

            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(boxX, boxY, boxW, boxH, 14);
            ctx.fill();
            ctx.stroke();

            // Tail: two top vertices sit exactly on the bubble's bottom
            // edge so the triangle visibly fuses with the bubble; the
            // bottom tip points at Blue.
            ctx.beginPath();
            ctx.moveTo(tailBaseLeftX, boxY + boxH);
            ctx.lineTo(tailTipX, tailTipY);
            ctx.lineTo(tailBaseRightX, boxY + boxH);
            ctx.closePath();
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;
            ctx.fillStyle = '#1a2a4a';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            for (let i = 0; i < lines.length; i++) {
                ctx.fillText(lines[i], boxX + boxW / 2, boxY + padding + i * lineHeight);
            }
            ctx.restore();
        }

        // ===== 6.3 Main menu =====
        function drawMenu() {
            drawBackground();
            updateButtonHover();  // Phase-2B hover tracking

            // ----- Top-left star balance badge -----
            // Shows how many stars the player has collected in Classic
            // matches (1 point = 1 star) — the currency of the SKIN SHOP.
            // Cached per-account so the menu doesn't re-parse localStorage
            // every frame; invalidated whenever the balance changes.
            const starCount = getStarCountCached();
            const starCountText = starCount.toLocaleString('en-US');
            ctx.font = 'bold 15px Orbitron, sans-serif';
            const starTW = ctx.measureText(starCountText).width;
            const badgeH = 34;
            const badgeW = 32 + starTW + 22;
            const badgeX = 14;
            const badgeY = 14;
            ctx.fillStyle = 'rgba(26, 31, 44, 0.78)';
            ctx.strokeStyle = 'rgba(255, 191, 36, 0.5)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.roundRect(badgeX, badgeY, badgeW, badgeH, 17);
            ctx.fill();
            ctx.stroke();
            ctx.shadowColor = 'rgba(255, 191, 36, 0.85)';
            ctx.shadowBlur = 12;
            drawVectorIcon('star', badgeX + 17, badgeY + badgeH / 2, '#ffd84a', 1.05);
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ffd84a';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillText(starCountText, badgeX + 32, badgeY + badgeH / 2 + 1);
            ctx.textAlign = 'center';
            ctx.textBaseline = 'alphabetic';

            ctx.textAlign = 'center';
            ctx.shadowColor = 'rgba(138, 43, 226, 0.5)';
            ctx.shadowBlur = 50;

            const centerX = canvas.width / 2;
            const titleY = 170;

            ctx.font = 'bold 72px Orbitron, sans-serif';
            const starText = 'STAR';
            const catcherText = 'CATCHER';
            const starWidth = ctx.measureText(starText).width;
            const catcherWidth = ctx.measureText(catcherText).width;
            const totalTextWidth = starWidth + catcherWidth + 20;

            if (!rocketEmoji.isEscaping && rocketEmoji.escapeTimer <= 0) {
                rocketEmoji.baseX = centerX - totalTextWidth / 2 - 40;
                rocketEmoji.x = rocketEmoji.baseX;
                rocketEmoji.y = rocketEmoji.baseY;
            }

            ctx.font = 'bold 72px Orbitron, sans-serif';
            ctx.fillStyle = '#ffffff';
            ctx.fillText(starText, centerX - catcherWidth / 2 - 10, titleY);
            ctx.fillStyle = '#ffbf24';
            ctx.fillText(catcherText, centerX + starWidth / 2 + 10, titleY);

            ctx.save();
            ctx.translate(rocketEmoji.x, rocketEmoji.y);
            ctx.rotate(rocketEmoji.angle);
            ctx.font = '60px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = '#ff6b35';
            ctx.shadowBlur = 30;
            drawVectorIcon('rocket', 0, 0, '#ff6b35', 2.6);
            ctx.restore();

            ctx.shadowBlur = 10;
            ctx.shadowColor = 'black';
            ctx.font = '24px Orbitron, sans-serif';
            ctx.fillStyle = '#f1f5f9';
            ctx.fillText('Get the stars, beat the record!', canvas.width / 2, 215);

            // ============================================================
            // Phase-2C: Central Glassmorphism Panel
            // ============================================================
            const panelW = 500;
            const panelX = canvas.width / 2 - panelW / 2;
            const panelY = 240;
            // panelH trimmed from 358 → 348 so the panel's bottom edge
            // (588) stops well short of the canvas floor (600) instead
            // of sitting right up against it.
            const panelH = 348;
            const pad = 30;                     // internal padding
            const innerW = panelW - pad * 2;    // usable width inside panel
            const innerX = panelX + pad;

            // --- Glassmorphism panel background ---
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(26, 31, 44, 0.70)';
            ctx.strokeStyle = 'rgba(138, 43, 226, 0.35)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.roundRect(panelX, panelY, panelW, panelH, 16);
            ctx.fill();
            ctx.stroke();

            // Subtle inner highlight (top edge)
            const hlGrad = ctx.createLinearGradient(panelX, panelY, panelX, panelY + 60);
            hlGrad.addColorStop(0, 'rgba(138, 43, 226, 0.08)');
            hlGrad.addColorStop(1, 'rgba(138, 43, 226, 0)');
            ctx.fillStyle = hlGrad;
            ctx.beginPath();
            ctx.roundRect(panelX + 2, panelY + 2, panelW - 4, panelH - 4, 14);
            ctx.fill();

            // ============================================================
            // Pill-shaped Streak & Account Bar
            // ============================================================
            // Invalidate missions cache on every menu visit
            _cachedMissions = null;
            _cachedMissionsUser = null;

            const barY = panelY + 16;
            const barH = 38;
            const barW = innerW;
            const barX = innerX;

            // --- Pill background ---
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(26, 31, 44, 0.72)';
            ctx.strokeStyle = 'rgba(138, 43, 226, 0.30)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.roundRect(barX, barY, barW, barH, 20);
            ctx.fill();
            ctx.stroke();

            // --- Segment 1: STREAK badge (purple gradient pill) ---
            const seg1W = 82;
            const seg1X = barX + 4;
            const seg1Y = barY + 4;
            const seg1H = barH - 8;
            const s1Grad = ctx.createLinearGradient(seg1X, seg1Y, seg1X + seg1W, seg1Y);
            s1Grad.addColorStop(0, '#4a3aff');
            s1Grad.addColorStop(1, '#6c5ce7');
            ctx.fillStyle = s1Grad;
            ctx.shadowColor = 'rgba(74, 58, 255, 0.5)';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.roundRect(seg1X, seg1Y, seg1W, seg1H, 16);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.font = 'bold 11px Orbitron, sans-serif';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('STREAK', seg1X + seg1W / 2, seg1Y + seg1H / 2);

            // --- Separators helper ---
            function drawSep(x) {
                ctx.strokeStyle = 'rgba(138, 43, 226, 0.25)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(x, barY + 8);
                ctx.lineTo(x, barY + barH - 8);
                ctx.stroke();
            }

            const sep1X = seg1X + seg1W + 6;
            drawSep(sep1X);

            // --- Segment 2: Username ---
            const seg2X = sep1X + 6;
            const seg2W = 90;
            ctx.font = 'bold 13px Orbitron, sans-serif';
            ctx.textBaseline = 'middle';
            const displayName = currentUser
                ? (currentUser.length > 8 ? currentUser.slice(0, 7) + '…' : currentUser)
                : 'NO USER';
            ctx.fillStyle = currentUser ? '#f1f5f9' : '#9aa6b2';
            ctx.fillText(displayName, seg2X + seg2W / 2, barY + barH / 2);

            const sep2X = seg2X + seg2W + 6;
            drawSep(sep2X);

            // --- Streak data ---
            if (!_cachedMissions || _cachedMissionsUser !== currentUser) {
                _cachedMissions = currentUser ? refreshMissionsForUser(currentUser) : newMissionsRecord();
                _cachedMissionsUser = currentUser;
            }
            const m = _cachedMissions;
            const tick = Date.now() / 200;
            const flicker = 0.75 + Math.sin(tick * 1.7) * 0.18 + Math.sin(tick * 3.1) * 0.07;

            // --- Segment 3: Normal Streak (orange) ---
            const seg3X = sep2X + 8;
            const seg3W = 90;
            const ns = m.streakCount || 0;
            const flameOn = ns > 0;
            if (flameOn) {
                ctx.shadowColor = `rgba(255, 140, 0, ${(0.6 + flicker * 0.4).toFixed(2)})`;
                ctx.shadowBlur = 6 + flicker * 8;
                ctx.font = `${(15 + flicker * 3).toFixed(0)}px sans-serif`;
            } else {
                ctx.shadowBlur = 0;
                ctx.font = '15px sans-serif';
            }
            drawFlameIcon(seg3X + 14, barY + barH / 2, 0.9, flameOn, flameOn ? '#ff9f43' : null);
            ctx.shadowBlur = 0;
            ctx.font = 'bold 13px Orbitron, sans-serif';
            ctx.fillStyle = flameOn ? '#ff9f43' : '#555';
            ctx.fillText(String(ns), seg3X + seg3W - 16, barY + barH / 2);

            const sep3X = seg3X + seg3W + 6;
            drawSep(sep3X);

            // --- Segment 4: Super Streak (red) ---
            const seg4X = sep3X + 8;
            const seg4W = 90;
            const ss = m.superStreakCount || 0;
            const ssOn = ss > 0;
            if (ssOn) {
                ctx.shadowColor = `rgba(200, 40, 40, ${(0.6 + flicker * 0.4).toFixed(2)})`;
                ctx.shadowBlur = 6 + flicker * 8;
                ctx.font = `${(15 + flicker * 3).toFixed(0)}px sans-serif`;
            } else {
                ctx.shadowBlur = 0;
                ctx.font = '15px sans-serif';
            }
            drawFlameIcon(seg4X + 14, barY + barH / 2, 0.9, ssOn, ssOn ? '#e74c3c' : null);
            ctx.shadowBlur = 0;
            ctx.font = 'bold 13px Orbitron, sans-serif';
            ctx.fillStyle = ssOn ? '#e74c3c' : '#555';
            ctx.fillText(String(ss), seg4X + seg4W - 16, barY + barH / 2);

            // Reset text state
            ctx.shadowBlur = 0;
            ctx.textAlign = 'start';
            ctx.textBaseline = 'alphabetic';

            // --- Section helper ---
            // Teal accent (#49d7c8 / rgba(73, 215, 200, ...)) — the same
            // color as the SETTINGS GAME CONTROLS header and the settings
            // scroll-bar thumb. Slightly larger (bold 14px) so the three
            // section titles read clearly while staying compact.
            function drawSectionLabel(label, y) {
                ctx.shadowBlur = 6;
                ctx.shadowColor = 'rgba(73, 215, 200, 0.6)';
                ctx.font = 'bold 14px Orbitron, sans-serif';
                ctx.fillStyle = 'rgba(73, 215, 200, 0.9)';
                ctx.textAlign = 'center';
                ctx.fillText(label, canvas.width / 2, y);
                ctx.shadowBlur = 0;
            }

            // ===== ROW 1: MAIN (PLAY + ACCOUNT + SHOP) =====
            const sec1LabelY = barY + barH + 22;
            drawSectionLabel('— MAIN —', sec1LabelY);

            const row1Y = sec1LabelY + 12;
            const row1H = 52;
            const row1W = (innerW - 40) / 3;    // 3 buttons with 20px gaps
            const r1LeftX = innerX;
            const r1RightX = innerX + row1W + 20;
            const r1ShopX = innerX + (row1W + 20) * 2;

            drawGlassButton(r1LeftX, row1Y, row1W, row1H, 12, 'PLAY', 'bold 24px Orbitron, sans-serif', {
                icon: 'play',
                isPrimary: true,
                hoverStrength: hoverFor('play')
            });
            drawGlassButton(r1RightX, row1Y, row1W, row1H, 12, 'ACCOUNT', 'bold 17px Orbitron, sans-serif', {
                icon: 'account',
                hoverStrength: hoverFor('account')
            });
            // SKIN SHOP — spends the star balance on colored skins for the
            // main character / mascot. Same glass button style as its
            // row-mates so it reads as a first-class menu action.
            drawGlassButton(r1ShopX, row1Y, row1W, row1H, 12, 'SHOP', 'bold 17px Orbitron, sans-serif', {
                icon: 'shop',
                hoverStrength: hoverFor('shop')
            });

            // ===== ROW 2: MENU (RECORDS + SETTINGS + MISSIONS) =====
            const sec2LabelY = row1Y + row1H + 22;
            drawSectionLabel('— MENU —', sec2LabelY);

            const row2Y = sec2LabelY + 12;
            const row2H = 42;
            const row2W = (innerW - 40) / 3;    // 3 buttons with 20px gaps
            const r2aX = innerX;
            const r2bX = innerX + row2W + 20;
            const r2cX = innerX + (row2W + 20) * 2;

            drawGlassButton(r2aX, row2Y, row2W, row2H, 10, 'RECORDS', '18px Orbitron, sans-serif', {
                icon: 'records',
                hoverStrength: hoverFor('records')
            });
            drawGlassButton(r2bX, row2Y, row2W, row2H, 10, 'SETTINGS', '18px Orbitron, sans-serif', {
