            // Visually separate from the SOUNDS controls above so the new
            // gameplay-affecting toggle is clearly its own category.
            ctx.save();
            ctx.fillStyle = 'rgba(73, 215, 200, 0.9)';
            ctx.shadowColor = 'rgba(73, 215, 200, 0.6)';
            ctx.shadowBlur = 6;
            ctx.font = 'bold 14px Orbitron, sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('🎮 GAME CONTROLS', rowX, panelY + 425);
            ctx.restore();

            drawSettingsRow(rowX, panelY + 440, innerW, 56,
                '🖱 FREE MOVEMENT (Survival)',
                'Ship follows the cursor exactly — no smoothing, full screen.',
                settings.survivalFreeMovement, 'toggleSurvivalFreeMovement');

            ctx.restore();  // End of scroll-clip + translate group

            // ----- Side scroll bar (right edge of the panel) -------------
            // Drawn AFTER the scroll-clip ctx.restore so the thumb sits
            // on top of the clipped content rather than being scrolled
            // with it. Only meaningful when the logical content height
            // (SETTINGS_CONTENT_H = 510) is taller than the visible
            // panelH (449); when there is no overflow the thumb fills
            // the entire track.
            const sbTrackX = panelX + panelW - 12;
            const sbTrackY = panelY + 12;
            const sbTrackH = panelH - 24;
            const sbThumbH = Math.max(
                28,
                sbTrackH * (panelH / SETTINGS_CONTENT_H)
            );
            const sbThumbY = sbTrackY
                + (scrollRange > 0
                    ? (sbTrackH - sbThumbH) * (settingsScrollY / scrollRange)
                    : 0);

            // Subtle track — a narrow vertical strip on the right edge
            // of the panel, low-opacity white so it blends with the
            // dark teal panel glow rather than competing with the rows.
            ctx.fillStyle = 'rgba(255, 255, 255, 0.10)';
            ctx.fillRect(sbTrackX, sbTrackY, 4, sbTrackH);

            // Thumb — teal pill in the same accent as the GAME
            // CONTROLS section header so the scrollbar reads as part
            // of the panel chrome, not foreign UI. Glows brighter
            // while the user is actively dragging it; in this MVP
            // we DO NOT implement drag-from-thumb (wheel scrolling
            // is the only scroll input), so the brighter state is
            // reserved as a hook for future keyboard-scroll arrows.
            ctx.save();
            const thumbActive = isSettingsScrollDrag;
            ctx.shadowColor = thumbActive
                ? 'rgba(73, 215, 200, 0.85)'
                : 'rgba(73, 215, 200, 0.45)';
            ctx.shadowBlur = thumbActive ? 10 : 6;
            ctx.fillStyle = thumbActive
                ? 'rgba(73, 215, 200, 1.0)'
                : 'rgba(73, 215, 200, 0.7)';
            ctx.beginPath();
            ctx.roundRect(sbTrackX - 2, sbThumbY, 8, sbThumbH, 4);
            ctx.fill();
            ctx.restore();

            // ----- "Scrolled away from top" hint -------------------------
            // The per-account note lives inside the wrap (so it scrolls
            // with the content), which means once the user scrolls down
            // the original "Saved for ..." line disappears above the
            // panel edge. Re-print a SHORTER version next to the thumb
            // tip when scrollY > 4 so they still get visual confirmation
            // that their settings persist for this account.
            if (settingsScrollY > 4 && currentUser) {
                ctx.save();
                ctx.font = '10px Orbitron, sans-serif';
                ctx.shadowColor = 'rgba(73, 215, 200, 0.7)';
                ctx.shadowBlur = 4;
                ctx.fillStyle = 'rgba(73, 215, 200, 0.95)';
                ctx.textAlign = 'right';
                ctx.fillText('\u2713 Saved', panelX + panelW - 22, sbThumbY - 4);
                ctx.restore();
            }

            // BACK button — sits below the now-taller panel (5 rows
            // total) and below the per-account footer line above it.
            const btnW = 180;
            const btnH = 45;
            const btnX = canvas.width / 2 - btnW / 2;
            const btnY = canvas.height - 50;

            ctx.shadowBlur = 25;
            ctx.shadowColor = '#ff8800';
            ctx.fillStyle = '#6a3a1a';
            ctx.beginPath();
            ctx.roundRect(btnX, btnY, btnW, btnH, 14);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(255, 170, 80, 0.5)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(btnX, btnY, btnW, btnH, 14);
            ctx.stroke();

            ctx.fillStyle = '#ffd700';
            ctx.font = 'bold 22px Orbitron, sans-serif';
            // Draw the label with textBaseline='middle' so it sits
            // vertically centred inside the 45-px button regardless
            // of Orbitron's (slightly taller than average) ascent/
            // descent — the previous btnY + 30 trick left the cap-top
            // peeking above the border, so the button visibly "spilled"
            // its text on the upper edge.
            ctx.textBaseline = 'middle';
            ctx.fillText('\u2190 BACK', canvas.width / 2 - 50, btnY + btnH / 2);
            ctx.textBaseline = 'alphabetic';   // restore default for later code

            // Preserve the pill hit-rects that drawSettingsRow() pushed
            // earlier in this call, then add the BACK button rect.
            menuButtons.push({ rect: { x: btnX, y: btnY, w: btnW, h: btnH }, action: 'settingsBack' });

            ctx.textAlign = 'left';
            ctx.shadowBlur = 0;
        }

        function draw() {
            updatePauseButton();
            // Battle mode ships a mobile FIRE pad positioned outside the
            // canvas. The pad's visibility follows the current run-state,
            // so calling updateFireButton() at the top of draw() each
            // frame keeps it correctly shown / hidden during state
            // transitions (PLAYING → PAUSED → MENU, etc).
            updateFireButton();
            switch (gameState) {
                case GAME_STATES.MENU:
                    drawMenu();
                    break;
                case GAME_STATES.ACCOUNT:
                    drawAccountScreen();
                    break;
                case GAME_STATES.SETTINGS:
                    drawSettingsScreen();
                    break;
                case GAME_STATES.RECORDS:
                    drawRecordsScreen();
                    break;
                case GAME_STATES.MISSIONS:
                    drawMissionsScreen();
                    break;
                case GAME_STATES.DIFFICULTY: {
                    // Three rectangular cards laid out side-by-side on
                    // the main row, with a smaller BACK button centred
                    // below. Each card uses a colour that telegraphs
                    // its difficulty: green=EASY, orange=NORMAL,
                    // red=HARD (matching the project's existing palette
                    // for Resume / Survival / Battle-danger reds).
                    menuButtons = [];
                    ctx.textAlign = 'center';
                    // Header
                    ctx.shadowColor = '#ff9f43';
                    ctx.shadowBlur = 24;
                    ctx.fillStyle = '#ffd56a';
                    ctx.font = 'bold 44px Orbitron, sans-serif';
                    ctx.fillText('⚔ CHOOSE BATTLE DIFFICULTY', canvas.width / 2, 130);
                    ctx.shadowBlur = 0;
                    ctx.font = '14px Orbitron, sans-serif';
                    ctx.fillStyle = '#9bcfff';
                    ctx.fillText('Easy keeps the original cadence  \u2022  Normal speeds up enemies + adds rare fast meteorites  \u2022  Hard (placeholder) mirrors Normal', canvas.width / 2, 168);
                    // Card geometry
                    const cardW = 220;
                    const cardH = 220;
                    const cardGap = 24;
                    const rowW = cardW * 3 + cardGap * 2;
                    const cardsY = 215;
                    const cardsLeftX = canvas.width / 2 - rowW / 2;
                    const easyX = cardsLeftX;
                    const normalX = cardsLeftX + cardW + cardGap;
                    const hardX = cardsLeftX + (cardW + cardGap) * 2;
                    // --- Easy card (green) ---
                    ctx.shadowBlur = 28;
                    ctx.shadowColor = 'rgba(120, 255, 160, 0.55)';
                    ctx.fillStyle = '#1a4a2a';
                    ctx.beginPath();
                    ctx.roundRect(easyX, cardsY, cardW, cardH, 14);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = 'rgba(120, 255, 160, 0.8)';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.roundRect(easyX, cardsY, cardW, cardH, 14);
                    ctx.stroke();
                    ctx.fillStyle = '#cfffcf';
                    ctx.font = 'bold 30px Orbitron, sans-serif';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('EASY', easyX + cardW / 2, cardsY + 50);
                    ctx.font = '13px Orbitron, sans-serif';
                    ctx.fillStyle = '#aaffaa';
                    ctx.textBaseline = 'top';
                    ctx.fillText('Original enemy', easyX + cardW / 2, cardsY + 100);
                    ctx.fillText('cadence. Best', easyX + cardW / 2, cardsY + 119);
                    ctx.fillText('place to start.', easyX + cardW / 2, cardsY + 138);
                    // --- Normal card (orange) ---
                    ctx.shadowBlur = 28;
                    ctx.shadowColor = 'rgba(255, 170, 60, 0.65)';
                    ctx.fillStyle = '#6a3a1a';
                    ctx.beginPath();
                    ctx.roundRect(normalX, cardsY, cardW, cardH, 14);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = 'rgba(255, 170, 60, 0.85)';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.roundRect(normalX, cardsY, cardW, cardH, 14);
                    ctx.stroke();
                    ctx.fillStyle = '#ffd56a';
                    ctx.font = 'bold 30px Orbitron, sans-serif';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('NORMAL', normalX + cardW / 2, cardsY + 50);
                    ctx.font = '13px Orbitron, sans-serif';
                    ctx.fillStyle = '#ffe1a8';
                    ctx.textBaseline = 'top';
                    ctx.fillText('Enemies 2x faster.', normalX + cardW / 2, cardsY + 100);
                    ctx.fillText('Rare fast meteors', normalX + cardW / 2, cardsY + 119);
                    ctx.fillText('also appear.', normalX + cardW / 2, cardsY + 138);
                    // --- Hard card (red, mirrors Normal for now) ---
                    ctx.shadowBlur = 28;
                    ctx.shadowColor = 'rgba(255, 100, 100, 0.7)';
                    ctx.fillStyle = '#5a1a1a';
                    ctx.beginPath();
                    ctx.roundRect(hardX, cardsY, cardW, cardH, 14);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = 'rgba(255, 100, 100, 0.85)';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.roundRect(hardX, cardsY, cardW, cardH, 14);
                    ctx.stroke();
                    ctx.fillStyle = '#ff8a8a';
                    ctx.font = 'bold 30px Orbitron, sans-serif';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('HARD', hardX + cardW / 2, cardsY + 50);
                    // Regular 13 px throughout the Hard subtitle (Easy /
                    // Normal cards use a single 13 px weight so a bold
                    // prefix would look like a one-off glitch rather
                    // than a deliberate accent).
                    ctx.font = '13px Orbitron, sans-serif';
                    ctx.fillStyle = '#ffaaaa';
                    ctx.textBaseline = 'top';
                    ctx.fillText('(Normal for now \u2014', hardX + cardW / 2, cardsY + 100);
                    ctx.font = '13px Orbitron, sans-serif';
                    ctx.fillText('Hard-only rules', hardX + cardW / 2, cardsY + 119);
                    ctx.fillText('coming later)', hardX + cardW / 2, cardsY + 138);
                    ctx.textBaseline = 'alphabetic';
                    // Click targets
                    menuButtons.push({ rect: { x: easyX, y: cardsY, w: cardW, h: cardH }, action: 'pickDifficulty_easy' });
                    menuButtons.push({ rect: { x: normalX, y: cardsY, w: cardW, h: cardH }, action: 'pickDifficulty_normal' });
                    menuButtons.push({ rect: { x: hardX, y: cardsY, w: cardW, h: cardH }, action: 'pickDifficulty_hard' });
                    // BACK button below the row
                    const backW = 180;
                    const backH = 50;
                    const backX = canvas.width / 2 - backW / 2;
                    const backY = cardsY + cardH + 32;
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = 'rgba(255, 255, 255, 0.25)';
                    ctx.fillStyle = 'rgba(60, 64, 80, 0.92)';
                    ctx.beginPath();
                    ctx.roundRect(backX, backY, backW, backH, 10);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.roundRect(backX, backY, backW, backH, 10);
                    ctx.stroke();
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 18px Orbitron, sans-serif';
                    ctx.fillText('\u2190 BACK', canvas.width / 2, backY + 31);
                    menuButtons.push({ rect: { x: backX, y: backY, w: backW, h: backH }, action: 'difficultyBack' });
                    ctx.textAlign = 'left';
                    ctx.shadowBlur = 0;
                    break;
                }
                case GAME_STATES.PLAYING:
                    drawBackground();
                    if (gameMode === GAME_MODES.SURVIVAL) {
                        drawMeteorites();
                        drawSurvivalOverlay();   // red filter on top of bg + meteorites
                        drawMonster();          // cyclops face + beam drawn AFTER vignette so the dark green reads true
                    } else if (gameMode === GAME_MODES.BATTLE) {
                        // Battle mode owns its own scene: red enemy
                        // ships with HP bars, blue ray bullets, red
                        // ray bullets. Shared drawShip() still draws
                        // the player vessel underneath so dodging is
                        // visible. Ordering is bottom → top.
                        drawEnemies();
                        drawMeteorites();        // Normal/Hard Battle spawns rare meteorites — must render them or they'd be invisible damage sources
                        drawPlayerBullets();
                        drawEnemyBullets();
                    } else if (gameMode === GAME_MODES.COOP) {
                        // CO-OP scene: BOTH stars (Blue) and enemies
                        // (Green) live on-screen together like the
                        // player spec asks. Green beams render BEFORE
                        // the enemy so the explosion spark reads on top
                        // of the green beam glow. Blue ship draws
                        // BEFORE Green so Green's HP reads as a
                        // foreground ship (closer to the action zone).
                        drawEnemies();
                        drawGreenBeams();
                        drawFallingStars();
                        drawEnemyBullets();
                    } else {
                        drawFallingStars();
                    }
                    drawShip();
                    if (gameMode === GAME_MODES.COOP) drawGreenShip();
                    drawGameUI();
                    if (gameOver) drawGameOver();
                    break;
                case GAME_STATES.PAUSED:
                    drawBackground();
                    if (gameMode === GAME_STATES.SURVIVAL || gameMode === GAME_MODES.SURVIVAL) {
                        drawMeteorites();
                        drawSurvivalOverlay();
                    } else if (gameMode === GAME_MODES.COOP) {
                        // CO-OP paused frame: show both ships + the
                        // frozen enemy / star field so the player can
                        // read where everything was when they hit P.
                        // Falling stars + enemies + beams + enemy
                        // bullets render in the same order as the
                        // PLAYING state above so the paused frame is
                        // byte-identical to a single PLAYING frame
                        // snapshot.
                        drawEnemies();
                        drawGreenBeams();
                        drawFallingStars();
                        drawEnemyBullets();
                    } else {
                        drawFallingStars();
                    }
                    drawShip();
                    if (gameMode === GAME_MODES.COOP) drawGreenShip();
                    drawGameUI();
                    drawPauseScreen();
                    break;
            }
        }

        /* ============================================================
           7. HANDLE MENU ACTIONS
        ============================================================ */
        function handleMenuAction(action) {
            switch (action) {
                case 'play':
                    if (!currentUser) {
                        gameState = GAME_STATES.ACCOUNT;
                        accountInput = '';
                        showMobileInput(true);
                    } else {
                        startGame(GAME_MODES.CLASSIC);
                    }
                    break;
                case 'survival':
                    if (!currentUser) {
                        gameState = GAME_STATES.ACCOUNT;
                        accountInput = '';
                        showMobileInput(true);
                    } else {
                        startGame(GAME_MODES.SURVIVAL);
                    }
                    break;
                case 'playBattle':
                    if (!currentUser) {
                        gameState = GAME_STATES.ACCOUNT;
                        accountInput = '';
                        showMobileInput(true);
                    } else {
                        // Route through the difficulty picker so the
                        // player chooses Easy / Normal / Hard before
                        // the BGM kicks in. Resetting battleDifficulty
                        // each visit means a player isn't silently
                        // dropped into Normal or Hard after opting in
                        // once — the next menu-tap always starts fresh.
                        battleDifficulty = 'easy';
                        gameState = GAME_STATES.DIFFICULTY;
                    }
                    break;
                case 'pickDifficulty_easy':
                    battleDifficulty = 'easy';
                    startGame(GAME_MODES.BATTLE);
                    break;
                case 'pickDifficulty_normal':
                    battleDifficulty = 'normal';
                    startGame(GAME_MODES.BATTLE);
                    break;
                case 'pickDifficulty_hard':
                    // Hard is currently a 1:1 mirror of Normal —
                    // future rules will diverge here.
                    battleDifficulty = 'hard';
                    startGame(GAME_MODES.BATTLE);
                    break;
                case 'playCoop':
                    // CO-OP skips the Battle difficulty picker because
                    // the player spec says the cadence is the same as
                    // Battle (one enemy on screen at a time, telegraph
                    // before each shot). If a future difficulty picker
                    // is needed, lift CO-OP into its own DIFFICULTY
                    // state the same way Battle already does it.
                    if (!currentUser) {
                        gameState = GAME_STATES.ACCOUNT;
                        accountInput = '';
                        showMobileInput(true);
                    } else {
                        startGame(GAME_MODES.COOP);
                    }
                    break;
                case 'difficultyBack':
                    // User changed their mind; drop back to the main
                    // menu without touching battleDifficulty (which is
                    // already reset on the next menu-tap-to-battle).
                    gameState = GAME_STATES.MENU;
                    break;
                case 'account':
                    gameState = GAME_STATES.ACCOUNT;
                    accountInput = currentUser || '';
                    showMobileInput(true);
                    break;
                case 'missions':
                    if (!currentUser) {
                        gameState = GAME_STATES.ACCOUNT;
                        accountInput = '';
                        showMobileInput(true);
                    } else {
                        navigateToMissionsScreen();
                    }
                    break;
                case 'missionsBack':
                    navigateFromMissionsScreen();
                    break;
                case 'claimStreak':
                    claimDailyStreak();
                    break;
                case 'claimSuperStreak':
                    claimSuperStreak();
                    break;
                case 'records':
                    if (!currentUser) {
                        gameState = GAME_STATES.ACCOUNT;
                        accountInput = '';
                        showMobileInput(true);
                    } else {
                        flushPlayTime();      // ensure displayed time is current
                        gameState = GAME_STATES.RECORDS;
                    }
                    break;
                case 'confirm':
                    if (accountInput.trim().length > 0) {
                        const newUser = accountInput.trim();
                        if (newUser.length > 12) {
                            alert('The name must be at most 12 characters!');
                            return;
                        }
                        // Se è un nuovo nome diverso da currentUser, azzera i record
                        if (newUser !== currentUser && currentUser) {
                            if (confirm(`Changing account from "${currentUser}" to "${newUser}".\nYour previous records will be reset. Continue?`)) {
                                // Rimuovi i record del vecchio account
                                const allRecords = getAllRecords();
                                delete allRecords[currentUser];
                                delete allRecords[currentUser + '__survival'];
                                delete allRecords[currentUser + '__missions'];
                                delete allRecords[currentUser + '__playTime'];
                                saveAllRecords(allRecords);
                                currentUser = newUser;
                                getUserRecords(currentUser);
                                saveLastUser(currentUser);
                                settings = loadSettings();
                                resetGame();
                                gameState = GAME_STATES.MENU;
                                accountInput = newUser; // Mantieni il nuovo nome
                                showMobileInput(false);
                            }
                            // Se l'utente annulla, rimane nella schermata account
                        } else {
                            currentUser = newUser;
                            getUserRecords(currentUser);
                            saveLastUser(currentUser);
                            settings = loadSettings();
                            resetGame();
                            gameState = GAME_STATES.MENU;
                            accountInput = newUser; // Mantieni il nome
                            showMobileInput(false);
                        }
                    } else {
                        alert('Please enter a name!');
                    }
                    break;
                case 'cancel':
                    gameState = GAME_STATES.MENU;
                    accountInput = '';
                    showMobileInput(false);
                    break;
                case 'back':
                    gameState = GAME_STATES.MENU;
                    showMobileInput(false);
                    break;
                case 'playAgain':
                    stopMenuMusic();
                    flushPlayTime();
                    resetGame();
                    gameState = GAME_STATES.PLAYING;
                    startPlayTimer();
                    break;
                case 'menu':
                    flushPlayTime();
                    resetGame();
                    gameState = GAME_STATES.MENU;
                    stopClassicMusic();   // Classic BGM off before menu song takes over
                    stopSurvivalMusic();  // Survival BGM off before menu song takes over
                    playMenuMusic();
                    break;
                case 'pauseResume':
                    togglePause();
                    break;
                case 'pauseSave':
                    // Triggers the text-flash path inside
                    // saveCurrentRun (button reads "✓ SAVED" for 1.5 s
                    // then reverts). Pressing S has the same effect.
                    // The pause overlay stays open so the player can
                    // see the flash and then choose RESUME / MENU.
                    saveCurrentRun(true /* fromMenuButton */);
                    break;
                case 'pauseSettings':
                    gameStateBeforeSettings = GAME_STATES.PAUSED;
                    gameState = GAME_STATES.SETTINGS;
                    showMobileInput(false);
                    recordMissionEvent('visited_settings');
                    break;
                case 'pauseMenu':
                    flushPlayTime();
                    stopMenuMusic();
                    resetGame();
                    gameState = GAME_STATES.MENU;
                    stopClassicMusic();   // Classic BGM off before menu song takes over
                    stopSurvivalMusic();  // Survival BGM off before menu song takes over
                    playMenuMusic();
                    break;
                case 'settings':
                    gameStateBeforeSettings = GAME_STATES.MENU;
                    gameState = GAME_STATES.SETTINGS;
                    showMobileInput(false);
                    recordMissionEvent('visited_settings');
                    break;
                case 'toggleMusic':
                    settings.music = !settings.music;
                    saveSettings();
                    playMenuMusic();       // respects new settings.music value
                    playClickSound();
                    recordMissionEvent('toggled_setting');
                    break;
                case 'toggleClassicMusic':
                    settings.classicMusic = !settings.classicMusic;
                    saveSettings();
                    playClassicMusic();    // respects new settings.classicMusic value (silences or resumes the Classic BGM)
                    playClickSound();
                    recordMissionEvent('toggled_setting');
                    break;
                case 'toggleSfx':
                    settings.sfx = !settings.sfx;
                    saveSettings();
                    playClickSound();
                    recordMissionEvent('toggled_setting');
                    break;
                case 'menuVolDown':
                    if (settings.menuVolume > 0) {
                        setMenuVolume(settings.menuVolume - 0.1);
                        playMenuMusic();   // re-evaluate play/pause so a previously-paused song resumes when bumped back up
                        playClickSound();
                        recordMissionEvent('toggled_setting');
                    }
                    break;
                case 'menuVolUp':
                    if (settings.menuVolume < 1) {
                        setMenuVolume(settings.menuVolume + 0.1);
                        playMenuMusic();   // re-evaluate play/pause so a previously-paused song resumes when bumped back up
                        playClickSound();
                        recordMissionEvent('toggled_setting');
                    }
                    break;
                case 'classicVolDown':
                    if (settings.classicVolume > 0) {
                        setClassicVolume(settings.classicVolume - 0.1);
                        playClickSound();
                        recordMissionEvent('toggled_setting');
                    }
                    break;
                case 'classicVolUp':
                    if (settings.classicVolume < 1) {
                        setClassicVolume(settings.classicVolume + 0.1);
                        playClickSound();
                        recordMissionEvent('toggled_setting');
                    }
                    break;
                case 'toggleSurvivalMusic':
                    settings.survivalMusic = !settings.survivalMusic;
                    saveSettings();
                    playSurvivalMusic();   // respects new settings.survivalMusic value (silences or resumes the Survival BGM)
                    playClickSound();
                    recordMissionEvent('toggled_setting');
                    break;
                case 'toggleSurvivalFreeMovement':
                    // Flips the new GAME CONTROLS toggle: when ON, the
                    // Survival-mode ship tracks the cursor EXACTLY (no
                    // smoothing) and roams anywhere on canvas. No audio
                    // side-effect — this is purely a movement setting.
                    settings.survivalFreeMovement = !settings.survivalFreeMovement;
                    saveSettings();
                    playClickSound();
                    recordMissionEvent('toggled_setting');
                    break;
                case 'survivalVolDown':
                    if (settings.survivalVolume > 0) {
                        setSurvivalVolume(settings.survivalVolume - 0.1);
                        playClickSound();
                        recordMissionEvent('toggled_setting');
                    }
                    break;
                case 'survivalVolUp':
                    if (settings.survivalVolume < 1) {
                        setSurvivalVolume(settings.survivalVolume + 0.1);
                        playClickSound();
                        recordMissionEvent('toggled_setting');
                    }
                    break;
                case 'settingsBack':
                    if (gameStateBeforeSettings === GAME_STATES.PAUSED) {
                        gameState = GAME_STATES.PAUSED;
                    } else {
                        gameState = GAME_STATES.MENU;
                        showMobileInput(false);
                    }
                    gameStateBeforeSettings = GAME_STATES.MENU;
                    // Reset the Settings-panel scroll position so the
                    // user always re-enters the screen at the top and
                    // sees the SOUNDS controls without scrolling back
                    // up first; also clear any in-flight thumb-drag
                    // flag so a stuck drag doesn't keep modulating
                    // scrollY on subsequent visits.
                    settingsScrollY = 0;
                    isSettingsScrollDrag = false;
                    break;
                default:
                    break;
            }
            menuButtons = [];
        }

        /* ============================================================
           8. INPUT: MOUSE, KEYBOARD AND TOUCH
        ============================================================ */
        canvas.addEventListener('click', (event) => {
            const c = getGameCoords(event);
            for (const btn of menuButtons) {
                const r = btn.rect;
                if (c.x >= r.x && c.x <= r.x + r.w && c.y >= r.y && c.y <= r.y + r.h) {
                    handleMenuAction(btn.action);
                    break;
                }
            }
        });

        canvas.addEventListener('mousemove', (event) => {
            const c = getGameCoords(event);
            // Mirror the latest cursor position into the module-level
            // mouseX/mouseY globals so update() can read them in any
            // gameState. This is shared with touch events because
            // getGameCoords() already handles touches/touch-changed.
            mouseX = c.x;
            mouseY = c.y;
            const wasHovering = blueCharacter.isHovering;
            if (gameState === GAME_STATES.MENU) {
                if (!rocketEmoji.isEscaping) {
                    const dx = c.x - rocketEmoji.x;
                    const dy = c.y - rocketEmoji.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < 50) {
                        rocketEmoji.isEscaping = true;
                        rocketEmoji.escapeTimer = 1200; // 20 secondi a 60 FPS
                        const speed = 5 + Math.random() * 4;
                        const angle = Math.random() * Math.PI * 2;
                        rocketEmoji.vx = Math.cos(angle) * speed;
                        rocketEmoji.vy = Math.sin(angle) * speed;
                    }
                }
                const hoverNow = blueHoverHitTest(c.x, c.y);
                blueCharacter.isHovering = hoverNow;
                if (hoverNow && !wasHovering) {
                    pickNewBlueLine();
                }
            } else {
                blueCharacter.isHovering = false;
            }

            if (gameState === GAME_STATES.PLAYING) {
                player.targetX = c.x;
            }
        });

        // ----- Save-game state + helper functions -----
        // Both the S/s hotkey and the pause-menu SAVE button go
        // through saveCurrentRun() — the boolean argument picks
        // which visual feedback path fires:
        //   * false (hotkey) → the S pill in the HUD briefly lights
        //                      up at full opacity for 1.5 s.
        //   * true  (button) → the pause-menu button text changes
        //                      from "💾 SAVE" to "✓ SAVED" for 1.5 s,
        //                      then reverts, so the player still gets
        //                      confirmation even though the pause
        //                      overlay already covers the HUD pills.
        let menuSaveBtnText = '\ud83d\udcbe SAVE';
        let menuSaveBtnFlashUntil = 0;

        // ----- Centered "Saved" overlay state -----
        // Time-bounded slot for the big centered ✓ Saved confirmation
        // that fires after every successful save — whether the trigger
        // is the S/s hotkey or the pause-menu SAVE button. This
        // serves as the screen-spanning confirmation the user can NOT
        // miss even when attention was elsewhere at the moment of
        // save. The 2.0 s window is split 0..1.5 s at full alpha,
        // 1.5..2.0 s linear fade-out, so it doesn't pop out abruptly
        // at expiry. Set in saveCurrentRun() after the localStorage
        // + records writes; drawn in drawSavedOverlay() called at the
        // END of drawGameUI() (so it sits on top of the Battle HP bar
        // and HUD overlay during game play) AND drawPauseScreen()
        // (so it sits on top of the pause backdrop when saved from
        // the pause overlay).
        let savedOverlayUntil = 0;

        // Render the centred ✓ Saved confirmation. Single source of
        // truth for the overlay's appearance so PLAYING and PAUSED
        // states always agree on font, colour, position, and fade-out
        // curve. ctx.save() / ctx.restore() wrap the draw so the rest
        // of the frame's ctx state (font, shadow, baseline, alpha)
        // isn't polluted by this overlay.
        function drawSavedOverlay() {
            const now = Date.now();
            if (now >= savedOverlayUntil) return;
            const remain = savedOverlayUntil - now;
            const alpha = remain > 500 ? 1 : (remain / 500);
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            // Light-green (#aaffaa) + matching green glow — same
            // palette family as the green Resume button / green
            // "success" cues elsewhere in the project — so the toast
            // reads as the "saved / safe / continue" family.
            ctx.shadowColor = '#aaffaa';
            ctx.shadowBlur = 40;
            ctx.fillStyle = '#aaffaa';
            ctx.font = 'bold 64px Orbitron, sans-serif';
            ctx.fillText('\u2713 Saved', canvas.width / 2, canvas.height / 2);
            ctx.restore();
        }

        // Pulse the S pill in the HUD at full opacity for 1.5 s,
        // then fade it back to whatever opacity it had before (0
        // while idle, 1 while the pause overlay is up — the
        // function does NOT touch display state, only the toast
        // flash is layered on top).
        function flashSavePill() {
            const sHint = document.getElementById('saveKeyHint');
            if (!sHint) return;
            // Bright snap-in so the pulse reads as "something
            // happened" rather than as a normal show transition.
            sHint.style.transition = 'opacity 0.18s ease';
            sHint.style.opacity = '1';
            if (sHint._saveFlashTimer) clearTimeout(sHint._saveFlashTimer);
            sHint._saveFlashTimer = setTimeout(() => {
                // Restore the default fade the .key-hint CSS class
                // provides (0.28 s ease) so the next show / hide
                // cycles in lock-step with the P pill.
                sHint.style.opacity = '';
                sHint.style.transition = '';
            }, 1500);
        }

        // Snapshot the current in-flight run to localStorage under
        // the per-account __save bucket so a future Resume feature
        // (out of scope today) can re-launch the same mode at the
        // same score / lives / hp / survival-start-time. The
        // function is intentionally cheap and idempotent — repeated
        // presses just overwrite the previous snapshot.
        function saveCurrentRun(fromMenuButton) {
            // Silent no-op for logged-out users: progress belongs to
            // an account, and a __default key would conflict with
            // anyone who later logs in with that same default key.
            if (!currentUser) return;
            // gameOver=true means the run has just ended — the
            // records bucket already holds the just-completed score,
            // and resuming a dead run would let the player dodge a
            // death by saving mid-damage-frame then reloading.
            if (gameOver) return;
            try {
                const all = getAllRecords();
                // Survival absolute Date.now() so resume can copy
                // the value verbatim into survivalStartTime without
                // a discontinuity in the per-second score tick —
                // the same Date.now()-arithmetic the run uses while
                // playing will continue to work after resume.
                const survivalStartAbs = (gameMode === GAME_MODES.SURVIVAL
                    && survivalStartTime > 0)
                    ? survivalStartTime
                    : (gameMode === GAME_MODES.SURVIVAL ? Date.now() : 0);
                const battleElapsed = gameMode === GAME_MODES.BATTLE
                    ? (typeof battleElapsedMs === 'number' ? battleElapsedMs : 0)
                    : 0;
                all[`${currentUser}__save`] = {
                    savedAt: Date.now(),
                    mode: gameMode,
                    score: score,
                    lives: lives,
                    hp: hp,
                    battleElapsedMs: battleElapsed,
                    survivalStartTime: survivalStartAbs
                };
                saveAllRecords(all);
                // Audio-feedback rationale: PLAY + MENU paths can have
                // the SAME minimum baseline confirmation so neither
                // path feels silent. The hotkey gets only
                // playClickSound() — a small tactile tick that won't
                // startle the player who's playing actively — while
                // the in-pause-menu button additionally layers
                // playRecordSound(), the 4-note celebratory chord,
                // because the player isn't actively playing at that
                // moment and a stronger cue helps confirm the save.
                // Both paths still flash their respective UI element
                // (pill or button text) so audio + visual never miss.
                playClickSound();
                if (fromMenuButton) {
                    menuSaveBtnText = '\u2713 SAVED';
                    menuSaveBtnFlashUntil = Date.now() + 1500;
                    playRecordSound();
                } else {
                    flashSavePill();
                }
                // ----- Persist score to per-mode records -----
                // The previous iteration saved only to the
                // ${user}__save bucket (snapshot for a future Resume
                // feature). The player expects Save to ALSO show up
                // in the RECORDS screen for the matching mode, so the
                // current run's score is additionally pushed into the
                // per-mode top-10 via the same helper gameOver uses.
                // addScoreToUser / addSurvivalScoreToUser /
                // addBattleScoreToUser silently no-op on score <= 0
                // (e.g. saving before catching anything), so a
                // 0-score save doesn't bloat the records bucket.
                if (score > 0) {
                    if (gameMode === GAME_MODES.CLASSIC) {
                        addScoreToUser(currentUser, score);
                    } else if (gameMode === GAME_MODES.SURVIVAL) {
                        addSurvivalScoreToUser(currentUser, score);
                    } else if (gameMode === GAME_MODES.BATTLE) {
                        addBattleScoreToUser(currentUser, score);
                    }
                }
                // ----- Trigger the screen-spanning overlay -----
                // 2.0 s window so the player has time to read the
                // toast even if their eyes were elsewhere at the
                // moment of save. drawSavedOverlay() handles the fade
                // out automatically — no separate timer needed here.
                savedOverlayUntil = Date.now() + 2000;
            } catch (e) {
                // localStorage quota / disabled storage: best-effort.
                // The audio cue is INSIDE the try so a quota error
                // also skips the click-sound false-positive.
            }
        }

        window.addEventListener('keydown', (event) => {

            // ----- CO-OP arrow key tracking -----
            // The green player (Player 2) responds to Left/Right/Up
            // arrows + Space while a CO-OP run is active. We mirror
            // the same guard on gameState/state used for `P` below so
            // the keys are no-ops outside an active CO-OP run — the
            // mission-menu PAUSED state and the records / settings
            // screens all stay free of green-movement side effects.
            if (gameState === GAME_STATES.PLAYING
                && gameMode === GAME_MODES.COOP && !gameOver) {
                if (event.key === 'ArrowLeft') coopKeys.left = true;
                else if (event.key === 'ArrowRight') coopKeys.right = true;
                else if (event.key === 'ArrowUp') coopKeys.up = true;
                else if (event.key === ' ' || event.code === 'Space') {
                    coopKeys.space = true;
                    // Suppress the browser's default Space-scroll
                    // behaviour so the green shoot key doesn't also
                    // page-scroll the canvas iframe edge cases.
                    event.preventDefault();
                }
            }

            if (gameState === GAME_STATES.PLAYING) {
                if (event.key === 'r' || event.key === 'R') {
                    if (gameOver) {
                        resetGame();
                        gameState = GAME_STATES.PLAYING;
                    }
                }
            }

            if (event.key === 'p' || event.key === 'P') {
                if (gameState === GAME_STATES.PLAYING || gameState === GAME_STATES.PAUSED) {
                    togglePause();
                    event.preventDefault();
                }
            }

            // ----- Save-game hotkey (S / s) -----
            // Same state gate as the P hotkey (PLAYING or PAUSED) plus
            // an extra !gameOver guard so saving after death doesn't
            // dodge the just-rolled game-over screen. saveCurrentRun()
            // itself is a no-op when currentUser is null, so logged-out
            // users pressing S get a silent skip plus the in-game
            // audio still fires (the playRecordSound() inside the
            // function is guarded behind currentUser, so truly
            // logged-out users get nothing — by design).
            if ((event.key === 's' || event.key === 'S')
                && (gameState === GAME_STATES.PLAYING || gameState === GAME_STATES.PAUSED)
                && !gameOver) {
                saveCurrentRun(false /* fromMenuButton */);
                event.preventDefault();
            }

            // ----- Missions page keyboard nav -----
            // MENU + (account set) + M: open Missions page (also by
            // clicking the big "M KEY" pill in the top-right).
            // MISSIONS + Esc: back to menu. PLAYING keeps its own
            // R-key handler in the block above; the checks below only
            // fire when the gameState is on MENU/MISSIONS, never
            // during play.
            if (gameState === GAME_STATES.MENU && currentUser
                && (event.key === 'm' || event.key === 'M')) {
                navigateToMissionsScreen();
                event.preventDefault();
            }
            if (gameState === GAME_STATES.MISSIONS) {
                if (event.key === 'Escape') {
                    navigateFromMissionsScreen();
                    event.preventDefault();
                }
            }

            if (gameState === GAME_STATES.ACCOUNT) {
                const inputField = document.getElementById('accountMobileInput');
                if (event.key === 'Backspace') {
                    accountInput = accountInput.slice(0, -1);
                    if (inputField) inputField.value = accountInput;
                    event.preventDefault();
                } else if (event.key.length === 1 && accountInput.length < 12) {
                    if (/^[a-zA-Z0-9_]$/.test(event.key)) {
                        accountInput += event.key;
                        if (inputField) inputField.value = accountInput;
                        event.preventDefault();
                    }
                }
            }
        });


        // Touch drag on canvas — drives the ship during gameplay AND
        // the Blue mascot on the menu (since mousemove never fires on
        // touch devices).
        let canvasTouchActive = false;
        canvas.addEventListener('touchstart', (event) => {
            const c = getGameCoords(event);
            if (gameState === GAME_STATES.PLAYING) {
                canvasTouchActive = true;
                player.targetX = c.x;
            } else if (gameState === GAME_STATES.MENU && IS_MOBILE) {
                // Tap Blue to make him speak. The hover state is held
                // for ~1.5s via a timestamp so there is time to read the
                // bubble before it fades back out. preventDefault keeps
                // the touch from bubbling into a synthetic click ~300 ms
                // later that could double-hit a button under the bubble.
                if (blueHoverHitTest(c.x, c.y)) {
                    blueCharacter.isHovering = true;
                    blueCharacter.hoverResetAt = Date.now() + 1500;
                    pickNewBlueLine();
                    event.preventDefault();
                }
            }
        }, { passive: true });
        canvas.addEventListener('touchmove', (event) => {
            if (gameState === GAME_STATES.PLAYING && canvasTouchActive) {
                const c = getGameCoords(event);
                player.targetX = c.x;
                // Touch machines that fire on touch want player.targetX
                // anyway, but the new Survival free-movement branch in
                // update() reads mouseX/mouseY directly. Mirroring here
                // keeps mobile touch players on equal footing with the
                // desktop mousemove path so toggling Free Movement ON
                // works the same on a phone as on a mouse.
                mouseX = c.x;
                mouseY = c.y;
            }
        }, { passive: true });
        canvas.addEventListener('touchend', (event) => {
            if (gameState === GAME_STATES.PLAYING) {
                canvasTouchActive = false;
            }
        }, { passive: true });

        // Cached at script load so the pointerup listener below can
        // attach. Without this, the bare `if (pauseButton)` would
        // hit a ReferenceError because no global pauseButton exists
        // (the only declarations are function-scoped inside
        // updatePauseButton / positionPauseButton).
        const pauseButton = document.getElementById('pauseButton');

        if (pauseButton) {
            const handlePausePress = (e) => {
                e.preventDefault();
                if (gameState === GAME_STATES.PLAYING || gameState === GAME_STATES.PAUSED) {
                    togglePause();
                }
            };

            pauseButton.addEventListener('pointerup', handlePausePress);
        }

        const mobileConfirmBtn = document.getElementById('mobileConfirmBtn');
        const mobileCancelBtn = document.getElementById('mobileCancelBtn');
        const accountMobileInput = document.getElementById('accountMobileInput');

        if (mobileConfirmBtn) {
            mobileConfirmBtn.addEventListener('click', () => {
                const input = document.getElementById('accountMobileInput');
                const name = input.value.trim();
                console.log('Confirm clicked, name:', name);
                if (name.length > 0 && name.length <= 12) {
                    accountInput = name;
                    handleMenuAction('confirm');
                } else {
                    alert('Please enter a valid name (1-12 characters).');
                    input.focus();
                }
            });
        }

        if (mobileCancelBtn) {
            mobileCancelBtn.addEventListener('click', () => {
                console.log('Cancel clicked');
                handleMenuAction('cancel');
            });
        }

        // Gestore per cancellare il nome corrente
        const mobileClearNameBtn = document.getElementById('mobileClearNameBtn');
        if (mobileClearNameBtn) {
            mobileClearNameBtn.addEventListener('click', () => {
                accountInput = '';
                const input = document.getElementById('accountMobileInput');
                if (input) input.value = '';
                input.focus();
            });
        }

        // Gestore per cancellare l'account
        const mobileClearAccountBtn = document.getElementById('mobileClearAccountBtn');
        if (mobileClearAccountBtn) {
            mobileClearAccountBtn.addEventListener('click', () => {
                if (confirm('Are you sure you want to delete your account?\nThis will remove all your records permanently.')) {
                    // Rimuovi tutti i record dell'account
                    const allRecords = getAllRecords();
                    delete allRecords[currentUser];
                    delete allRecords[currentUser + '__survival'];
                    delete allRecords[currentUser + '__missions'];
                    delete allRecords[currentUser + '__playTime'];
                    saveAllRecords(allRecords);

                    // Rimuovi l'ultimo utente salvato
                    localStorage.removeItem('starCatcherLastUser');

                    currentUser = null;
                    accountInput = '';
                    settings = loadSettings();
                    gameState = GAME_STATES.ACCOUNT;
                    showMobileInput(true);
                    const input = document.getElementById('accountMobileInput');
                    if (input) input.value = '';
                }
            });
        }

        // Focus automatico sull'input quando l'utente lo tocca
        const accountInputField = document.getElementById('accountMobileInput');
        if (accountInputField) {
            // Imposta il valore corrente all'avvio
            accountInputField.value = accountInput || '';

            accountInputField.addEventListener('touchstart', () => {
                accountInputField.focus();
                // Non reimpostare il valore qui! Altrimenti cancella ciò che l'utente sta scrivendo
            });
            accountInputField.addEventListener('input', () => {
                accountInput = accountInputField.value.slice(0, 12);
                if (accountInputField.value !== accountInput) {
                    accountInputField.value = accountInput;
                }
            });
        }

        if (accountMobileInput) {
            accountMobileInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    document.getElementById('mobileConfirmBtn').click();
                }
                if (e.key === 'Escape') {
                    document.getElementById('mobileCancelBtn').click();
                }
            });
        }

        /* ============================================================
           9. POLYFILL AND UTILITIES
        ============================================================ */
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                if (r > w / 2) r = w / 2;
                if (r > h / 2) r = h / 2;
                this.moveTo(x + r, y);
                this.lineTo(x + w - r, y);
                this.quadraticCurveTo(x + w, y, x + w, y + r);
                this.lineTo(x + w, y + h - r);
                this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                this.lineTo(x + r, y + h);
                this.quadraticCurveTo(x, y + h, x, y + h - r);
                this.lineTo(x, y + r);
                this.quadraticCurveTo(x, y, x + r, y);
                return this;
            };
        }


        /* ============================================================
           10. GAME LOOP AND INITIALIZATION
        ============================================================ */
        function gameLoop() {
            update();
            updateRocketEmoji();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Inizializza l'audio alla prima interazione dell'utente (richiesto da Web API)
        function initAudioOnUserInteraction() {
            initAudio();
            initMenuAudio();
            loadStarSound();
            // Rimuovi gli event listener dopo l'inizializzazione
            document.removeEventListener('click', initAudioOnUserInteraction);
            document.removeEventListener('keydown', initAudioOnUserInteraction);
            document.removeEventListener('touchstart', initAudioOnUserInteraction);

            // Mobile autoplay-unlock recovery: re-attempt to start
            // the menu song at +1 s, after the user's first
            // interaction has unlocked audio on iOS / Android.
            setTimeout(() => {
                if (gameState === GAME_STATES.MENU) {
                    playMenuMusic();
                }
            }, 1000);
        }

        document.addEventListener('click', initAudioOnUserInteraction);
        document.addEventListener('keydown', initAudioOnUserInteraction);
        document.addEventListener('touchstart', initAudioOnUserInteraction);

        // ----- CO-OP keyup handler -----
        // Releases the coopKeys flags when the player lets go of an
        // arrow key or spacebar. Without this the green ship would
        // keep moving / shooting forever the moment the first key
        // is pressed (the flag would stick at `true`). We intentionally
        // listen on the window so the release is captured even when
        // the canvas has lost focus.
        window.addEventListener('keyup', (event) => {
            if (event.key === 'ArrowLeft') coopKeys.left = false;
            else if (event.key === 'ArrowRight') coopKeys.right = false;
            else if (event.key === 'ArrowUp') coopKeys.up = false;
            else if (event.key === ' ' || event.code === 'Space') {
                coopKeys.space = false;
            }
        });
        // Clear sticky keys when the window loses focus (alt-tab,
        // browser switch, etc.) so a player returning to the page
        // doesn't find the green ship still gliding sideways.
        window.addEventListener('blur', () => {
            coopKeys.left = false;
            coopKeys.right = false;
            coopKeys.up = false;
            coopKeys.space = false;
        });

        // ----- Battle Mode input handlers -----
        // Desktop: fire a blue ray bullet on right-mouse-down while a
        // Battle run is in progress. Right-click is reserved for this
        // purpose; the browser context menu is suppressed everywhere on
        // the canvas via the canvas-level `contextmenu` preventDefault
        // registered near the top of the script, so this listener is
        // never interrupted by the pop-up menu.
        canvas.addEventListener('mousedown', (e) => {
            if (e.button === 2 &&
                gameMode === GAME_MODES.BATTLE &&
                gameState === GAME_STATES.PLAYING &&
                !gameOver) {
                e.preventDefault();
                fireBullet();
            }
        });

        // Mobile fallback: a dedicated FIRE button overlay that lives
        // outside the canvas. Touch users cannot trigger a button === 2
        // event, so they tap this pad instead. The button is HIDDEN by
        // default; `updateFireButton()` toggles its visibility from the
        // main render loop so it appears only while a Battle run is in
        // progress on a touch-first viewport.
        const fireButton = document.createElement('button');
        fireButton.id = 'fireButton';
        fireButton.setAttribute('aria-label', 'Fire ray bullet');
        fireButton.style.cssText = [
            'position:fixed',
            'z-index:55',
            'display:none',
            'align-items:center',
            'justify-content:center',
            'width:88px',
            'height:88px',
            'border-radius:24px',
            'border:1px solid rgba(255,138,61,0.85)',
            'background:linear-gradient(180deg, rgba(74,26,10,0.95), rgba(46,16,6,0.95))',
            'color:#ffd2a8',
            'font:900 24px Orbitron, sans-serif',
            'cursor:pointer',
            'user-select:none',
            'touch-action:manipulation',
            'box-shadow:0 0 24px rgba(255,138,61,0.4)',
            'transition:transform 0.12s ease'
        ].join(';');
        fireButton.textContent = '🎯';
        document.body.appendChild(fireButton);

        fireButton.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (gameMode === GAME_MODES.BATTLE &&
                gameState === GAME_STATES.PLAYING &&
                !gameOver) {
                fireBullet();
            }
        }, { passive: false });
        fireButton.addEventListener('mousedown', (e) => {
            e.preventDefault();
            if (gameMode === GAME_MODES.BATTLE &&
                gameState === GAME_STATES.PLAYING &&
                !gameOver) {
                fireBullet();
            }
        });

        // Position the FIRE pad on the right edge below the canvas and
        // show/hide it from the render loop. Mirrors the
        // positionPauseButton() pattern so future re-layouts share
        // the same logic.
        //
        // FIX (reviewer found a layout bug here): use the explicit
        // fixed dimensions (88 px on each axis, set in `cssText`)
        // instead of `fireButton.offsetWidth`. While `display: none`
        // the browser strips layout for the element so `offsetWidth`
        // reads 0 — meaning the first time the button becomes visible
        // it would paint at `left = rect.right - 0 - 16` and stick
        // there until the layout pass that happens AFTER the very next
        // paint cycle. Hardcoding the geometry avoids the layout
        // dependency entirely.
        const FIRE_BUTTON_W = 88;
        const FIRE_BUTTON_H = 88;
        function positionFireButton() {
            if (!fireButton) return;
            const rect = canvas.getBoundingClientRect();
            const margin = 16;
            fireButton.style.left = (rect.right - FIRE_BUTTON_W - margin) + 'px';
            fireButton.style.top = (rect.bottom - FIRE_BUTTON_H - margin) + 'px';
        }

        function updateFireButton() {
            if (!fireButton) return;
            const shouldShow =
                IS_MOBILE &&
                gameMode === GAME_MODES.BATTLE &&
                gameState === GAME_STATES.PLAYING &&
                !gameOver;
            // Set display FIRST; only then position. `positionFireButton`
            // relies on hardcoded geometry rather than the element's
            // measured size so this ordering is also safe with the old
            // `display: none` bug, but flipping the order keeps the
            // intent obvious.
            fireButton.style.display = shouldShow ? 'flex' : 'none';
            if (shouldShow) positionFireButton();
        }
        window.addEventListener('resize', positionFireButton);
        window.addEventListener('orientationchange', () => setTimeout(positionFireButton, 100));

        // No-interaction fallback: also attempt to start the menu
        // song at +1 s for desktop / browsers that allow autoplay.
        setTimeout(() => {
            if (gameState === GAME_STATES.MENU) {
                playMenuMusic();
            }
        }, 1000);

        const savedUser = loadLastUser();
        if (savedUser) {
            currentUser = savedUser;
            getUserRecords(currentUser);
        }
        settings = loadSettings();

        resetGame();
        gameLoop();
    </script>
</body>

</html>
