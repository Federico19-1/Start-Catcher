                        clearTimeout(sHint._hideTimer);
                        sHint._hideTimer = null;
                    }
                    sHint.style.display = 'flex';
                }
                positionPauseButton();
                if (hint) hint.style.opacity = '1';
                if (sHint) sHint.style.opacity = '1';
            } else {
                pauseButton.style.display = 'none';
                const sHint = document.getElementById('saveKeyHint');
                if (hint) {
                    // Fade the pill out before un-mounting it so it doesn't
                    // pop in / out abruptly across state transitions.
                    hint.style.opacity = '0';
                    if (hint._hideTimer) clearTimeout(hint._hideTimer);
                    hint._hideTimer = setTimeout(() => {
                        hint.style.display = 'none';
                        hint._hideTimer = null;
                    }, 350);
                }
                if (sHint) {
                    // Mirror the P-pill fade-out so the S pill stays
                    // in lock-step visually (same 350 ms fade, same
                    // un-mount after the timer fires).
                    sHint.style.opacity = '0';
                    if (sHint._hideTimer) clearTimeout(sHint._hideTimer);
                    sHint._hideTimer = setTimeout(() => {
                        sHint.style.display = 'none';
                        sHint._hideTimer = null;
                    }, 350);
                }
            }
        }

        // Position the pause button JUST OUTSIDE the canvas (the "game
        // screen"), right next to it with a small gap. Tries the left side
        // first (the most natural ergonomic spot on widescreen), then the
        // right side, then above, then below — so it works on every viewport
        // without encroaching on the playing field. Acts as the visible
        // companion to the P/p keyboard shortcut, performing the same
        // togglePause(). Both elements use position:fixed so the values
        // returned by canvas.getBoundingClientRect() (viewport coords) are
        // directly what we set on the inline styles — no body-padding
        // compensation required.
        function positionPauseButton() {
            const pauseButton = document.getElementById('pauseButton');
            if (!pauseButton) return;
            const rect = canvas.getBoundingClientRect();
            const btnSize = 72;
            const gap = 14;
            const minMargin = 8;

            let btnX, btnY;

            const leftX = rect.left - btnSize - gap;
            if (leftX >= minMargin) {
                btnX = leftX;
                btnY = rect.top + gap;
            } else {
                const rightX = rect.right + gap;
                if (rightX + btnSize <= window.innerWidth - minMargin) {
                    btnX = rightX;
                    btnY = rect.top + gap;
                } else {
                    const aboveY = rect.top - btnSize - gap;
                    if (aboveY >= minMargin) {
                        btnX = Math.max(minMargin, rect.left);
                        btnY = aboveY;
                    } else {
                        const belowY = rect.bottom + gap;
                        if (belowY + btnSize <= window.innerHeight - minMargin) {
                            btnX = Math.max(minMargin, rect.left);
                            btnY = belowY;
                        } else {
                            btnX = minMargin;
                            btnY = minMargin;
                        }
                    }
                }
            }

            pauseButton.style.left = btnX + 'px';
            pauseButton.style.top = btnY + 'px';
            // The P hint pill rides alongside the button — place it
            // IMMEDIATELY BESIDE the button so the keyboard shortcut is
            // visually obvious to anyone watching the pause button.
            positionPauseKeyHint(btnX, btnY, btnSize);
        }

        // Position the small "P" key hint pill IMMEDIATELY BESIDE the
        // pause button. The pill always lands on the side AWAY from the
        // canvas (so the button + pill sandwich the play field from each
        // side, never overlap it), then falls back to the *other* side,
        // then below, so the pill stays visible no matter which corner
        // of the canvas the button is parked against.
        function positionPauseKeyHint(btnX, btnY, btnSize) {
            const hint = document.getElementById('pauseKeyHint');
            if (!hint) return;
            const hRect = hint.getBoundingClientRect();
            const hintW = hRect.width || 50;
            const hintH = hRect.height || 32;
            const gapBetween = 8;
            const minMargin = 8;
            const hintYAligned = btnY + (btnSize - hintH) / 2;
            const canvasRect = canvas.getBoundingClientRect();

            // Which canvas-side is the button on? "side" matters more than
            // "side that happens to fit in viewport" — we always prefer the
            // outside-of-canvas side first so the pill can't overlap play.
            const onLeftOfCanvas = btnX < canvasRect.left;
            const onRightOfCanvas = (btnX + btnSize) > canvasRect.right;
            const setPos = (vx, vy) => {
                hint.style.left = vx + 'px';
                hint.style.top = vy + 'px';
                // Stack the S pill directly below the P pill at the
                // same horizontal x, separated by an 8 px gap. This
                // single setPos hook drives ALL four fallback cases
                // (left, right, above, below the canvas) so the S
                // pill follows the P pill through every P-positioning
                // branch without a separate position function.
                const sHint = document.getElementById('saveKeyHint');
                if (sHint) {
                    sHint.style.left = vx + 'px';
                    sHint.style.top = (vy + hintH + 8) + 'px';
                }
            };

            // Phase 1 — preferred side: AWAY from canvas.
            if (onLeftOfCanvas) {
                const hintX = btnX - hintW - gapBetween;
                if (hintX >= minMargin) { setPos(hintX, hintYAligned); return; }
            } else if (onRightOfCanvas) {
                const hintX = btnX + btnSize + gapBetween;
                if (hintX + hintW <= window.innerWidth - minMargin) {
                    setPos(hintX, hintYAligned); return;
                }
            } else {
                // Button is above / below canvas — try right then left.
                const rightX = btnX + btnSize + gapBetween;
                if (rightX + hintW <= window.innerWidth - minMargin) {
                    setPos(rightX, hintYAligned); return;
                }
                const leftX = btnX - hintW - gapBetween;
                if (leftX >= minMargin) { setPos(leftX, hintYAligned); return; }
            }

            // Phase 2 — opposite of preferred. Try the canvas-facing side
            // but BAIL if it would bite the canvas — the canvas gap is
            // rarely wide enough to fit a 50px pill, so this branch is
            // almost always dead code and that's fine, it stays as a
            // defensive fallback for whatever viewport some future player
            // brings along. NOTE: both checks must pass AND-wise; an OR
            // would let the viewport check alone approve a placement that
            // overlaps the canvas.
            if (onLeftOfCanvas) {
                const hintX = btnX + btnSize + gapBetween;
                if (hintX + hintW <= canvasRect.left - 4
                    && hintX + hintW <= window.innerWidth - minMargin) {
                    setPos(hintX, hintYAligned); return;
                }
            } else if (onRightOfCanvas) {
                const hintX = btnX - hintW - gapBetween;
                if (hintX >= canvasRect.right + 4
                    && hintX >= minMargin) {
                    setPos(hintX, hintYAligned); return;
                }
            }

            // Phase 3 — directly below the button.
            const hintYBelow = btnY + btnSize + 4;
            if (hintYBelow + hintH <= window.innerHeight - minMargin) {
                setPos(btnX, hintYBelow); return;
            }
            // Phase 4 — viewport corner fallback so the pill is never lost.
            setPos(minMargin, minMargin);
        }

        function updateRocketEmoji() {
            if (gameState !== GAME_STATES.MENU) {
                if (rocketEmoji.isEscaping) {
                    rocketEmoji.isEscaping = false;
                    rocketEmoji.escapeTimer = 0;
                    rocketEmoji.vx = 0;
                    rocketEmoji.vy = 0;
                }
                return;
            }

            if (rocketEmoji.isEscaping) {
                rocketEmoji.x += rocketEmoji.vx;
                rocketEmoji.y += rocketEmoji.vy;
                rocketEmoji.angle = Math.atan2(rocketEmoji.vy, rocketEmoji.vx) + Math.PI / 2;

                const margin = 40;
                if (rocketEmoji.x < margin || rocketEmoji.x > canvas.width - margin) {
                    rocketEmoji.vx *= -1;
                    rocketEmoji.x = Math.max(margin, Math.min(canvas.width - margin, rocketEmoji.x));
                }
                if (rocketEmoji.y < margin || rocketEmoji.y > canvas.height - margin) {
                    rocketEmoji.vy *= -1;
                    rocketEmoji.y = Math.max(margin, Math.min(canvas.height - margin, rocketEmoji.y));
                }

                rocketEmoji.escapeTimer--;
                if (rocketEmoji.escapeTimer <= 0) {
                    rocketEmoji.isEscaping = false;
                    rocketEmoji.vx = 0;
                    rocketEmoji.vy = 0;
                    rocketEmoji.angle = 0;
                }
            }
        }

        /* ============================================================
           5. UPDATE GAME STATE
        ============================================================ */
        function update() {
            if (gameState !== GAME_STATES.PLAYING || gameOver) return;

            // Movement has two branches:
            //
            //   (A) Survival-mode free movement (toggle ON) — the ship
            //       tracks the cursor EXACTLY and is allowed anywhere on
            //       canvas. Reads mouseX/mouseY globals that the
            //       mousemove handler keeps fresh. No smoothing, full
            //       vertical freedom, same radius-inward clamping as
            //       the smoothed branch so the ship never clips past
            //       the canvas edges.
            //
            //   (B) Default smoothed horizontal damping toward
            //       player.targetX — same behaviour as before, applies
            //       to Classic + Battle + Survival-when-toggle-OFF.
            //
            // Mouse, touch, and the canvas drag handler (which updates
            // targetX on move events) are the only ways to steer —
            // keyboard arrow movement is gone.
            if (gameMode === GAME_MODES.SURVIVAL
                && settings.survivalFreeMovement) {
                // Snap directly to the cursor (no targetX smoothing,
                // full vertical freedom). Clamp the same way the
                // smoothed branch does so the ship never half-straddles
                // the canvas edge no matter which way the cursor is.
                player.x = mouseX;
                player.y = mouseY;
                if (player.x < player.radius) player.x = player.radius;
                if (player.x > canvas.width - player.radius) player.x = canvas.width - player.radius;
                if (player.y < player.radius) player.y = player.radius;
                if (player.y > canvas.height - player.radius) player.y = canvas.height - player.radius;
            } else {
                player.x += (player.targetX - player.x) * 0.3;
                if (player.x < player.radius) player.x = player.radius;
                if (player.x > canvas.width - player.radius) player.x = canvas.width - player.radius;
            }

            if (gameMode === GAME_MODES.CLASSIC) {
                // Classic: stars fall; catching them gives points, missing
                // them costs a life.
                if (Math.random() < 0.05) {
                    stars.push(createStar());
                }

                for (let i = stars.length - 1; i >= 0; i--) {
                    const star = stars[i];
                    star.y += star.speed;

                    const dx = player.x - star.x;
                    const dy = player.y - star.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    const collisionDistance = player.radius + star.radius;

                    if (distance < collisionDistance) {
                        comboStreak++;
                        comboBest = Math.max(comboBest, comboStreak);
                        const comboBonus = Math.min(3, Math.floor(comboStreak / 5));
                        if (star.kind === 'lucky') {
                            luckyStarsCaught++;
                            score += 3 + comboBonus;
                            if (lives < 3) {
                                lives++;
                            }
                            playRecordSound();
                        } else {
                            score += 1 + comboBonus;
                            playCollectSound();
                        }
                        stars.splice(i, 1);
                        continue;
                    }

                    if (star.y > canvas.height + star.radius) {
                        comboStreak = 0;
                        lives--;
                        playLoseLifeSound();
                        stars.splice(i, 1);
                        if (lives <= 0) endGame();
                        continue;
                    }
                }

                if (stars.length > 100) {
                    stars.splice(0, stars.length - 100);
                }

                // In-game NEW RECORD banner (classic only)
                if (!inGameRecordShown && currentUser && score > 0
                    && getMaxScore(currentUser) > 0
                    && score >= getMaxScore(currentUser)) {
                    inGameRecordShown = true;
                    inGameRecordShownAt = Date.now();
                }
            } else if (gameMode === GAME_MODES.SURVIVAL) {
                // Survival: meteorites fall; dodging them is the goal.
                // Hitting the ship costs a life. Score = seconds survived.
                updateSurvival();
            } else if (gameMode === GAME_MODES.BATTLE) {
                // Battle: red ships drop in and shoot the player; right-click
                // (or the mobile FIRE pad) fires blue ray bullets. Score = kills.
                // All enemy / bullet / HP bookkeeping lives inside updateBattle();
                // we just pass in the current wall-clock so it can compute its
                // own dt-relative animations and spawn cadence.
                updateBattle(Date.now());
            } else if (gameMode === GAME_MODES.COOP) {
                // ----- CO-OP mode tick -----
                // Two-player shared run. Stars use the OLD Classic spawn
                // cadence (5% chance per frame) because Blue is the only
                // one catching them; enemies reuse Battle's full spawn
                // ramp because Green needs the same threat density to be
                // able to keep up with the +2-per-kill economy.
                updateCoop(Date.now());
            }
        }

        // ----- Monster helpers (Survival only) -----
        // All monsters share one entry point: spawnMonster() flips
        // monster.active = true and resets state, while updateMonster()
        // ticks the warp-in/active/fade-out state machine forward each
        // frame. The damage gate lives in updateSurvival() so it can
        // coordinate with the existing lives-- / endGame() flow.

        function spawnMonster(now) {
            monster.active = true;
            monster.state = 'warp-in';
            // Random side per spawn (50/50) so the player can't memorise
            // a single dodge column. cx sits 60 px from the chosen edge
            // so the face disc clips "the body" off-canvas as the user
            // described, with the visible portion of the face taking
            // up roughly the inner 60% of the side margin.
            monster.side = Math.random() < 0.5 ? 'left' : 'right';
            monster.cx = monster.side === 'left' ? 60 : 740;
            // Random vertical row per spawn from MONSTER_SPAWN_ROWS
            // (TOP / CENTER / BOTTOM). The previous code pinned cy=300,
            // which meant the beam always hit the same horizontal band
            // and a stationary player could camp one safe y. Now the
            // player must read the spawn position each time.
            monster.cy = MONSTER_SPAWN_ROWS[
                Math.floor(Math.random() * MONSTER_SPAWN_ROWS.length)
            ];
            monster.stateStartedMs = now;
            monster.beamActive = false;
        }

        function updateMonster(now) {
            // Lazy-spawn check: only ONE monster on screen at a time.
            // Until the player's survival clock passes monsterNextSpawnAtMs,
            // we sit idle.
            if (!monster.active && monsterNextSpawnAtMs > 0
                && survivalElapsedMs() >= monsterNextSpawnAtMs) {
                spawnMonster(now);
            }
            if (!monster.active) return;

            const elapsed = now - monster.stateStartedMs;
            if (monster.state === 'warp-in' && elapsed >= MONSTER_WARP_IN_MS) {
                monster.state = 'active';
                monster.stateStartedMs = now;
                monster.beamActive = false;
            } else if (monster.state === 'active' && elapsed >= MONSTER_ACTIVE_MS) {
                monster.state = 'fade-out';
                monster.stateStartedMs = now;
                monster.beamActive = false;
            } else if (monster.state === 'fade-out' && elapsed >= MONSTER_FADE_OUT_MS) {
                monster.active = false;
                // Schedule the next monster with a randomised gap so
                // back-to-back appearances don't feel mechanical.
                const gap = SURVIVAL_MONSTER_RESPAWN_MIN_MS
                    + Math.floor(Math.random()
                        * (SURVIVAL_MONSTER_RESPAWN_MAX_MS
                            - SURVIVAL_MONSTER_RESPAWN_MIN_MS));
                monsterNextSpawnAtMs = survivalElapsedMs() + gap;
                return;
            }
            // Beam-on delay inside 'active' so the player has a beat
            // to see the monster before damage starts accruing.
            if (monster.state === 'active'
                && (now - monster.stateStartedMs) >= MONSTER_BEAM_ONSET_MS) {
                monster.beamActive = true;
            }
        }

        // Returns true when the player's hit circle overlaps the active
        // beam rectangle. Circle-vs-rect test via the "closest point"
        // trick: clamp the circle centre to the rect, distance to
        // radius wins. True even when the player is partially OUT of
        // the rect but still grazing it.
        function isPlayerInMonsterBeam() {
            if (!monster.active || !monster.beamActive) return false;
            // Beam rectangle: starts at the monster's cx and runs all
            // the way across the canvas to the opposite edge. Vertical
            // bounds use beamSpanY/2 — the SAME half-extent that
            // drawMonsterBeam() uses to draw the visible band — so the
            // hit rectangle exactly matches the visible beam. (The
            // previous version used the full beamSpanY as a half-extent,
            // which silently doubled the hitbox height — pair that with
            // the player's 100-px Classic-mode radius and you could
            // lose a life even when visibly outside the beam, which
            // was the "1 HP at end of beam for no reason" bug.)
            const x0 = monster.side === 'left' ? monster.cx : 0;
            const x1 = monster.side === 'left' ? canvas.width : monster.cx;
            const y0 = monster.cy - monster.beamSpanY / 2;
            const y1 = monster.cy + monster.beamSpanY / 2;
            const closestX = Math.max(x0, Math.min(player.x, x1));
            const closestY = Math.max(y0, Math.min(player.y, y1));
            const dx = player.x - closestX;
            const dy = player.y - closestY;
            // Tight ship-body radius — see MONSTER_BEAM_PLAYER_HIT_RADIUS
            // for the rationale. Using player.radius=100 here would let
            // a player who's well clear of the visible beam still be
            // counted as "in beam" via their star-catching bubble.
            return (dx * dx + dy * dy) < (MONSTER_BEAM_PLAYER_HIT_RADIUS * MONSTER_BEAM_PLAYER_HIT_RADIUS);
        }

        // ----- Monster render -----
        // drawMonster() is the single entry point called from the main
        // render pipeline (between drawMeteorites and drawSurvivalOverlay
        // in the PLAYING/Survival branch). Internally it composites the
        // beam first (so the face disc reads ON TOP of it where the
        // two overlap at the canvas edge) and then the face primitives
        // (body, antenna, mouth, eye). Alpha eases in/out for the
        // warp-in and fade-out phases.
        function drawMonsterBeam() {
            const x0 = monster.side === 'left' ? monster.cx : -20;
            const x1 = monster.side === 'left' ? canvas.width + 20 : monster.cx;
            const yTop = monster.cy - monster.beamSpanY / 2;
            const yBot = monster.cy + monster.beamSpanY / 2;
            // Normal alpha compositing (no 'lighter') so the green
            // beam reads as a translucent band over the red vignette
            // without RGB-add muddying the colours. The three stacked
            // rects (broad body + bright core + shimmer line) build
            // up the light effect through overlapping opacity rather
            // than additive blending, which keeps the colour of the
            // face disc underneath stable.
            // Broad translucent body
            ctx.fillStyle = 'rgba(170, 255, 170, 0.20)';
            ctx.fillRect(x0, yTop, x1 - x0, yBot - yTop);
            // Bright narrow core on top of body
            ctx.fillStyle = 'rgba(220, 255, 220, 0.70)';
            ctx.fillRect(x0, monster.cy - 8, x1 - x0, 16);
            // Pulse shimmer line for energy read
            ctx.fillStyle = 'rgba(255, 255, 255, 0.60)';
            ctx.fillRect(x0, monster.cy - 1, x1 - x0, 2);
        }

        function drawMonsterFace() {
            const fx = monster.cx;
            const fy = monster.cy;
            const r = monster.faceRadius;
            // sgn = -1 for side='right' (eye looks LEFT into canvas),
            // +1 for 'left' (eye looks RIGHT into canvas). The eye-
            // highlight + iris offset use this so the cyclops stares
            // at the player regardless of side.
            const sgn = monster.side === 'left' ? 1 : -1;
            ctx.save();
            // Outline glow so the dark green face reads against the
            // red survival vignette without disappearing into it.
            ctx.shadowColor = '#aaffaa';
            ctx.shadowBlur = 26;

            // Body disc — taller-than-wide green ellipse so the
            // antenna + mouth + eye all fit vertically inside it.
            ctx.fillStyle = '#1a4a2a';
            ctx.beginPath();
            ctx.ellipse(fx, fy, r * 1.05, r * 1.25, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#0e3a1a';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Antenna — thin stem + glowing green dot on the forehead.
            ctx.strokeStyle = '#0e3a1a';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(fx, fy - r * 1.0);
            ctx.lineTo(fx, fy - r * 1.45);
            ctx.stroke();
            ctx.fillStyle = '#aaffaa';
            ctx.shadowColor = '#aaffaa';
            ctx.shadowBlur = 14;
            ctx.beginPath();
            ctx.arc(fx, fy - r * 1.5, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Mouth — wide dark rectangle across the lower face with a
            // row of small triangle teeth so it reads as "wide mouth"
            // rather than just a flat slot.
            const mw = r * 1.4;
            const mh = r * 0.42;
            const mx = fx - mw / 2;
            const my = fy + r * 0.45;
            ctx.fillStyle = '#000';
            ctx.fillRect(mx, my, mw, mh);
            ctx.fillStyle = '#dfd';
            for (let i = 0; i < 6; i++) {
                const tx = mx + (mw / 6) * i + (mw / 12);
                ctx.beginPath();
                ctx.moveTo(tx - 6, my + 4);
                ctx.lineTo(tx + 6, my + 4);
                ctx.lineTo(tx, my + mh - 3);
                ctx.closePath();
                ctx.fill();
            }

            // Single large eye — white sclera ellipse + green iris +
            // black pupil + tiny white highlight, offset toward the
            // inside of the canvas so it always looks AT the player.
            const eyeOffsetX = sgn * -10;
            const eyeOffsetY = -r * 0.12;
            const ex = fx + eyeOffsetX;
            const ey = fy + eyeOffsetY;
            const ew = r * 0.85;     // sclera half-width
            const eh = r * 0.55;     // sclera half-height
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.ellipse(ex, ey, ew, eh, 0, 0, Math.PI * 2);
            ctx.fill();
            // Iris — large green circle
            ctx.fillStyle = '#aaffaa';
            ctx.beginPath();
            ctx.arc(ex + sgn * 10, ey, ew * 0.55, 0, Math.PI * 2);
            ctx.fill();
            // Pupil — black slit
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(ex + sgn * 14, ey, ew * 0.30, 0, Math.PI * 2);
            ctx.fill();
            // White highlight
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(ex + sgn * 18, ey - eh * 0.35, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawMonster() {
            if (!monster.active) return;
            // Alpha eases in/out for warp-in / fade-out so the
            // monster doesn't pop in or out abruptly.
            const now = Date.now();
            const elapsed = now - monster.stateStartedMs;
            let alpha = 1;
            if (monster.state === 'warp-in') {
                alpha = Math.min(1, elapsed / MONSTER_WARP_IN_MS);
            } else if (monster.state === 'fade-out') {
                alpha = Math.max(0, 1 - elapsed / MONSTER_FADE_OUT_MS);
            }
            ctx.save();
            ctx.globalAlpha = alpha;
            // Beam first so the face primitives read ON TOP of the
            // beam where the two overlap at the canvas edge.
            if (monster.beamActive) drawMonsterBeam();
            drawMonsterFace();
            ctx.restore();
        }

        function updateSurvival() {
            // Score grows with time — convert real-time elapsed since the
            // run started into an integer-seconds counter via an accumulator.
            if (survivalStartTime === 0) {
                // Late-initialise so the timer starts the moment survival
                // begins. resetGame() also prepares this to 0.
                survivalStartTime = Date.now();
            }
            survivalScorePerSecondTick += (Date.now() - survivalStartTime) / 1000;
            const newSeconds = Math.floor(survivalScorePerSecondTick);
            survivalStartTime = Date.now();
            if (newSeconds > score) {
                score = newSeconds;
            }

            // Meteorite spawn cadence gradually ramps up the longer the
            // player survives, so the run keeps getting harder.
            const elapsedSec = score;
            const spawnChance = Math.min(0.025 + elapsedSec * 0.0008, 0.10);
            if (Math.random() < spawnChance) {
                meteorites.push(createMeteorite());
            }

            // Tick down i-frames after a hit so the player can take another
            // one once the brief invincibility window is over.
            if (meteoriteHitCooldown > 0) meteoriteHitCooldown--;

            for (let i = meteorites.length - 1; i >= 0; i--) {
                const m = meteorites[i];
                m.y += m.speed;
                m.rotation += m.rotationSpeed;

                // Player is briefly invincible after a hit so consecutive
                // meteorites in roughly the same column cannot drain all
                // three lives in an instant.
                if (meteoriteHitCooldown === 0) {
                    const dx = player.x - m.x;
                    const dy = player.y - m.y;
                    // Survival uses a deliberately forgiving capture radius so
                    // a glancing meteorite won't drain a life. The hit zone
                    // covers a moderate core around the ship's centre — the
                    // player must still take care, but a near miss is no
                    // longer a guaranteed hit. The mode stays gentle while
                    // feeling less unfair on tight dodges.
                    const hitDistance = player.radius * 0.20 + m.radius * 0.35;
                    const dist2 = dx * dx + dy * dy;
                    if (dist2 < hitDistance * hitDistance) {
                        lives--;
                        meteoriteHitCooldown = 60;  // ~1 second of i-frames at 60fps
                        playLoseLifeSound();
                        meteorites.splice(i, 1);
                        if (lives <= 0) endGame();
                        continue;
                    }
                }

                if (m.y > canvas.height + m.radius * 2) {
                    // Safely dodged — meteorites that leave the screen
                    // get a small puff (intensity 0) so the screen never
                    // feels static, but it stays clearly gentler than
                    // the big hit burst on the other path.
                    meteorites.splice(i, 1);
                }
            }

            // Tick down active explosions (debris flies, shockwave
            // expands, every layer fades). Called every frame so bursts
            // finish cleanly even when no new meteorite spawns.

            // Cleanup only meteorites that have fully left the screen.
            // Do not cull on-screen meteorites just because the array is large.
            for (let i = meteorites.length - 1; i >= 0; i--) {
                const m = meteorites[i];
                if (m.y > canvas.height + m.radius * 2) {
                    meteorites.splice(i, 1);
                }
            }
            // ----- Survival monster update + beam damage gate -----
            // The monster state machine runs every survival frame so
            // warp-in / active / fade-out animations progress
            // regardless of beam damage (otherwise an early death would
            // freeze the monster mid-animation).
            updateMonster(Date.now());
            // Beam damage is gated by !gameOver so a single frame of
            // intersection after endGame() can't drain lives below
            // zero — defence in depth on top of endGame()'s own
            // gameOver flag.
            if (!gameOver) {
                const inBeam = isPlayerInMonsterBeam();
                if (inBeam) {
                    if (playerInBeamSince === 0) {
                        // First beam contact does NOT deal damage —
                        // the only way to lose a life is to remain
                        // inside the beam for a full 2 seconds. Just
                        // arm the timer so the dwell-then-tick rule
                        // below can decide when to deduct a life.
                        // This fixes the prior bug where entering the
                        // beam at the instant the monster appeared
                        // always cost an extra life on top of the
                        // 2-s sustained tick.
                        playerInBeamSince = Date.now();
                    } else if (Date.now() - playerInBeamSince >= 2000) {
                        // Sustained contact: -1 life every 2 s while
                        // the player remains inside the beam. Resetting
                        // playerInBeamSince to "now" rather than to 0
                        // keeps the cadence on a 2-s rolling window
                        // rather than draining 1 life per frame.
                        lives--;
                        playLoseLifeSound();
                        playerInBeamSince = Date.now();
                        if (lives <= 0) endGame();
                    }
                } else if (playerInBeamSince > 0) {
                    // Player left the beam — clear the entry timestamp
                    // so the NEXT entry starts a fresh 2-s grace window
                    // before any life can be deducted.
                    playerInBeamSince = 0;
                }
            }
        }

        // ----- Battle mode loop -----
        // A self-contained branch added at the end of update() so the
        // existing Classic and Survival logic keeps its proven shape.
        // The branch runs only when gameMode === BATTLE; it owns:
        //   * spawning new enemy ships according to a cooldown that
        //     shrinks as battleElapsedMs grows,
        //   * advancing every enemy toward its anchorY unless it has
        //     been destroyed, then telegraph & fire red bullets,
        //   * moving player / enemy bullets, then resolving collisions
        //     in reverse to safely splice hits out of the array,
        //   * draining player hp on hits and flipping the
        //     `noDamageBattleToday` flag the first time hp dips below
        //     100 (used by the `battle_no_damage` daily mission),
        //   * ending the game when hp ≤ 0 via the shared endGame() hook.
        function updateBattle(nowMs) {
            battleElapsedMs += 16;
            // Spawn cadence — at t=0 we wait ~90 frames for the first
            // arrival; by ~60s of play we cap at one enemy every 60
            // frames, with a hard ceiling of 4 enemies on screen so the
            // field never becomes unfair on slow devices.
            battleSpawnCooldown -= 1;
            if (battleSpawnCooldown <= 0 && battleEnemies.length < 4) {
                battleEnemies.push(createEnemy());
                // Re-arm: starts at 180, ticks down toward 60 as the
                // player has been alive longer. Linear ease.
                // Battle-Mode difficulty scaling: Normal/Hard halves
                // the spawn-cooldown range so enemies appear MUCH
                // faster AND more frequently than in Easy. Easy keeps
                // the 60..180 frame range untouched so old saves line
                // up identically with the previous build.
                const t = Math.min(1, battleElapsedMs / 60000);
                if (battleDifficulty === 'easy') {
                    battleSpawnCooldown = Math.round(180 - t * 120);
                } else {
                    // Normal + Hard: 30..90 frame range (≈ 0.5x Easy).
                    battleSpawnCooldown = Math.round(90 - t * 60);
                }
            }

            // Enemies advance to anchorY then hover / fire.
            for (let i = battleEnemies.length - 1; i >= 0; i--) {
                const e = battleEnemies[i];
                if (e.state === 'entering') {
                    e.y += 1.4;
                    if (e.y >= e.anchorY) {
                        e.y = e.anchorY;
                        e.state = 'hover';
                        e.fireTimer = 60 + Math.floor(Math.random() * 60);
                    }
                } else {
                    // Hover: gentle horizontal sway + telegraph before
                    // each red ray bolt.
                    e.swayPhase += 0.05;
                    e.x = e.anchorX + Math.sin(e.swayPhase) * 14;
                    e.flashTimer = Math.max(0, e.flashTimer - 1);
                    e.fireTimer -= 1;
                    if (e.fireTimer <= 0) {
                        // 30-frame telegraph = visible white flash so
                        // the player can dodge.
                        if (e.flashTimer === 0) e.flashTimer = 30;
                        if (e.flashTimer > 0) {
                            // wait for telegraph to elapse before firing
                            if (e.flashTimer === 1) {
                                enemyBullets.push({
                                    x: e.x,
                                    y: e.y + 28,
                                    radius: 6,
                                    vy: 5.0 + Math.min(2, battleElapsedMs / 30000),
                                    dmg: 10 + Math.floor(Math.random() * 21)
                                });
                                playEnemyShootSound();
                                e.fireTimer = 100 + Math.floor(Math.random() * 80);
                            }
                        }
                    }
                }
            }

            // Player bullets — straight up, no gravity, no sway.
            for (let i = playerBullets.length - 1; i >= 0; i--) {
                const b = playerBullets[i];
                b.y += b.vy;
                if (b.y < -20) {
                    playerBullets.splice(i, 1);
                }
            }

            // Enemy bullets — straight down, increasing vy with time.
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                const b = enemyBullets[i];
                b.y += b.vy;
                if (b.y > canvas.height + 20) {
                    enemyBullets.splice(i, 1);
                }
            }

            // Player bullets vs enemies (reverse-loop so splice is safe).
            for (let i = playerBullets.length - 1; i >= 0; i--) {
                const b = playerBullets[i];
                let consumed = false;
                for (let j = battleEnemies.length - 1; j >= 0; j--) {
                    const e = battleEnemies[j];
                    const dx = b.x - e.x;
                    const dy = b.y - e.y;
                    if (dx * dx + dy * dy < 36 * 36) {
                        // Apply damage; only increment the kill counter
                        // when this hit is the one that takes the enemy
                        // from positive hp to zero, so a stacked
                        // bullet cluster cannot over-credit the score.
                        e.hp -= b.dmg;
                        if (e.hp > 0) {
                            // Enemy is hurt — flash it briefly, leave it
                            // alive so the same bullet does not jump to
                            // a second enemy.
                            e.flashTimer = 8;
                            break;
                        }
                        battleEnemies.splice(j, 1);
                        score += 1;
                        playEnemyExplodeSound();
                        consumed = true;
                        break;
                    }
                }
                if (consumed) playerBullets.splice(i, 1);
            }

            // Enemy bullets vs player. Same i-frame rule as Survival
            // (`meteoriteHitCooldown` doubles as the Battle cooldown so
            // a wall of bullets cannot drain all 100 HP in a single
            // frame).
            if (meteoriteHitCooldown > 0) meteoriteHitCooldown -= 1;
            if (meteoriteHitCooldown === 0) {
                for (let i = enemyBullets.length - 1; i >= 0; i--) {
                    const b = enemyBullets[i];
                    const dx = b.x - player.x;
                    const dy = b.y - player.y;
                    if (dx * dx + dy * dy < 80 * 80) {
                        if (hp === 100) {
                            // First bite of the run — record that the
                            // no-damage mission is now permanently
                            // impossible today for this account.
                            const m = currentUser ? refreshMissionsForUser(currentUser) : null;
                            if (m) {
                                m.noDamageBattleToday = false;
                                saveUserMissions(currentUser, m);
                            }
                        }
                        hp = Math.max(0, hp - b.dmg);
                        playLoseLifeSound();
                        enemyBullets.splice(i, 1);
                        meteoriteHitCooldown = 36; // ~0.6s i-frames
                        if (hp <= 0) {
                            endGame();
                            break;
                        }
                    }
                }
            }

            // If we die by some other path (e.g. manual menu back), the
            // endGame call above is the canonical state change; the
            // game-over overlay will pick up from `gameOver`.

            // ----- Battle-Mode meteorites (Normal + Hard only) -----
            // Normal/Hard Battle runs add rare fast meteorites on top
            // of the normal enemy stream so the player has to dodge
            // TWO threat types at once. Easy skips this block entirely.
            //   * Spawn cadence: 0.5% per frame ≈ one meteorite every
            //     200 frames (~3.3 s at 60 fps) — well below enemy
            //     spawn rate so meteorites feel like SURPRISE hazards.
            //   * Speed: m.speed *= 2 — explicitly "much faster than
            //     Survival" per spec. createMeteorite() seeds a base
            //     speed of roughly 3-5 px/frame; doubling makes them
            //     6-10 px/frame which is hard to dodge but still gives
            //     half-a-second of visual warning.
            //   * Collision: uses the same Survival collision maths
            //     (player.radius * 0.20 + m.radius * 0.35) and the
            //     shared meteoriteHitCooldown i-frame window so a
            //     meteorite never double-fires.
            if (battleDifficulty !== 'easy') {
                if (Math.random() < 0.005) {
                    const m = createMeteorite();
                    m.speed *= 2;
                    meteorites.push(m);
                }
                for (let i = meteorites.length - 1; i >= 0; i--) {
                    const m = meteorites[i];
                    m.y += m.speed;
                    m.rotation += m.rotationSpeed;
                    if (m.y > canvas.height + m.radius * 2) {
                        meteorites.splice(i, 1);
                        continue;
                    }
                    if (meteoriteHitCooldown === 0) {
                        const dx = player.x - m.x;
                        const dy = player.y - m.y;
                        const hitDistance = player.radius * 0.20 + m.radius * 0.35;
                        const dist2 = dx * dx + dy * dy;
                        if (dist2 < hitDistance * hitDistance) {
                            hp = Math.max(0, hp - 15);
                            playLoseLifeSound();
                            // Match the Battle enemy-bullet i-frame
                            // (36 frames / ~0.6 s at 60 fps). Meteorites
                            // would otherwise give the player a longer
                            // recovery window than bullets, which feels
                            // backwards since the speed-doubled meteors
                            // are the harder threat.
                            meteoriteHitCooldown = 36;
                            meteorites.splice(i, 1);
                            if (hp <= 0) endGame();
                        }
                    }
                }
            }
        }

        function createEnemy() {
            const anchorX = 80 + Math.random() * (canvas.width - 160);
            return {
                x: anchorX,
                y: -40,
                anchorX: anchorX,
                anchorY: 60 + Math.random() * 140,
                width: 48,
                height: 56,
                hp: 100,
                state: 'entering',
                swayPhase: Math.random() * Math.PI * 2,
                fireTimer: 30 + Math.floor(Math.random() * 30),
                flashTimer: 0
            };
        }

        // ----- CO-OP combat tick -----
        // Reuses Battle's battleEnemies / enemyBullets pools so the
        // enemy behaviour + telegraph feel is identical, and adds only
        // greenPlayerBeams on top. Score: +1 per star caught (no combo
        // / no lucky bonus because green is also playing), +2 per
        // enemy destroyed by green beams.
        //
        // Shared lose condition: lives <= 0 OR greenPlayer.hp <= 0.
        // Both call endGame() so the unified game-over overlay + record
        // saving flow stays the same.
        function updateCoop(nowMs) {
            coopElapsedMs += 16;

            // ===== Green ship (Player 2) movement =====
            // Direct keyboard control: ±GREEN_SPEED px per frame, clamped
            // to the canvas edges so green cannot leave the play area.
            // No smoothing on green because the player explicitly
            // presses left/right and expects an instant arcady
            // response. Speed tuned to feel like an equal to Blue's
            // smoothed targetX motion (which travels 0.3 of the
            // distance per frame from the cursor — at 100 px gap that's
            // 30 px/frame, so 6 px/frame for green keeps both ships
            // roughly matched on the same horizontal line).
            const GREEN_SPEED = 6;
            if (coopKeys.left) greenPlayer.x -= GREEN_SPEED;
            if (coopKeys.right) greenPlayer.x += GREEN_SPEED;
            if (greenPlayer.x < greenPlayer.radius) greenPlayer.x = greenPlayer.radius;
            if (greenPlayer.x > canvas.width - greenPlayer.radius) greenPlayer.x = canvas.width - greenPlayer.radius;

            // ===== Green beams =====
            // UP arrow or SPACE pushes a beam straight up. Same
            // cooldown as the Battle player's right-click bullet so
            // both players feel equally armed.
            if ((coopKeys.up || coopKeys.space) && !gameOver) {
                if (nowMs - lastGreenFireTimeMs >= FIRE_RATE_COOLDOWN_MS) {
                    greenPlayerBeams.push({
                        x: greenPlayer.x,
                        y: greenPlayer.y - 24,
                        width: 10,
                        height: 22,
                        vy: -16
                    });
                    lastGreenFireTimeMs = nowMs;
                    playShootSound();
                }
            }

            // ===== Star spawn (Classic mechanic for Blue) =====
            // 5% per frame is the same spawn rate the existing Classic
            // mode uses — the player description is explicit that
            // CO-OP stars behave "just like Classic". All stars are
            // worth +1 here regardless of kind because the green
            // player is also playing and the green player's kills
            // are weighted +2, which keeps the runs balanced
            // (combo + lucky bonuses are Classic-only perks).
            if (Math.random() < 0.05) {
                stars.push(createStar());
            }
            for (let i = stars.length - 1; i >= 0; i--) {
                const star = stars[i];
                star.y += star.speed;
                const dx = player.x - star.x;
                const dy = player.y - star.y;
                const dist2 = dx * dx + dy * dy;
                const hitR = player.radius + star.radius;
                if (dist2 < hitR * hitR) {
                    // +1 regardless of kind per CO-OP spec.
                    score += 1;
                    playCollectSound();
                    stars.splice(i, 1);
                    continue;
                }
                if (star.y > canvas.height + star.radius) {
                    lives--;
                    playLoseLifeSound();
                    stars.splice(i, 1);
                    if (lives <= 0) {
                        endGame();
                        return;
                    }
                }
            }
            if (stars.length > 100) stars.splice(0, stars.length - 100);

            // ===== Enemy spawn (Battle mechanic for Green) =====
            // 110-frame initial cooldown (slightly slower than Battle's
            // 90 so the player can read the field on first frame), then
            // linear ramp 180 → 60 over the first 60 s of play. Same
            //   per-frame tick rate as Battle so any future tuning to
            // Battle cadence is mirrored here for free.
            coopSpawnCooldown -= 1;
            if (coopSpawnCooldown <= 0 && battleEnemies.length < 4) {
                battleEnemies.push(createEnemy());
                const t = Math.min(1, coopElapsedMs / 60000);
                coopSpawnCooldown = Math.round(180 - t * 120);
            }

            // ===== Enemy ships: advance / hover / fire =====
            // Mirrors updateBattle() verbatim so CO-OP — like Battle —
            // has a 30-frame telegraph whenever an enemy is about to
            // shoot a red ray. The telegraph is essential for fair
            // dodging because Green has only one row of vertical space
            // (above Blue) to dodge into.
            for (let i = battleEnemies.length - 1; i >= 0; i--) {
                const e = battleEnemies[i];
                if (e.state === 'entering') {
                    e.y += 1.4;
                    if (e.y >= e.anchorY) {
                        e.y = e.anchorY;
                        e.state = 'hover';
                        e.fireTimer = 60 + Math.floor(Math.random() * 60);
                    }
                } else {
                    e.swayPhase += 0.05;
                    e.x = e.anchorX + Math.sin(e.swayPhase) * 14;
                    e.flashTimer = Math.max(0, e.flashTimer - 1);
                    e.fireTimer -= 1;
                    if (e.fireTimer <= 0) {
                        if (e.flashTimer === 0) e.flashTimer = 30;
                        if (e.flashTimer > 0 && e.flashTimer === 1) {
                            enemyBullets.push({
                                x: e.x,
                                y: e.y + 28,
                                radius: 6,
                                vy: 4.0 + Math.min(2, coopElapsedMs / 30000),
                                dmg: 8 + Math.floor(Math.random() * 13)
                            });
                            playEnemyShootSound();
                            e.fireTimer = 100 + Math.floor(Math.random() * 80);
                        }
                    }
                }
            }

            // ===== Beam movement =====
            for (let i = greenPlayerBeams.length - 1; i >= 0; i--) {
                const b = greenPlayerBeams[i];
                b.y += b.vy;
                if (b.y < -30) {
                    greenPlayerBeams.splice(i, 1);
                }
            }

            // ===== Enemy bullet movement =====
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                const b = enemyBullets[i];
                b.y += b.vy;
                if (b.y > canvas.height + 20) {
                    enemyBullets.splice(i, 1);
                }
            }

            // ===== Beam vs Enemy collision =====
            // +2 score per kill per CO-OP spec.  One-hit-one-kill so
            // the math is obvious to the player (vs Battle's 10-30 dmg
            // per bullet).  Reverse-loop splice is safe.
            for (let i = greenPlayerBeams.length - 1; i >= 0; i--) {
                const b = greenPlayerBeams[i];
                let consumed = false;
                for (let j = battleEnemies.length - 1; j >= 0; j--) {
                    const e = battleEnemies[j];
                    const dx = b.x - e.x;
                    const dy = b.y - e.y;
                    if (dx * dx + dy * dy < 36 * 36) {
                        battleEnemies.splice(j, 1);
                        score += 2;
                        playEnemyExplodeSound();
                        consumed = true;
                        break;
                    }
                }
                if (consumed) greenPlayerBeams.splice(i, 1);
            }

            // ===== Enemy bullet vs both players =====
            // CO-OP uses its own i-frame clock (`coopGreenHitCooldown`)
            // so Green doesn't share the Battle's `meteoriteHitCooldown`
            // (Blue is unaffected by bullets in CO-OP per spec — Blue
            // only loses lives by missing stars).
            if (coopGreenHitCooldown > 0) coopGreenHitCooldown -= 1;
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                const b = enemyBullets[i];

                // Green hit-test first.  Smaller hit radius (28 vs the
                // 80 Battle uses for Blue) because green's drawRadius
                // is intentionally narrower than Blue's giant 100-px
                // hitbox so the two ships feel differently-sized on
                // screen.
                if (coopGreenHitCooldown === 0) {
                    const gdx = b.x - greenPlayer.x;
                    const gdy = b.y - greenPlayer.y;
                    if (gdx * gdx + gdy * gdy < 40 * 40) {
                        greenPlayer.hp = Math.max(0, greenPlayer.hp - b.dmg);
                        playLoseLifeSound();
                        enemyBullets.splice(i, 1);
                        coopGreenHitCooldown = 36;
                        if (greenPlayer.hp <= 0) {
                            endGame();
                            return;
                        }
                        continue;
                    }
                }// Blue is never directly hit by enemy bullets per spec —
                    // Blue is the Classic-style collector.  Enemy bullets
                    // simply pass Blue by and vanish off the bottom of the
                    // canvas (handled by the splice at the top of this
                    // block). Leaving the per-bullet positional check
                    // untouched keeps the loop's indexing safe.
                }
            }

        function fireBullet() {
            if (gameState !== GAME_STATES.PLAYING || gameOver) return;
            if (gameMode !== GAME_MODES.BATTLE) return;
            const now = Date.now();
            if (now - lastFireTimeMs < FIRE_RATE_COOLDOWN_MS) return;
            playerBullets.push({
                x: player.x,
                y: player.y - 80,
                vy: -14,
                dmg: 10 + Math.floor(Math.random() * 21)
            });
            lastFireTimeMs = now;
            playShootSound();
        }

        function endGame() {
            // Centralised game-over so classic (star missed), survival
            // (meteorite hit) and battle (HP ≤ 0) paths honour the same
            // record logic.
            //
            // NOTE: intentionally do NOT stop classicAudio here. Letting
            // the song play through the game-over overlay means a fast
            // 'playAgain' (R key / tap) re-uses the same playback
            // position for a seamless restart. The song is stopped in
            // case 'menu' when the player actually returns to the menu.
            // Mirror the togglePause() discipline: a held arrow at the
            // moment of game-over would otherwise leave coopKeys stuck
            // true and visibly teleport the green ship on the next CO-OP
            // restart. The same clear also defends against the
            // window-blur handler being slow to fire mid-frame.
            coopKeys.left = false;
            coopKeys.right = false;
            coopKeys.up = false;
            coopKeys.space = false;
            flushPlayTime();   // persist this run's time to the account
            if (currentUser) {
                // Snapshot the Battle HP state BEFORE recording the mission
                // event so the `battle_no_damage` mission can read a
                // consistent value (noDamageBattleToday was already set the
                // first time hp dropped below 100; if a finished Battle
                // survived with hp === 100, noDamageBattleToday stayed
                // true and the daily mission flips to ✅ below).
                if (gameMode === GAME_MODES.CLASSIC) {
                    recordMissionEvent('finished_classic', score);
                } else if (gameMode === GAME_MODES.SURVIVAL) {
                    recordMissionEvent('finished_survival', score);
                } else if (gameMode === GAME_MODES.BATTLE) {
                    recordMissionEvent('finished_battle', score);
                } else if (gameMode === GAME_MODES.COOP) {
                    // CO-OP runs don't have a daily mission mapping today
                    // (no entries in MISSION_POOL use a coop_* type) but
                    // we still emit `finished_coop` so a future mission
                    // can hook in without a code change at the call site.
                    recordMissionEvent('finished_coop', score);
                }
            }
            gameOver = true;
            playGameOverSound();
            if (currentUser) {
                if (gameMode === GAME_MODES.SURVIVAL) {
                    const pos = addSurvivalScoreToUser(currentUser, score);
                    if (pos !== -1) {
                        isNewRecord = true;
                        newRecordPosition = pos;
                        playRecordSound();
                    }
                } else if (gameMode === GAME_MODES.BATTLE) {
                    const pos = addBattleScoreToUser(currentUser, score);
                    if (pos !== -1) {
                        isNewRecord = true;
                        newRecordPosition = pos;
                        playRecordSound();
                    }
                } else if (gameMode === GAME_MODES.COOP) {
                    // CO-OP writes to its own bucket (`${user}__coop`)
                    // so the Records screen can show a separate top-10
                    // column without polluting Classic / Battle records.
                    const pos = addCoopScoreToUser(currentUser, score);
                    if (pos !== -1) {
                        isNewRecord = true;
                        newRecordPosition = pos;
                        playRecordSound();
                    }
                } else {
                    const pos = addScoreToUser(currentUser, score);
                    if (pos !== -1) {
                        isNewRecord = true;
                        newRecordPosition = pos;
                        playRecordSound();
                    }
                }
            }
        }

        /* ============================================================
           6. DRAWING FUNCTIONS
        ============================================================ */
        function drawBackground() {
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.shadowBlur = 0;
            const twinkleCount = IS_MOBILE ? 50 : 100;
            for (let i = 0; i < twinkleCount; i++) {
                const x = (i * 137 + 50) % canvas.width;
                const y = (i * 251 + 30) % canvas.height;
                const size = 0.5 + (i % 3) * 0.5;
                const brightness = 0.6 + Math.random() * 0.4;
                ctx.fillStyle = `rgba(255, 255, 255, ${brightness})`;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }

            const g1 = ctx.createRadialGradient(120, 100, 10, 120, 100, 60);
            g1.addColorStop(0, '#ff8c42');
            g1.addColorStop(0.7, '#b84a1c');
            g1.addColorStop(1, '#4a1a0a');
            ctx.shadowColor = '#ff8c42';
            ctx.shadowBlur = 30;
            ctx.beginPath();
            ctx.arc(120, 100, 60, 0, Math.PI * 2);
            ctx.fillStyle = g1;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(255,200,100,0.3)';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.ellipse(120, 100, 90, 25, -0.2, 0, Math.PI * 2);
            ctx.stroke();

            const g2 = ctx.createRadialGradient(700, 500, 15, 700, 500, 45);
            g2.addColorStop(0, '#4fc3ff');
            g2.addColorStop(0.5, '#1a7ab5');
            g2.addColorStop(1, '#0a2a4a');
            ctx.shadowColor = '#4fc3ff';
            ctx.shadowBlur = 25;
            ctx.beginPath();
            ctx.arc(700, 500, 45, 0, Math.PI * 2);
            ctx.fillStyle = g2;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            ctx.beginPath();
            ctx.ellipse(690, 490, 20, 10, 0.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(710, 510, 15, 8, -0.3, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawBlueCharacter(now) {
            const c = blueCharacter;
            const bobY = Math.sin(c.bobPhase) * 6;
            const cx = c.cx;
            const cy = c.cy + bobY;

            ctx.save();

            ctx.shadowColor = '#88c8ff';
            ctx.shadowBlur = 22;
            ctx.fillStyle = '#7ec8e3';
            ctx.beginPath();
            ctx.arc(cx, cy, c.bodyRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            const grad = ctx.createRadialGradient(cx - 8, cy - 10, 4, cx, cy, c.bodyRadius);
            grad.addColorStop(0, 'rgba(255,255,255,0.55)');
            grad.addColorStop(0.6, 'rgba(255,255,255,0.05)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(cx, cy, c.bodyRadius, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#3a8cff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(cx, cy, c.bodyRadius, 0, Math.PI * 2);
            ctx.stroke();

            ctx.strokeStyle = '#3a8cff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(cx, cy - c.bodyRadius);
            ctx.lineTo(cx, cy - c.bodyRadius - 14);
            ctx.stroke();
            ctx.fillStyle = '#ffd84a';
            ctx.shadowColor = '#ffd84a';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(cx, cy - c.bodyRadius - 16, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.fillStyle = 'rgba(255, 140, 160, 0.55)';
            ctx.beginPath();
            ctx.arc(cx - 14, cy + 6, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(cx + 14, cy + 6, 5, 0, Math.PI * 2);
            ctx.fill();

            const blink = (Math.floor(now / 3500) % 7 === 0);
            const povX = c.isHovering ? 2 : 0;
            const povY = c.isHovering ? -2 : 0;
            const eyeY = cy - 4;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(cx - 8, eyeY, 6, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(cx + 8, eyeY, 6, 0, Math.PI * 2); ctx.fill();
            if (!blink) {
                ctx.fillStyle = '#1a2a4a';
                ctx.beginPath(); ctx.arc(cx - 8 + povX, eyeY + povY, 3, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(cx + 8 + povX, eyeY + povY, 3, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.beginPath(); ctx.arc(cx - 8 + povX + 1, eyeY + povY - 1, 1, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(cx + 8 + povX + 1, eyeY + povY - 1, 1, 0, Math.PI * 2); ctx.fill();
            } else {
                ctx.strokeStyle = '#1a2a4a';
                ctx.lineWidth = 1.5;
                ctx.beginPath(); ctx.moveTo(cx - 12, eyeY); ctx.lineTo(cx - 4, eyeY); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(cx + 4, eyeY); ctx.lineTo(cx + 12, eyeY); ctx.stroke();
            }

            ctx.strokeStyle = '#1a2a4a';
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.beginPath();
            const smileY = cy + 12;
            const smileR = c.isHovering ? c.bodyRadius * 0.7 : c.bodyRadius * 0.55;
            ctx.arc(cx, smileY - 2, smileR, 0.15 * Math.PI, 0.85 * Math.PI);
            ctx.stroke();
            ctx.lineCap = 'butt';

            ctx.font = 'bold 11px Orbitron, sans-serif';
            ctx.fillStyle = '#88c8ff';
            ctx.shadowColor = 'black';
            ctx.shadowBlur = 4;
            ctx.textAlign = 'center';
            ctx.fillText('BLUE', cx, cy + c.bodyRadius + 14);
            ctx.shadowBlur = 0;

            ctx.restore();
        }

        function drawSpeechBubble() {
            const a = blueCharacter.bubbleAlpha;
            if (a <= 0.01) return;

            const text = blueCharacter.currentLine;
            const fontSize = 13;
            ctx.font = fontSize + 'px Orbitron, sans-serif';
            const padding = 9;
            // Keep bubble well clear of RECORDS row (y >= 465).
            const maxWidth = 200;
            const words = text.split(' ');
            const lines = [];
            let cur = '';
            for (const w of words) {
                const candidate = cur ? cur + ' ' + w : w;
                const wWidth = ctx.measureText(candidate).width;
                if (wWidth > maxWidth && cur) {
                    lines.push(cur);
                    cur = w;
                } else {
                    cur = candidate;
                }
            }
            if (cur) lines.push(cur);

            const lineHeight = fontSize + 4;
            const boxW = Math.min(
                maxWidth + padding * 2,
                Math.max(...lines.map(l => ctx.measureText(l).width)) + padding * 2
            );
            const boxH = lineHeight * lines.length + padding * 2;

            // Speech bubble: positioned just above Blue and to the right.
            // With the tightened font (13px) and padding the bubble ends
            // around y=460 for 2-line messages, leaving only a thin
            // sliver of overlap with the top of the RECORDS row.
            const boxX = 165;
            const boxY = 415;
            // Tail anchors on the bubble's bottom edge (left side) and
            // its tip points down-left toward Blue's antenna.
            const tailBaseLeftX = boxX + 6;
            const tailBaseRightX = boxX + 46;
            const tailTipX = blueCharacter.cx + 8;
            const tailTipY = boxY + boxH + 18;

            ctx.save();
            ctx.globalAlpha = a;
            ctx.shadowColor = 'rgba(0, 0, 0, 0.65)';
            ctx.shadowBlur = 14;
            ctx.shadowOffsetY = 4;

            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(boxX, boxY, boxW, boxH, 14);
            ctx.fill();
            ctx.stroke();

            // Tail: two top vertices sit exactly on the bubble's bottom
            // edge so the triangle visibly fuses with the bubble; the
            // bottom tip points at Blue.
            ctx.beginPath();
            ctx.moveTo(tailBaseLeftX, boxY + boxH);
            ctx.lineTo(tailTipX, tailTipY);
            ctx.lineTo(tailBaseRightX, boxY + boxH);
            ctx.closePath();
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;
            ctx.fillStyle = '#1a2a4a';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            for (let i = 0; i < lines.length; i++) {
                ctx.fillText(lines[i], boxX + boxW / 2, boxY + padding + i * lineHeight);
            }
            ctx.restore();
        }

        function drawMenu() {
            drawBackground();
            // Menu music is no longer auto-started here on the first
            // render frame: doing so would fire at ~16 ms, shadowing
            // the setTimeout(playMenuMusic, 300) that the boot path
            // schedules right after stopMenuMusic(). Every later
            // "return to menu" branch (post-game 'menu' and
            // post-pause 'pauseMenu') already calls playMenuMusic()
            // explicitly so the song restarts correctly without us
            // needing an auto-trigger here.

            ctx.textAlign = 'center';
            ctx.shadowColor = '#4af';
            ctx.shadowBlur = 50;

            const centerX = canvas.width / 2;
            const titleY = 170;

            ctx.font = 'bold 72px Orbitron, sans-serif';
            const starText = 'STAR';
            const catcherText = 'CATCHER';
            const starWidth = ctx.measureText(starText).width;
            const catcherWidth = ctx.measureText(catcherText).width;
            const totalTextWidth = starWidth + catcherWidth + 20;

            if (!rocketEmoji.isEscaping && rocketEmoji.escapeTimer <= 0) {
                rocketEmoji.baseX = centerX - totalTextWidth / 2 - 40;
                rocketEmoji.x = rocketEmoji.baseX;
                rocketEmoji.y = rocketEmoji.baseY;
            }

            ctx.font = 'bold 72px Orbitron, sans-serif';
            ctx.fillStyle = '#ffffff';
            ctx.fillText(starText, centerX - catcherWidth / 2 - 10, titleY);
            ctx.fillStyle = '#ffd700';
            ctx.fillText(catcherText, centerX + starWidth / 2 + 10, titleY);

            ctx.save();
            ctx.translate(rocketEmoji.x, rocketEmoji.y);
            ctx.rotate(rocketEmoji.angle);
            ctx.font = '60px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = '#ff6b35';
            ctx.shadowBlur = 30;
            ctx.fillText('🚀', 0, 0);
            ctx.restore();

            ctx.shadowBlur = 10;
            ctx.shadowColor = 'black';
            ctx.font = '24px Orbitron, sans-serif';
            ctx.fillStyle = '#88aaff';
            ctx.fillText('Get the stars, beat the record!', canvas.width / 2, 215);

            ctx.font = '18px Orbitron, sans-serif';
            ctx.fillStyle = '#66dd88';
            ctx.shadowBlur = 10;
            ctx.fillText(
                currentUser ? `👤 ${currentUser}` : '👤 No account',
                canvas.width / 2,
                350
            );

            // Two rows of two buttons: PLAY/ACCOUNT top, RECORDS/SETTINGS bottom
            const btnY = 380;
            const btnW = 180;
            const btnH = 50;
            const gap = 25;
            const row2Y = btnY + btnH + 35;
            const row2H = 40;

            const playX = canvas.width / 2 - btnW - gap / 2;
            const playCenterX = playX + btnW / 2;
            ctx.shadowBlur = 30;
            ctx.shadowColor = '#4af';
            ctx.fillStyle = '#2a6aff';
            ctx.beginPath();
            ctx.roundRect(playX, btnY, btnW, btnH, 12);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'white';
            ctx.font = 'bold 24px Orbitron, sans-serif';
            ctx.fillText('▶ PLAY', playCenterX, btnY + 34);

            const accX = canvas.width / 2 + gap / 2;
            const accCenterX = accX + btnW / 2;
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#88aaff';
            ctx.fillStyle = '#3a3a6a';
            ctx.beginPath();
            ctx.roundRect(accX, btnY, btnW, btnH, 12);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#88aaff';
            ctx.font = 'bold 22px Orbitron, sans-serif';
            ctx.fillText('👤 ACCOUNT', accCenterX, btnY + 34);

            const recX = canvas.width / 2 - btnW - gap / 2;
            const recCenterX = recX + btnW / 2;
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ffd700';
            ctx.fillStyle = '#2a2a4a';
            ctx.beginPath();
            ctx.roundRect(recX, row2Y, btnW, row2H, 10);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ffd700';
            ctx.font = '20px Orbitron, sans-serif';
            ctx.fillText('🏆 RECORDS', recCenterX, row2Y + 28);

            const settingsX = canvas.width / 2 + gap / 2;
            const settingsCenterX = settingsX + btnW / 2;
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#aaaaaa';
            ctx.fillStyle = '#2a2a3a';
            ctx.beginPath();
            ctx.roundRect(settingsX, row2Y, btnW, row2H, 10);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(170, 170, 170, 0.4)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(settingsX, row2Y, btnW, row2H, 10);
            ctx.stroke();
            ctx.fillStyle = '#cccccc';
            ctx.font = '20px Orbitron, sans-serif';
            ctx.fillText('⚙ SETTINGS', settingsCenterX, row2Y + 28);

            // ----- Blue mascot lives in the lower-left of the menu -----
            const now = Date.now();
            updateBlueCharacter(now);
            drawBlueCharacter(now);
            drawSpeechBubble();

            // Row 3 — BATTLE | SURVIVAL split. Two equal-width buttons
            // sitting side-by-side under RECORDS / SETTINGS so the new
            // mode does not push the MISSIONS pill down past the
            // canvas's lower safe area. Both buttons keep the same
            // visual height as row 1 (btnH-ish, rounded 12 px) so the
            // menu's tier hierarchy reads cleanly: top row → quick
            // launchers; second row → menu pages; third row → high-
            // difficulty alternatives. After CO-OP shipped, row 3
            // hosts THREE buttons (Battle / CO-OP / Survival) so
            // row3W is shrunk to 130 px to fit all three within the
            // 800 px canvas without overlap.
            const row3Y = row2Y + row2H + 25;
            const row3H = 50;
            const row3W = 130;
            const row3Gap = 10;
            // Three buttons centred evenly across the row. Total
            // width 3*row3W + 2*row3Gap = 410, so battle starts at
            //    canvas.width/2 - 1.5*row3W - row3Gap
            // and each subsequent button is offset by row3W + row3Gap.
            // Order is BATTLE / CO-OP / SURVIVAL because that's the
            // semantic flow "single-player combat → two-player
            // cooperation → single-player escape".
            const battleMenuX = canvas.width / 2 - 1.5 * row3W - row3Gap;
            const coopMenuX = canvas.width / 2 - row3W / 2;
            const survivalMenuX = canvas.width / 2 + row3W / 2 + row3Gap;
            const survivalMenuW = row3W;

            // ----- BATTLE button (left) -----
            ctx.shadowBlur = 28;
            ctx.shadowColor = '#ff8a3d';
            ctx.fillStyle = '#4a1a0a';
            ctx.beginPath();
            ctx.roundRect(battleMenuX, row3Y, row3W, row3H, 12);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(255, 138, 61, 0.85)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(battleMenuX, row3Y, row3W, row3H, 12);
            ctx.stroke();
            ctx.fillStyle = '#ffd2a8';
            ctx.font = 'bold 20px Orbitron, sans-serif';
            ctx.fillText('🎯 BATTLE', battleMenuX + row3W / 2, row3Y + 30);

            // ----- SURVIVAL button (right) -----
            ctx.shadowBlur = 28;
            ctx.shadowColor = '#ff0000';
            ctx.fillStyle = '#a01010';
            ctx.beginPath();
            ctx.roundRect(survivalMenuX, row3Y, row3W, row3H, 12);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(255, 90, 90, 0.7)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(survivalMenuX, row3Y, survivalMenuW, row3H, 12);
            ctx.stroke();
            ctx.fillStyle = '#ffcccc';
            ctx.font = 'bold 20px Orbitron, sans-serif';
            ctx.fillText('💀 SURVIVAL', survivalMenuX + survivalMenuW / 2, row3Y + 30);

            // ----- CO-OP button (centre of row 3) -----
            // Purple gradient with handshake emoji + "CO-OP" text
            // so the player can identify the two-player mode at a
            // glance. Purple deliberately diverges from the blue +
            // green ship palettes to signal "shared" rather than
            // "either player". Must render BEFORE the menuButtons =
            // [...] block so the click-target array below matches the
            // pixel rectangle that was just painted.
            ctx.shadowBlur = 28;
            ctx.shadowColor = '#b066ff';
            const coopPanel = ctx.createLinearGradient(coopMenuX, row3Y, coopMenuX, row3Y + row3H);
            coopPanel.addColorStop(0, '#5a2a8a');
            coopPanel.addColorStop(0.5, '#7a3aa8');
            coopPanel.addColorStop(1, '#3a1660');
            ctx.fillStyle = coopPanel;
            ctx.beginPath();
            ctx.roundRect(coopMenuX, row3Y, row3W, row3H, 12);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(200, 140, 255, 0.75)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(coopMenuX, row3Y, row3W, row3H, 12);
            ctx.stroke();
            ctx.fillStyle = '#e8d6ff';
            ctx.font = 'bold 18px Orbitron, sans-serif';
            ctx.fillText('🤝 CO-OP', coopMenuX + row3W / 2, row3Y + 31);

            menuButtons = [
                { rect: { x: playX, y: btnY, w: btnW, h: btnH }, action: 'play' },
                { rect: { x: accX, y: btnY, w: btnW, h: btnH }, action: 'account' },
                { rect: { x: recX, y: row2Y, w: btnW, h: row2H }, action: 'records' },
                { rect: { x: settingsX, y: row2Y, w: btnW, h: row2H }, action: 'settings' },
                { rect: { x: battleMenuX, y: row3Y, w: row3W, h: row3H }, action: 'playBattle' },
                { rect: { x: coopMenuX, y: row3Y, w: row3W, h: row3H }, action: 'playCoop' },
                { rect: { x: survivalMenuX, y: row3Y, w: survivalMenuW, h: row3H }, action: 'survival' }
            ];
            // ----- BIG "M KEY" pill -- enters the Missions page -----
            // No swipe gesture anymore; the pill AND the M keyboard
            // shortcut are the only two entry points now.
            // Centered on the menu's hero column, tucked between the
